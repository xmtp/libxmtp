[package]
name = "bindings_node"
description = "nodeJS bindings to the XMTP mls libraries"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

# rlib included so building dependencies for workspace succeeds, but in reality node just uses cdylib
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait.workspace = true
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true
hex.workspace = true
mimalloc = { version = "0.1.52", default-features = false }
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.11.0", default-features = false, features = [
  "napi6",
  "async",
  "serde-json",
] }
napi-derive = "3.6.0"
prost.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
xmtp-workspace-hack.workspace = true
xmtp_api.workspace = true
xmtp_api_d14n.workspace = true
xmtp_api_grpc = { workspace = true, optional = true }
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_content_types.workspace = true
xmtp_cryptography.workspace = true
# Direct path (not workspace-inherited) so `default-features = false` is allowed:
# the all-async spike needs to select the storage SHAPE (`blocking`) per-build,
# and cargo forbids overriding default-features on an inherited workspace dep.
xmtp_db = { path = "../../crates/xmtp_db", default-features = false }
xmtp_id.workspace = true
xmtp_logging.workspace = true
xmtp_macro.workspace = true
xmtp_mls = { path = "../../crates/xmtp_mls", default-features = false }
xmtp_proto.workspace = true

[build-dependencies]
napi-build = "2.3.2"

[dev-dependencies]
# Add self as dev dependency to automatically enable the test-utils feature
bindings_node = { path = ".", features = ["test-utils"] }
chrono.workspace = true
toxiproxy_rust.workspace = true

[package.metadata.cross.build.env]
volumes = ["__LIB12_DEP=../"]

[features]
# Storage BACKEND (`sqlite` = diesel/SQLite). The client is unconditionally async;
# on the SQLite backend the storage futures are always ready.
default = ["sqlite"]
sqlite = ["xmtp_mls/sqlite", "xmtp_db/sqlite"]
test-utils = [
  "dep:xmtp_api_grpc",
  "xmtp_api_grpc/test-utils",
  "xmtp_mls/test-utils",
  "xmtp_proto/test-utils",
]
