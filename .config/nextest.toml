[profile.default]
default-filter = "not package(xmtp_backend) & (not test(test_stream_all_messages_does_not_lose_messages))"
retries = { backoff = "exponential", count = 3, delay = "3s", max-delay = "20s", jitter = true }
failure-output = "final"
fail-fast = false

[profile.ci]
slow-timeout = "90sec"
default-filter = "not package(xmtp_backend) & (not test(test_stream_all_messages_does_not_lose_messages))"
failure-output = "immediate-final"
fail-fast = false

# consumed by .github/workflows/ignored-tests-tracker.yml
[profile.ci.junit]
path = "junit.xml"

# These two watchdog tests pass in milliseconds, but on Linux CI the wasm-bindgen-test
# Node process sometimes does not exit after the test reports `ok`. That hang caused 17
# of 35 failed wasm jobs from 2026-10-02 to 2026-10-06 and never hit another test. Bound
# the hang and retry. Keep this above the general wasm override: for each setting, the
# first matching override wins.
[[profile.ci.overrides]]
platform = 'cfg(all(target_family = "wasm", target_os = "unknown"))'
filter = 'package(xmtp_mls) & test(/^subscriptions::watchdog::tests::(new_uses_a_real_timer|disabled_watchdog_never_trips)$/)'
slow-timeout = { period = "20s", terminate-after = 2, grace-period = "5s" }
retries = 2

[[profile.ci.overrides]]
platform = 'cfg(all(target_family = "wasm", target_os = "unknown"))'
slow-timeout = { period = "1m", terminate-after = 2, grace-period = "10s" }
retries = 0
threads-required = 2

# test_db_migrates experiences random failures b/c of 'corrupted double-linked list' coming from glibc/sqlcipher https://github.com/xmtp/libxmtp/issues/2402
[[profile.ci.overrides]]
filter = 'test(/\btest_db_migrates/)'
retries = 3

# Fuzz tests print their seed and must fail loudly — a retry would re-roll
# the seed and mask the finding.
[[profile.default.overrides]]
filter = 'test(/bidi_fuzz/)'
retries = 0

[[profile.ci.overrides]]
filter = 'test(/bidi_fuzz/)'
retries = 0

[[profile.ci.overrides]]
filter = 'test(thousand_local_consent_changes_publish_once_without_echo)'
slow-timeout = "180sec"
