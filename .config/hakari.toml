# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "xmtp-workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

workspace-hack-line-style = "workspace-dotted"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "3"

platforms = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "aarch64-linux-android",
  "x86_64-linux-android",
] # Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

# Including mio/tokio breaks webassembly builds since net features are mutually exclusive with wasm
[traversal-excludes]
workspace-members = [
  "xmtp-db-tools",
  "xdbg",
  "error_glossary",
  "xnet-cli",
  "xnet-lib",
  "keepalive-probe",
]
third-party = [
  { name = "tonic" },
  { name = "tokio" },
  { name = "uniffi" },
  { name = "wasm-bindgen" },
  # Excluded so workspace-hack does not unify libsqlite3-sys's
  # `bundled-sqlcipher-vendored-openssl` feature into every workspace member,
  # which would drag openssl-sys/openssl into builds (e.g. mls-validation-service)
  # that have no need for SQLite.
  { name = "libsqlite3-sys" },
  # `maybe-async`'s `is_sync` feature selects xmtp_db's storage track. Unifying it
  # into the workspace-hack would turn `is_sync` on for every member, collapsing
  # the async track's traits to the blocking shape in every build -- the async
  # track would silently cease to exist.
  { name = "maybe-async" },
  # diesel is the sync track's driver. Unifying it into the workspace-hack puts
  # it (and through it libsqlite3-sys) into *every* member's graph, which
  # silently undoes `xmtp_db`'s `sync`-gating of diesel and puts a SQLite driver
  # back into server builds. Same reasoning as libsqlite3-sys above.
  # (git source must be spelled out -- these are patched to the ephemerahq fork)
  { name = "diesel", git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" },
  { name = "diesel_derives", git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" },
  { name = "diesel_migrations", git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" },
  # Same rationale as libsqlite3-sys: sqlx is the servers-only storage driver, and
  # unifying it would compile a Postgres client into every native member,
  # including the mobile bindings, which have no use for it.
  { name = "sqlx" },
]

[final-excludes]
workspace-members = [
  "xmtp-db-tools",
  "xdbg",
  "error_glossary",
  "xnet-cli",
  "xnet-lib",
  "keepalive-probe",
]
third-party = [
  { name = "tonic" },
  { name = "tokio" },
  { name = "uniffi" },
  { name = "wasm-bindgen" },
  { name = "libsqlite3-sys" },
  # `maybe-async`'s `is_sync` feature selects xmtp_db's storage track. Unifying it
  # into the workspace-hack would turn `is_sync` on for every member, collapsing
  # the async track's traits to the blocking shape in every build -- the async
  # track would silently cease to exist.
  { name = "maybe-async" },
  # diesel is the sync track's driver. Unifying it into the workspace-hack puts
  # it (and through it libsqlite3-sys) into *every* member's graph, which
  # silently undoes `xmtp_db`'s `sync`-gating of diesel and puts a SQLite driver
  # back into server builds. Same reasoning as libsqlite3-sys above.
  # (git source must be spelled out -- these are patched to the ephemerahq fork)
  { name = "diesel", git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" },
  { name = "diesel_derives", git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" },
  { name = "diesel_migrations", git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" },
  # Same rationale as libsqlite3-sys: sqlx is the servers-only storage driver, and
  # unifying it would compile a Postgres client into every native member,
  # including the mobile bindings, which have no use for it.
  { name = "sqlx" },
]
