// Intent protos that are stored in the libxmtp database

syntax = "proto3";
package xmtp.mls.database;

import "mls/message_contents/component_permissions.proto";
import "mls/message_contents/welcome_pointer.proto";
import "mls/message_contents/wrapper_encryption.proto";

option go_package = "github.com/xmtp/proto/v3/go/mls/database";
option java_package = "org.xmtp.proto.mls.database";

// The data required to publish a message
message SendMessageData {
  // V1 of SendMessagePublishData
  message V1 {
    bytes payload_bytes = 1;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// Wrapper around a list af repeated EVM Account Addresses
message AccountAddresses {
  repeated string account_addresses = 1;
}

// Wrapper around a list of repeated Installation IDs
message InstallationIds {
  repeated bytes installation_ids = 1;
}

// One of an EVM account address or Installation ID
message AddressesOrInstallationIds {
  oneof addresses_or_installation_ids {
    AccountAddresses account_addresses = 1;
    InstallationIds installation_ids = 2;
  }
}

// DEPRECATED
// The data required to add members to a group
message AddMembersData {
  // V1 of AddMembersPublishData
  message V1 {
    AddressesOrInstallationIds addresses_or_installation_ids = 1;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// DEPRECATED
// The data required to remove members from a group
message RemoveMembersData {
  // V1 of RemoveMembersPublishData
  message V1 {
    AddressesOrInstallationIds addresses_or_installation_ids = 1;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// The data required to make a commit that updates group membership
// Handles both Add and Remove actions
message UpdateGroupMembershipData {
  // V1 of UpdateGroupMembershipPublishData
  message V1 {
    // Contains delta of membership updates that need to be applied
    map<string, uint64> membership_updates = 1;
    // Contains the list of members that will be removed
    repeated string removed_members = 2;
    // List of installations that failed to be added due to errors encountered during the evaluation process.
    repeated bytes failed_installations = 3;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// The data required to remove and readd existing leaf nodes
// on the MLS tree. Does not change or update the members list.
// Used for fork recovery
message ReaddInstallationsData {
  message V1 {
    repeated bytes readded_installations = 1;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// The data required to update group metadata
message UpdateMetadataData {
  // V1 of UpdateMetadataPublishData
  message V1 {
    string field_name = 1;
    string field_value = 2;
    // Compare-and-swap guard. When set, the publisher must abandon this
    // intent unless the field's currently committed value equals this,
    // rather than overwriting whatever landed in the meantime. Absent
    // means last-writer-wins, which is the historical behavior.
    optional string expected_field_value = 3;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// Type of update to admin lists
enum AdminListUpdateType {
  ADMIN_LIST_UPDATE_TYPE_UNSPECIFIED = 0;
  ADMIN_LIST_UPDATE_TYPE_ADD_ADMIN = 1;
  ADMIN_LIST_UPDATE_TYPE_REMOVE_ADMIN = 2;
  ADMIN_LIST_UPDATE_TYPE_ADD_SUPER_ADMIN = 3;
  ADMIN_LIST_UPDATE_TYPE_REMOVE_SUPER_ADMIN = 4;
}

// The data required to update group admin/super admin lists
message UpdateAdminListsData {
  // V1 of UpdateAdminListsPublishData
  message V1 {
    AdminListUpdateType admin_list_update_type = 1;
    string inbox_id = 2;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// Type of Permission to Update
enum PermissionUpdateType {
  PERMISSION_UPDATE_TYPE_UNSPECIFIED = 0;
  PERMISSION_UPDATE_TYPE_ADD_MEMBER = 1;
  PERMISSION_UPDATE_TYPE_REMOVE_MEMBER = 2;
  PERMISSION_UPDATE_TYPE_ADD_ADMIN = 3;
  PERMISSION_UPDATE_TYPE_REMOVE_ADMIN = 4;
  PERMISSION_UPDATE_TYPE_UPDATE_METADATA = 5;
}

// Permission Policy
enum PermissionPolicyOption {
  PERMISSION_POLICY_OPTION_UNSPECIFIED = 0;
  PERMISSION_POLICY_OPTION_ALLOW = 1;
  PERMISSION_POLICY_OPTION_DENY = 2;
  PERMISSION_POLICY_OPTION_ADMIN_ONLY = 3;
  PERMISSION_POLICY_OPTION_SUPER_ADMIN_ONLY = 4;
}

// The data required to update permissions
message UpdatePermissionData {
  // V1 of UpdatePermissionData
  message V1 {
    PermissionUpdateType permission_update_type = 1;
    PermissionPolicyOption permission_policy_option = 2;
    // Metadata permissions update specify which field permission they are updating
    optional string metadata_field_name = 3;
  }

  oneof version {
    V1 v1 = 1;
  }
}

// Generic AppData write intent — local-only serialization for the
// `group_intents` table. Never appears on the MLS wire.
//
// A payload is what the on-wire `AppDataUpdate` proposal carries, and
// its meaning follows the target component's registered
// `ComponentType`:
//
//   * `Bytes` / `String` typed components — the new value.
//   * `TlsMap` typed components — a TLS-encoded `TlsMapDelta<K, V>`.
//   * `TlsSet` typed components — a TLS-encoded `TlsSetDelta<E>`.
//
// Deltas apply strictly and atomically: an Insert of a
// present key, or an Update or Delete of an absent key, rejects the
// whole commit.
message AppDataUpdateData {
  // One verbatim payload.
  message V1 {
    // u16 component_id widened to u32 (proto has no u16). The
    // dispatcher narrows back to u16 at decode time.
    uint32 component_id = 1;
    // The bytes written verbatim as the AppDataUpdate proposal payload.
    bytes payload = 2;
  }

  // Typed metadata field writes, committed together. The publisher
  // re-checks each against the committed registry and resolves the
  // own-key operations against the state the commit starts from.
  message V2 {
    repeated FieldWrite writes = 1;
  }

  // One field write, encoded under the field's committed type.
  message FieldWrite {
    // u16 component_id widened to u32.
    uint32 component_id = 1;
    // The type the write was encoded under. The publisher refuses the
    // write if the committed type differs.
    xmtp.mls.message_contents.ComponentType component_type = 2;
    oneof operation {
      // An AppDataUpdate Update payload.
      bytes update = 3;
      // Remove the component if present.
      bool remove = 4;
      // Insert or update the writer's own key of an inbox-keyed map
      // with these value bytes.
      bytes set_own = 5;
      // Delete the writer's own key of an inbox-keyed map if present.
      bool clear_own = 6;
    }
  }

  // Versioned envelope. New variants are added as new oneof entries;
  // readers that don't recognize a variant fail closed.
  oneof version {
    V1 v1 = 1;
    V2 v2 = 2;
  }
}

// Generic data-type for all post-commit actions
message PostCommitAction {
  // An installation
  message Installation {
    bytes installation_key = 1;
    bytes hpke_public_key = 2;
    xmtp.mls.message_contents.WelcomeWrapperAlgorithm welcome_wrapper_algorithm = 3;
    xmtp.mls.message_contents.WelcomePointeeEncryptionAeadTypesExtension welcome_pointee_encryption_aead_types = 4;
  }
  // SendWelcome message
  message SendWelcomes {
    repeated Installation installations = 1;
    bytes welcome_message = 2;
  }

  oneof kind {
    SendWelcomes send_welcomes = 1;
  }
}

message ProposeMemberUpdateData {
  message V1 {
    // Not hex encoded
    repeated bytes add_inbox_ids = 1;
    repeated bytes remove_inbox_ids = 2;
  }

  oneof version {
    V1 v1 = 1;
  }
}

message ProposeGroupContextExtensionData {
  message V1 {
    bytes group_context_extension = 1;
  }

  oneof version {
    V1 v1 = 1;
  }
}

message CommitPendingProposalsData {
  message V1 {
    repeated bytes proposal_hashes = 1;
  }

  oneof version {
    V1 v1 = 1;
  }
}
