[package]
name = "xmtp_content_types"
description = "xmtp content types"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-utils = []

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
flate2.workspace = true
hex.workspace = true
hkdf.workspace = true
prost = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
xmtp-workspace-hack.workspace = true
xmtp_common.workspace = true
xmtp_proto.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes.workspace = true
ctr.workspace = true
ghash.workspace = true
subtle.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
xmtp_logging = { workspace = true, features = ["test-utils"] }

[dev-dependencies]
tokio.workspace = true
xmtp_common = { workspace = true, features = ['test-utils'] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
