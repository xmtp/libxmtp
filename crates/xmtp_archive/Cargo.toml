[package]
name = "xmtp_archive"
description = "archive and backup features for xmtp"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Storage-track selection, forwarded to xmtp_db + xmtp_mls_common.
default = ["sync", "blocking"]
sync = ["xmtp_db/sync", "xmtp_mls_common/sync"]
blocking = ["xmtp_db/blocking", "xmtp_mls_common/blocking"]
async = ["xmtp_db/async", "xmtp_mls_common/async"]
test-utils = ["xmtp_common/test-utils"]

[dependencies]
aes-gcm.workspace = true
async-compression.workspace = true
async-trait.workspace = true
futures = { workspace = true, features = ["alloc", "std"] }
futures-util.workspace = true
openmls.workspace = true
pin-project.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
xmtp-workspace-hack.workspace = true
xmtp_common.workspace = true
# Direct path deps so default features (the `sync` track) can be turned off; see
# xmtp_mls_common/Cargo.toml for why `workspace = true` can't express this.
xmtp_db = { path = "../xmtp_db", default-features = false }
xmtp_mls_common = { path = "../xmtp_mls_common", default-features = false }
xmtp_proto.workspace = true

[dev-dependencies]
xmtp_common = { workspace = true, features = ["test-utils"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
xmtp_common.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-test.workspace = true
