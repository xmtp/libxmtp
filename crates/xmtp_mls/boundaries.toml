# Dependency direction for the planned split of xmtp_mls (Ref yrC4OvnlOKmcebA9).
#
# dev/check-boundaries maps every module and item of crates/xmtp_mls/src to
# the crate it moves to, and fails on a reference between two target crates
# that is neither an allowed edge nor covered by a waiver with the measured
# count. Waivers may only shrink: CI compares them with the base branch.

source = "crates/xmtp_mls/src"

# Target crate of each module path; the longest matching prefix wins.
[modules]
"" = "facade"
"attachments" = "attachments"
"builder" = "facade"
"client" = "facade"
"client::notifications" = "notifications"
"context" = "core"
"core" = "core"
"definitions" = "facade"
"diagnostics" = "facade"
"groups" = "engine"
"identity" = "core"
"identity::identity_ext" = "identity"
"identity_lifecycle" = "identity"
"identity_updates" = "identity"
"inbox_handles" = "identity"
"intents" = "engine"
"mls_store" = "core"
"mutex_registry" = "core"
"subscriptions" = "streams"
"subscriptions::barrier" = "engine"
"subscriptions::connection_state" = "engine"
"subscriptions::group_set_gate" = "engine"
"subscriptions::incoming" = "engine"
"subscriptions::recovery" = "engine"
"test" = "facade"
"utils" = "facade"
"worker" = "core"
"worker::device_sync" = "device_sync"
"worker::key_package_maintenance" = "identity"
"worker::notifications" = "notifications"

# Items that move to a different crate than their module.
[items]
"worker::device_sync::is_own_sync_group" = "engine"

# The Target crates table: each crate and the crates it may depend on.
[allowed]
messages = []
server_config = []
core = ["server_config"]
identity = ["core", "server_config"]
attachments = ["core", "server_config"]
engine = ["core", "identity", "messages", "server_config"]
streams = ["core", "engine", "messages", "server_config"]
device_sync = ["core", "engine", "identity"]
notifications = ["core", "engine"]
facade = [
  "attachments",
  "core",
  "device_sync",
  "engine",
  "identity",
  "messages",
  "notifications",
  "server_config",
  "streams",
]


# Edges that exist today. Each count is exact; lower it when a PR removes
# references, and delete the waiver when none are left.

[[waivers]]
from = "core"
to = "engine"
tier = "path"
count = 1
reason = "The context re-exports the engine alias XmtpSharedContext at its old path; the facade takes over that path when core becomes a crate."

[[waivers]]
from = "core"
to = "facade"
tier = "path"
count = 1
reason = "The context re-exports the facade alias XmtpMlsLocalContext at its old path; the facade takes over that path when core becomes a crate."

[[waivers]]
from = "core"
to = "identity"
tier = "path"
count = 6
reason = "Task 17: identity re-exports identity_ext and the identity-owned strategy and key package items at their old paths; the facade takes over those paths when core becomes a crate."

[[waivers]]
from = "engine"
to = "facade"
tier = "path"
count = 6
reason = "PR 5b (Tasks 12 and 15): engine test helpers outside test suites still build a facade client or name the facade's test utilities."

[[waivers]]
from = "engine"
to = "streams"
tier = "path"
count = 5
reason = "PR 7 (Task 20): the receiver and the group stream entry points name stream types."

[[waivers]]
from = "streams"
to = "facade"
tier = "path"
count = 1
reason = "Streams extraction (PR 7): stream_failure_details opens the transparent ClientError::Group so a group failure keeps its stream-failure details."

[naming]
prefix = "xmtp_mls_"
exempt = ["xmtp_integration_tests"]
existing = [
  "error_glossary",
  "keepalive-probe",
  "xchaos",
  "xdbg",
  "xmtp-db-tools",
  "xmtp-sdk-bindgen",
  "xmtp-workspace-hack",
  "xmtp_api",
  "xmtp_api_backend",
  "xmtp_api_grpc",
  "xmtp_archive",
  "xmtp_attachments",
  "xmtp_attachments_server",
  "xmtp_backend",
  "xmtp_backend_config",
  "xmtp_common",
  "xmtp_configuration",
  "xmtp_content_types",
  "xmtp_cryptography",
  "xmtp_db",
  "xmtp_events",
  "xmtp_id",
  "xmtp_legacy_migration",
  "xmtp_logging",
  "xmtp_macro",
  "xmtp_mls",
  "xmtp_mls_common",
  "xmtp_mls_validation",
  "xmtp_proto",
  "xmtp_push_types",
  "xmtp_rate_limit",
  "xmtp_sdk",
]

# The call tier (dev/check-boundaries --full) counts every reference to an
# item, method calls and inferred types included, so its counts are larger.
# Each edge has the same cause and owner as its path waiver.

[[waivers]]
from = "core"
to = "engine"
tier = "call"
count = 1
reason = "The context re-exports the engine alias XmtpSharedContext at its old path; the facade takes over that path when core becomes a crate."

[[waivers]]
from = "core"
to = "identity"
tier = "call"
count = 4
reason = "Task 17 moves identity_ext with the identity crate."

[[waivers]]
from = "engine"
to = "facade"
tier = "call"
count = 18
reason = "PR 5b (Tasks 12 and 15): engine test helpers outside test suites still build a facade client or name the facade's test utilities."

[[waivers]]
from = "engine"
to = "streams"
tier = "call"
count = 13
reason = "PR 7 (Task 20): the receiver and the group stream entry points name stream types."

[[waivers]]
from = "streams"
to = "facade"
tier = "call"
count = 4
reason = "Streams extraction (PR 7): stream_failure_details opens the transparent ClientError::Group so a group failure keeps its stream-failure details."
