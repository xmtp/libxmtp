[package]
name = "xmtp_id"
description = "XMTP Identity implementation according to XIP-46"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = [
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
  "aarch64-apple-darwin",
]

[dependencies]
alloy = { workspace = true, features = [
  "sol-types",
  "provider-http",
  "reqwest",
] }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
coset = { version = "0.4", optional = true }
ed25519-dalek = { workspace = true, features = ["digest"] }
futures.workspace = true
futures-executor = { version = "0.3", optional = true }
hex.workspace = true
hpke-rs.workspace = true
lru.workspace = true
openmls.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
p256.workspace = true
parking_lot.workspace = true
passkey = { version = "0.5", optional = true }
prost.workspace = true
public-suffix = { version = "0.1.3", optional = true }
regex.workspace = true
rstest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_cryptography.workspace = true
xmtp_proto.workspace = true

[dev-dependencies]
alloy = { workspace = true, features = [
  "sol-types",
  "providers",
  "rpc",
  "rpc-types",
  "network",
  "json",
  "contract",
  "rand",
] }
coset = "0.4"
ed25519-dalek = { workspace = true, features = ["digest", "rand_core"] }
futures-executor = "0.3"
passkey = "0.5"
public-suffix = "0.1.3"
rstest.workspace = true
tokio = { workspace = true }
wasm-bindgen-test.workspace = true
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_configuration = { workspace = true, features = ["test-utils"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Activate native harness support without enabling it on portable fixtures.
alloy-provider = { version = "2", default-features = false, features = [
  "anvil-node",
], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
alloy-provider = { version = "2", default-features = false, features = [
  "anvil-node",
] }
ctor.workspace = true

[features]
test-utils = [
  "dep:passkey",
  "dep:coset",
  "dep:public-suffix",
  "dep:futures-executor",
  "xmtp_common/test-utils",
  "xmtp_configuration/test-utils",
  "dep:rstest",
  "alloy/json",
  "alloy/contract",
  "alloy/rand",
]

test-utils-anvil = ["test-utils", "dep:alloy-provider"]
