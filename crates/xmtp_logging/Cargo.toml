[package]
name = "xmtp_logging"
description = "Logging and tracing pipeline construction for libxmtp"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
http.workspace = true
opentelemetry.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
  "fmt",
  "env-filter",
  "ansi",
  "json",
  "registry",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
# Local OTLP receiver for tests in this crate and its bindings.
opentelemetry-proto = { version = "0.32", default-features = false, features = [
  "gen-tonic",
  "trace",
  "logs",
], optional = true }
tonic = { workspace = true, features = [
  "transport",
  "router",
], optional = true }
tokio-stream = { workspace = true, features = ["net"], optional = true }
metrics = { workspace = true, optional = true }
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
tracing-appender.workspace = true
opentelemetry-appender-tracing.workspace = true
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# Only to install the ring provider that sentry's `rustls-no-provider`
# transport needs; pinned ring-only by the workspace dep.
rustls = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
metrics-util.workspace = true
futures = { workspace = true, features = ["executor"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
sentry = { workspace = true, features = ["test"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web.workspace = true
# test-utils only: readable panics in wasm test output.
console_error_panic_hook = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
tracing_android_trace = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[features]
metrics = ["dep:metrics"]
# The test subscriber installed by `#[xmtp_common::test]`. On wasm this pulls in
# `console_error_panic_hook` for readable panic output. Native tests also get a
# local OTLP receiver shared with binding tests.
test-utils = [
  "dep:console_error_panic_hook",
  "dep:opentelemetry-proto",
  "dep:tonic",
  "dep:tokio-stream",
]
# Sentry telemetry backend. Native-only; the deps it pulls in do not build on wasm.
sentry = [
  "dep:sentry",
  "dep:sentry-tracing",
  "dep:hkdf",
  "dep:sha2",
  "dep:rustls",
]
