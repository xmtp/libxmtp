[package]
name = "xmtp_mls_group_state"
description = "MLS group state: app data, group metadata, inbox IDs and versions"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Counters of registry decodes and policy evaluations, for cost tests.
test-utils = []

[dependencies]
bon.workspace = true
hex.workspace = true
openmls.workspace = true
prost.workspace = true
semver.workspace = true
serde.workspace = true
thiserror.workspace = true
tls_codec.workspace = true
tracing.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_cryptography.workspace = true
xmtp_id.workspace = true
xmtp_mls_group_keys.workspace = true
xmtp_mls_tls_collections.workspace = true
xmtp_proto.workspace = true

[dev-dependencies]
proptest.workspace = true
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_configuration = { workspace = true, features = ["test-utils"] }
xmtp_cryptography = { workspace = true, features = ["test-utils"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

# The dev-dependency above turns this feature on, so every test build,
# including CI's, runs the heap-canary proofs.
[[test]]
name = "zeroize"
required-features = ["xmtp_cryptography/test-utils"]
