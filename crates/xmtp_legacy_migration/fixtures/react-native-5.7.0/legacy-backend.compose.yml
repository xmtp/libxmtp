services:
  db:
    image: postgres@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    environment:
      POSTGRES_PASSWORD: xmtp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60
  mlsdb:
    image: postgres@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    environment:
      POSTGRES_PASSWORD: xmtp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60
  validation:
    image: ghcr.io/xmtp/mls-validation-service@sha256:ee64edfeaece2414ea29ca8e1cdbd336a62648ddca9111ed1bd6de774734856d
    platform: linux/amd64
  node:
    image: ghcr.io/xmtp/node-go@sha256:e61e0f030504af32da0eae969e27ea9140c154e805ed218efa92cfaf7d053132
    platform: linux/amd64
    environment:
      GOWAKU-NODEKEY: 8a30dcb604b0b53627a5adc054dbf434b446628d4bd1eccc681d223f0550ce67
    command:
      - --store.enable
      - --store.db-connection-string=postgres://postgres:xmtp@db:5432/postgres?sslmode=disable
      - --store.reader-db-connection-string=postgres://postgres:xmtp@db:5432/postgres?sslmode=disable
      - --mls-store.db-connection-string=postgres://postgres:xmtp@mlsdb:5432/postgres?sslmode=disable
      - --mls-validation.grpc-address=validation:50051
      - --api.enable-mls
      - --wait-for-db=30s
    ports:
      - "127.0.0.1::5556"
    depends_on:
      db:
        condition: service_healthy
      mlsdb:
        condition: service_healthy
      validation:
        condition: service_started
