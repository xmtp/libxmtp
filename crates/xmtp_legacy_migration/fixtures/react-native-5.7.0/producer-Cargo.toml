[package]
name = "rn-legacy-fixture-producer"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
xmtpv3 = { path = "/private/tmp/rn-legacy-native-source/bindings/mobile" }
xmtp_cryptography = { path = "/private/tmp/rn-legacy-native-source/crates/xmtp_cryptography" }
hex = "0.4"
serde_json = "1"
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
diesel = { git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" }
diesel_migrations = { git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" }
