[package]
name = "xmtp_legacy_migration"
description = "Offline conversion of legacy XMTP databases to standard archives"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
bincode.workspace = true
diesel = { workspace = true, features = ["sqlite"] }
hex.workspace = true
openmls.workspace = true
prost.workspace = true
thiserror.workspace = true
tls_codec.workspace = true
tracing.workspace = true
xmtp-workspace-hack.workspace = true
xmtp_archive.workspace = true
xmtp_common.workspace = true
xmtp_mls_common.workspace = true
xmtp_proto.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uniffi = { version = "=0.32.2", default-features = false, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi = { version = "=0.32.2", default-features = false, features = [
  "wasm-unstable-single-threaded",
] }
uniffi-runtime-wasm.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
xmtp_db.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
sqlite-wasm-rs = { version = "0.5", default-features = false }
sqlite-wasm-vfs = "0.2"
xmtp_configuration.workspace = true

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
xmtp_common = { workspace = true, features = ["test-utils"] }

[[example]]
name = "fixture_host"
crate-type = ["cdylib"]
