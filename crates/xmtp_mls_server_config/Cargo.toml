[package]
name = "xmtp_mls_server_config"
description = "The XMTP deployment's published server configuration and the local storage location record"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Hook state and dispatch points that change runtime behavior for a test.
# Never enabled outside tests.
test-hooks = []
test-utils = ["dep:async-trait", "dep:futures", "xmtp_db/test-utils"]

[dependencies]
async-trait = { workspace = true, optional = true }
futures = { workspace = true, features = ["alloc", "std"], optional = true }
hex.workspace = true
parking_lot.workspace = true
prost = { workspace = true, features = ["derive"] }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
xmtp_api.workspace = true
xmtp_attachments.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_db.workspace = true
xmtp_events.workspace = true
xmtp_id.workspace = true
xmtp_proto.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures = { workspace = true, features = ["alloc", "std", "executor"] }
xmtp_api = { workspace = true, features = ["test-utils"] }
xmtp_api_backend = { workspace = true, features = ["test-utils"] }
xmtp_api_grpc = { workspace = true, features = ["test-utils"] }
xmtp_common = { workspace = true, features = ["test-utils-network"] }
xmtp_configuration = { workspace = true, features = ["test-utils"] }
xmtp_db = { workspace = true, features = ["test-utils"] }
xmtp_mls = { workspace = true, features = ["test-utils"] }
xmtp_mls_validation = { workspace = true, features = ["test-utils"] }
xmtp_proto = { workspace = true, features = ["test-utils-network"] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
ctor.workspace = true
fdlimit.workspace = true
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
xmtp_backend = { path = "../../apps/backend", features = ["test-utils"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[[test]]
name = "server_config"
path = "tests/server_config/main.rs"
required-features = ["test-utils"]
