[package]
name = "xmtp_mls_validation"
description = "Shared XMTP payload admission, commit validation rules, and fixtures"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true, optional = true }
hex.workspace = true
openmls.workspace = true
openmls_rust_crypto.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tls_codec.workspace = true
tracing.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_cryptography.workspace = true
xmtp_id.workspace = true
xmtp_mls_common.workspace = true
xmtp_proto.workspace = true

[features]
default = []
test-utils = [
  "dep:async-trait",
  "xmtp_common/test-utils",
  "xmtp_id/test-utils",
  "openmls/test-utils",
]

[dev-dependencies]
async-trait.workspace = true
openmls = { workspace = true, features = ["test-utils"] }
openmls_basic_credential.workspace = true
tokio.workspace = true
wasm-bindgen-test.workspace = true
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_id = { workspace = true, features = ["test-utils"] }
