[package]
name = "xmtp_mls_validation"
description = "Shared XMTP payload admission, commit validation rules, and fixtures"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true, optional = true }
futures.workspace = true
hex.workspace = true
openmls.workspace = true
openmls_rust_crypto.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tls_codec.workspace = true
tracing.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_cryptography.workspace = true
xmtp_id.workspace = true
xmtp_mls_common.workspace = true
xmtp_proto.workspace = true

[features]
default = []
test-utils = [
  "dep:async-trait",
  "xmtp_common/test-utils",
  "xmtp_id/test-utils",
  "openmls/test-utils",
]

[dev-dependencies]
async-trait.workspace = true
# Sign bytes the group keys never sign, and derive a group signing key the
# way the group key table states, to build refused publish signatures.
ed25519-dalek.workspace = true
hkdf.workspace = true
# The bench times the commit-log nonce HMAC of the seal self-check.
hmac.workspace = true
openmls = { workspace = true, features = ["test-utils"] }
openmls_basic_credential.workspace = true
sha2.workspace = true
tokio.workspace = true
wasm-bindgen-test.workspace = true
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_cryptography = { workspace = true, features = ["test-utils"] }
xmtp_id = { workspace = true, features = ["test-utils"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

# A one-off measurement of publish-signature cost, not a CI check:
# `dev/nix-shell 'dev/agent-run cargo bench -p xmtp_mls_validation --bench publish_signature'`.
[[bench]]
name = "publish_signature"
harness = false

# The dev-dependency above turns this feature on, so every test build,
# including CI's, runs the heap-canary proof.
[[test]]
name = "zeroize"
required-features = ["xmtp_cryptography/test-utils"]
