[package]
name = "xmtp_mls_messages"
description = "Decoded XMTP MLS messages and their enrichment"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
conformance = []
test-utils = []

[dependencies]
bytes.workspace = true
hex.workspace = true
prost = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_content_types.workspace = true
xmtp_db.workspace = true
xmtp_proto.workspace = true

[dev-dependencies]
xmtp_common = { workspace = true, features = ["test-utils"] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true
