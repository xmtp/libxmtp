[package]
name = "xmtp_mls_common"
description = "common MLS utilties"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Storage-track selection, forwarded to xmtp_db (which drives the global
# maybe-async/is_sync switch + the openmls track). Default is `sync` so every
# existing consumer is unchanged; `async` is for the sqlx/Postgres track.
default = ["sync", "blocking"]
sync = ["xmtp_db/sync"]
blocking = ["xmtp_db/blocking"]
async = ["xmtp_db/async"]

[dependencies]
bon.workspace = true
hex.workspace = true
hpke-rs.workspace = true
openmls.workspace = true
openmls_libcrux_crypto.workspace = true
openmls_traits.workspace = true
parking_lot.workspace = true
prost.workspace = true
serde.workspace = true
thiserror.workspace = true
tls_codec.workspace = true
xmtp-workspace-hack.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_cryptography.workspace = true
# Direct path dep (not `workspace = true`) so we can turn default features off:
# cargo forbids a member overriding a workspace dep's `default-features`. This
# is the experiment's async-track plumbing; a shipping version would instead set
# `default-features = false` at the workspace root and have every consumer pick a track.
xmtp_db = { path = "../xmtp_db", default-features = false }
xmtp_id.workspace = true
xmtp_proto.workspace = true

[dev-dependencies]
openmls_rust_crypto.workspace = true
proptest.workspace = true
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_configuration = { workspace = true, features = ["test-utils"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true
