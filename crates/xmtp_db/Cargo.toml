[package]
name = "xmtp_db"
description = "SQLite interface for XMTP"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
doc = false
name = "update-schema"
path = "src/bin/update-schema.rs"
required-features = ["update-schema"]


[dependencies]
arc-swap.workspace = true
ascii_table = { version = "5", optional = true, features = [
  "auto_table_width",
] }
bincode.workspace = true
# CBOR is the OpenMLS serialization on the async/Postgres track (self-describing,
# unlike bincode, which some OpenMLS entities' serde shapes need). Async-only;
# the sync/SQLite track stays on bincode until a dedicated migration moves it.
ciborium = { version = "0.2", optional = true }
bon.workspace = true
ctor.workspace = true
derive_builder.workspace = true
# Sync track only. A server build must pull neither diesel nor -- more to the
# point -- libsqlite3-sys below, which vendors SQLCipher and OpenSSL.
diesel = { workspace = true, optional = true, features = [
  "returning_clauses_for_sqlite_3_35",
  "sqlite",
  "32-column-tables",
  "serde_json",
] }
diesel_migrations = { workspace = true, optional = true, features = ["sqlite"] }
futures = { workspace = true, optional = true }
hex.workspace = true
itertools.workspace = true
maybe-async.workspace = true
mockall = { workspace = true, optional = true }
openmls.workspace = true
openmls_basic_credential.workspace = true
openmls_rust_crypto.workspace = true
openmls_traits.workspace = true
parking_lot.workspace = true
prost.workspace = true
rand.workspace = true
serde.workspace = true
serde_path_to_error = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
toml = { workspace = true, optional = true }
tracing.workspace = true
xmtp-workspace-hack.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_content_types.workspace = true
# `PgModel` derive. A proc macro, so it costs nothing at runtime and pulls in no
# storage driver; the items it emits are gated on `async` in the derive itself.
xmtp_macro.workspace = true
xmtp_proto.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Postgres only, deliberately: sqlx-sqlite pins libsqlite3-sys ^0.30 while
# diesel here needs ^0.35, and both set `links = "sqlite3"` — cargo permits only
# one such package per graph. SQLite therefore stays exclusively on the diesel
# (sync) track, which is also the only track wasm can use.
sqlx = { workspace = true, optional = true, features = [
  "postgres",
  "runtime-tokio",
] }
# `tokio::sync::Mutex` pins one connection for the duration of a transaction.
# It must be tokio's and not parking_lot's: the transaction closure is
# caller-supplied and (once it is `maybe_async`) awaits arbitrary work between
# lock acquisition and release, so a blocking guard would hold an OS thread
# across unbounded network round-trips.
# Also pulled in under `test-utils`, where it powers the task-local KV read
# counter behind the metadata read-amplification test (already present
# transitively via xmtp-workspace-hack, so it adds nothing to production builds).
tokio = { workspace = true, optional = true }
# Async-track only: the sqlx-Postgres OpenMLS crypto-store provider. Enabled by
# the `async` feature; never in the graph on the sync/diesel track.
openmls_pg_storage = { path = "../openmls_pg_storage", optional = true }
libsqlite3-sys = { version = "0.35", optional = true, features = [
  "bundled-sqlcipher-vendored-openssl",
] }
diesel = { workspace = true, optional = true, features = ["r2d2"] }
dyn-clone.workspace = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.5", default-features = false }
sqlite-wasm-vfs = "0.2"
# OpenMLS needs the `js` feature on wasm (secure randomness + current time via
# web-time); the fork's build script hard-errors without it. Wired here so both
# the sync and async(ready-future) SQLite wasm builds link it.
openmls = { workspace = true, features = ["js"] }
tokio.workspace = true
web-sys = { workspace = true, features = ["DomException"] }
wasm-bindgen.workspace = true


[[bench]]
harness = false
name = "db_init_latency"
required-features = ["bench"]

[dev-dependencies]
futures.workspace = true
mockall.workspace = true
rstest.workspace = true
xmtp_cryptography.workspace = true
# Switches `test-utils` on for the test targets (needed by `tests/` and the
# `db_init_latency` bench, which `cfg(test)` alone does not cover).
#
# Do NOT add `default-features = false` here to try to test the async track:
# differing features make cargo build a *second instance* of xmtp_db, and both
# instances then define `impl RetryableError<Mls> for diesel::result::Error` on a
# shared upstream type, so every `retryable!` call becomes ambiguous (E0283).
# Runtime-testing the sqlx impls needs a separate crate instead.
xmtp_db = { workspace = true, features = ["test-utils"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
criterion = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[features]
default = ["sync", "blocking"]
# Storage BACKEND + SHAPE are two axes.
#
# `sync` selects the diesel/SQLite BACKEND (the ~530 `cfg(feature = "sync")`
# gates key on this). `blocking` selects the maybe-async `is_sync` SHAPE. They
# used to be fused, but the all-async spike needs the diesel backend under the
# ASYNC openmls shape ("ready-future SQLite"): `--no-default-features --features
# sync` gives exactly that. The normal client is `sync + blocking` (unchanged),
# and `async` is the sqlx/Postgres backend which is async-shaped by construction.
# `blocking` and `async` are mutually exclusive (is_sync is a global switch);
# wasm can only use the diesel backend (sqlx cannot target wasm32).
sync = [
  "dep:diesel",
  "dep:diesel_migrations",
  "dep:libsqlite3-sys",
  "xmtp_proto/diesel",
]
# The blocking SHAPE: maybe-async's global `is_sync` switch, plus openmls' matching
# blocking track (its traits ride the same switch). Separated from `sync` so the
# diesel backend can also be built under the async openmls shape.
blocking = [
  "maybe-async/is_sync",
  "openmls/sync",
  "openmls_traits/sync",
  "openmls_basic_credential/sync",
  "openmls_rust_crypto/sync",
]
# `openmls/0-8-1-storage-format` switches OpenMLS' storage enums (CredentialType,
# ExtensionType, ProposalType) to STANDARD serde derive, which is self-consistent
# under any single format. Their default custom derive (integer `storage_tag`s)
# assumes non-self-describing formats encode enum variants by index (true for
# bincode, the sync track) — but CBOR encodes them by NAME, so ser writes a name
# string while de expects the tag integer. Async/CBOR only; the sync/SQLite
# (bincode) track keeps the custom format, so its on-disk data is unchanged.
async = [
  "dep:sqlx",
  "dep:tokio",
  "dep:ciborium",
  "dep:openmls_pg_storage",
  "xmtp_proto/sqlx",
  "openmls/0-8-1-storage-format",
]
update-schema = ["dep:toml"]
# Enables the latency-injecting SQLite VFS used by the disk-latency benchmarks.
bench = []
# Re-decode bincode failures via serde_path_to_error to log failing field path on `openmls_kv` target.
deserialize-paths = ["dep:serde_path_to_error"]
test-utils = [
  "dep:futures",
  "xmtp_common/test-utils",
  "dep:mockall",
  "dep:ascii_table",
  "dep:tokio",
  "xmtp_configuration/test-utils",
  "xmtp_cryptography/test-utils",
  "xmtp_proto/test-utils",
]
