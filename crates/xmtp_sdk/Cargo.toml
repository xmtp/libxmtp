[package]
name = "xmtp_sdk"
description = "XMTP SDK UniFFI facade"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
xmtp-workspace-hack.workspace = true
xmtp_api_backend.workspace = true
xmtp_common.workspace = true
xmtp_content_types.workspace = true
xmtp_cryptography.workspace = true
xmtp_db.workspace = true
xmtp_id.workspace = true
xmtp_macro.workspace = true
xmtp_mls.workspace = true
xmtp_proto.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { version = "=0.32.2", default-features = false, features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi = { version = "=0.32.2", default-features = false, features = ["wasm-unstable-single-threaded"] }
wasm-bindgen-futures.workspace = true

[dev-dependencies]
alloy.workspace = true
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_configuration.workspace = true
