plugins {
    id 'com.android.application' version '8.9.1'
    id 'org.jetbrains.kotlin.android' version '2.0.0'
}
def packageRoot = file(providers.gradleProperty('sdkPackageRoot').get())
def outputRoot = file(providers.gradleProperty('benchmarkBuildDirectory').get())
layout.buildDirectory = outputRoot
android {
    namespace 'org.xmtp.benchmark'
    compileSdk 35
    defaultConfig {
        applicationId 'org.xmtp.benchmark'
        minSdk 26
        targetSdk 35
    }
    sourceSets.main {
        java.srcDirs = []
        manifest.srcFile 'src/main/AndroidManifest.xml'
    }
    buildTypes.release {
        debuggable false
        minifyEnabled false
        signingConfig signingConfigs.debug
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging.resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
}
kotlin.sourceSets.getByName('main').kotlin.setSrcDirs(['.'])
kotlin.sourceSets.getByName('main').kotlin.include('Benchmark.kt', 'New.kt')
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // The frozen closure must contain the SDK and all of its runtime AAR/JAR files.
    implementation fileTree(dir: packageRoot, include: ['**/*.aar', '**/*.jar'])
}
