[package]
name = "xmtp_proto"
description = "xmtp protobuf definitions for rust"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
derive_builder.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
hex.workspace = true
http = "1.4"
openmls.workspace = true
openmls_traits.workspace = true
pbjson.workspace = true
pbjson-types.workspace = true
pin-project.workspace = true
prost = { workspace = true, features = ["derive"] }
prost-types = "0.14"
serde.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tonic = { workspace = true }
tonic-prost = "0.14"
tracing.workspace = true
url.workspace = true
xmtp_common.workspace = true
xmtp_configuration.workspace = true

# optional
diesel = { workspace = true, optional = true, features = ["sqlite"] }
mockall = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toxiproxy_rust = { workspace = true, optional = true }
# `codegen` is required because `build.rs` gates server-side generated
# modules on `cfg(any(not(target_arch = "wasm32"), feature = "grpc_server_impls"))`,
# so native builds always compile server stubs that `use tonic::codegen::*`.
tonic = { workspace = true, features = ["channel", "codegen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-test.workspace = true

[dev-dependencies]
bincode.workspace = true
mockall.workspace = true
rstest.workspace = true
tokio = { workspace = true }
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_configuration = { workspace = true, features = ["test-utils"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
toxiproxy_rust.workspace = true
ctor.workspace = true

[build-dependencies]
tonic-prost-build = "0.14"
walkdir = "2.5"
pbjson-build = "0.9"
tonic = { workspace = true, features = ["codegen"] }

[features]
default = []
diesel = ["dep:diesel"]
dev = ["xmtp_configuration/dev"]
test-utils = [
  "xmtp_common/test-utils",
  "xmtp_configuration/test-utils",
  "dep:mockall",
]
test-utils-network = ["test-utils", "dep:toxiproxy_rust", "xmtp_common/test-utils-network"]
grpc_server_impls = ["tonic/codegen"]
