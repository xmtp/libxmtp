[package]
name = "xmtp_db_shape_bench"
description = "Storage-shape A/B microbench: SqlKeyStore (openmls StorageProvider) over the same diesel/SQLite backend, blocking vs ready-future (is_sync-off) shape"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

# Deliberately NOT a member of the libxmtp workspace (listed in the root manifest's
# `exclude`, like xmtp_mls_pg_tests / openmls_pg_storage). It toggles the client
# SHAPE via the `blocking` feature, so as a member `clippy --all-features` would
# enable `blocking` AND `async` at once (conflicting shapes) and fail to compile.
#
# It depends ONLY on xmtp_db, with NO test-utils -- so it never pulls
# `openmls/test-utils` and builds under the async (is_sync-off) shape with zero
# test-infrastructure threading. It isolates exactly the code the shape change
# touches: openmls' `StorageProvider` methods on SqlKeyStore going `fn` ->
# ready-future `async fn`. The timed loop drives the (always-ready, diesel-backed)
# future with `now_or_never()` -- one poll, no runtime -- so the async arm carries
# no executor overhead the blocking arm lacks; the two are a fair A/B.
#
#   blocking (today's client):    cargo bench
#   ready-future (is_sync off):   RUSTC_BOOTSTRAP=1 cargo bench --no-default-features

[features]
# Blocking is retired: the client is unconditionally async (ready-future). This
# bench now measures the SqlKeyStore storage path on the single (async) shape; the
# blocking-vs-ready-future A/B it was written for is recorded in the spike doc.
default = []

[dependencies]
xmtp_db = { path = "../xmtp_db", default-features = false, features = ["sync"] }
# Same path + features as the root's workspace.dependencies.openmls_traits, so the
# async xmtp_db build unifies this to the exact same package instance (one shape).
openmls_traits = { path = "../../../openmls-storage-send/traits", features = [
  "extensions-draft",
  "draft-ietf-mls-pq-ciphersuites",
] }

serde = { version = "1.0", default-features = false, features = ["derive"] }
futures = "0.3"
tempfile = "3"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "storage_shape"
harness = false

# Cargo only honours [patch] at a workspace root, and this crate is its own root,
# so the root manifest's patches have to be restated. KEEP IN SYNC with the root
# Cargo.toml (source of truth).
[patch.crates-io]
diesel = { git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" }
diesel_migrations = { git = "https://github.com/ephemerahq/diesel", branch = "coda/copy-to-sqlite" }
hpke-rs = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
hpke-rs-crypto = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
hpke-rs-libcrux = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
hpke-rs-rust-crypto = { git = "https://github.com/xmtp/hpke-rs", rev = "6dba5c7ff23fa9ad47d56f3207c8f79ff76b67d2" }
tracing-oslog = { git = "https://github.com/xmtp/tracing-oslog", rev = "69cebec3804c33267b8d18aa50a5d9ba18617121" }

[patch.crates-io.xmtp-workspace-hack]
path = "../xmtp-workspace-hack"
