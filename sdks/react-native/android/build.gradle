apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

react {
    libraryName = 'XmtpReactNativeSpec'
    codegenJavaPackageName = 'org.xmtp.reactnative'
}

// The ABIs to build CMakeLists.txt for. React Native's Gradle plugin applies
// the app's reactNativeArchitectures (or react.nativeArchitectures) property
// to the app only, so a library reads it itself. CMakeLists.txt links the
// package's libxmtp_sdk.so of each ABI, and a partial test package ships one
// ABI. Without the property: every ABI that the release package ships.
def xmtpReactNativeArchitectures() {
    def value = project.findProperty('reactNativeArchitectures') ?: project.findProperty('react.nativeArchitectures')
    def abis = value ? value.toString().split(',').collect { it.trim() }.findAll { it } : []
    return abis ?: ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
}

android {
    namespace 'org.xmtp.reactnative'
    compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 37
    buildToolsVersion rootProject.ext.has('buildToolsVersion') ? rootProject.ext.buildToolsVersion : '37.0.0'
    ndkVersion rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : '27.1.12297006'
    defaultConfig {
        minSdk 24
        ndk { abiFilters(*xmtpReactNativeArchitectures()) }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }
    externalNativeBuild {
        cmake { path 'CMakeLists.txt'; version '3.22.1' }
    }
    buildFeatures { prefab true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
}
