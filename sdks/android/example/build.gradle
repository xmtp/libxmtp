buildscript {
    ext {
        lifecycle_version = '2.7.0'
    }

}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

String androidBackendURL() {
    String url = System.getenv("XMTP_ANDROID_BACKEND_URL")
    if (url) return url
    String port = System.getenv("XMTP_BACKEND_PORT")
    File env = new File(projectDir, "../../../dev/docker/.env")
    if (!port && env.isFile()) {
        String line = env.readLines().find { it.startsWith("XMTP_BACKEND_PORT=") }
        if (line) port = line.substring("XMTP_BACKEND_PORT=".length()).replace("'", "")
    }
    return "http://10.0.2.2:${port ?: '5050'}"
}

// The release test mode changes signing and instrumentation only, not DEBUG or resources.
boolean releaseTransportTests = providers.gradleProperty('xmtpExampleReleaseTests').map { it.toBoolean() }.getOrElse(false)

android {
    namespace 'org.xmtp.android.example'
    compileSdk 35
    testBuildType releaseTransportTests ? 'release' : 'debug'

    defaultConfig {
        applicationId "org.xmtp.android.example"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "XMTP_BACKEND_URL", "\"${androidBackendURL()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        buildConfigField("String", "PROJECT_ID", "\"Your Application ID from https://cloud.walletconnect.com/\"")
    }

    buildTypes {
        release {
            if (releaseTransportTests) signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        test { java.srcDir 'src/sharedTest/java' }
        androidTest {
            java.srcDir 'src/sharedTest/java'
            if (releaseTransportTests) java.srcDir 'src/androidTestRelease/java'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':library')
    implementation project(':example-shared')
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation 'androidx.compose.runtime:runtime:1.8.2'
    implementation 'androidx.compose.foundation:foundation:1.8.2'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.ui:ui:1.8.2'
    implementation 'androidx.emoji2:emoji2-emojipicker:1.6.0'
    implementation 'androidx.emoji2:emoji2-bundled:1.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.json:json:20180813'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.compose.runtime:runtime:1.8.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.8.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.8.2'
}
