buildscript {
    ext {
        lifecycle_version = '2.7.0'
    }

}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

String androidBackendURL() {
    String url = System.getenv("XMTP_ANDROID_BACKEND_URL")
    if (url) return url
    String port = System.getenv("XMTP_BACKEND_PORT")
    File env = new File(projectDir, "../../../dev/docker/.env")
    if (!port && env.isFile()) {
        String line = env.readLines().find { it.startsWith("XMTP_BACKEND_PORT=") }
        if (line) port = line.substring("XMTP_BACKEND_PORT=".length()).replace("'", "")
    }
    return "http://10.0.2.2:${port ?: '5050'}"
}

android {
    namespace 'org.xmtp.android.example'
    compileSdk 35

    defaultConfig {
        applicationId "org.xmtp.android.example"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "XMTP_BACKEND_URL", "\"${androidBackendURL()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        buildConfigField("String", "PROJECT_ID", "\"Your Application ID from https://cloud.walletconnect.com/\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':library')
    implementation project(':example-shared')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // WalletConnect V2: core library + WalletConnectModal
    implementation(platform("com.walletconnect:android-bom:1.19.1"))
    implementation("com.walletconnect:android-core")
    implementation("com.walletconnect:walletconnect-modal")

    //Navigation Component
    def nav_version = "2.7.6"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.8.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.8.2'
}
