services:
  db:
    image: postgres:18.6
    environment: { POSTGRES_USER: xmtp, POSTGRES_PASSWORD: xmtp, POSTGRES_DB: xmtp_backend }
    tmpfs: [/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U xmtp -d xmtp_backend"], interval: 1s, retries: 30 }
  backend:
    image: ghcr.io/xmtp/backend:self-hosted      # loaded from `nix build .#backend-image-<arch>` by `just backend up`
    depends_on: { db: { condition: service_healthy } }
    environment: { XMTP_DATABASE_URL: postgres://xmtp:xmtp@db:5432/xmtp_backend, XMTP_CHAIN_31337_URL: http://anvil:8545 }
    volumes: ["../../../../dev/backend/local.toml:/config.toml:ro"]
    command: ["--config", "/config.toml"]
    ports: ["5050:5050"]
  anvil:            # chain for the backend's SCW verification and for the existing SCW tests
    image: ghcr.io/foundry-rs/foundry
    entrypoint: ["anvil", "--host", "0.0.0.0", "--base-fee", "100"]
    ports: ["8545:8545"]
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on: [backend]
    ports: ["8474:8474", "6010:6010"]
    volumes: ["../../../../dev/docker/toxiproxy/config.json:/etc/toxiproxy/config.json:ro"]
    entrypoint: ["/toxiproxy"]
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/config.json"]
