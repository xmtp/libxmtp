buildscript {
    configurations.classpath.resolutionStrategy.activateDependencyLocking()
}

plugins {
    id 'com.android.application' version '8.10.1' apply false
    id 'com.android.library' version '8.10.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.multiplatform' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20' apply false
    id 'org.jetbrains.compose' version '1.8.2' apply false
    id 'io.github.gradle-nexus.publish-plugin' version "1.2.0"
    id "org.jetbrains.dokka" version "2.2.0" apply false
    id 'com.diffplug.spotless' version '8.0.0' apply false
}

group = "org.xmtp"
// version is read from gradle.properties

// Configure Spotless for all subprojects
subprojects {
    apply plugin: 'com.diffplug.spotless'

    // Use the NDK supplied by Nix for native library stripping.
    def nixNdk = System.getenv("ANDROID_NDK_HOME")
    if (nixNdk) {
        def ndkProperties = new Properties()
        file("${nixNdk}/source.properties").withInputStream { ndkProperties.load(it) }
        ['com.android.application', 'com.android.library'].each { pluginId ->
            plugins.withId(pluginId) {
                def android = extensions.getByName("android")
                android.ndkPath = nixNdk
                android.ndkVersion = ndkProperties.getProperty("Pkg.Revision")
            }
        }
    }

    dependencyLocking {
        lockAllConfigurations()
        lockMode = org.gradle.api.artifacts.dsl.LockMode.STRICT
    }

    spotless {
        kotlin {
            target '**/*.kt'
            targetExclude '**/build/**', '**/generated/**', '**/.build/**', '**/xmtp_sdk.kt'
            ktlint('1.8.0')
        }

        kotlinGradle {
            target '**/*.gradle.kts'
            ktlint('1.8.0')
        }

        format 'misc', {
            target '**/*.gradle', '**/*.md', '**/.gitignore'
            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            username = System.getenv("MAVEN_USERNAME")
            password = System.getenv("MAVEN_PASSWORD")
            stagingProfileId = System.getenv("MAVEN_PROFILE_ID")
        }
    }
}
