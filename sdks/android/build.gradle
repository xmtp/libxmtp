buildscript {
    configurations.classpath.resolutionStrategy.activateDependencyLocking()
}

plugins {
    id 'com.android.library' apply false
    id 'org.jetbrains.kotlin.android' apply false
    id 'io.github.gradle-nexus.publish-plugin'
    id "org.jetbrains.dokka" apply false
    id 'com.diffplug.spotless' apply false
}

def pins = new Properties()
file('gradle/toolchain.properties').withInputStream { pins.load(it) }
rootProject.ext.androidToolchain = pins

group = "org.xmtp"
// version is read from gradle.properties

// Configure Spotless for all subprojects
subprojects {
    apply plugin: 'com.diffplug.spotless'

    apply from: rootProject.file('gradle/android-ndk.gradle')

    dependencyLocking {
        lockAllConfigurations()
        lockMode = org.gradle.api.artifacts.dsl.LockMode.STRICT
    }

    spotless {
        kotlin {
            target '**/*.kt'
            targetExclude '**/build/**', '**/generated/**', '**/.build/**', '**/xmtp_sdk.kt'
            ktlint(pins.getProperty('ktlint'))
        }

        kotlinGradle {
            target '**/*.gradle.kts'
            ktlint(pins.getProperty('ktlint'))
        }

        format 'misc', {
            target '**/*.gradle', '**/*.md', '**/.gitignore'
            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            username = System.getenv("MAVEN_USERNAME")
            password = System.getenv("MAVEN_PASSWORD")
            stagingProfileId = System.getenv("MAVEN_PROFILE_ID")
        }
    }
}
