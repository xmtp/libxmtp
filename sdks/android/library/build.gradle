plugins {
    id 'signing'
    id 'maven-publish'
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id "org.jetbrains.dokka"
}

dokka {
    dokkaSourceSets.configureEach {
        // The generated sources are the public API. Include them in the reference.
    }
}

// Read a port for the local test stack: the environment first, then
// dev/docker/.env (written by dev/worktree-env), then the slot-0 default.
// Gradle may run without the `just` recipes, so do not rely on the environment
// alone: falling back to the default would point a worktree's tests at the main
// checkout's backend.
String worktreePort(String name, String fallback) {
    String fromEnv = System.getenv(name)
    if (fromEnv != null && !fromEnv.isEmpty()) {
        return fromEnv
    }
    File env = new File(projectDir, "../../../dev/docker/.env")
    if (env.isFile()) {
        for (String line : env.readLines()) {
            if (line.startsWith(name + "=")) {
                // dev/worktree-env single-quotes values.
                return line.substring(name.length() + 1).replaceAll("^'|'\$", "")
            }
        }
    }
    return fallback
}

String androidBackendURL() {
    String url = System.getenv("XMTP_ANDROID_BACKEND_URL")
    return url ?: "http://10.0.2.2:${worktreePort('XMTP_BACKEND_PORT', '5050')}"
}

android {
    namespace 'org.xmtp.android.library'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        // Each worktree publishes the local stack on its own ports, so the test
        // endpoints come from this worktree's environment. Prefer a variable the
        // `just` recipes export, then dev/docker/.env, so a direct ./gradlew or
        // Android Studio run still reaches this worktree's backend rather than
        // the main checkout's. 10.0.2.2 is how the emulator reaches the host;
        // only the port moves.
        buildConfigField "String", "XMTP_BACKEND_URL",
            "\"${androidBackendURL()}\""
        buildConfigField "String", "ANVIL_URL",
            "\"http://10.0.2.2:${worktreePort("XMTP_ANVIL_PORT", "8545")}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        animationsDisabled = true
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
        checkTestSources = false
        ignoreTestSources = true
    }
    // Use one matched generated package and its JNI libraries.
    sourceSets {
        main {
            def generated = System.getenv("XMTP_SDK_GENERATED_DIR")
            def sources = generated ? "${generated}/kotlin" : "${projectDir.parentFile}/.build/bindings"
            java.srcDirs += ["${sources}/uniffi", "${sources}/runtime", "${sources}/android"]
            jniLibs.srcDirs += [System.getenv("XMTP_SDK_ANDROID_JNI_DIR") ?: "${projectDir.parentFile}/.build/bindings/jniLibs"]
            assets.srcDirs += ["${buildDir}/generated/contract"]
        }
    }
}

def generatedRoot = System.getenv("XMTP_SDK_GENERATED_DIR")
def contractSource = generatedRoot ? "${generatedRoot}/kotlin/sdk-contract.json" : "${projectDir.parentFile}/.build/bindings/sdk-contract.json"
tasks.register("stageSDKContract", Copy) {
    fileMode = 0644
    from contractSource
    into "${buildDir}/generated/contract"
}
tasks.named("preBuild").configure { dependsOn "stageSDKContract" }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation "net.java.dev.jna:jna:5.17.0@aar"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
    // JVM tests need the host dispatcher that is absent from the Android AAR.
    testRuntimeOnly 'net.java.dev.jna:jna:5.17.0@jar'
    androidTestImplementation 'org.web3j:core:4.9.4'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = "org.xmtp"
                artifactId = "android"
                version = rootProject.version

                from components.release

                pom {
                    name = "XMTP"
                    description = "XMTP Android Library"
                    url = "https://github.com/xmtp/libxmtp"

                    licenses {
                        license {
                            name = "MIT License"
                            url = "https://github.com/xmtp/libxmtp/blob/self-hosted/sdks/android/LICENSE"
                        }
                    }
                    developers {
                        developer {

                            id = "xmtp"
                            name = "xmtp"
                            email = "naomi@xmtp.com"
                        }
                    }
                    scm {
                        connection = "https://github.com/xmtp/libxmtp.git"
                        developerConnection = "https://github.com/xmtp/libxmtp.git"
                        url = "https://github.com/xmtp/libxmtp/tree/self-hosted/sdks/android"
                    }
                }
            }
        }
    }
    signing {
        def signingKey = System.getenv("SIGN_KEY")
        def signingPassword = System.getenv("SIGN_PASSWORD")
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.release
    }
}
