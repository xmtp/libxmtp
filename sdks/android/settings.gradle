pluginManagement {
    def pins = new Properties()
    file('gradle/toolchain.properties').withInputStream { pins.load(it) }
    resolutionStrategy.eachPlugin {
        def version = pins.getProperty("plugin.${requested.id.id}")
        if (version) useVersion(version)
    }
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "xmtp-android"
include ':library'
