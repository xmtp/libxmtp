packages:
  - sdks/node
  - sdks/browser
  - sdks/agent
  - apps/cli
  - apps/web-chat
  - apps/docs
  - dev/release-tools

includeWorkspaceRoot: false

# Native artifacts are staged by Just/Nix before JavaScript tasks run.
tasks:
  build:
    dependsOn: ["^build"]
  typecheck:
    dependsOn: ["^build"]
  check:examples:
    dependsOn: ["^build"]
  lint:
    # Published-type probes read this package's output as well as dependencies.
    dependsOn: ["build"]
  # These checks consume products that CI has already validated and restored.
  lint:prepared:
    dependsOn: []
  typecheck:prepared:
    dependsOn: []
  check:examples:prepared:
    dependsOn: []
  build:prepared:
    dependsOn: []
  format:
    dependsOn: []
  format:check:
    dependsOn: []

# Nix reads packageManager from package.json; update its source hash on upgrades.
pmOnFail: error
# Release jobs update manifests after the frozen install.
verifyDepsBeforeRun: warn
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@xmtp/*"

allowBuilds:
  esbuild: true
  protobufjs: true
  keccak: true
  bufferutil: true
  utf-8-validate: true

overrides:
  # Must match nixpkgs playwright-driver and the catalog below.
  playwright: 1.61.1
  playwright-core: 1.61.1

catalog:
  "@playwright/test": "1.61.1"
  "@testing-library/dom": "^10.4.1"
  "@vitest/browser": "^4.1.10"
  "@vitest/browser-playwright": "^4.1.10"
  "@vitest/coverage-v8": "^4.1.10"
  "@xmtp/content-type-remote-attachment": "^2.0.3"
  "fast-glob": "^3.3.3"
  "oxfmt": "0.68.0"
  "playwright": "1.61.1"
  "prettier": "^3.9.6"
  "tsdown": "0.23.0"
  "tsx": "^4.23.1"
  "typescript": "7.0.2"
  "uint8array-extras": "^1.5.0"
  "viem": "^2.55.10"
  "vite": "^8.3.0"
  "vitest": "^4.1.10"

catalogs:
  node22:
    "@types/node": "^22.20.0"
  node26:
    "@types/node": "^26.1.1"
