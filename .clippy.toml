allow-unwrap-in-tests = true
large-error-threshold = 256
ignore-interior-mutability = ["xmtp_mls::groups::MlsGroup", "bytes::Bytes"]

# Every reqwest client must be built through `xmtp_common::http`, which keeps Android off
# `rustls-platform-verifier`: a default-built reqwest client aborts the process on its first
# TLS connection there. See `crates/xmtp_common/src/http.rs` for the full explanation.
#
# Clippy resolves paths, so this also catches `use reqwest::Client; Client::new()`, which a grep
# for `reqwest::Client::new` misses.
#
# The signing-key accessors below copy a private key into a bare array that is freed or dropped
# unwiped. Borrow the key (`SigningKey::as_bytes()`) or move it (`from_signing_key`). Where a copy
# is unavoidable, `#[allow(clippy::disallowed_methods)]` with a `// zeroize:` comment that names the
# `Zeroizing` binding holding the result, or says why none exists.
#
# A GroupInfo carries the group context, whose AppData dictionary holds the group root. Only a
# Welcome may carry it (GMOD-042), so nothing exports one: the commit builders call
# `create_group_info(false)`, and the export and bundle accessors below are banned. So are the
# OpenMLS convenience commits, which build a GroupInfo by default, and the builder option that
# turns it on. Two paths stay open because Clippy cannot ban them by path:
# `CommitMessageBundle::into_messages()`, whose third element production drops, and iteration over
# a bundle. With `create_group_info(false)` both yield no GroupInfo.
disallowed-methods = [
  { path = "reqwest::Client::new", reason = "use xmtp_common::http::client()" },
  { path = "reqwest::Client::builder", reason = "use xmtp_common::http::client_builder()" },
  { path = "reqwest::ClientBuilder::new", reason = "use xmtp_common::http::client_builder()" },
  { path = "ed25519_dalek::SigningKey::to_bytes", reason = "copies the private key; borrow with as_bytes()" },
  { path = "ed25519_dalek::SigningKey::to_keypair_bytes", reason = "copies the private key; borrow with as_bytes()" },
  { path = "alloy_signer_local::LocalSigner::to_bytes", reason = "copies the private key; hold the copy in Zeroizing" },
  { path = "alloy_signer_local::LocalSigner::to_field_bytes", reason = "copies the private key; hold the copy in Zeroizing" },
  { path = "ecdsa::SigningKey::to_bytes", reason = "copies the private key; hold the copy in Zeroizing" },
  { path = "elliptic_curve::SecretKey::to_bytes", reason = "copies the private key; hold the copy in Zeroizing" },
  { path = "openmls::group::MlsGroup::export_group_info", reason = "a GroupInfo carries the group root; only a Welcome may (GMOD-042)" },
  { path = "openmls::group::MlsGroup::export_group_info_with_additional_extensions", reason = "a GroupInfo carries the group root; only a Welcome may (GMOD-042)" },
  { path = "openmls::group::CommitMessageBundle::group_info", reason = "a GroupInfo carries the group root; only a Welcome may (GMOD-042)" },
  { path = "openmls::group::CommitMessageBundle::contents", reason = "returns the GroupInfo, which carries the group root (GMOD-042); use commit() and welcome()" },
  { path = "openmls::group::CommitMessageBundle::into_group_info", reason = "a GroupInfo carries the group root; only a Welcome may (GMOD-042)" },
  { path = "openmls::group::CommitMessageBundle::into_group_info_msg", reason = "a GroupInfo carries the group root; only a Welcome may (GMOD-042)" },
  { path = "openmls::group::CommitMessageBundle::into_contents", reason = "returns the GroupInfo, which carries the group root (GMOD-042); use into_messages() and drop the third element" },
  { path = "openmls::group::CommitBuilder::create_group_info_with_extensions", reason = "builds a GroupInfo, which carries the group root (GMOD-042)" },
  { path = "openmls::group::MlsGroup::add_members", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::add_members_without_update", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::swap_members", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::remove_members", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::self_update", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::self_update_with_new_signer", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::commit_to_pending_proposals", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::update_group_context_extensions", reason = "builds a GroupInfo, which carries the group root (GMOD-042); use commit_builder() with create_group_info(false)" },
  { path = "openmls::group::MlsGroup::join_by_external_commit", reason = "builds a GroupInfo, which carries the group root (GMOD-042)" },
]

disallowed-types = [
  { path = "openmls::group::WelcomeCommitMessages", reason = "holds the GroupInfo, which carries the group root (GMOD-042)" },
]
