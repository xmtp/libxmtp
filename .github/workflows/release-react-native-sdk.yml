name: "Release: React Native SDK"

on:
  workflow_call:
    inputs:
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

env:
  CARGO_TERM_COLOR: always

# Runners: the iOS legs need Xcode 27.0 and stay on paid macOS. The Linux legs
# stay on Blacksmith: they rebuild the versioned RN products on every release
# (the warm set holds only the default version), and the Android consumer
# job runs an emulator with native backend services and a Gradle build.
jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  components:
    name: Build RN components (${{ matrix.system }})
    needs: [check-push-permissions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: blacksmith-16vcpu-ubuntu-2404
          - system: aarch64-darwin
            runner: warp-macos-26-arm64-12x
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "read"
          github-token: ${{ github.token }}
      - name: Build the RN product stage
        uses: ./.github/actions/react-native-product
        with:
          stage: components
          system: ${{ matrix.system }}
          source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
          package-version: ${{ inputs.version }}
          artifact-prefix: react-native-release
          cache-mode: "read"

  build:
    name: Assemble npm package
    needs: [components, check-push-permissions]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "read"
          github-token: ${{ github.token }}
      - name: Build the RN product stage
        uses: ./.github/actions/react-native-product
        with:
          stage: package
          system: x86_64-linux
          source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
          package-version: ${{ inputs.version }}
          artifact-prefix: react-native-release
          cache-mode: "read"
      - name: Retain the exact checked release tarball
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p target/sdk-packages/react-native-release
          cp -RL "$XMTP_RN_PACKAGE_DIR/." target/sdk-packages/react-native-release/
          dev/nix-shell --shell js --command python3.11 sdks/react-native/scripts/package.py verify-package \
            "target/sdk-packages/react-native-release/xmtp-react-native-sdk-$VERSION.tgz" \
            --version "$VERSION" --source "$XMTP_RN_EXPECTED_SOURCE"
      - name: Store the release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: react-native-release-package
          path: target/sdk-packages/react-native-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  consumers:
    name: Installed-app tests (${{ matrix.platform }})
    needs: [build, check-push-permissions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            system: x86_64-linux
            runner: blacksmith-16vcpu-ubuntu-2404
          - platform: ios
            system: aarch64-darwin
            runner: warp-macos-26-arm64-12x
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      XMTP_SDK_BUILD: nix
      NIX_DEVSHELL: ${{ matrix.platform == 'android' && 'android' || 'ios' }}
      # Every journey, also runtime reload and background launch, gates publish.
      XMTP_RN_JOURNEYS: full
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "read"
          github-token: ${{ github.token }}
      - name: Set up JavaScript
        uses: ./.github/actions/setup-js
        with:
          cache-mode: "read"
          filter: "@xmtp/node-sdk..."
      - name: Build the RN product stage
        uses: ./.github/actions/react-native-product
        with:
          stage: consumers
          system: ${{ matrix.system }}
          source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
          package-version: ${{ inputs.version }}
          artifact-prefix: react-native-release
          cache-mode: "read"
      - name: Run the installed RN journeys
        uses: ./.github/actions/react-native-conformance
        with:
          platform: ${{ matrix.platform }}
          artifact-prefix: react-native-release

  publish:
    name: Publish
    needs: [build, consumers, check-push-permissions]
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
      package-dir: target/sdk-packages/react-native-release/package
      package-tarball: target/sdk-packages/react-native-release/xmtp-react-native-sdk-${{ inputs.version }}.tgz
      sdk: react-native-sdk
      version: ${{ inputs.version }}
      artifact-pattern: react-native-release-package
      artifact-path: target/sdk-packages/react-native-release
      ignore-scripts: true
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
