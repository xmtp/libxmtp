name: Check Rust SDK unit tests
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  unit:
    name: Test (SDK crate debug)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      NIX_DEVSHELL: rust
      SQLX_OFFLINE: 'true'
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: rust
        kache: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@just
    - name: Start local backend
      run: dev/nix-shell 'just backend up'
    - name: Run SDK crate tests with the existing debug test profile
      run: dev/nix-shell 'just test crate xmtp_sdk'
    - name: Dump Docker logs on failure
      if: failure()
      uses: jwalton/gh-docker-logs@v2
