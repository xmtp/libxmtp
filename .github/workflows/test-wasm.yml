name: Test WASM
on:
  workflow_call:
    inputs:
      prepared-products:
        type: boolean
        default: false
env:
  NIX_DEVSHELL: wasm
jobs:
  wasm-ci:
    name: Test (WASM)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ !inputs.prepared-products && secrets.CACHIX_AUTH_TOKEN || '' }}
          sccache: "false"
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Restore prepared backend product
        if: inputs.prepared-products
        uses: ./.github/actions/backend-product
        with:
          artifact-name: ci-backend
      - name: Start prepared backend
        if: inputs.prepared-products
        run: dev/nix-shell 'just backend up-prepared'
      - name: Start backend
        if: ${{ !inputs.prepared-products }}
        run: just backend up
      - name: Run WASM tests
        run: just wasm test-ci
