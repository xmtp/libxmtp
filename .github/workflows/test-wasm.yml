name: Test WASM
on:
  workflow_call:
env:
  NIX_DEVSHELL: wasm
jobs:
  wasm-ci:
    name: Test (WASM)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: "ci"
      - name: Start backend
        run: just backend up
      - name: Run WASM tests
        run: just wasm nix-test
