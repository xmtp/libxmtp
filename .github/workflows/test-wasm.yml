name: Test WASM
on:
  workflow_call:
env:
  NIX_DEVSHELL: wasm
jobs:
  # Compile the WASM test binaries once. The backend binary is a run input of
  # every partition; building it here lets the partitions substitute it
  # instead of 4 runners building it at once.
  archive:
    name: Test (WASM archive)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Build the WASM test archive and the backend
        run: >-
          nix build --print-build-logs --no-link
          .#wasm-nextest-archive.x86_64-linux .#xmtp-backend
  # Each partition runs one slice of the archive. nix/ci-checks.nix
  # (`wasmPartitions`) and dev/wasm.just name the same 4 slices.
  partition:
    name: Test (WASM ${{ matrix.part }})
    needs: archive
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: "ci"
      - name: Start backend
        run: just backend up
      - name: Run WASM tests
        run: just wasm nix-test-part ${{ matrix.part }}
