name: Test WASM
on:
  workflow_call:
env:
  NIX_DEVSHELL: wasm
jobs:
  # Compile the WASM test binaries once. The test services (with the backend
  # binary) are a run input of every partition; building them here lets the
  # partitions substitute them instead of 4 runners building them at once.
  archive:
    name: Test (WASM archive)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Build the WASM test archive and the test services
        run: >-
          nix build --print-build-logs --no-link
          .#wasm-nextest-archive.x86_64-linux .#services-test
  # Each partition runs one slice of the archive and starts its own test
  # services inside the build, so the job needs no Docker stack.
  # nix/ci-checks.nix (`wasmPartitions`) and dev/wasm.just name the same 4
  # slices.
  partition:
    name: Test (WASM ${{ matrix.part }})
    needs: archive
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - name: Run WASM tests
        run: just wasm nix-test-part ${{ matrix.part }}
      # The JUnit report of the slice, also when the result came from the
      # cache; a test that passed on retry shows as `flakyFailure`.
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-wasm-${{ matrix.part }}
          path: result-wasm-${{ matrix.part }}/junit.xml
          if-no-files-found: ignore
          retention-days: 14
