name: "Test: Rust WASM"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
      scope:
        description: full runs all partitions; sample rotates one partition on pull requests only.
        type: string
        default: full
env:
  NIX_DEVSHELL: wasm
jobs:
  # Compile the WASM test binaries once. The test services (with the backend
  # binary) are a run input of every partition; building them here lets the
  # partitions substitute them instead of 4 runners building them at once.
  archive:
    name: Build test archive
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      partitions: ${{ steps.partitions.outputs.partitions }}
    steps:
      - name: Select test partitions
        id: partitions
        env:
          SCOPE: ${{ inputs.scope }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          case "$SCOPE" in full|sample) ;; *) echo "::error::Unknown WASM scope: $SCOPE"; exit 1 ;; esac
          if [[ "$SCOPE" == sample && "$EVENT_NAME" == pull_request ]]; then
            echo "partitions=[$((RUN_NUMBER % 4 + 1))]" >> "$GITHUB_OUTPUT"
          else
            echo 'partitions=[1,2,3,4]' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Build the WASM test archive and the test services
        run: >-
          nix build --print-build-logs --no-link
          .#wasm-nextest-archive.x86_64-linux .#services-test
  # Each selected partition runs one slice of the archive and starts its own
  # test services inside the build, so the job needs no Docker stack.
  # nix/ci-checks.nix (`wasmPartitions`) and dev/wasm.just name the same 4
  # slices.
  partition:
    name: Tests (${{ matrix.part }} of 4)
    needs: archive
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.archive.outputs.partitions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: dev/nix-shell 'just wasm nix-test-part ${{ matrix.part }}'
        run: dev/nix-shell 'just wasm nix-test-part ${{ matrix.part }}'
      # The JUnit report of the slice, also when the result came from the
      # cache; a test that passed on retry shows as `flakyFailure`.
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-wasm-${{ matrix.part }}
          path: result-wasm-${{ matrix.part }}/junit.xml
          if-no-files-found: ignore
          retention-days: 14
