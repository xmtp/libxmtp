name: "Test: Rust workspace"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
env:
  NIX_DEVSHELL: rust
jobs:
  test:
    name: Tests with coverage
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted runners (merge and manual runs) have 4 vCPU.
    timeout-minutes: ${{ startsWith(inputs.runner, 'ubuntu-') && 60 || 30 }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: dev/check-ephemeral-backend
        run: dev/check-ephemeral-backend
      # The derivation starts its own test services (nix/services) on free
      # loopback ports, so the job needs no Docker stack. `nix build` keeps
      # the coverage report.
      # junit-refs proves that the JUnit step leaves no store path. One call
      # evaluates once; the first output links to workspace-tests.
      - name: Run workspace tests with coverage
        run: |
          nix build .#nextest.x86_64-linux .#junit-refs.x86_64-linux \
            --out-link workspace-tests --option sandbox relaxed --log-lines 500
      # The JUnit report, also when the result came from the cache; a test
      # that passed on retry shows as `flakyFailure`.
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-workspace
          path: workspace-tests/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: workspace-tests/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
