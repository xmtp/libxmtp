name: Test XDBG
on:
  workflow_call:
env:
  NIX_DEVSHELL: rust
jobs:
  check:
    name: Check (xdbg)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Check xdbg compiles
        run: nix build --no-link .#cargo-clippy.x86_64-linux.xdbg
  observe:
    name: Observability check
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      # `just backend up` builds and loads the backend image first.
      # The check builds xdbg as a traffic client.
      - name: Verify observability
        run: |
          just backend up
          just backend observe-check
      - name: Backend logs and cleanup
        if: always()
        run: |
          just backend logs || true
          just backend down
