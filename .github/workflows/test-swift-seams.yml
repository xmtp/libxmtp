name: Test Swift seam proofs and consumers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  swift:
    name: Swift seam proofs and consumers
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: ios
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          kache: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: taiki-e/install-action@just
      - name: Check native Apple toolchain
        run: dev/nix-shell 'bash dev/check-apple-toolchain'
      # test-ios.yml skips these tests in its macOS run (`test skip-seams`).
      - name: Swift seam proofs
        run: dev/nix-shell 'just backend ci just ios test-seams'
      - name: Check Swift consumers
        run: dev/nix-shell 'just ios check-consumer'
      - name: Retain native service logs
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
