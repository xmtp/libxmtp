name: Check JavaScript types and full lint
'on':
  workflow_call: {}
env:
  NIX_DEVSHELL: js
jobs:
  check:
    name: Check (JavaScript types and full lint)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: web
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
    - name: Prepare SDK declarations
      run: just js sdk-products
    - name: Typecheck JavaScript workspace
      run: dev/nix-shell 'pnpm -r run typecheck'
    - name: Full Oxlint rules
      run: dev/nix-shell 'pnpm -r run lint'
