name: Check JavaScript types and full lint
'on':
  workflow_call:
env:
  NIX_DEVSHELL: js
  # Stage release-profile Nix products before workspace types and full lint.
  # React Native needs only its JS/types output, without mobile components.
  XMTP_SDK_BUILD: nix
jobs:
  check:
    name: Check (JavaScript types and full lint)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        github-token: ${{ github.token }}
    - uses: ./.github/actions/setup-js
      with:
        cache-mode: ci
    - name: Prepare Node, Browser, and React Native declarations
      run: dev/nix-shell 'just js sdk-products all'
    - name: Typecheck JavaScript workspace
      run: dev/nix-shell 'pnpm -r run typecheck'
    # A recursive `lint` runs each package's `build` first (the task graph in
    # pnpm-workspace.yaml). The docs build is the site, which docs_site builds,
    # so the docs package is linted on its own, without a build.
    - name: Full Oxlint rules
      run: dev/nix-shell "pnpm -r --filter '!@xmtp/docs' run lint"
    - name: Lint the docs package
      run: dev/nix-shell 'just docs lint'
