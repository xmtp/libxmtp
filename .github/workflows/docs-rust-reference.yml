name: Rust reference and error glossary
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml and deploy-docs.yml pass it.
        type: string
        default: blacksmith-8vcpu-ubuntu-2404
      cache-mode:
        description: >-
          setup-nix cache mode. Empty: trusted on a protected push to trunk,
          ci otherwise. deploy-docs.yml passes its own mode.
        type: string
        default: ""
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: "Optional compiler cache reader access key ID"
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: "Optional compiler cache reader secret access key"
        required: false
permissions:
  contents: read
jobs:
  rust:
    name: Rust reference and error glossary
    runs-on: ${{ inputs.runner }}
    environment:
      name: ${{ (inputs.cache-mode || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && github.ref == 'refs/heads/main' && 'trusted' || 'ci')) == 'trusted' && 'kache-s3-writer' || '' }}
    timeout-minutes: 45
    env:
      NIX_DEVSHELL: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: ${{ inputs.cache-mode || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && github.ref == 'refs/heads/main' && 'trusted' || 'ci') }}
          github-token: ${{ github.token }}
          kache: "true"
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: rust-reference
          kache-readonly: "false"
      - name: Generate error glossary
        run: dev/nix-shell 'dev/gen-error-glossary'
      - name: Reject stale glossary
        run: git diff --exit-code -- docs/error_glossary.md
      - name: Build Rust reference
        run: dev/nix-shell 'cargo doc --locked --no-deps'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-rust
          path: target/doc
          if-no-files-found: error
