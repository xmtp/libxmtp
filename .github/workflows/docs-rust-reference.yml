name: Rust reference and error glossary
on:
  workflow_call:
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: "Optional compiler cache reader access key ID"
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: "Optional compiler cache reader secret access key"
        required: false
permissions:
  contents: read
jobs:
  rust:
    name: Rust reference and error glossary
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 45
    env:
      NIX_DEVSHELL: rust
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: rust-reference
          kache-readonly: "false"
      - name: Generate error glossary
        run: dev/nix-shell 'dev/gen-error-glossary'
      - name: Reject stale glossary
        run: git diff --exit-code -- docs/error_glossary.md
      - name: Build Rust reference
        run: dev/nix-shell 'cargo doc --locked --no-deps'
      - uses: actions/upload-artifact@v7
        with:
          name: docs-rust
          path: target/doc
          if-no-files-found: error
