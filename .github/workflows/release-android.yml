name: Release Android SDK

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
        description: "dev, rc, or final"
      rc-number:
        required: false
        type: string
        description: "RC number (required for rc releases)"
      ref:
        required: true
        type: string
        description: "Git ref to build from"
      timestamp:
        required: false
        type: string
        description: "Shared UTC YYYYMMDDHHMMSS stamp minted once per Release run"
      pending-version:
        required: false
        type: string
      pending-kind:
        required: false
        type: string
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

jobs:
  check-push-permissions:
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  publish:
    needs: [check-push-permissions]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-release-tools
      - uses: ./.github/actions/setup-nix
        with:
          nix-disk: "false"
          gradle-disk: "true"
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: release-android
          kache-readonly: "true"

      - name: Compute version
        id: version
        env:
          REF: ${{ inputs.ref }}
          TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          if [ "${{ inputs.release-type }}" = "rc" ]; then
            VERSION=$(xmtp-release compute-version --sdk android --release-type rc --rc-number ${{ inputs.rc-number }})
          elif [ "${{ inputs.release-type }}" = "dev" ]; then
            VERSION=$(xmtp-release compute-version --sdk android --release-type dev --source-ref "$REF" --timestamp "$TIMESTAMP")
          elif [ "${{ inputs.release-type }}" = "nightly" ]; then
            # Belt-and-suspenders: release.yml already skips this whole job when
            # the gate isn't green or there are no conventional commits
            # (nothing-pending), so pending-* are populated whenever we reach
            # here. This guard only fires if that orchestration is bypassed.
            if [ -z "${{ inputs.pending-version }}" ] || [ -z "${{ inputs.pending-kind }}" ]; then
              echo "::error::nightly resolve called with empty pending version/kind"
              exit 1
            fi
            VERSION=$(xmtp-release resolve-sdk-version \
              --sdk android --release-type nightly \
              --timestamp "$TIMESTAMP" \
              --pending-version "${{ inputs.pending-version }}" \
              --pending-kind "${{ inputs.pending-kind }}")
          else
            VERSION=$(xmtp-release compute-version --sdk android --release-type final)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Set version in gradle.properties
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: xmtp-release set-manifest-version --sdk android --version "$VERSION"

      - name: Build Android bindings
        run: NIX_DEVSHELL=android dev/nix-shell './sdks/android/dev/bindings --release'

      - name: Build JVM test library
        run: env -u LD_LIBRARY_PATH nix build .#xmtp-sdk-libs --out-link sdks/android/.build/test-host

      - uses: taiki-e/install-action@844d13d3ed6991e61a4ebc2c067073e3ed4f5ee1 # just
      - name: Start backend
        env:
          NIX_DEVSHELL: android
        run: dev/nix-shell 'just backend up'

      - name: Build and test
        env:
          JAVA_TOOL_OPTIONS: "-Djna.library.path=${{ github.workspace }}/sdks/android/.build/test-host/lib"
        run: NIX_DEVSHELL=android dev/nix-shell 'dev/worktree-env && . dev/docker/load-env && cd sdks/android && ./gradlew :library:build'

      - name: Publish
        env:
          JAVA_TOOL_OPTIONS: "-Djna.library.path=${{ github.workspace }}/sdks/android/.build/test-host/lib"
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          SIGN_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          SIGN_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          MAVEN_PROFILE_ID: ${{ secrets.MAVEN_PROFILE_ID }}
        run: NIX_DEVSHELL=android dev/nix-shell 'cd sdks/android && ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository'

      - name: Prepare release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xmtp-release tag-release --sdk android --version "$VERSION" --no-push
          git bundle create "$RUNNER_TEMP/release.bundle" "refs/tags/android-$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tag-android
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 1

  push-tag:
    needs: [publish, check-push-permissions]
    uses: ./.github/workflows/push-release-tag.yml
    with:
      sdk: android
      version: ${{ needs.publish.outputs.version }}
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
    secrets: inherit
