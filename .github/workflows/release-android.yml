name: "Release: Android SDK"

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
        description: "dev, rc, or final"
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read

jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha }}
    secrets: inherit

  publish:
    name: Build Android release artifacts
    needs: [check-push-permissions]
    environment: release
    permissions:
      contents: read
    # Paid Linux: the android-ci shell closure is about 3 GiB plus an Android
    # SDK closure of 6 to 11 GiB, before the APK build and Gradle downloads,
    # which is more than the 14 GB disk of a free hosted runner.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      # The slim Android shell: the release builds no Rust.
      NIX_DEVSHELL: android-ci
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
          fetch-depth: 0
          # Full history for the release tag, without blobs; git-cliff, which
          # fails on a blobless clone, does not run here.
          filter: blob:none
      - name: Set up release tools
        uses: ./.github/actions/setup-release-tools
      # No ~/.gradle disk: CI jobs commit it, and a release reads no store that
      # CI jobs write. Gradle downloads its distribution and dependencies.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ github.token }}

      - name: Set version in gradle.properties
        env:
          VERSION: ${{ inputs.version }}
        run: xmtp-release set-manifest-version --sdk android --version "$VERSION"

      - name: Build Android bindings
        run: dev/nix-shell './sdks/android/dev/bindings --release'

      # Publish only: CI tests the release commit (the Android suites), and a
      # live-backend test here once failed a release.
      - name: Build example APK
        env:
          XMTP_EXAMPLE_VERSION: ${{ inputs.version }}
        run: dev/nix-shell 'just example-android apk'

      - name: Retain example APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-example-apk
          path: apps/example-android/build/apk/xmtp-messenger-${{ inputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare signed Maven bundle
        env:
          SIGN_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          SIGN_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEY SIGN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android publishing credential: $name"
              exit 1
            fi
          done
          dev/nix-shell 'cd sdks/android && ./gradlew :library:publishReleasePublicationToReleaseBundleRepository'

      - name: Retain signed Maven bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-maven-bundle
          path: sdks/android/library/build/release-repository/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          xmtp-release tag-release --sdk android --version "$VERSION" --no-push
          git bundle create "$RUNNER_TEMP/release.bundle" "refs/tags/android-$VERSION"
      - name: Store release tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tag-android
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 30

  publish-github:
    name: Publish to GitHub Packages
    needs: [publish, check-push-permissions]
    permissions:
      contents: read
      packages: write
    environment: release
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      NIX_DEVSHELL: android-ci
      VERSION: ${{ inputs.version }}
      XMTP_ANDROID_RELEASE_BUNDLE: ${{ github.workspace }}/android-maven-bundle
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ github.token }}
      - name: Download signed Maven bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-maven-bundle
          path: android-maven-bundle

      - name: Publish signed bundle to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: dev/nix-shell 'cd sdks/android && ./gradlew -Pversion="$VERSION" :publisher:publishReleasePublicationToGitHubPackagesRepository'

  publish-central:
    name: Publish to Maven Central
    needs: [publish, publish-github, check-push-permissions]
    permissions:
      contents: read
    environment: release
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      NIX_DEVSHELL: android-ci
      VERSION: ${{ inputs.version }}
      XMTP_ANDROID_RELEASE_BUNDLE: ${{ github.workspace }}/android-maven-bundle
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ github.token }}
      - name: Download signed Maven bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-maven-bundle
          path: android-maven-bundle

      - name: Publish signed bundle to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: dev/nix-shell 'cd sdks/android && ./gradlew -Pversion="$VERSION" :publisher:publishReleasePublicationToSonatypeRepository closeAndReleaseSonatypeStagingRepository'

  push-tag:
    name: Tag
    needs: [publish, publish-central, check-push-permissions]
    uses: ./.github/workflows/push-release-tag.yml
    with:
      sdk: android
      version: ${{ needs.publish.outputs.version }}
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
    secrets: inherit

  publish-apk:
    name: Attach Messenger APK
    needs: [publish, push-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download example APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-example-apk
          path: apk
      - name: Attach example APK to Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          TAG="android-$VERSION"
          APK="apk/xmtp-messenger-$VERSION.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            FLAGS=()
            if [ "$RELEASE_TYPE" != final ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "$APK" --verify-tag \
              --title "Android SDK $VERSION" \
              --notes "Android SDK $VERSION. The XMTP Messenger APK is a universal release build for testing on Android 8.1 or newer, signed with the public AOSP testing key. It installs separately as XMTP Messenger (Testing). Select a reachable HTTPS server in the app. Its profiles and local data are separate from normal example-app installs. Firebase notifications are off in this build." \
              "${FLAGS[@]}"
          fi
