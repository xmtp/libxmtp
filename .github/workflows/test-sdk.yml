name: Test SDK façade
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_swift:
        type: boolean
        default: false
jobs:
  node-platforms:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-sdk-node-platforms.yml
    secrets: inherit

  sdk:
    name: Generate and test SDK façade
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NIX_DEVSHELL: rust
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://xmtp:xmtp@localhost:55432/xmtp_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          kache: "true"
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Install JavaScript tools
        run: dev/nix-shell 'just install-js'
      - name: Start backend
        run: dev/nix-shell 'just backend up'
      - name: Check native Nix inputs
        run: dev/nix-shell 'just sdk check-native-nix'
      - name: Check package scripts
        run: dev/nix-shell 'just sdk check-package-scripts'
      - name: Build SDK artifacts once
        run: dev/nix-shell 'just sdk build'
      - name: Render SDK bindings
        run: dev/nix-shell 'just sdk render'
      - name: Lint generated SDK bindings
        run: dev/nix-shell 'just sdk lint'
      - name: Check clean SDK generation
        run: dev/nix-shell 'just sdk check-clean-generate'
      - name: Initialize generated SDK WASM
        run: dev/nix-shell 'just sdk wasm-init'
      - name: Installed Node ESM package smoke
        run: dev/nix-shell 'just sdk package-smoke node'
      - name: Installed browser pure and worker package smoke
        env:
          NIX_DEVSHELL: js
        run: dev/nix-shell 'just sdk package-smoke browser'
      - name: Bridge runtime unit tests
        env:
          NIX_DEVSHELL: js
        run: dev/nix-shell 'just sdk test-bridge'
      - name: Test SDK crate
        run: dev/nix-shell 'just test crate xmtp_sdk'
      - name: Browser platform proofs
        env:
          NIX_DEVSHELL: js
        run: dev/nix-shell 'just sdk test-browser'
      - name: Dump Docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

  android-stage:
    name: Android SDK staging
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NIX_DEVSHELL: android
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: android
          gradle-disk: "true"
          kache: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - name: Build Kotlin SDK artifacts
        run: dev/nix-shell 'just sdk build kotlin --profile release'
      - name: Render Kotlin SDK bindings
        run: dev/nix-shell 'just sdk render kotlin --profile release'
      - name: Build all Android ABI libraries
        run: dev/nix-shell 'just sdk mobile-build android'
      - name: Clear prior Android package output
        run: rm -rf target/sdk-packages/android
      - name: Stage Android AAR with strict dependency verification
        run: dev/nix-shell 'just sdk mobile-stage android'
      - name: Retain Android AAR and contract
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-stage
          if-no-files-found: error
          path: |
            target/sdk-packages/android/xmtp-sdk.aar
            target/sdk-packages/android/sdk-contract.json
      - name: Check Kotlin consumers
        run: dev/nix-shell 'just android check-consumers'

  swift:
    name: Swift lifecycle checks and consumers
    if: inputs.run_swift && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: ios
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: taiki-e/install-action@just
      - name: Check native Apple toolchain
        run: dev/nix-shell 'bash dev/check-apple-toolchain'
      # test-ios.yml skips these tests in its macOS run (`test skip-lifecycle`).
      - name: Swift lifecycle checks
        run: dev/nix-shell 'just backend ci just ios test-lifecycle'
      - name: Check Swift consumers
        run: dev/nix-shell 'just ios check-consumer'
      - name: Retain native service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7

  windows-load:
    name: Windows SDK load (win32-x64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
          workspaces: .
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Disable usePackageExitCodes feature
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: feature disable --name="'usePackageExitCodes'"
      - name: Upgrade Visual Studio 2022 enterprise
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: upgrade visualstudio2022enterprise
      - name: Install Visual Studio 2022 build tools
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install visualstudio2022buildtools
      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install protoc
      - name: Verify protoc for Rust builds
        shell: pwsh
        run: |
          $protoc = Join-Path $env:ChocolateyInstall 'lib\protoc\tools\bin\protoc.exe'
          if (-not (Test-Path -LiteralPath $protoc -PathType Leaf)) {
            throw "Chocolatey protoc executable is missing: $protoc"
          }
          & $protoc --version
          if ($LASTEXITCODE -ne 0) {
            throw "protoc --version failed with exit code $LASTEXITCODE"
          }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build xmtp_sdk and generator
        run: cargo build --locked -p xmtp_sdk -p xmtp-sdk-bindgen
      - name: Generate TypeScript bindings
        shell: bash
        run: |
          # This job generates only Node. Remove all cached language roots
          # before recording the native-only product.
          rm -rf target/sdk-generated
          mkdir -p target/sdk-generated/typescript-napi
          # This job only loads the package and installs no JavaScript
          # toolchain, so it has no formatter. Formatting only changes layout.
          target/debug/xmtp-sdk-bindgen.exe generate --lib target/debug/xmtp_sdk.dll --language typescript-napi --out target/sdk-generated/typescript-napi --config apps/xmtp_sdk_bindgen/uniffi-global.toml --no-format
          cp target/debug/xmtp_sdk.dll target/sdk-generated/typescript-napi/
      - name: Build pinned @ubjs runtimes
        shell: bash
        run: |
          git clone https://github.com/neekolas/uniffi-bindgen-react-native.git ubrn
          fork_rev=$(node -p 'require("fs").readFileSync("Cargo.toml", "utf8").match(/\[workspace\.metadata\.xmtp-sdk-fork\][^\[]*rev\s*=\s*"([0-9a-f]{40})"/)[1]')
          git -C ubrn checkout "$fork_rev"
          npm ci --prefix ubrn/typescript --ignore-scripts
          npm run build --prefix ubrn/typescript
          npm ci --prefix ubrn/runtimes/napi --ignore-scripts
          npm run build --prefix ubrn/runtimes/napi
          mkdir -p target/sdk-generated/typescript-napi/node_modules/@ubjs
          cp -R ubrn/typescript target/sdk-generated/typescript-napi/node_modules/@ubjs/core
          cp -R ubrn/runtimes/napi target/sdk-generated/typescript-napi/node_modules/@ubjs/node
      - name: Use the package compiler Node version
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
      - name: Install locked package compiler
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @xmtp/workspace
      - name: Stage Windows ESM package
        shell: bash
        env:
          XMTP_SDK_RUNTIME_DIR: target/sdk-generated/typescript-napi/node_modules/@ubjs
          XMTP_SDK_TSDOWN_CLI: node_modules/tsdown/dist/run.mjs
        run: |
          python crates/xmtp_sdk/dev/record-generated.py target/sdk-generated --native target/debug/xmtp_sdk.dll --bindgen target/debug/xmtp-sdk-bindgen.exe --profile debug
          node crates/xmtp_sdk/dev/stage-package.mjs node --public
      - name: Use the minimum SDK Node version
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Installed Windows ESM package smoke
        shell: bash
        run: node crates/xmtp_sdk/dev/package-smoke.mjs node
