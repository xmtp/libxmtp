name: Test Node
on:
  workflow_call:
env:
  NIX_DEVSHELL: js
jobs:
  test:
    name: Test (Node)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: test-node
          docker-builder: "true"
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: just node install-ci
      - name: Start backend
        run: just backend up
      - name: Run Node tests
        run: just node test-ci
