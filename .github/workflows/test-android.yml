name: Test Android
'on':
  workflow_call:
permissions:
  contents: read
jobs:
  min-sdk-smoke:
    name: JNI, public client, and timestamp smoke (API 23)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: nix-only
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Run the minimum SDK smoke
      env:
        NIX_DEVSHELL: android
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/android-emulator-startup
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192 -verbose
          -show-kernel
      run: dev/nix-shell 'just android test-min-sdk'
    - name: Upload minimum SDK proof
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-api23-proof
        retention-days: 7
        if-no-files-found: ignore
        path: 'sdks/android/library/build/outputs/aar/library-release.aar

          sdks/android/library/build/outputs/androidTest-results/connected/**/*.xml

          sdks/android/library/build/outputs/androidTest-results/connected/**/logcat-*.txt

          ${{ runner.temp }}/android-emulator-startup/

          '
        include-hidden-files: 'true'
  unit-tests:
    name: Unit Tests (Android)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: nix-only
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Run unit tests
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just android test'
    - name: Compile app and shared UI
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just android assemble'
    - name: Check Kotlin consumers
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just android check-consumers'
    - name: Run Messenger unit tests
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just android example-test'
    - name: Check Messenger build variants
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just android example-check'
  integration-tests:
    name: Integration Tests (Android)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: nix-only
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Run integration tests
      timeout-minutes: 30
      env:
        NIX_DEVSHELL: android
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/android-emulator-startup
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192 -verbose
          -show-kernel
      run: dev/nix-shell 'just android test-integration'
    - name: Run Messenger integration tests
      timeout-minutes: 30
      env:
        NIX_DEVSHELL: android
        XMTP_METADATA_LOG_DIR: ${{ runner.temp }}/messenger-metadata-backend
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/messenger-emulator-startup
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192
      run: dev/nix-shell 'just android example-test-integration'
    - name: Upload failed Android test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: android-integration-failures
        retention-days: 7
        if-no-files-found: ignore
        path: |
          sdks/android/example/build/outputs/androidTest-results/connected/**/*.xml
          sdks/android/example/build/outputs/androidTest-results/connected/**/*.txt
          sdks/android/example/build/reports/androidTests/**
          sdks/android/example/build/screenshots/**
          sdks/android/library/build/outputs/androidTest-results/connected/**/*.xml
          sdks/android/library/build/outputs/androidTest-results/connected/**/logcat-*.txt
          ${{ runner.temp }}/messenger-metadata-backend/
          ${{ runner.temp }}/android-emulator-startup/
          ${{ runner.temp }}/messenger-emulator-startup/
        include-hidden-files: 'true'
  check-android:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 30
    env:
      NIX_DEVSHELL: android
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache: 'true'
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: nix-only
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Start backend
      run: dev/nix-shell 'just backend up'
    - name: Check Android SDK compile
      run: dev/nix-shell 'just android check'
    - name: Retain backend startup diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: android-check-backend-startup-logs
        path: ${{ runner.temp }}/backend-startup-logs
        if-no-files-found: ignore
        retention-days: 7
  android-stage:
    name: Android SDK staging
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      NIX_DEVSHELL: android
      SQLX_OFFLINE: "true"
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: "true"
        kache: "true"
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: sdk-android-release
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Build Kotlin SDK artifacts
      run: dev/nix-shell 'just sdk build kotlin --profile release'
    - name: Render Kotlin SDK bindings
      run: dev/nix-shell 'just sdk render kotlin --profile release'
    - name: Build all Android ABI libraries
      run: dev/nix-shell 'just sdk mobile-build android'
    - name: Clear prior Android package output
      run: rm -rf target/sdk-packages/android
    - name: Stage Android AAR with strict dependency verification
      run: dev/nix-shell 'just sdk mobile-stage android'
    - name: Retain Android AAR and contract
      uses: actions/upload-artifact@v4
      with:
        name: android-sdk-stage
        if-no-files-found: error
        path: |
          target/sdk-packages/android/xmtp-sdk.aar
          target/sdk-packages/android/sdk-contract.json
  messenger-performance:
    name: Messenger local query and heap budgets (API 34 x86_64)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run the fixed workload and cache failure control
      timeout-minutes: 210
      env:
        NIX_DEVSHELL: android
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/messenger-performance-emulator
      run: dev/nix-shell 'just android example-performance'
    - name: Upload performance proof
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: messenger-api34-performance
        retention-days: 7
        if-no-files-found: ignore
        include-hidden-files: 'true'
        path: |
          sdks/android/example/build/performance/
          sdks/android/example/build/outputs/androidTest-results/connected/
          ${{ runner.temp }}/messenger-performance-emulator/
  results:
    name: Require Android checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 1
    if: always()
    needs:
    - unit-tests
    - min-sdk-smoke
    - integration-tests
    - check-android
    - android-stage
    - messenger-performance
    steps:
    - env:
        PASSED: ${{ needs.unit-tests.result == 'success' && needs.min-sdk-smoke.result == 'success' && needs.integration-tests.result == 'success' && needs.check-android.result == 'success' && needs.android-stage.result == 'success' && needs.messenger-performance.result == 'success' }}
      run: test "$PASSED" = true
