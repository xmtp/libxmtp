name: Test Android
'on':
  workflow_call:
    inputs:
      run-unit:
        type: boolean
        default: true
      run-consumers:
        type: boolean
        default: true
      run-platform:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  min-sdk-smoke:
    if: inputs.run-platform
    name: JNI, public client, and timestamp smoke (API 23)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || 'kache-s3-reader' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: android-min-sdk
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Run the minimum SDK smoke
      env:
        NIX_DEVSHELL: android
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/android-emulator-startup
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192 -verbose
          -show-kernel
      run: dev/nix-shell 'just android test-min-sdk'
    - name: Upload minimum SDK proof
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-api23-proof
        retention-days: 7
        if-no-files-found: ignore
        path: 'sdks/android/library/build/outputs/aar/library-release.aar

          sdks/android/library/build/outputs/androidTest-results/connected/**/*.xml

          sdks/android/library/build/outputs/androidTest-results/connected/**/logcat-*.txt

          ${{ runner.temp }}/android-emulator-startup/

          '
        include-hidden-files: 'true'
  unit-tests:
    if: inputs.run-unit || inputs.run-consumers
    name: Unit Tests (Android)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || 'kache-s3-reader' }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: android-unit
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Run unit tests
      if: inputs.run-unit
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just android test'
    - name: Check Kotlin consumers
      if: inputs.run-consumers
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just android check-consumers'
  integration-tests:
    if: inputs.run-platform
    name: Integration Tests (Android)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || 'kache-s3-reader' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: android-integration
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Run integration tests
      timeout-minutes: 30
      env:
        NIX_DEVSHELL: android
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/android-emulator-startup
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192 -verbose
          -show-kernel
      run: dev/nix-shell 'just android test-integration'
    - name: Upload failed Android test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: android-integration-failures
        retention-days: 7
        if-no-files-found: ignore
        path: 'sdks/android/library/build/outputs/androidTest-results/connected/**/*.xml

          sdks/android/library/build/outputs/androidTest-results/connected/**/logcat-*.txt

          ${{ runner.temp }}/android-emulator-startup/

          '
        include-hidden-files: 'true'
  results:
    name: Require selected Android checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 1
    if: always()
    needs:
    - unit-tests
    - min-sdk-smoke
    - integration-tests
    steps:
    - env:
        PASSED: ${{ (!(inputs.run-unit || inputs.run-consumers) || needs.unit-tests.result == 'success') && (!inputs.run-platform ||
          (needs.min-sdk-smoke.result == 'success' && needs.integration-tests.result == 'success')) }}
      run: test "$PASSED" = true
