name: Test Android

on:
  workflow_call:
    inputs:
      run-unit:
        type: boolean
        default: true
      run-consumers:
        type: boolean
        default: true
      run-platform:
        type: boolean
        default: true
permissions:
  contents: read

jobs:
  min-sdk-smoke:
    if: inputs.run-platform
    name: JNI, public client, and timestamp smoke (API 23)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: android
          gradle-disk: "true"
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - name: Start backend
        env:
          NIX_DEVSHELL: android
        run: dev/nix-shell 'just backend up'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the minimum SDK smoke
        env:
          NIX_DEVSHELL: android
          NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/android-emulator-startup
          NIX_ANDROID_EMULATOR_FLAGS: "-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192 -verbose -show-kernel"
        run: dev/nix-shell 'just android test-min-sdk'
      - name: Upload minimum SDK proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-api23-proof
          retention-days: 7
          if-no-files-found: ignore
          path: |
            sdks/android/library/build/outputs/aar/library-release.aar
            sdks/android/library/build/outputs/androidTest-results/connected/**/*.xml
            sdks/android/library/build/outputs/androidTest-results/connected/**/logcat-*.txt
            ${{ runner.temp }}/android-emulator-startup/
          include-hidden-files: true

  unit-tests:
    if: inputs.run-unit || inputs.run-consumers
    name: Unit Tests (Android)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: android
          gradle-disk: "true"
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - name: Start backend
        env:
          NIX_DEVSHELL: android
        run: dev/nix-shell 'just backend up'
      - name: Run unit tests
        if: inputs.run-unit
        env:
          NIX_DEVSHELL: android
        run: dev/nix-shell 'just android test'
      - name: Check Kotlin consumers
        if: inputs.run-consumers
        env:
          NIX_DEVSHELL: android
        run: dev/nix-shell 'just android check-consumers'

  integration-tests:
    if: inputs.run-platform
    name: Integration Tests (Android)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Job budget leaves headroom for setup/backend before the suite step (#4044).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: android
          gradle-disk: "true"
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - name: Start backend
        env:
          NIX_DEVSHELL: android
        run: dev/nix-shell 'just backend up'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Suite runs ~18–20m with 0 failures; 20m step budget killed healthy runs (#4044).
      - name: Run integration tests
        timeout-minutes: 30
        env:
          NIX_DEVSHELL: android
          NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/android-emulator-startup
          NIX_ANDROID_EMULATOR_FLAGS: "-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192 -verbose -show-kernel"
        run: dev/nix-shell 'just android test-integration'
      - name: Upload failed Android test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-integration-failures
          retention-days: 7
          if-no-files-found: ignore
          path: |
            sdks/android/library/build/outputs/androidTest-results/connected/**/*.xml
            sdks/android/library/build/outputs/androidTest-results/connected/**/logcat-*.txt
            ${{ runner.temp }}/android-emulator-startup/
          include-hidden-files: true

  results:
    name: Require selected Android checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 1
    if: always()
    needs: [unit-tests, min-sdk-smoke, integration-tests]
    steps:
      - uses: actions/checkout@v6
      - name: Require each selected Android result
        env:
          RUN_UNIT: ${{ inputs.run-unit }}
          RUN_CONSUMERS: ${{ inputs.run-consumers }}
          RUN_PLATFORM: ${{ inputs.run-platform }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          selection="$(printf '{"schema_version":1,"checks":{"unit":%s,"consumers":%s,"minimum":%s,"integration":%s}}' "$RUN_UNIT" "$RUN_CONSUMERS" "$RUN_PLATFORM" "$RUN_PLATFORM")"
          python3 -B dev/ci/check-gate.py --selection "$selection" --needs "$CI_NEEDS" --detector '' \
            --mapping '{"unit":"unit-tests","consumers":"unit-tests","minimum":"min-sdk-smoke","integration":"integration-tests"}'
