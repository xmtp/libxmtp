name: Test Agent SDK
on:
  workflow_call:
env:
  NIX_DEVSHELL: js-node
  # JS jobs test the release-profile Nix products (products_sdk_js), not a
  # cargo debug build.
  XMTP_SDK_BUILD: nix
jobs:
  test:
    name: Test (agent-sdk)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: ci
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just (v2.87.28)
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: ci
      - name: Start backend
        run: just backend up
      - name: Run agent-sdk tests
        run: just js test-agent-sdk-ci
