name: Release
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Release type
        required: true
        type: choice
        options: [dev, rc, final]
      ref:
        description: Branch to release from (defaults to the branch the workflow is run from)
        required: false
        type: string
      rc-number:
        description: RC number (required for RC releases)
        required: false
        type: number
      cli:
        description: Release CLI (also releases Node)
        required: false
        type: boolean
        default: false
      backend:
        description: Release the backend container and GitHub tag
        required: false
        type: boolean
        default: false
      no-merge:
        description: Skip merging the release PR (only applies to final releases)
        required: false
        type: boolean
        default: false
      pr-base:
        description: Release PR target branch (only applies to final releases)
        required: false
        type: string
        default: main
      dry-run:
        description: Validate all six SDKs and any selected CLI; skip publishing, tags, merges, and notifications
        required: false
        type: boolean
        default: false
      ios:
        description: Release iOS SDK
        type: boolean
        required: false
        default: false
      android:
        description: Release Android SDK
        type: boolean
        required: false
        default: false
      node-sdk:
        description: Release Node SDK
        type: boolean
        required: false
        default: false
      browser-sdk:
        description: Release Browser SDK
        type: boolean
        required: false
        default: false
      agent-sdk:
        description: Release Agent SDK (also releases Node)
        type: boolean
        required: false
        default: false
      react-native-sdk:
        description: Release React Native SDK
        type: boolean
        required: false
        default: false
jobs:
  validate:
    name: Freeze source and shared SDK version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-type: ${{ steps.resolve.outputs.release-type }}
      ref: ${{ steps.resolve.outputs.ref }}
      source-sha: ${{ steps.source.outputs.sha }}
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      products-selected: ${{ steps.resolve.outputs.products-selected }}
      ios: ${{ steps.resolve.outputs.ios }}
      android: ${{ steps.resolve.outputs.android }}
      node-sdk: ${{ steps.resolve.outputs.node-sdk }}
      browser-sdk: ${{ steps.resolve.outputs.browser-sdk }}
      agent-sdk: ${{ steps.resolve.outputs.agent-sdk }}
      react-native-sdk: ${{ steps.resolve.outputs.react-native-sdk }}
      cli: ${{ steps.resolve.outputs.cli }}
      backend: ${{ steps.resolve.outputs.backend }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
      version-ios: ${{ steps.versions.outputs.version-ios }}
      version-android: ${{ steps.versions.outputs.version-android }}
      version-node-sdk: ${{ steps.versions.outputs.version-node-sdk }}
      version-browser-sdk: ${{ steps.versions.outputs.version-browser-sdk }}
      version-agent-sdk: ${{ steps.versions.outputs.version-agent-sdk }}
      version-react-native-sdk: ${{ steps.versions.outputs.version-react-native-sdk }}
      version-cli: ${{ steps.versions.outputs.version-cli }}
    steps:
      - name: Resolve release parameters
        id: resolve
        env:
          INPUT_RELEASE_TYPE: ${{ inputs.release-type }}
          INPUT_REF: ${{ inputs.ref }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_IOS: ${{ inputs.ios }}
          INPUT_ANDROID: ${{ inputs.android }}
          INPUT_NODE_SDK: ${{ inputs.node-sdk }}
          INPUT_BROWSER_SDK: ${{ inputs.browser-sdk }}
          INPUT_AGENT_SDK: ${{ inputs.agent-sdk }}
          INPUT_REACT_NATIVE_SDK: ${{ inputs.react-native-sdk }}
          INPUT_CLI: ${{ inputs.cli }}
          INPUT_BACKEND: ${{ inputs.backend }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          # Agent and CLI require this run's exact published Node version.
          if [ "$INPUT_AGENT_SDK" = true ] || [ "$INPUT_CLI" = true ]; then INPUT_NODE_SDK=true; fi
          SELECTED=false
          if [[ "$INPUT_IOS $INPUT_ANDROID $INPUT_NODE_SDK $INPUT_BROWSER_SDK $INPUT_AGENT_SDK $INPUT_REACT_NATIVE_SDK $INPUT_CLI" = *true* ]]; then SELECTED=true; fi
          {
            echo "products-selected=$SELECTED"
            echo "release-type=$INPUT_RELEASE_TYPE"
            echo "ref=${INPUT_REF:-$GITHUB_REF}"
            echo "ios=$INPUT_IOS"
            echo "android=$INPUT_ANDROID"
            echo "node-sdk=$INPUT_NODE_SDK"
            echo "browser-sdk=$INPUT_BROWSER_SDK"
            echo "agent-sdk=$INPUT_AGENT_SDK"
            echo "react-native-sdk=$INPUT_REACT_NATIVE_SDK"
            echo "cli=$INPUT_CLI"
            echo "backend=$INPUT_BACKEND"
            echo "dry-run=${INPUT_DRY_RUN:-false}"
          } >> "$GITHUB_OUTPUT"
      - name: Mint release timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Validate dev release
        if: steps.resolve.outputs.release-type == 'dev'
        env:
          RC_NUMBER: ${{ inputs.rc-number }}
        run: |
          if [ -n "$RC_NUMBER" ]; then
            echo "::error::Dev releases should not have an RC number set"
            exit 1
          fi
      - name: Validate release branch
        if: steps.resolve.outputs.release-type == 'rc' || steps.resolve.outputs.release-type == 'final'
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          BACKEND: ${{ steps.resolve.outputs.backend }}
        run: |
          BRANCH="${REF#refs/heads/}"
          if [[ ! "$BRANCH" =~ ^release/ ]]; then
            echo "::error::RC and final releases must be run from a release/* branch, got: $BRANCH"
            exit 1
          fi
          if [ "$BACKEND" = "true" ] && ! [[ "$BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Backend RC and final releases require release/X.Y.Z, got: $BRANCH"
            exit 1
          fi
      - name: Validate RC number
        if: steps.resolve.outputs.release-type == 'rc'
        env:
          RC_NUMBER: ${{ inputs.rc-number }}
        run: |
          if ! [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::RC releases require a positive integer rc-number"
            exit 1
          fi
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          persist-credentials: false
      - name: Resolve release source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ github.token }}
      - name: Compute SDK version once
        id: versions
        env:
          RELEASE_TYPE: ${{ steps.resolve.outputs.release-type }}
          RC_NUMBER: ${{ inputs.rc-number }}
          TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        run: |
          set -euo pipefail
          args=(--kind "$RELEASE_TYPE" --timestamp "$TIMESTAMP" --output "$RUNNER_TEMP/release-plan.json")
          if [ "$RELEASE_TYPE" = rc ]; then args+=(--rc-number "$RC_NUMBER"); fi
          version=$(dev/nix-shell --shell js-node --command python3.11 dev/sdk_version.py plan "${args[@]}")
          for sdk in ios android node-sdk browser-sdk agent-sdk react-native-sdk cli; do
            echo "version-$sdk=$version" >> "$GITHUB_OUTPUT"
          done
      - name: Retain frozen SDK release plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-release-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 7
          if-no-files-found: error
  build-ios:
    name: Build and validate ios
    needs: [validate]
    if: needs.validate.outputs.products-selected == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-ios }}
      dry-run: true
      build-only: true
      release-type: ${{ needs.validate.outputs.release-type }}
    secrets: inherit
    permissions:
      contents: write
  build-android:
    name: Build and validate android
    needs: [validate]
    if: needs.validate.outputs.products-selected == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-android }}
      dry-run: true
      build-only: true
      release-type: ${{ needs.validate.outputs.release-type }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
  build-node-sdk:
    name: Build and validate node-sdk
    needs: [validate]
    if: needs.validate.outputs.products-selected == 'true'
    uses: ./.github/workflows/release-node-sdk.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-node-sdk }}
      dry-run: true
      build-only: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  build-browser-sdk:
    name: Build and validate browser-sdk
    needs: [validate]
    if: needs.validate.outputs.products-selected == 'true'
    uses: ./.github/workflows/release-browser-sdk.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-browser-sdk }}
      dry-run: true
      build-only: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  build-agent-sdk:
    name: Build and validate agent-sdk
    needs: [validate, build-node-sdk]
    if: needs.validate.outputs.products-selected == 'true'
    uses: ./.github/workflows/release-agent-sdk.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-agent-sdk }}
      dry-run: true
      build-only: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  build-cli:
    name: Build and validate cli
    needs: [validate, build-node-sdk]
    if: needs.validate.outputs.cli == 'true'
    uses: ./.github/workflows/release-cli.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-cli }}
      dry-run: true
      build-only: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  build-react-native-sdk:
    name: Build and validate react-native-sdk
    needs: [validate]
    if: needs.validate.outputs.products-selected == 'true'
    uses: ./.github/workflows/release-react-native-sdk.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-react-native-sdk }}
      dry-run: true
      build-only: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  sdk-ready:
    name: All six SDKs and selected CLI validated
    needs: [validate, build-ios, build-android, build-node-sdk, build-browser-sdk, build-agent-sdk, build-react-native-sdk, build-cli]
    if: "!cancelled() && needs.validate.result == 'success' && needs.validate.outputs.products-selected == 'true'"
    runs-on: ubuntu-latest
    steps:
      - name: Require all six SDKs and any selected CLI to succeed
        env:
          SDK_SELECTION: ${{ toJSON(needs.validate.outputs) }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          SDK_JOB_PREFIX: build
        run: |
          python3 - <<'PYTHON'
          import json, os
          selected = json.loads(os.environ["SDK_SELECTION"])
          results = json.loads(os.environ["JOB_RESULTS"])
          prefix = os.environ["SDK_JOB_PREFIX"]
          for sdk in ("ios", "android", "node-sdk", "browser-sdk", "agent-sdk", "react-native-sdk", "cli"):
              if (sdk != "cli" or selected[sdk] == "true") and results[f"{prefix}-{sdk}"]["result"] != "success":
                  raise SystemExit(f"Required product {sdk} did not succeed")
          PYTHON
  release-ios:
    name: Publish ios
    needs: [validate, sdk-ready]
    if: "!cancelled() && needs.sdk-ready.result == 'success' && needs.validate.outputs.ios == 'true' && needs.validate.outputs.dry-run != 'true'"
    secrets: inherit
    uses: ./.github/workflows/release-ios.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-ios }}
      release-type: ${{ needs.validate.outputs.release-type }}
      publish-only: true
    permissions:
      contents: write
  release-android:
    name: Publish android
    needs: [validate, sdk-ready]
    if: "!cancelled() && needs.sdk-ready.result == 'success' && needs.validate.outputs.android == 'true' && needs.validate.outputs.dry-run != 'true'"
    secrets: inherit
    uses: ./.github/workflows/release-android.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-android }}
      release-type: ${{ needs.validate.outputs.release-type }}
      publish-only: true
    permissions:
      contents: write
      packages: write
  release-node-sdk:
    name: Publish node-sdk
    needs: [validate, sdk-ready]
    if: "!cancelled() && needs.sdk-ready.result == 'success' && needs.validate.outputs.node-sdk == 'true' && needs.validate.outputs.dry-run != 'true'"
    secrets: inherit
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-node-sdk }}
      sdk: node-sdk
      prepared: true
      package-dir: .
      ignore-scripts: true
    permissions:
      contents: read
      id-token: write
  release-browser-sdk:
    name: Publish browser-sdk
    needs: [validate, sdk-ready]
    if: "!cancelled() && needs.sdk-ready.result == 'success' && needs.validate.outputs.browser-sdk == 'true' && needs.validate.outputs.dry-run != 'true'"
    secrets: inherit
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-browser-sdk }}
      sdk: browser-sdk
      prepared: true
      package-dir: .
      ignore-scripts: true
    permissions:
      contents: read
      id-token: write
  release-agent-sdk:
    name: Publish agent-sdk
    needs: [validate, sdk-ready, release-node-sdk]
    if: "!cancelled() && needs.sdk-ready.result == 'success' && needs.validate.outputs.agent-sdk == 'true' && needs.release-node-sdk.result == 'success' && needs.validate.outputs.dry-run != 'true'"
    secrets: inherit
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-agent-sdk }}
      sdk: agent-sdk
      prepared: true
      package-dir: .
      ignore-scripts: true
    permissions:
      contents: read
      id-token: write
  release-cli:
    name: Publish cli
    needs: [validate, sdk-ready, release-node-sdk]
    if: "!cancelled() && needs.sdk-ready.result == 'success' && needs.validate.outputs.cli == 'true' && needs.release-node-sdk.result == 'success' && needs.validate.outputs.dry-run != 'true'"
    secrets: inherit
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-cli }}
      sdk: cli
      prepared: true
      package-dir: .
      ignore-scripts: true
    permissions:
      contents: read
      id-token: write
  release-react-native-sdk:
    name: Publish react-native-sdk
    needs: [validate, sdk-ready]
    if: "!cancelled() && needs.sdk-ready.result == 'success' && needs.validate.outputs.react-native-sdk == 'true' && needs.validate.outputs.dry-run != 'true'"
    secrets: inherit
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-react-native-sdk }}
      sdk: react-native-sdk
      prepared: true
      package-dir: .
      ignore-scripts: true
    permissions:
      contents: read
      id-token: write
  sdk-complete:
    name: Selected SDK and CLI publications completed
    needs: [validate, release-ios, release-android, release-node-sdk, release-browser-sdk, release-agent-sdk, release-react-native-sdk, release-cli]
    if: "!cancelled() && needs.validate.result == 'success' && needs.validate.outputs.products-selected == 'true' && needs.validate.outputs.dry-run != 'true'"
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected SDK to succeed
        env:
          SDK_SELECTION: ${{ toJSON(needs.validate.outputs) }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          SDK_JOB_PREFIX: release
        run: |
          python3 - <<'PYTHON'
          import json, os
          selected = json.loads(os.environ["SDK_SELECTION"])
          results = json.loads(os.environ["JOB_RESULTS"])
          prefix = os.environ["SDK_JOB_PREFIX"]
          for sdk in ("ios", "android", "node-sdk", "browser-sdk", "agent-sdk", "react-native-sdk", "cli"):
              if selected[sdk] == "true" and results[f"{prefix}-{sdk}"]["result"] != "success":
                  raise SystemExit(f"Selected SDK {sdk} did not succeed")
          PYTHON
  release-backend:
    name: Backend
    needs: [validate]
    if: needs.validate.outputs.backend == 'true'
    uses: ./.github/workflows/release-backend.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      release-type: ${{ needs.validate.outputs.release-type }}
      rc-number: ${{ format('{0}', inputs.rc-number) }}
      ref: ${{ needs.validate.outputs.ref }}
      source-sha: ${{ needs.validate.outputs.source-sha }}
      timestamp: ${{ needs.validate.outputs.timestamp }}
      dry-run: ${{ needs.validate.outputs.dry-run == 'true' }}
    secrets: inherit
  release-xdbg:
    name: Publish xdbg image
    needs: [validate, release-backend]
    if: needs.release-backend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release-backend.outputs.version }}
      pushed: ${{ steps.release-source.outcome == 'success' }}
    env:
      IMAGE: ghcr.io/xmtp/xdbg
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      - name: Check that the source is on a release branch
        id: release-source
        if: needs.validate.outputs.dry-run != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Commits only: the check needs history, not trees or blobs.
          git fetch --quiet --no-tags --filter=tree:0 origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          branches=$(git for-each-ref --contains HEAD --format='%(refname:lstrip=3)' \
            refs/remotes/origin/main 'refs/remotes/origin/release/')
          if [[ -z "$branches" ]]; then
            echo "::error title=Release source::$(git rev-parse HEAD) is not on main or a release/** branch"
            exit 1
          fi
          echo "Release source is on: $(tr '\n' ' ' <<< "$branches")"
      - name: Say that the image is not published
        if: steps.release-source.outcome != 'success'
        run: echo "::notice title=xdbg image::Built, not pushed. Only a non-dry release from main or a release/** branch pushes
          it."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GHCR
        if: steps.release-source.outcome == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ needs.release-backend.outputs.version }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./apps/xmtp_debug/docker/Dockerfile
          push: ${{ steps.release-source.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  merge-pr:
    name: Merge release PR
    if: needs.validate.outputs.release-type == 'final' && !inputs.no-merge && !cancelled() && !contains(needs.*.result, 'failure')
      && needs.validate.outputs.dry-run != 'true' && (needs.validate.outputs.products-selected != 'true' || needs.sdk-complete.result == 'success')
    needs: [validate, release-ios, release-android, release-node-sdk, release-browser-sdk, release-agent-sdk, release-react-native-sdk,
      release-cli, release-backend, sdk-complete]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.ref }}
          PR_BASE: ${{ inputs.pr-base }}
        run: |
          BRANCH="${RELEASE_BRANCH#refs/heads/}"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base "$PR_BASE" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for branch $BRANCH targeting $PR_BASE"
            exit 1
          fi
          # Use squash and keep the release branch for later maintenance.
          gh pr merge "$PR_NUMBER" --squash
  notify:
    name: Notify Slack
    needs: [validate, release-ios, release-android, release-node-sdk, release-browser-sdk, release-agent-sdk, release-react-native-sdk,
      release-cli, release-backend, release-xdbg, merge-pr, sdk-ready, sdk-complete]
    if: always() && inputs.dry-run != true && needs.validate.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Slack action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compose the release message
        id: compute
        env:
          IOS_RESULT: ${{ needs.release-ios.result }}
          IOS_VERSION: ${{ needs.release-ios.outputs.version }}
          ANDROID_RESULT: ${{ needs.release-android.result }}
          ANDROID_VERSION: ${{ needs.release-android.outputs.version }}
          NODE_RESULT: ${{ needs.release-node-sdk.result }}
          NODE_VERSION: ${{ needs.release-node-sdk.outputs.version }}
          BROWSER_RESULT: ${{ needs.release-browser-sdk.result }}
          BROWSER_VERSION: ${{ needs.release-browser-sdk.outputs.version }}
          AGENT_RESULT: ${{ needs.release-agent-sdk.result }}
          AGENT_VERSION: ${{ needs.release-agent-sdk.outputs.version }}
          REACT_NATIVE_RESULT: ${{ needs.release-react-native-sdk.result }}
          CLI_RESULT: ${{ needs.release-cli.result }}
          REACT_NATIVE_VERSION: ${{ needs.release-react-native-sdk.outputs.version }}
          CLI_VERSION: ${{ needs.release-cli.outputs.version }}
          BACKEND_RESULT: ${{ needs.release-backend.result }}
          BACKEND_VERSION: ${{ needs.release-backend.outputs.version }}
          XDBG_RESULT: ${{ needs.release-xdbg.result }}
          XDBG_VERSION: ${{ needs.release-xdbg.outputs.version }}
          XDBG_PUSHED: ${{ needs.release-xdbg.outputs.pushed }}
          DRY_RUN: ${{ needs.validate.outputs.dry-run }}
          RELEASE_TYPE: ${{ needs.validate.outputs.release-type }}
          SDK_SELECTED: ${{ needs.validate.outputs.products-selected }}
          SDK_COMPLETE: ${{ needs.sdk-complete.result }}
        run: |
          MSG="${RELEASE_TYPE^} Release:"
          if [ "$SDK_SELECTED" = true ] && [ "$SDK_COMPLETE" != success ]; then
            MSG="$MSG SDK release incomplete ($SDK_COMPLETE)."
          fi
          if [ "$DRY_RUN" = "true" ]; then
            MSG="Dry run: $MSG"
          fi
          if [ -n "$IOS_VERSION" ] || [ "$IOS_RESULT" != "skipped" ]; then
            MSG="$MSG iOS ${IOS_VERSION:-failed} (${IOS_RESULT})"
          fi
          if [ -n "$ANDROID_VERSION" ] || [ "$ANDROID_RESULT" != "skipped" ]; then
            MSG="$MSG Android ${ANDROID_VERSION:-failed} (${ANDROID_RESULT})"
          fi
          if [ -n "$NODE_VERSION" ] || [ "$NODE_RESULT" != "skipped" ]; then
            MSG="$MSG Node ${NODE_VERSION:-failed} (${NODE_RESULT})"
          fi
          if [ -n "$BROWSER_VERSION" ] || [ "$BROWSER_RESULT" != "skipped" ]; then
            MSG="$MSG Browser ${BROWSER_VERSION:-failed} (${BROWSER_RESULT})"
          fi
          if [ -n "$AGENT_VERSION" ] || [ "$AGENT_RESULT" != "skipped" ]; then
            MSG="$MSG Agent ${AGENT_VERSION:-failed} (${AGENT_RESULT})"
          fi
          if [ -n "$REACT_NATIVE_VERSION" ] || [ "$REACT_NATIVE_RESULT" != "skipped" ]; then
            MSG="$MSG React Native ${REACT_NATIVE_VERSION:-failed} (${REACT_NATIVE_RESULT})"
          fi
          if [ -n "$CLI_VERSION" ] || [ "$CLI_RESULT" != "skipped" ]; then
            MSG="$MSG CLI ${CLI_VERSION:-failed} (${CLI_RESULT})"
          fi
          if [ -n "$BACKEND_VERSION" ] || [ "$BACKEND_RESULT" != "skipped" ]; then
            MSG="$MSG Backend ${BACKEND_VERSION:-failed} (${BACKEND_RESULT})"
          fi
          if [ -n "$XDBG_VERSION" ] || [ "$XDBG_RESULT" != "skipped" ]; then
            MSG="$MSG xdbg image ${XDBG_VERSION:-failed} (${XDBG_RESULT}$([ "$XDBG_PUSHED" = true ] || echo ', not pushed'))"
          fi
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
      - name: Post to Slack
        uses: ./.github/actions/slack-notify
        with:
          message: ${{ steps.compute.outputs.message }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
