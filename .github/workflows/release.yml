name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type"
        required: true
        type: choice
        options:
          - "dev"
          - "rc"
          - "final"
      ref:
        description: "Branch to release from (defaults to the branch the workflow is run from)"
        required: false
        type: string
      rc-number:
        description: "RC number (required for RC releases)"
        required: false
        type: number
      ios:
        description: "Release iOS SDK"
        required: false
        type: boolean
        default: false
      android:
        description: "Release Android SDK"
        required: false
        type: boolean
        default: false
      node-sdk:
        description: "Release Node SDK"
        required: false
        type: boolean
        default: false
      browser-sdk:
        description: "Release Browser SDK"
        required: false
        type: boolean
        default: false
      agent-sdk:
        description: "Release Agent SDK"
        required: false
        type: boolean
        default: false
      react-native-sdk:
        description: "Release React Native SDK"
        required: false
        type: boolean
        default: false
      cli:
        description: "Release CLI"
        required: false
        type: boolean
        default: false
      backend:
        description: "Release the backend container and GitHub tag"
        required: false
        type: boolean
        default: false
      no-merge:
        description: "Skip merging the release PR (only applies to final releases)"
        required: false
        type: boolean
        default: false
      pr-base:
        description: "Release PR target branch (only applies to final releases)"
        required: false
        type: string
        default: "main"
      dry-run:
        description: "Build selected artifacts and verify React Native consumers; skip publishing, tags, merges, and notifications"
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Resolve source and versions
    runs-on: ubuntu-latest
    # This job runs the release tools from the source, so it holds no App or
    # publish secret and only reads the repository.
    permissions:
      contents: read
    outputs:
      release-type: ${{ steps.resolve.outputs.release-type }}
      ref: ${{ steps.resolve.outputs.ref }}
      source-sha: ${{ steps.source.outputs.sha }}
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      ios: ${{ steps.resolve.outputs.ios }}
      android: ${{ steps.resolve.outputs.android }}
      node-sdk: ${{ steps.resolve.outputs.node-sdk }}
      browser-sdk: ${{ steps.resolve.outputs.browser-sdk }}
      agent-sdk: ${{ steps.resolve.outputs.agent-sdk }}
      react-native-sdk: ${{ steps.resolve.outputs.react-native-sdk }}
      cli: ${{ steps.resolve.outputs.cli }}
      backend: ${{ steps.resolve.outputs.backend }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
      version-ios: ${{ steps.versions.outputs.version-ios }}
      version-android: ${{ steps.versions.outputs.version-android }}
      version-node-sdk: ${{ steps.versions.outputs.version-node-sdk }}
      version-browser-sdk: ${{ steps.versions.outputs.version-browser-sdk }}
      version-agent-sdk: ${{ steps.versions.outputs.version-agent-sdk }}
      version-react-native-sdk: ${{ steps.versions.outputs.version-react-native-sdk }}
      version-cli: ${{ steps.versions.outputs.version-cli }}
    steps:
      - name: Resolve release parameters
        id: resolve
        env:
          INPUT_RELEASE_TYPE: ${{ inputs.release-type }}
          INPUT_REF: ${{ inputs.ref }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_IOS: ${{ inputs.ios }}
          INPUT_ANDROID: ${{ inputs.android }}
          INPUT_NODE_SDK: ${{ inputs.node-sdk }}
          INPUT_BROWSER_SDK: ${{ inputs.browser-sdk }}
          INPUT_AGENT_SDK: ${{ inputs.agent-sdk }}
          INPUT_REACT_NATIVE_SDK: ${{ inputs.react-native-sdk }}
          INPUT_CLI: ${{ inputs.cli }}
          INPUT_BACKEND: ${{ inputs.backend }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "release-type=$INPUT_RELEASE_TYPE"
            echo "ref=${INPUT_REF:-$GITHUB_REF}"
            echo "ios=$INPUT_IOS"
            echo "android=$INPUT_ANDROID"
            echo "node-sdk=$INPUT_NODE_SDK"
            echo "browser-sdk=$INPUT_BROWSER_SDK"
            echo "agent-sdk=$INPUT_AGENT_SDK"
            echo "react-native-sdk=$INPUT_REACT_NATIVE_SDK"
            echo "cli=$INPUT_CLI"
            echo "backend=$INPUT_BACKEND"
            echo "dry-run=${INPUT_DRY_RUN:-false}"
          } >> "$GITHUB_OUTPUT"
      # Use one timestamp for all versions in this release run.
      #
      # Second precision, not minute: the stamp is the semver ordering key, so
      # two runs sharing one stamp fall through to comparing the sha, which is
      # arbitrary. Seconds keep separate runs on separate keys.
      - name: Mint release timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Validate dev release
        if: steps.resolve.outputs.release-type == 'dev'
        env:
          RC_NUMBER: ${{ inputs.rc-number }}
        run: |
          if [ -n "$RC_NUMBER" ]; then
            echo "::error::Dev releases should not have an RC number set"
            exit 1
          fi
      - name: Validate release branch
        if: steps.resolve.outputs.release-type == 'rc' || steps.resolve.outputs.release-type == 'final'
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          BACKEND: ${{ steps.resolve.outputs.backend }}
        run: |
          BRANCH="${REF#refs/heads/}"
          if [[ ! "$BRANCH" =~ ^release/ ]]; then
            echo "::error::RC and final releases must be run from a release/* branch, got: $BRANCH"
            exit 1
          fi
          if [ "$BACKEND" = "true" ] && ! [[ "$BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Backend RC and final releases require release/X.Y.Z, got: $BRANCH"
            exit 1
          fi
      - name: Validate RC number
        if: steps.resolve.outputs.release-type == 'rc'
        env:
          RC_NUMBER: ${{ inputs.rc-number }}
        run: |
          if ! [[ "$RC_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::RC releases require a positive integer rc-number"
            exit 1
          fi
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          persist-credentials: false
      - name: Resolve release source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up release tools
        uses: ./.github/actions/setup-release-tools
      # Every selected SDK gets its version here, once, from the pinned
      # source and the run timestamp. The SDK workflows publish these values.
      # The backend computes its own version after it pins its source.
      - name: Compute SDK versions
        id: versions
        env:
          RELEASE_TYPE: ${{ steps.resolve.outputs.release-type }}
          RC_NUMBER: ${{ inputs.rc-number }}
          REF: ${{ steps.resolve.outputs.ref }}
          TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
          IOS: ${{ steps.resolve.outputs.ios }}
          ANDROID: ${{ steps.resolve.outputs.android }}
          NODE_SDK: ${{ steps.resolve.outputs.node-sdk }}
          BROWSER_SDK: ${{ steps.resolve.outputs.browser-sdk }}
          AGENT_SDK: ${{ steps.resolve.outputs.agent-sdk }}
          REACT_NATIVE_SDK: ${{ steps.resolve.outputs.react-native-sdk }}
          CLI: ${{ steps.resolve.outputs.cli }}
        run: |
          set -euo pipefail
          for entry in "ios:$IOS" "android:$ANDROID" "node-sdk:$NODE_SDK" \
            "browser-sdk:$BROWSER_SDK" "agent-sdk:$AGENT_SDK" \
            "react-native-sdk:$REACT_NATIVE_SDK" "cli:$CLI"; do
            sdk="${entry%%:*}"
            if [ "${entry#*:}" != true ]; then
              continue
            fi
            args=(--sdk "$sdk" --release-type "$RELEASE_TYPE")
            case "$RELEASE_TYPE" in
              rc) args+=(--rc-number "$RC_NUMBER") ;;
              dev) args+=(--source-ref "$REF" --timestamp "$TIMESTAMP") ;;
            esac
            version=$(xmtp-release compute-version "${args[@]}")
            echo "version-$sdk=$version" >> "$GITHUB_OUTPUT"
            echo "$sdk: $version"
          done

  release-ios:
    name: iOS SDK
    needs: [validate]
    if: needs.validate.outputs.ios == 'true' && needs.validate.outputs.dry-run != 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      release-type: ${{ needs.validate.outputs.release-type }}
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-ios }}
    secrets: inherit

  release-android:
    name: Android SDK
    needs: [validate]
    if: needs.validate.outputs.android == 'true' && needs.validate.outputs.dry-run != 'true'
    uses: ./.github/workflows/release-android.yml
    permissions:
      contents: write
      packages: write
    with:
      release-type: ${{ needs.validate.outputs.release-type }}
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-android }}
    secrets: inherit

  release-node-sdk:
    name: Node SDK
    needs: [validate]
    if: needs.validate.outputs.node-sdk == 'true'
    uses: ./.github/workflows/release-node-sdk.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-node-sdk }}
      dry-run: ${{ needs.validate.outputs.dry-run == 'true' }}
    secrets: inherit

  release-browser-sdk:
    name: Browser SDK
    needs: [validate]
    if: needs.validate.outputs.browser-sdk == 'true'
    uses: ./.github/workflows/release-browser-sdk.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-browser-sdk }}
      dry-run: ${{ needs.validate.outputs.dry-run == 'true' }}
    secrets: inherit

  # Depends on release-node-sdk so the published agent-sdk pins the node-sdk
  # version shipped by this same run; when node-sdk is deselected (skipped),
  # the empty version input falls back to npm latest inside the workflow.
  # `!cancelled()` lets this job run when release-node-sdk was skipped.
  release-agent-sdk:
    name: Agent SDK
    needs: [validate, release-node-sdk]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.validate.outputs.agent-sdk == 'true'
    uses: ./.github/workflows/release-agent-sdk.yml
    with:
      release-type: ${{ needs.validate.outputs.release-type }}
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-agent-sdk }}
      node-sdk-version: ${{ needs.release-node-sdk.outputs.version }}
      dry-run: ${{ needs.validate.outputs.dry-run == 'true' }}
    secrets: inherit

  release-react-native-sdk:
    name: React Native SDK
    needs: [validate]
    if: needs.validate.outputs.react-native-sdk == 'true'
    uses: ./.github/workflows/release-react-native-sdk.yml
    with:
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-react-native-sdk }}
      dry-run: ${{ needs.validate.outputs.dry-run == 'true' }}
    secrets: inherit

  # Depends on release-node-sdk so the published CLI pins the node-sdk version
  # shipped by this run, falling back to npm latest when node-sdk is skipped.
  release-cli:
    name: CLI
    needs: [validate, release-node-sdk]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.validate.outputs.cli == 'true'
    uses: ./.github/workflows/release-cli.yml
    with:
      release-type: ${{ needs.validate.outputs.release-type }}
      source-sha: ${{ needs.validate.outputs.source-sha }}
      version: ${{ needs.validate.outputs.version-cli }}
      node-sdk-version: ${{ needs.release-node-sdk.outputs.version }}
      dry-run: ${{ needs.validate.outputs.dry-run == 'true' }}
    secrets: inherit

  release-backend:
    name: Backend
    needs: [validate]
    if: needs.validate.outputs.backend == 'true'
    uses: ./.github/workflows/release-backend.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      release-type: ${{ needs.validate.outputs.release-type }}
      rc-number: ${{ format('{0}', inputs.rc-number) }}
      ref: ${{ needs.validate.outputs.ref }}
      source-sha: ${{ needs.validate.outputs.source-sha }}
      timestamp: ${{ needs.validate.outputs.timestamp }}
      dry-run: ${{ needs.validate.outputs.dry-run == 'true' }}
    secrets: inherit

  # A backend release publishes the xdbg monitoring image
  # (apps/xmtp_debug/README.md), built from the backend's pinned source and
  # tagged with the backend release version. It pushes the image only when the
  # source commit is on main or a release/** branch: a dev release may come
  # from any branch, and a dry run publishes nothing, so those build the image
  # without pushing it. Nothing deploys it.
  release-xdbg:
    name: Publish xdbg image
    needs: [validate, release-backend]
    if: needs.release-backend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release-backend.outputs.version }}
      pushed: ${{ steps.release-source.outcome == 'success' }}
    env:
      IMAGE: ghcr.io/xmtp/xdbg
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source-sha }}
          persist-credentials: false
      # The same check as check-release-push.yml (test_release_push.py runs
      # it). Here a failure only keeps the image from being pushed.
      - name: Check that the source is on a release branch
        id: release-source
        if: needs.validate.outputs.dry-run != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Commits only: the check needs history, not trees or blobs.
          git fetch --quiet --no-tags --filter=tree:0 origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          branches=$(git for-each-ref --contains HEAD --format='%(refname:lstrip=3)' \
            refs/remotes/origin/main 'refs/remotes/origin/release/')
          if [[ -z "$branches" ]]; then
            echo "::error title=Release source::$(git rev-parse HEAD) is not on main or a release/** branch"
            exit 1
          fi
          echo "Release source is on: $(tr '\n' ' ' <<< "$branches")"
      - name: Say that the image is not published
        if: steps.release-source.outcome != 'success'
        run: echo "::notice title=xdbg image::Built, not pushed. Only a non-dry release from main or a release/** branch pushes it."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: steps.release-source.outcome == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ needs.release-backend.outputs.version }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./apps/xmtp_debug/docker/Dockerfile
          push: ${{ steps.release-source.outcome == 'success' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  merge-pr:
    name: Merge release PR
    # dry-run must not mutate the repo: a final + dry-run would otherwise merge
    # and delete the release branch even though the release-* jobs were skipped
    # (skipped ≠ failure, so the !contains(failure) check alone lets it through).
    if: needs.validate.outputs.release-type == 'final' && !inputs.no-merge && !cancelled() && !contains(needs.*.result, 'failure') && needs.validate.outputs.dry-run != 'true'
    needs: [validate, release-ios, release-android, release-node-sdk, release-browser-sdk, release-agent-sdk, release-react-native-sdk, release-cli, release-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.validate.outputs.ref }}
          PR_BASE: ${{ inputs.pr-base }}
        run: |
          BRANCH="${RELEASE_BRANCH#refs/heads/}"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base "$PR_BASE" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for branch $BRANCH targeting $PR_BASE"
            exit 1
          fi
          # Use squash and keep the release branch for later maintenance.
          gh pr merge "$PR_NUMBER" --squash

  notify:
    name: Notify Slack
    needs: [validate, release-ios, release-android, release-node-sdk, release-browser-sdk, release-agent-sdk, release-react-native-sdk, release-cli, release-backend, release-xdbg, merge-pr]
    if: always() && inputs.dry-run != true && needs.validate.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Slack action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose the release message
        id: compute
        env:
          IOS_RESULT: ${{ needs.release-ios.result }}
          IOS_VERSION: ${{ needs.release-ios.outputs.version }}
          ANDROID_RESULT: ${{ needs.release-android.result }}
          ANDROID_VERSION: ${{ needs.release-android.outputs.version }}
          NODE_RESULT: ${{ needs.release-node-sdk.result }}
          NODE_VERSION: ${{ needs.release-node-sdk.outputs.version }}
          BROWSER_RESULT: ${{ needs.release-browser-sdk.result }}
          BROWSER_VERSION: ${{ needs.release-browser-sdk.outputs.version }}
          AGENT_RESULT: ${{ needs.release-agent-sdk.result }}
          AGENT_VERSION: ${{ needs.release-agent-sdk.outputs.version }}
          REACT_NATIVE_RESULT: ${{ needs.release-react-native-sdk.result }}
          CLI_RESULT: ${{ needs.release-cli.result }}
          REACT_NATIVE_VERSION: ${{ needs.release-react-native-sdk.outputs.version }}
          CLI_VERSION: ${{ needs.release-cli.outputs.version }}
          BACKEND_RESULT: ${{ needs.release-backend.result }}
          BACKEND_VERSION: ${{ needs.release-backend.outputs.version }}
          XDBG_RESULT: ${{ needs.release-xdbg.result }}
          XDBG_VERSION: ${{ needs.release-xdbg.outputs.version }}
          XDBG_PUSHED: ${{ needs.release-xdbg.outputs.pushed }}
          DRY_RUN: ${{ needs.validate.outputs.dry-run }}
          RELEASE_TYPE: ${{ needs.validate.outputs.release-type }}
        run: |
          MSG="${RELEASE_TYPE^} Release:"
          if [ "$DRY_RUN" = "true" ]; then
            MSG="Dry run: $MSG"
          fi
          if [ -n "$IOS_VERSION" ] || [ "$IOS_RESULT" != "skipped" ]; then
            MSG="$MSG iOS ${IOS_VERSION:-failed} (${IOS_RESULT})"
          fi
          if [ -n "$ANDROID_VERSION" ] || [ "$ANDROID_RESULT" != "skipped" ]; then
            MSG="$MSG Android ${ANDROID_VERSION:-failed} (${ANDROID_RESULT})"
          fi
          if [ -n "$NODE_VERSION" ] || [ "$NODE_RESULT" != "skipped" ]; then
            MSG="$MSG Node ${NODE_VERSION:-failed} (${NODE_RESULT})"
          fi
          if [ -n "$BROWSER_VERSION" ] || [ "$BROWSER_RESULT" != "skipped" ]; then
            MSG="$MSG Browser ${BROWSER_VERSION:-failed} (${BROWSER_RESULT})"
          fi
          if [ -n "$AGENT_VERSION" ] || [ "$AGENT_RESULT" != "skipped" ]; then
            MSG="$MSG Agent ${AGENT_VERSION:-failed} (${AGENT_RESULT})"
          fi
          if [ -n "$REACT_NATIVE_VERSION" ] || [ "$REACT_NATIVE_RESULT" != "skipped" ]; then
            MSG="$MSG React Native ${REACT_NATIVE_VERSION:-failed} (${REACT_NATIVE_RESULT})"
          fi
          if [ -n "$CLI_VERSION" ] || [ "$CLI_RESULT" != "skipped" ]; then
            MSG="$MSG CLI ${CLI_VERSION:-failed} (${CLI_RESULT})"
          fi
          if [ -n "$BACKEND_VERSION" ] || [ "$BACKEND_RESULT" != "skipped" ]; then
            MSG="$MSG Backend ${BACKEND_VERSION:-failed} (${BACKEND_RESULT})"
          fi
          if [ -n "$XDBG_VERSION" ] || [ "$XDBG_RESULT" != "skipped" ]; then
            MSG="$MSG xdbg image ${XDBG_VERSION:-failed} (${XDBG_RESULT}$([ "$XDBG_PUSHED" = true ] || echo ', not pushed'))"
          fi
          echo "message=$MSG" >> "$GITHUB_OUTPUT"
      - name: Post to Slack
        uses: ./.github/actions/slack-notify
        with:
          message: ${{ steps.compute.outputs.message }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
