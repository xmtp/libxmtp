name: CI
'on':
  push:
    branches:
    - main
    - self-hosted
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  detect-changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      source_suites: ${{ steps.select.outputs.source_suites }}
      test_suites: ${{ steps.select.outputs.test_suites }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
    - name: Select checks from the event Git diff
      id: select
      run: "python3 -B dev/ci/select-checks.py --output \"$RUNNER_TEMP/ci-selection.json\" --source-suites-output \"$RUNNER_TEMP/source-suites.json\"\
        \ --test-suites-output \"$RUNNER_TEMP/test-suites.json\"\n{\n  echo \"selection=$(cat \"$RUNNER_TEMP/ci-selection.json\")\"\n\
        \  echo \"source_suites=$(cat \"$RUNNER_TEMP/source-suites.json\")\"\n  echo \"test_suites=$(cat \"$RUNNER_TEMP/test-suites.json\"\
        )\"\n} >> \"$GITHUB_OUTPUT\"\n"
    - uses: actions/upload-artifact@v4
      with:
        name: ci-selection
        path: '${{ runner.temp }}/ci-selection.json

          ${{ runner.temp }}/source-suites.json

          ${{ runner.temp }}/test-suites.json

          '
        retention-days: 7
  docs-quality:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.docs_quality
    uses: ./.github/workflows/docs-quality.yml
  source-lint:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.source_lint
    uses: ./.github/workflows/lint.yml
    with:
      suites: ${{ needs.detect-changes.outputs.source_suites }}
    secrets: inherit
  lint-ios:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.lint_ios
    uses: ./.github/workflows/lint-ios.yml
    secrets: inherit
  lint-android:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.lint_android
    uses: ./.github/workflows/lint-android.yml
    secrets: inherit
  test-ios:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.test_ios || fromJSON(needs.detect-changes.outputs.selection).checks.test_ios_platform
    uses: ./.github/workflows/test-ios.yml
    with:
      run-unit: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_ios }}
      run-platform: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_ios_platform }}
    secrets: inherit
  test-swift-seams:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.test_swift_seams && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
      == github.repository)
    uses: ./.github/workflows/test-swift-seams.yml
    secrets: inherit
  test-android:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.test_android || fromJSON(needs.detect-changes.outputs.selection).checks.test_android_consumers
      || fromJSON(needs.detect-changes.outputs.selection).checks.test_android_platform
    uses: ./.github/workflows/test-android.yml
    with:
      run-unit: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_android }}
      run-consumers: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_android_consumers }}
      run-platform: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_android_platform }}
    secrets: inherit
  check-rust:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.check_rust
    uses: ./.github/workflows/check-rust.yml
  check-types:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.check_types
    uses: ./.github/workflows/check-types.yml
  check-sdk:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.check_sdk
    uses: ./.github/workflows/check-sdk-products.yml
  check-sdk-unit:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.check_sdk_unit
    uses: ./.github/workflows/check-sdk-unit.yml
  tests:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.tests
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      suites: ${{ needs.detect-changes.outputs.test_suites }}
      run-bindings-ios: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.check_bindings_ios }}
      run-bindings-android: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.check_bindings_android }}
  docs-rust-reference:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.docs_rust && !fromJSON(needs.detect-changes.outputs.selection).checks.docs_site
    uses: ./.github/workflows/docs-rust-reference.yml
  docs:
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.selection).checks.docs_site
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    secrets: inherit
  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    needs:
    - detect-changes
    - source-lint
    - docs-quality
    - lint-ios
    - lint-android
    steps:
    - env:
        PASSED: ${{ needs.detect-changes.result == 'success' && (!fromJSON(needs.detect-changes.outputs.selection).checks.source_lint
          || needs.source-lint.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.docs_quality || needs.docs-quality.result
          == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.lint_ios || needs.lint-ios.result == 'success')
          && (!fromJSON(needs.detect-changes.outputs.selection).checks.lint_android || needs.lint-android.result == 'success') }}
      run: test "$PASSED" = true
  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    needs:
    - detect-changes
    - check-rust
    - check-types
    - check-sdk
    - check-sdk-unit
    - tests
    - docs
    - test-ios
    - test-android
    - test-swift-seams
    - docs-rust-reference
    steps:
    - env:
        PASSED: ${{ needs.detect-changes.result == 'success' && (!fromJSON(needs.detect-changes.outputs.selection).checks.check_rust
          || needs.check-rust.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.check_types || needs.check-types.result
          == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.check_sdk || needs.check-sdk.result == 'success')
          && (!fromJSON(needs.detect-changes.outputs.selection).checks.check_sdk_unit || needs.check-sdk-unit.result == 'success') &&
          (!fromJSON(needs.detect-changes.outputs.selection).checks.tests || needs.tests.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.docs_site
          || needs.docs.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.test_ios || needs.test-ios.result
          == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.test_ios_platform || needs.test-ios.result == 'success')
          && (!fromJSON(needs.detect-changes.outputs.selection).checks.test_android || needs.test-android.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.test_android_consumers
          || needs.test-android.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.test_android_platform
          || needs.test-android.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.test_swift_seams ||
          needs.test-swift-seams.result == 'success') && (!fromJSON(needs.detect-changes.outputs.selection).checks.docs_rust || (fromJSON(needs.detect-changes.outputs.selection).checks.docs_site
          && needs.docs.result == 'success') || needs.docs-rust-reference.result == 'success') }}
      run: test "$PASSED" = true
