name: CI
'on':
  push:
    branches:
    - main
    - self-hosted
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  detect-changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      source_suites: ${{ steps.select.outputs.source_suites }}
      test_suites: ${{ steps.select.outputs.test_suites }}
      lint_jobs: ${{ toJSON(fromJSON(steps.select.outputs.selection).lint_jobs) }}
      test_jobs: ${{ toJSON(fromJSON(steps.select.outputs.selection).test_jobs) }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
    - name: Match changed paths
      id: paths
      if: github.event_name != 'workflow_dispatch'
      continue-on-error: true
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      with:
        # The action shallow-fetches event.before by exact SHA only when it is missing.
        base: ${{ github.ref }}
        predicate-quantifier: some-with-excludes
        list-files: json
        filters: .github/ci-paths.yml
    - name: Select checks and write summary
      id: select
      env:
        PATHS_OUTCOME: ${{ steps.paths.outcome }}
        GITHUB_TOKEN: ${{ github.token }}
      # JSON encoding keeps quotes and line breaks in file paths inside data.
      # Use standard input so large file lists do not exceed environment limits.
      run: |
        python3 dev/ci-select <<'CI_PATH_DATA'
        {
          "changes": ${{ toJSON(steps.paths.outputs.changes) }},
          "all_files_files": ${{ toJSON(steps.paths.outputs.all_files_files) }},
          "known_files_files": ${{ toJSON(steps.paths.outputs.known_files_files) }},
          "shared_files": ${{ toJSON(steps.paths.outputs.shared_files) }}
        }
        CI_PATH_DATA
  docs-quality:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.lint_jobs), 'docs-quality')
    uses: ./.github/workflows/docs-quality.yml
  source-lint:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.lint_jobs), 'source-lint')
    uses: ./.github/workflows/lint.yml
    with:
      suites: ${{ needs.detect-changes.outputs.source_suites }}
    secrets: inherit
  lint-ios:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.lint_jobs), 'lint-ios')
    uses: ./.github/workflows/lint-ios.yml
    secrets: inherit
  lint-android:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.lint_jobs), 'lint-android')
    uses: ./.github/workflows/lint-android.yml
    secrets: inherit
  test-ios:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'test-ios')
    uses: ./.github/workflows/test-ios.yml
    with:
      run-unit: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_ios }}
      run-platform: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_ios_platform }}
    secrets: inherit
  test-swift-lifecycle:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'test-swift-lifecycle') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
      == github.repository)
    uses: ./.github/workflows/test-swift-lifecycle.yml
    secrets: inherit
  test-android:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'test-android')
    uses: ./.github/workflows/test-android.yml
    with:
      run-unit: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_android }}
      run-consumers: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_android_consumers }}
      run-platform: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.test_android_platform }}
    secrets: inherit
  check-rust:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'check-rust')
    uses: ./.github/workflows/check-rust.yml
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  check-types:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'check-types')
    uses: ./.github/workflows/check-types.yml
  check-sdk:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'check-sdk')
    uses: ./.github/workflows/check-sdk-products.yml
  check-sdk-unit:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'check-sdk-unit')
    uses: ./.github/workflows/check-sdk-unit.yml
  tests:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'tests')
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      suites: ${{ needs.detect-changes.outputs.test_suites }}
      run-bindings-ios: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.check_bindings_ios }}
      run-bindings-android: ${{ fromJSON(needs.detect-changes.outputs.selection).checks.check_bindings_android }}
  docs-rust-reference:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'docs-rust-reference')
    uses: ./.github/workflows/docs-rust-reference.yml
  docs:
    needs: detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_jobs), 'docs')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    secrets: inherit
  lint:
    name: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) == 'true' && 'Draft lint' || 'Lint' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    needs:
    - detect-changes
    - source-lint
    - docs-quality
    - lint-ios
    - lint-android
    steps:
    - name: Check selected jobs
      env:
        REQUIRED_JOBS: ${{ needs.detect-changes.outputs.lint_jobs }}
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -en \
          --argjson required "$REQUIRED_JOBS" \
          --argjson results "$JOB_RESULTS" \
          '$required | all(.[]; $results[.].result == "success")'
  test:
    name: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) == 'true' && 'Draft checks' || 'Test' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    needs:
    - detect-changes
    - check-rust
    - check-types
    - check-sdk
    - check-sdk-unit
    - tests
    - docs
    - test-ios
    - test-android
    - test-swift-lifecycle
    - docs-rust-reference
    steps:
    - name: Check selected jobs
      env:
        REQUIRED_JOBS: ${{ needs.detect-changes.outputs.test_jobs }}
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -en \
          --argjson required "$REQUIRED_JOBS" \
          --argjson results "$JOB_RESULTS" \
          '$required | all(.[]; $results[.].result == "success")'
