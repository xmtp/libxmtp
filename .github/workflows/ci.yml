# Generated by dev/ci-suites from .github/ci-suites.yml. Do not edit.
#
# Select suites (job detect-changes) runs dev/ci-select. It picks the blocking
# and advisory suites and the product groups. Each suite has a caller job, and
# a suite with advisory_filters has a second one, <suite>_advisory, for runs
# where only those filters match. The Lint and Test gates need detection, the
# products jobs, and the blocking callers of their phase; they never wait for
# an advisory caller.
name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      suites:
        description: Comma-separated suite keys of .github/ci-suites.yml. Empty runs every suite.
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  # A pull request push cancels the older run of that pull request. Merge runs
  # and manual runs each have their own group per ref and are never cancelled
  # while they run. GitHub keeps at most one pending run per group, so a newer
  # push to main replaces a merge run that is still waiting: merge runs are
  # latest-wins, and a manual run never replaces a merge run.
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  detect-changes:
    name: Select suites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint_suites: ${{ steps.select.outputs.lint_suites }}
      test_suites: ${{ steps.select.outputs.test_suites }}
      advisory_suites: ${{ steps.select.outputs.advisory_suites }}
      products: ${{ steps.select.outputs.products }}
    steps:
    - name: Check out the source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 2
    - name: List changed paths
      id: paths
      if: github.event_name != 'workflow_dispatch'
      continue-on-error: true
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
      with:
        # The action shallow-fetches event.before by exact SHA only when it is missing.
        base: ${{ github.ref }}
        list-files: json
        filters: |
          all_files:
          - '**'
    - name: Select suites and write summary
      id: select
      env:
        PATHS_OUTCOME: ${{ steps.paths.outcome }}
        GITHUB_TOKEN: ${{ github.token }}
        # Whether this run can push to xmtp-pr. Only true or false reaches the
        # script, never the token. Fork runs have no secrets, and Dependabot
        # runs have only Dependabot secrets.
        PR_CACHE_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN != '' }}
      # JSON encoding keeps quotes and line breaks in file paths inside data.
      # Use standard input so large file lists do not exceed environment limits.
      # A manual run reads its `suites` input from the event payload.
      run: |
        python3 dev/ci-select <<'CI_PATH_DATA'
        {
          "changes": ${{ toJSON(steps.paths.outputs.changes) }},
          "all_files_files": ${{ toJSON(steps.paths.outputs.all_files_files) }}
        }
        CI_PATH_DATA
  products_sdk_js:
    name: Prebuild JS SDKs (Nix)
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.products), 'sdk_js')
    runs-on: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 120 }}
    steps:
    - name: Check out the source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - name: Build the sdk_js products
      run: nix build --keep-going --no-link .#ciSets.x86_64-linux.sdk_js
  products_sdk_android:
    name: Prebuild Android SDK (Nix)
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.products), 'sdk_android')
    runs-on: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 120 }}
    steps:
    - name: Check out the source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - name: Build the sdk_android products
      run: nix build --keep-going --no-link .#ciSets.x86_64-linux.sdk_android
  lint_config:
    name: Repository lint
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.lint_suites), 'lint_config')
    uses: ./.github/workflows/lint-config.yml
    permissions:
      contents: read
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  nix_eval:
    name: Nix evaluation
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.lint_suites), 'nix_eval')
    uses: ./.github/workflows/nix-eval.yml
    permissions:
      contents: read
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  lint_example_react_native:
    name: React Native example app
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.lint_suites), 'lint_example_react_native')
    uses: ./.github/workflows/lint-example-react-native.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_dev:
    name: Dev tools
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_dev')
    uses: ./.github/workflows/test-dev.yml
    permissions:
      contents: read
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  check_rust:
    name: Rust Clippy
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'check_rust')
    uses: ./.github/workflows/check-rust.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_backend:
    name: Backend Docker image
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_backend')
    uses: ./.github/workflows/test-backend.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_nix_checks:
    name: Rust Nix checks
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_nix_checks')
    uses: ./.github/workflows/test-nix-checks.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_workspace:
    name: Rust workspace
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_workspace')
    uses: ./.github/workflows/test-workspace.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_wasm:
    name: Rust WASM
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_wasm')
    uses: ./.github/workflows/test-wasm.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  docs_rust:
    name: Rust reference
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'docs_rust')
    uses: ./.github/workflows/docs-rust-reference.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  check_types:
    name: JS types
    needs:
    - detect-changes
    - products_sdk_js
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'check_types') && needs.products_sdk_js.result != 'failure' }}
    uses: ./.github/workflows/check-types.yml
    permissions:
      contents: read
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  check_sdk:
    name: SDK packaging
    needs:
    - detect-changes
    - products_sdk_js
    - products_sdk_android
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'check_sdk') && needs.products_sdk_js.result != 'failure' && needs.products_sdk_android.result != 'failure' }}
    uses: ./.github/workflows/check-sdk-products.yml
    permissions:
      contents: read
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_node:
    name: Node SDK, Agent SDK, CLI
    needs:
    - detect-changes
    - products_sdk_js
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_node') && needs.products_sdk_js.result != 'failure' }}
    uses: ./.github/workflows/test-node-sdk.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_browser:
    name: Browser SDK
    needs:
    - detect-changes
    - products_sdk_js
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_browser') && needs.products_sdk_js.result != 'failure' }}
    uses: ./.github/workflows/test-browser-sdk.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_sdk_platform:
    name: Browser SDK platform
    needs:
    - detect-changes
    - products_sdk_js
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_sdk_platform') && needs.products_sdk_js.result != 'failure' }}
    uses: ./.github/workflows/test-sdk-platform.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  docs_site:
    name: Docs site
    needs:
    - detect-changes
    - products_sdk_js
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'docs_site') && needs.products_sdk_js.result != 'failure' }}
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-16vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
      compose-runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_ios:
    name: iOS SDK
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_ios')
    uses: ./.github/workflows/test-ios.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-6vcpu-macos-15' || 'warp-macos-15-arm64-6x' }}
  test_android:
    name: Android SDK
    needs:
    - detect-changes
    - products_sdk_android
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_android') && needs.products_sdk_android.result != 'failure' }}
    uses: ./.github/workflows/test-android.yml
    permissions:
      contents: read
    secrets: inherit
  test_example_android:
    name: Android example app
    needs:
    - detect-changes
    - products_sdk_android
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_example_android') && needs.products_sdk_android.result != 'failure' }}
    uses: ./.github/workflows/test-example-android.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      emulator: false
  test_example_android_advisory:
    name: Android example app (advisory)
    needs:
    - detect-changes
    - products_sdk_android
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.advisory_suites), 'test_example_android') && needs.products_sdk_android.result != 'failure' }}
    uses: ./.github/workflows/test-example-android.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      emulator: false
  test_example_android_emulator:
    name: Android example emulator
    needs:
    - detect-changes
    - products_sdk_android
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_example_android_emulator') && needs.products_sdk_android.result != 'failure' }}
    uses: ./.github/workflows/test-example-android.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      emulator: true
  test_example_android_emulator_advisory:
    name: Android example emulator (advisory)
    needs:
    - detect-changes
    - products_sdk_android
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.advisory_suites), 'test_example_android_emulator') && needs.products_sdk_android.result != 'failure' }}
    uses: ./.github/workflows/test-example-android.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      emulator: true
  test_example_ios:
    name: iOS example app
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_example_ios')
    uses: ./.github/workflows/test-example-ios.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-6vcpu-macos-15' || 'warp-macos-15-arm64-6x' }}
  test_example_ios_advisory:
    name: iOS example app (advisory)
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.advisory_suites), 'test_example_ios')
    uses: ./.github/workflows/test-example-ios.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-6vcpu-macos-15' || 'warp-macos-15-arm64-6x' }}
  check_react_native:
    name: React Native unit checks
    needs:
    - detect-changes
    - products_sdk_js
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && contains(fromJSON(needs.detect-changes.outputs.test_suites), 'check_react_native') && needs.products_sdk_js.result != 'failure' }}
    uses: ./.github/workflows/check-react-native.yml
    permissions:
      contents: read
    with:
      runner: ${{ github.event_name == 'pull_request' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
  test_react_native:
    name: React Native SDK
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_react_native')
    uses: ./.github/workflows/test-react-native.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      scope: full
  test_react_native_advisory:
    name: React Native SDK (advisory)
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.advisory_suites), 'test_react_native')
    uses: ./.github/workflows/test-react-native.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      scope: full
  test_react_native_smoke:
    name: React Native Android smoke
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.test_suites), 'test_react_native_smoke')
    uses: ./.github/workflows/test-react-native.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      scope: android-smoke
  test_react_native_smoke_advisory:
    name: React Native Android smoke (advisory)
    needs:
    - detect-changes
    if: contains(fromJSON(needs.detect-changes.outputs.advisory_suites), 'test_react_native_smoke')
    uses: ./.github/workflows/test-react-native.yml
    permissions:
      contents: read
    secrets:
      CACHIX_PR_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
    with:
      scope: android-smoke
  lint:
    name: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) == 'true' && 'Lint (draft)' || github.event_name == 'workflow_dispatch' && inputs.suites != '' && 'Lint (manual subset)' || 'Lint' }}
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
    - detect-changes
    - lint_config
    - nix_eval
    - lint_example_react_native
    steps:
    - name: Check detection and the selected blocking lint suites
      env:
        DETECTED: ${{ needs.detect-changes.result }}
        SELECTED: ${{ needs.detect-changes.outputs.lint_suites }}
        PRODUCTS: '[]'
        WAITS: '{}'
        RESULTS: ${{ toJSON(needs) }}
      run: |
        if [ "$DETECTED" != success ]; then
          echo "Select suites: $DETECTED"
          exit 1
        fi
        jq -enr \
          --argjson selected "$SELECTED" \
          --argjson products "$PRODUCTS" \
          --argjson waits "$WAITS" \
          --argjson results "$RESULTS" \
          '[$products[] | select(. as $group | any($selected[]; any(($waits[.] // [])[]; . == $group)))
              | "products_\(.)" | select($results[.].result != "success")] as $broken
          | [$selected[] | select($results[.].result != "success")
              | select(any(($waits[.] // [])[]; "products_\(.)" | IN($broken[])) | not)] as $failed
          | ($broken[] | "\(.): \($results[.].result); the suites that wait for it did not run"),
            ($failed[] | "\(.): \($results[.].result)"),
            ($broken + $failed == [])'
  test:
    name: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) == 'true' && 'Test (not run on drafts)' || github.event_name == 'workflow_dispatch' && inputs.suites != '' && 'Test (manual subset)' || 'Test' }}
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
    - detect-changes
    - products_sdk_js
    - products_sdk_android
    - test_dev
    - check_rust
    - test_backend
    - test_nix_checks
    - test_workspace
    - test_wasm
    - docs_rust
    - check_types
    - check_sdk
    - test_node
    - test_browser
    - test_sdk_platform
    - docs_site
    - test_ios
    - test_android
    - test_example_android
    - test_example_android_emulator
    - test_example_ios
    - check_react_native
    - test_react_native
    - test_react_native_smoke
    steps:
    - name: Check detection and the selected blocking test suites
      env:
        DETECTED: ${{ needs.detect-changes.result }}
        SELECTED: ${{ needs.detect-changes.outputs.test_suites }}
        PRODUCTS: ${{ needs.detect-changes.outputs.products }}
        WAITS: '{"check_types":["sdk_js"],"check_sdk":["sdk_js","sdk_android"],"test_node":["sdk_js"],"test_browser":["sdk_js"],"test_sdk_platform":["sdk_js"],"docs_site":["sdk_js"],"test_android":["sdk_android"],"test_example_android":["sdk_android"],"test_example_android_emulator":["sdk_android"],"check_react_native":["sdk_js"]}'
        RESULTS: ${{ toJSON(needs) }}
      run: |
        if [ "$DETECTED" != success ]; then
          echo "Select suites: $DETECTED"
          exit 1
        fi
        jq -enr \
          --argjson selected "$SELECTED" \
          --argjson products "$PRODUCTS" \
          --argjson waits "$WAITS" \
          --argjson results "$RESULTS" \
          '[$products[] | select(. as $group | any($selected[]; any(($waits[.] // [])[]; . == $group)))
              | "products_\(.)" | select($results[.].result != "success")] as $broken
          | [$selected[] | select($results[.].result != "success")
              | select(any(($waits[.] // [])[]; "products_\(.)" | IN($broken[])) | not)] as $failed
          | ($broken[] | "\(.): \($results[.].result); the suites that wait for it did not run"),
            ($failed[] | "\(.): \($results[.].result)"),
            ($broken + $failed == [])'
