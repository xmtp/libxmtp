name: "Lint: Repository"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
env:
  NIX_DEVSHELL: rust
jobs:
  # Every Linux lint in one job: one checkout, one dev shell, one pnpm
  # install. Each check also runs when an earlier check failed, so one run
  # reports every failure; none runs when setup failed.
  lint:
    name: hakari, deny, buf, treefmt, JS, Markdown
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted runners (merge and manual runs) have 4 vCPU.
    timeout-minutes: ${{ startsWith(inputs.runner, 'ubuntu-') && 60 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - name: Install JS dependencies (pnpm)
        uses: ./.github/actions/setup-js
        id: js
        with:
          cache-mode: "ci"
      - name: dev/nix-shell 'just lint-rust-source'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-rust-source'
      # The advisories check runs only in the daily lint-deny.yml schedule, so
      # a new RustSec advisory does not fail unrelated pull requests.
      - name: dev/nix-shell 'just lint-deny'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-deny'
      - name: dev/nix-shell 'just lint-proto'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-proto'
      - name: dev/nix-shell 'just lint-config'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-config'
      - name: dev/nix-shell 'just lint-js-source'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-js-source'
      - name: dev/nix-shell 'just lint-js-format'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-js-format'
      - name: dev/nix-shell 'just docs test'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just docs test'
      - name: dev/nix-shell 'just lint-markdown'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        env:
          NIX_DEVSHELL: docs
        run: dev/nix-shell 'just lint-markdown'
      - name: dev/nix-shell 'just docs check-source'
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just docs check-source'
      - name: Check scoped Node runtime dependencies
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: |
          nix build --no-link .#node-runtime-dependencies.x86_64-linux
          nix eval --json .#node-runtime-dependencies --apply 'builtins.mapAttrs (_: check: check.drvPath)'
