name: Lint Config
on:
  workflow_call:
env:
  NIX_DEVSHELL: rust
jobs:
  lint:
    name: Lint (Config)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Generate current Node public projection
        run: |
          if python3 dev/sdk/switches.py | grep -Fxq 'sdks/node/'; then
            just sdk generate node
          fi
      - name: Lint config files (TOML, Nix, shell)
        run: just lint-config
