name: Lint Config
on:
  workflow_call:
env:
  NIX_DEVSHELL: rust
jobs:
  # Every Linux lint in one job: one checkout, one dev shell, one pnpm
  # install. Each check also runs when an earlier check failed, so one run
  # reports every failure; none runs when setup failed.
  lint:
    name: Lint (Rust, JS, config, docs)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - uses: ./.github/actions/setup-js
        id: js
        with:
          cache-mode: "ci"
      - name: Check the Rust workspace manifests (hakari)
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-rust-source'
      # The advisories check runs only in the daily lint-deny.yml schedule, so
      # a new RustSec advisory does not fail unrelated pull requests.
      - name: Check dependency bans, licenses, and sources (cargo-deny)
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-deny'
      - name: Lint protobuf (buf)
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-proto'
      - name: Format check, CI declaration, and release tools (treefmt)
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-config'
      - name: Oxlint JavaScript workspace
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-js-source'
      - name: Check JavaScript formatting (Oxfmt)
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just lint-js-format'
      - name: Test the docs scripts
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just docs test'
      - name: Lint repository Markdown
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        env:
          NIX_DEVSHELL: docs
        run: dev/nix-shell 'just lint-markdown'
      - name: Check documentation source
        if: ${{ !cancelled() && steps.js.outcome == 'success' }}
        run: dev/nix-shell 'just docs check-source'
