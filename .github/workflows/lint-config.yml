name: Lint Config
on:
  workflow_call:
env:
  NIX_DEVSHELL: rust
jobs:
  lint:
    name: Lint (Config)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Generate current public projections
        run: |
          for target in node browser; do
            if python3 dev/sdk/switches.py | grep -Fxq "sdks/$target/"; then
              just sdk generate "$target"
            fi
          done
      - name: Lint config files (TOML, Nix, shell)
        run: just lint-config
