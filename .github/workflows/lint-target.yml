name: Source lint target
'on':
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
permissions:
  contents: read
jobs:
  lint_workspace:
    if: inputs.suite == 'lint_workspace'
    uses: ./.github/workflows/lint-workspace.yml
    secrets: inherit
  lint_js:
    if: inputs.suite == 'lint_js'
    uses: ./.github/workflows/lint-js.yml
    secrets: inherit
  lint_config:
    if: inputs.suite == 'lint_config'
    uses: ./.github/workflows/lint-config.yml
    secrets: inherit
  lint_proto:
    if: inputs.suite == 'lint_proto'
    uses: ./.github/workflows/lint-proto.yml
    secrets: inherit
  result:
    name: Require selected source target
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 1
    if: always()
    needs:
    - lint_workspace
    - lint_js
    - lint_config
    - lint_proto
    steps:
    - env:
        PASSED: ${{ needs[inputs.suite].result == 'success' }}
      run: test "$PASSED" = true
