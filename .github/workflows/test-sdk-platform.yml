name: Test SDK runtime and platform proofs
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      prepared-products:
        type: boolean
        default: false
permissions:
  contents: read
env:
  NIX_DEVSHELL: js
  SQLX_OFFLINE: "true"
jobs:
  proof:
    name: Test (SDK ${{ inputs.target }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Check proof target
        env:
          SDK_PROOF_TARGET: ${{ inputs.target }}
        run: |
          case "$SDK_PROOF_TARGET" in bridge|browser) ;; *) echo 'Invalid SDK proof target' >&2; exit 1 ;; esac
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          kache: ${{ (inputs.target == 'browser' || !inputs.prepared-products) && 'true' || 'false' }}
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Restore Node product
        if: inputs.prepared-products
        uses: ./.github/actions/sdk-product
        with:
          target: node
          artifact-name: ci-sdk-node
      - name: Restore Browser product
        if: inputs.prepared-products
        uses: ./.github/actions/sdk-product
        with:
          target: browser
          artifact-name: ci-sdk-browser
      - name: Restore backend product
        if: inputs.prepared-products
        uses: ./.github/actions/backend-product
        with:
          artifact-name: ci-backend
          allow-earlier-attempt: true
      - name: Start prepared backend
        if: inputs.prepared-products
        run: dev/nix-shell 'just backend up-prepared'
      - name: Generate local SDK products
        if: ${{ !inputs.prepared-products }}
        env:
          NIX_DEVSHELL: rust
        run: dev/nix-shell 'just sdk generate node,browser'
      - name: Start local backend
        if: ${{ !inputs.prepared-products }}
        run: dev/nix-shell 'just backend up'
      - name: Build the fixture generator
        if: inputs.prepared-products && inputs.target == 'browser'
        env:
          NIX_DEVSHELL: rust
        run: |
          dev/nix-shell 'dev/agent-run cargo build --locked -p xmtp-sdk-bindgen --target-dir target/sdk-fixture-tools'
          mkdir -p target/sdk-artifacts/bindgen
          cp target/sdk-fixture-tools/debug/xmtp-sdk-bindgen target/sdk-artifacts/bindgen/xmtp-sdk-bindgen
      - name: Bridge runtime unit tests
        if: inputs.target == 'bridge'
        run: dev/nix-shell 'just sdk test-bridge'
      - name: Browser platform proofs
        if: inputs.target == 'browser'
        # The helper builds the debug panic and release pure codec fixtures.
        run: dev/nix-shell 'just sdk test-browser'
      - name: Dump Docker logs on failure
        if: failure()
        timeout-minutes: 2
        uses: jwalton/gh-docker-logs@v2
      - name: Stop test services
        if: always()
        timeout-minutes: 2
        run: dev/nix-shell 'just backend down'
