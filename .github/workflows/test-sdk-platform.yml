name: Test SDK runtime and platform proofs
'on':
  workflow_call:
    inputs:
      target:
        type: string
        required: true
permissions:
  contents: read
env:
  NIX_DEVSHELL: js
  SQLX_OFFLINE: 'true'
jobs:
  proof:
    name: Test (SDK ${{ inputs.target }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - name: Check proof target
      env:
        SDK_PROOF_TARGET: ${{ inputs.target }}
      run: 'case "$SDK_PROOF_TARGET" in bridge|browser) ;; *) echo ''Invalid SDK proof target'' >&2; exit 1 ;; esac

        '
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: rust
        docker-builder: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: sdk-platform-${{ inputs.target }}
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
    - name: Generate local SDK products
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk generate node,browser'
    - name: Start local backend
      run: dev/nix-shell 'just backend up'
    - name: Bridge runtime unit tests
      if: inputs.target == 'bridge'
      run: dev/nix-shell 'just sdk test-bridge'
    - name: Browser platform proofs
      if: inputs.target == 'browser'
      run: dev/nix-shell 'just sdk test-browser'
    - name: Dump Docker logs on failure
      if: failure()
      timeout-minutes: 2
      uses: jwalton/gh-docker-logs@v2
    - name: Stop test services
      if: always()
      timeout-minutes: 2
      run: dev/nix-shell 'just backend down'
