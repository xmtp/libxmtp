name: "Test: Browser SDK platform"
'on':
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
permissions:
  contents: read
env:
  NIX_DEVSHELL: js
  # JS jobs test the release-profile Nix products (products_sdk_js), not a
  # cargo debug build.
  XMTP_SDK_BUILD: nix
  SQLX_OFFLINE: 'true'
jobs:
  proof:
    name: Workers, storage, bridge
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
    - name: Check out the source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - name: Install JS dependencies (pnpm)
      uses: ./.github/actions/setup-js
      with:
        cache-mode: ci
    - name: dev/nix-shell 'just sdk generate node,browser'
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk generate node,browser'
    - name: dev/nix-shell 'just backend up'
      run: dev/nix-shell 'just backend up'
    - name: dev/nix-shell 'just sdk test-bridge'
      id: bridge
      run: dev/nix-shell 'just sdk test-bridge'
    # The platform proofs also run when the bridge tests fail, so one run
    # reports both. They do not run when an earlier setup step failed.
    - name: dev/nix-shell 'just sdk test-browser'
      if: ${{ !cancelled() && steps.bridge.outcome != 'skipped' }}
      run: dev/nix-shell 'just sdk test-browser'
    - name: Dump Docker logs on failure
      if: failure()
      timeout-minutes: 2
      uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
    - name: dev/nix-shell 'just backend down'
      if: always()
      timeout-minutes: 2
      run: dev/nix-shell 'just backend down'
