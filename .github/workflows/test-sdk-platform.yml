name: Test SDK runtime and platform proofs
'on':
  workflow_call:
permissions:
  contents: read
env:
  NIX_DEVSHELL: js
  # JS jobs test the release-profile Nix products (products_sdk_js), not a
  # cargo debug build.
  XMTP_SDK_BUILD: nix
  SQLX_OFFLINE: 'true'
jobs:
  proof:
    name: Test (SDK browser)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just (v2.87.28)
    - uses: ./.github/actions/setup-js
      with:
        cache-mode: ci
    - name: Generate local SDK products
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk generate node,browser'
    - name: Start local backend
      run: dev/nix-shell 'just backend up'
    - name: Bridge runtime unit tests
      id: bridge
      run: dev/nix-shell 'just sdk test-bridge'
    # The platform proofs also run when the bridge tests fail, so one run
    # reports both. They do not run when an earlier setup step failed.
    - name: Browser platform proofs
      if: ${{ !cancelled() && steps.bridge.outcome != 'skipped' }}
      run: dev/nix-shell 'just sdk test-browser'
    - name: Dump Docker logs on failure
      if: failure()
      timeout-minutes: 2
      uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
    - name: Stop test services
      if: always()
      timeout-minutes: 2
      run: dev/nix-shell 'just backend down'
