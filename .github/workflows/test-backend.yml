name: Test self-hosted backend
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        description: The amd64 runner label. ci.yml passes it from .github/ci-suites.yml (runners); a dispatch uses the default.
        type: string
        default: blacksmith-8vcpu-ubuntu-2404
    secrets:
      CACHIX_PR_AUTH_TOKEN:
        required: false
permissions:
  contents: read
env:
  NIX_DEVSHELL: rust
jobs:
  # The Docker backend job: the backend image starts with only the database,
  # then the full stack passes the observability check. The backend's own
  # tests run in test-nix-checks.yml.
  backend-image:
    name: Backend image and observability (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        # Automatic runs test amd64. Manual runs also test arm64.
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Build backend image
        run: dev/nix-shell 'just backend image'
      - name: Load backend image
        run: docker load --input result-backend-image
      - name: Check image architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch="$(docker image inspect ghcr.io/xmtp/backend:self-hosted --format '{{.Architecture}}')"
          test "$actual_arch" = "$EXPECTED_ARCH"
      # The image starts, serves gRPC health, and reaches PostgreSQL with only
      # the database: no anvil, and the chain URL points at a name that does
      # not resolve. A smart-contract wallet test needs the full stack.
      - name: Run backend image with only the database
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          dev/nix-shell 'just backend db-up'
          # The Compose project name is per-worktree, so the network name is too.
          # CI is a clone, not a worktree, so this resolves to `libxmtp_default`.
          . dev/docker/load-env
          docker run --detach --name backend-smoke --platform "$PLATFORM" \
            --network "${XMTP_COMPOSE_PROJECT}_default" -p 127.0.0.1:55050:5050 \
            -e XMTP_CHAIN_31337_URL=http://anvil.invalid:8545 \
            -e XMTP_DATABASE_URL=postgres://xmtp:xmtp@db:5432/xmtp_backend \
            -e XMTP_REPLICA_URL=postgres://xmtp:xmtp@replica:5432/xmtp_backend \
            -v "$PWD/dev/backend/local.toml:/config.toml:ro" \
            ghcr.io/xmtp/backend:self-hosted --config-file /config.toml
          dev/nix-shell 'for attempt in {1..30}; do grpc-health-probe -addr=127.0.0.1:55050 && exit 0; sleep 1; done; exit 1'
      - name: Image logs and cleanup
        if: always()
        run: |
          docker logs backend-smoke || true
          docker rm --force backend-smoke || true
          dev/nix-shell 'just backend down'
      # `just backend up` loads the image built above. The check builds xdbg
      # as a traffic client and checks the traces, metrics, and dashboard.
      - name: Verify observability
        run: dev/nix-shell 'just backend up && just backend observe-check'
      - name: Stack logs
        if: failure()
        run: dev/nix-shell 'just backend logs' || true
      - name: Stop the stack
        if: always()
        run: dev/nix-shell 'just backend down'
