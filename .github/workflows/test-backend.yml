name: Test self-hosted backend

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NIX_DEVSHELL: rust
jobs:
  test-backend:
    name: Test backend (native)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NIX_DEVSHELL: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          kache: "false"
      - uses: taiki-e/install-action@just
      - name: Start backend database and VersityGW
        run: |
          just backend db-up
          just backend s3-up
      - name: Check SQL cache
        run: just backend sql-check
      - name: Test backend, replica recovery, and HTTPS streaming
        run: just backend test
      - name: Stop backend database
        if: always()
        run: just backend db-down

  native:
    name: Native backend contract
    # Fork pull requests do not run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
      # Prove public cache substitution without a cache-write token.
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: backend-tests-debug
          kache-readonly: "true"
      - uses: taiki-e/install-action@just
      - name: Check wrapper processes
        run: dev/nix-shell 'shellcheck dev/backend/ci && python3.11 dev/backend/check-ci.py'
      - name: Check cache reader environment
        run: |
          test -z "${CACHIX_AUTH_TOKEN:-}"
          test -z "${CACHIX_SIGNING_KEY:-}"
          echo "Cache writer environment absent"
      - name: Build native service package
        run: time nix build --no-link .#backend-ci
      - name: Record service versions and published configuration
        run: |
          nix run .#backend-ci -- bash -euc '
            postgres --version
            versitygw --version
            grpcurl -plaintext -emit-defaults -import-path proto -proto backend/v1/backend.proto \
              -d "{}" 127.0.0.1:5050 xmtp.backend.v1.ConfigurationService/GetConfiguration \
              > "$RUNNER_TEMP/backend-ci-logs/configuration.json"
          '
          dev/nix-shell --command jq -e \
            '.attachments == {baseUrl: "http://127.0.0.1:9067/attachments", maxUploadBytes: "104857600", retentionSeconds: "0"}' \
            "$RUNNER_TEMP/backend-ci-logs/configuration.json"
      - name: Check shared attachment configuration
        run: dev/nix-shell 'just backend test --lib local_s3_config_only_adds_attachments'
      # Build logs establish source-build or cache substitution evidence.
      # Cache-only substitution and job-only rerun proofs are recorded after CI.
      - name: Check real S3 attachment contract
        run: dev/nix-shell 'just backend ci just backend test --lib s3_target_accepts_exact_bytes_once'
      - name: Retain native service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7

  backend-image:
    name: Backend image (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        # Automatic runs test amd64. Manual runs also test arm64.
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          nix-disk: ${{ matrix.arch == 'amd64' && 'true' || 'false' }}
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          kache: "false"
      - uses: taiki-e/install-action@just
      - name: Build backend image
        run: just backend image
      - name: Load backend image
        run: docker load --input result-backend-image
      - name: Check image architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch="$(docker image inspect ghcr.io/xmtp/backend:self-hosted --format '{{.Architecture}}')"
          test "$actual_arch" = "$EXPECTED_ARCH"
      # This smoke test proves the image starts, serves gRPC health, and reaches
      # PostgreSQL. It runs no chain call, and the database subset has no anvil,
      # so the chain URL points at a name that does not resolve. A smart-contract
      # wallet test needs the full stack from `just backend up`.
      - name: Run backend image
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          just backend db-up
          # The Compose project name is per-worktree, so the network name is too.
          # CI is a clone, not a worktree, so this resolves to `libxmtp_default`.
          set -a && . dev/docker/.env && set +a
          docker run --detach --name backend-smoke --platform "$PLATFORM" \
            --network "${XMTP_COMPOSE_PROJECT}_default" -p 127.0.0.1:55050:5050 \
            -e XMTP_CHAIN_31337_URL=http://anvil.invalid:8545 \
            -e XMTP_DATABASE_URL=postgres://xmtp:xmtp@db:5432/xmtp_backend \
            -e XMTP_REPLICA_URL=postgres://xmtp:xmtp@replica:5432/xmtp_backend \
            -v "$PWD/dev/backend/local.toml:/config.toml:ro" \
            ghcr.io/xmtp/backend:self-hosted --config-file /config.toml
          dev/nix-shell 'for attempt in {1..30}; do grpc-health-probe -addr=127.0.0.1:55050 && exit 0; sleep 1; done; exit 1'
      - name: Backend logs and cleanup
        if: always()
        run: |
          docker logs backend-smoke || true
          docker rm --force backend-smoke || true
          just backend db-down
