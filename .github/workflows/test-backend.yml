name: Test self-hosted backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-backend:
    name: Test backend (native)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NIX_DEVSHELL: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache: "false"
      - uses: taiki-e/install-action@just
      - name: Start backend database
        run: just backend-db-up
      - name: Check SQL cache
        run: just backend-sql-check
      - name: Test backend, replica recovery, and HTTPS streaming
        run: just test-backend
      - name: Stop backend database
        if: always()
        run: just backend-db-down

  backend-image:
    name: Backend image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2404
            image: .#backend-image-x86_64-unknown-linux-musl
            nix-disk: "true"
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: .#backend-image-aarch64-unknown-linux-musl
            nix-disk: "false"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          nix-disk: ${{ matrix.nix-disk }}
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache: "false"
      - name: Build backend image
        run: nix build "${{ matrix.image }}" --out-link backend-image-result
      - name: Load backend image
        run: docker load --input backend-image-result
      - name: Check image architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch="$(docker image inspect ghcr.io/xmtp/backend:self-hosted --format '{{.Architecture}}')"
          test "$actual_arch" = "$EXPECTED_ARCH"
      - name: Run backend image
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker compose -f dev/backend/compose.yml up --detach --wait
          docker run --detach --name backend-smoke --platform "$PLATFORM" \
            --network xmtp-backend_default -p 127.0.0.1:55050:5050 \
            -e XMTP_DATABASE_URL=postgres://xmtp:xmtp@primary:5432/xmtp_backend \
            -v "$PWD/dev/backend/config.toml:/config.toml:ro" \
            ghcr.io/xmtp/backend:self-hosted --config /config.toml
          dev/nix-shell 'for attempt in {1..30}; do grpc-health-probe -addr=127.0.0.1:55050 && exit 0; sleep 1; done; exit 1'
      - name: Backend logs and cleanup
        if: always()
        run: |
          docker logs backend-smoke || true
          docker rm --force backend-smoke || true
          docker compose -f dev/backend/compose.yml down
