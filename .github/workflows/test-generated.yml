# Generated by dev/ci-suites from .github/ci-suites.yml. Do not edit.
name: Test suites
on:
  workflow_call:
    inputs:
      suites:
        description: JSON list of the suites to run.
        type: string
        required: true
      products:
        description: JSON list of the product groups to build.
        type: string
        required: true
permissions:
  contents: read
jobs:
  products_sdk_js:
    name: Products (sdk_js)
    if: contains(fromJSON(inputs.products), 'sdk_js')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - name: Build the sdk_js products
      run: nix build --keep-going --no-link .#ciSets.x86_64-linux.sdk_js
  products_sdk_android:
    name: Products (sdk_android)
    if: contains(fromJSON(inputs.products), 'sdk_android')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - name: Build the sdk_android products
      run: nix build --keep-going --no-link .#ciSets.x86_64-linux.sdk_android
  check_rust:
    if: contains(fromJSON(inputs.suites), 'check_rust')
    uses: ./.github/workflows/check-rust.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  check_sdk_unit:
    if: contains(fromJSON(inputs.suites), 'check_sdk_unit')
    uses: ./.github/workflows/check-sdk-unit.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  test_backend:
    if: contains(fromJSON(inputs.suites), 'test_backend')
    uses: ./.github/workflows/test-backend.yml
    permissions:
      contents: read
    secrets: inherit
  test_validation:
    if: contains(fromJSON(inputs.suites), 'test_validation')
    uses: ./.github/workflows/test-validation.yml
    permissions:
      contents: read
    secrets: inherit
  test_workspace:
    if: contains(fromJSON(inputs.suites), 'test_workspace')
    uses: ./.github/workflows/test-workspace.yml
    permissions:
      contents: read
    secrets: inherit
  test_keepalive:
    if: contains(fromJSON(inputs.suites), 'test_keepalive')
    uses: ./.github/workflows/test-keepalive-probe.yml
    permissions:
      contents: read
    secrets: inherit
  test_wasm:
    if: contains(fromJSON(inputs.suites), 'test_wasm')
    uses: ./.github/workflows/test-wasm.yml
    permissions:
      contents: read
    secrets: inherit
  test_xdbg:
    if: contains(fromJSON(inputs.suites), 'test_xdbg')
    uses: ./.github/workflows/test-xdbg.yml
    permissions:
      contents: read
    secrets: inherit
  docs_rust:
    if: contains(fromJSON(inputs.suites), 'docs_rust')
    uses: ./.github/workflows/docs-rust-reference.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  check_types:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'check_types') && needs.products_sdk_js.result != 'failure' }}
    needs:
    - products_sdk_js
    uses: ./.github/workflows/check-types.yml
    permissions:
      contents: read
  check_sdk:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'check_sdk') && needs.products_sdk_js.result != 'failure' }}
    needs:
    - products_sdk_js
    uses: ./.github/workflows/check-sdk-products.yml
    permissions:
      contents: read
  test_node:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'test_node') && needs.products_sdk_js.result != 'failure' }}
    needs:
    - products_sdk_js
    uses: ./.github/workflows/test-node-sdk.yml
    permissions:
      contents: read
    secrets: inherit
  test_agent:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'test_agent') && needs.products_sdk_js.result != 'failure' }}
    needs:
    - products_sdk_js
    uses: ./.github/workflows/test-agent-sdk.yml
    permissions:
      contents: read
    secrets: inherit
  test_browser:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'test_browser') && needs.products_sdk_js.result != 'failure' }}
    needs:
    - products_sdk_js
    uses: ./.github/workflows/test-browser-sdk.yml
    permissions:
      contents: read
    secrets: inherit
  test_sdk_platform:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'test_sdk_platform') && needs.products_sdk_js.result != 'failure' }}
    needs:
    - products_sdk_js
    uses: ./.github/workflows/test-sdk-platform.yml
    permissions:
      contents: read
    secrets: inherit
  docs_site:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'docs_site') && needs.products_sdk_js.result != 'failure' }}
    needs:
    - products_sdk_js
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  test_ios:
    if: contains(fromJSON(inputs.suites), 'test_ios')
    uses: ./.github/workflows/test-ios.yml
    permissions:
      contents: read
    secrets: inherit
  test_android:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'test_android') && needs.products_sdk_android.result != 'failure' }}
    needs:
    - products_sdk_android
    uses: ./.github/workflows/test-android.yml
    permissions:
      contents: read
    secrets: inherit
  test_example_android:
    if: ${{ !cancelled() && contains(fromJSON(inputs.suites), 'test_example_android') && needs.products_sdk_android.result != 'failure' }}
    needs:
    - products_sdk_android
    uses: ./.github/workflows/test-example-android.yml
    permissions:
      contents: read
    secrets: inherit
  required:
    name: Require selected suites
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    needs:
    - products_sdk_js
    - products_sdk_android
    - check_rust
    - check_sdk_unit
    - test_backend
    - test_validation
    - test_workspace
    - test_keepalive
    - test_wasm
    - test_xdbg
    - docs_rust
    - check_types
    - check_sdk
    - test_node
    - test_agent
    - test_browser
    - test_sdk_platform
    - docs_site
    - test_ios
    - test_android
    - test_example_android
    steps:
    - name: Check that every selected suite passed
      env:
        SELECTED: ${{ inputs.suites }}
        PRODUCTS: ${{ inputs.products }}
        WAITS: '{"check_types":["sdk_js"],"check_sdk":["sdk_js"],"test_node":["sdk_js"],"test_agent":["sdk_js"],"test_browser":["sdk_js"],"test_sdk_platform":["sdk_js"],"docs_site":["sdk_js"],"test_android":["sdk_android"],"test_example_android":["sdk_android"]}'
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -enr \
          --argjson selected "$SELECTED" \
          --argjson products "$PRODUCTS" \
          --argjson waits "$WAITS" \
          --argjson results "$RESULTS" \
          '[$products[] | "products_\(.)" | select($results[.].result != "success")] as $broken
          | [$selected[] | select($results[.].result != "success")
              | select(any(($waits[.] // [])[]; "products_\(.)" | IN($broken[])) | not)] as $failed
          | ($broken[] | "\(.): \($results[.].result); the suites that wait for it did not run"),
            ($failed[] | "\(.): \($results[.].result)"),
            ($broken + $failed == [])'
