# Generated by dev/ci-suites from .github/ci-suites.yml. Do not edit.
name: Test suites
on:
  workflow_call:
    inputs:
      suites:
        description: JSON list of the suites to run.
        type: string
        required: true
permissions:
  contents: read
jobs:
  check_rust:
    if: contains(fromJSON(inputs.suites), 'check_rust')
    uses: ./.github/workflows/check-rust.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  check_sdk_unit:
    if: contains(fromJSON(inputs.suites), 'check_sdk_unit')
    uses: ./.github/workflows/check-sdk-unit.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  test_backend:
    if: contains(fromJSON(inputs.suites), 'test_backend')
    uses: ./.github/workflows/test-backend.yml
    permissions:
      contents: read
    secrets: inherit
  test_validation:
    if: contains(fromJSON(inputs.suites), 'test_validation')
    uses: ./.github/workflows/test-validation.yml
    permissions:
      contents: read
    secrets: inherit
  test_workspace:
    if: contains(fromJSON(inputs.suites), 'test_workspace')
    uses: ./.github/workflows/test-workspace.yml
    permissions:
      contents: read
    secrets: inherit
  test_keepalive:
    if: contains(fromJSON(inputs.suites), 'test_keepalive')
    uses: ./.github/workflows/test-keepalive-probe.yml
    permissions:
      contents: read
    secrets: inherit
  test_wasm:
    if: contains(fromJSON(inputs.suites), 'test_wasm')
    uses: ./.github/workflows/test-wasm.yml
    permissions:
      contents: read
    secrets: inherit
  test_xdbg:
    if: contains(fromJSON(inputs.suites), 'test_xdbg')
    uses: ./.github/workflows/test-xdbg.yml
    permissions:
      contents: read
    secrets: inherit
  docs_rust:
    if: contains(fromJSON(inputs.suites), 'docs_rust')
    uses: ./.github/workflows/docs-rust-reference.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  check_types:
    if: contains(fromJSON(inputs.suites), 'check_types')
    uses: ./.github/workflows/check-types.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  check_sdk:
    if: contains(fromJSON(inputs.suites), 'check_sdk')
    uses: ./.github/workflows/check-sdk-products.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  test_node:
    if: contains(fromJSON(inputs.suites), 'test_node')
    uses: ./.github/workflows/test-node-sdk.yml
    permissions:
      contents: read
    secrets: inherit
  test_agent:
    if: contains(fromJSON(inputs.suites), 'test_agent')
    uses: ./.github/workflows/test-agent-sdk.yml
    permissions:
      contents: read
    secrets: inherit
  test_browser:
    if: contains(fromJSON(inputs.suites), 'test_browser')
    uses: ./.github/workflows/test-browser-sdk.yml
    permissions:
      contents: read
    secrets: inherit
  test_sdk_platform:
    if: contains(fromJSON(inputs.suites), 'test_sdk_platform')
    uses: ./.github/workflows/test-sdk-platform.yml
    permissions:
      contents: read
    secrets: inherit
  docs_site:
    if: contains(fromJSON(inputs.suites), 'docs_site')
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
  test_ios:
    if: contains(fromJSON(inputs.suites), 'test_ios')
    uses: ./.github/workflows/test-ios.yml
    permissions:
      contents: read
    secrets: inherit
  test_android:
    if: contains(fromJSON(inputs.suites), 'test_android')
    uses: ./.github/workflows/test-android.yml
    permissions:
      contents: read
    secrets: inherit
  required:
    name: Require selected suites
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    needs:
    - check_rust
    - check_sdk_unit
    - test_backend
    - test_validation
    - test_workspace
    - test_keepalive
    - test_wasm
    - test_xdbg
    - docs_rust
    - check_types
    - check_sdk
    - test_node
    - test_agent
    - test_browser
    - test_sdk_platform
    - docs_site
    - test_ios
    - test_android
    steps:
    - name: Check that every selected suite passed
      env:
        SELECTED: ${{ inputs.suites }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -en \
          --argjson selected "$SELECTED" \
          --argjson results "$RESULTS" \
          '$selected | all(.[]; $results[.].result == "success")'
