name: Test shared MLS validation
on:
  workflow_call:
env:
  NIX_DEVSHELL: rust
jobs:
  test:
    name: Test (shared MLS validation)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Check isolated graphs and run native and wasm tests
        run: nix build --no-link .#validation.x86_64-linux
