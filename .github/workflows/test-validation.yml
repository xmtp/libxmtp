name: Test shared MLS validation
on:
  workflow_call:
jobs:
  test:
    name: Test (shared MLS validation)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          sccache: "false"
      - name: Check isolated graphs and run native and wasm tests
        run: nix build --no-link .#validation.x86_64-linux
