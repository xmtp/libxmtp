name: "Release: Browser SDK"

on:
  workflow_call:
    inputs:
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      build-only:
        description: Retain checked products without publication
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  build:
    name: Build
    needs: [check-push-permissions]
    runs-on: ubuntu-24.04
    env:
      NIX_DEVSHELL: js
      # Ship the release-profile Nix products that CI tested.
      XMTP_SDK_BUILD: nix
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}

      # Mode read: substitute from the trusted cache only, and build on a miss.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize the shared SDK version
        uses: ./.github/actions/release-source

      - name: Set up JavaScript
        uses: ./.github/actions/setup-js
        with:
          cache-mode: read

      - name: dev/nix-shell 'pnpm --filter @xmtp/browser-sdk build'
        run: dev/nix-shell 'pnpm --filter @xmtp/browser-sdk build'

      - name: Require release-profile WASM
        run: |
          for tree in typescript-wasm typescript-pure; do
            profile="$(jq -r '.artifact.profile' "target/sdk-generated/$tree/sdk-contract.json")"
            if [ "$profile" != release ]; then
              echo "::error::$tree was built with the '$profile' profile; the published browser SDK must ship release WASM"
              exit 1
            fi
          done

      - name: Verify the installed browser package
        run: dev/nix-shell 'node crates/xmtp_sdk/dev/package-smoke.mjs browser'

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser_sdk_build
          path: target/sdk-packages/browser
          # The package receipt includes hidden generated files such as .gitkeep.
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish
    needs: [build, check-push-permissions]
    uses: ./.github/workflows/npm-prepare.yml
    with:
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
      package-dir: target/sdk-packages/browser
      sdk: browser-sdk
      version: ${{ inputs.version }}
      artifact-pattern: browser_sdk_build
      artifact-path: target/sdk-packages/browser
      ignore-scripts: true
      dry-run: ${{ inputs.dry-run }}
      prepare-only: ${{ inputs.build-only }}
    secrets: inherit
