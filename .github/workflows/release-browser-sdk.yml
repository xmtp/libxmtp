name: Release Browser SDK

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
        description: "dev, rc, or final"
      rc-number:
        required: false
        type: string
        description: "RC number (required for rc releases)"
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: false
        type: string
      ref:
        required: true
        type: string
        description: "Git ref to build from"
      timestamp:
        required: false
        type: string
        description: "Shared UTC YYYYMMDDHHMMSS stamp minted once per Release run"
      pending-version:
        required: false
        type: string
      pending-kind:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check-push-permissions:
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha || inputs.ref }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  setup:
    needs: [check-push-permissions]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - uses: ./.github/actions/setup-release-tools

      - name: Require the run-wide timestamp
        if: inputs.release-type == 'dev' || inputs.release-type == 'nightly'
        env:
          TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          if [ -z "$TIMESTAMP" ]; then
            echo "::error::${{ inputs.release-type }} releases require the run-wide timestamp minted by release.yml; refusing to publish browser-sdk without the shared release stamp"
            exit 1
          fi

      - name: Compute version
        id: version
        env:
          REF: ${{ inputs.ref }}
          TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          if [ "${{ inputs.release-type }}" = "rc" ]; then
            VERSION=$(xmtp-release compute-version --sdk browser-sdk --release-type rc --rc-number ${{ inputs.rc-number }})
          elif [ "${{ inputs.release-type }}" = "dev" ]; then
            VERSION=$(xmtp-release compute-version --sdk browser-sdk --release-type dev --source-ref "$REF" --timestamp "$TIMESTAMP")
          elif [ "${{ inputs.release-type }}" = "nightly" ]; then
            if [ -z "${{ inputs.pending-version }}" ] || [ -z "${{ inputs.pending-kind }}" ]; then
              echo "::error::nightly resolve called with empty pending version/kind"
              exit 1
            fi
            VERSION=$(xmtp-release resolve-sdk-version \
              --sdk browser-sdk --release-type nightly \
              --timestamp "$TIMESTAMP" \
              --pending-version "${{ inputs.pending-version }}" \
              --pending-kind "${{ inputs.pending-kind }}")
          else
            VERSION=$(xmtp-release compute-version --sdk browser-sdk --release-type final)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

  build:
    needs: [setup, check-push-permissions]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      NIX_DEVSHELL: js
      # Ship the release-profile Nix products that CI tested.
      XMTP_SDK_BUILD: nix
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}

      # Mode read: substitute from the trusted cache only, and build on a miss.
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-js

      - name: Install + build browser-sdk
        run: |
          dev/nix-shell 'pnpm --filter @xmtp/browser-sdk build'

      - name: Require release-profile WASM
        run: |
          for tree in typescript-wasm typescript-pure; do
            profile="$(jq -r '.artifact.profile' "target/sdk-generated/$tree/sdk-contract.json")"
            if [ "$profile" != release ]; then
              echo "::error::$tree was built with the '$profile' profile; the published browser SDK must ship release WASM"
              exit 1
            fi
          done

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser_sdk_build
          path: target/sdk-packages/browser
          # The package receipt includes hidden generated files such as .gitkeep.
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: [setup, build, check-push-permissions]
    uses: ./.github/workflows/npm-publish.yml
    with:
      ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      package-dir: target/sdk-packages/browser
      sdk: browser-sdk
      version: ${{ needs.setup.outputs.version }}
      artifact-pattern: browser_sdk_build
      artifact-path: target/sdk-packages/browser
      ignore-scripts: true
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
