name: Lint JS
'on':
  workflow_call: null
env:
  NIX_DEVSHELL: js-node
jobs:
  lint:
    name: Lint (JS SDKs)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: "ci"
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just
    - uses: ./.github/actions/setup-js
      with:
        cache-mode: "ci"
    - name: Oxlint JavaScript workspace
      run: just lint-js-source
    - name: Check JavaScript formatting
      run: just lint-js-format
