name: Lint JS
on:
  workflow_call:
env:
  NIX_DEVSHELL: js
jobs:
  lint:
    name: Lint (JS SDKs)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: just js install-ci
      - name: Build Node bindings (typecheck needs the .d.ts)
        run: just js bindings-node
      - name: Typecheck
        run: just js check-node
      - name: ESLint
        run: just js lint-node
      - name: Build Node and agent SDKs
        run: just js build-node
