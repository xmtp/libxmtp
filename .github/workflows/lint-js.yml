name: Lint JS
on:
  workflow_call:
env:
  NIX_DEVSHELL: js
jobs:
  lint:
    name: Lint (JS SDKs)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Stage native bindings
        run: just js bindings
      - name: Typecheck JavaScript workspace
        run: dev/nix-shell 'pnpm typecheck'
      - name: Oxlint JavaScript workspace
        run: dev/nix-shell 'pnpm lint'
      - name: Check JavaScript formatting
        run: just lint-js-format
