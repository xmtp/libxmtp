name: Lint iOS
on:
  workflow_call:
env:
  NIX_DEVSHELL: ios
jobs:
  lint:
    name: Lint (iOS)
    runs-on: warp-macos-15-arm64-6x
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - name: Lint iOS SDK
        run: dev/nix-shell 'just ios lint'
