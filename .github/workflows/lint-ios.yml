name: Lint iOS
on:
  workflow_call:
env:
  NIX_DEVSHELL: ios
jobs:
  lint:
    name: Lint (iOS)
    runs-on: warp-macos-15-arm64-6x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just
      - name: Lint iOS SDK
        run: dev/nix-shell 'just ios lint'
