name: "Publish: npm package"

on:
  workflow_call:
    inputs:
      source-sha:
        description: "Source commit to check out, package, and tag. The caller's release preflight (check-release-push.yml) pinned and checked it."
        required: true
        type: string
      package-dir:
        description: "Path to the npm package directory"
        required: true
        type: string
      package-tarball:
        description: "Checked React Native tarball; publish these exact bytes without stamping or repacking"
        required: false
        type: string
        default: ""
      sdk:
        description: "SDK name for release tools (e.g. node-sdk, browser-sdk)"
        required: true
        type: string
      version:
        description: "The version to publish"
        required: true
        type: string
      artifact-pattern:
        description: "Pattern for downloading build artifacts (optional)"
        required: false
        type: string
      artifact-path:
        description: "Path to download artifacts to (required if artifact-pattern is set)"
        required: false
        type: string
      ignore-scripts:
        description: "Skip npm lifecycle scripts during publish (e.g. prepublishOnly)"
        required: false
        type: boolean
        default: false
      dep-name:
        description: "Dependency name to pin before publish (e.g. @xmtp/node-sdk)"
        required: false
        type: string
        default: ""
      dep-version:
        description: "Exact version to pin the dependency to (e.g. 8.0.0-rc1)"
        required: false
        type: string
        default: ""
      dep-name-2:
        description: "Second dependency name to pin before publish"
        required: false
        type: string
        default: ""
      dep-version-2:
        description: "Exact version for the second dependency"
        required: false
        type: string
        default: ""
      dry-run:
        description: "When true, run all steps EXCEPT the npm publish and tag (no side effects)"
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version"
        value: ${{ jobs.publish.outputs.version }}

# Every caller runs check-release-push.yml for this source commit before it
# builds, and passes the commit it pinned. The publish job authorizes itself
# too, so a workflow on another branch cannot call this one to publish: a real
# publish runs in the `release` environment, whose deployment policy admits
# only protected release refs, and publishes only a source commit on main or
# a release/** branch. A dry run publishes nothing and may build any branch.
jobs:
  publish:
    name: Publish to npm
    permissions:
      id-token: write
      contents: read
    # The job reads no App secret; it uses the environment for its branch
    # policy. npm trusted publishing can also require this environment.
    environment: ${{ inputs.dry-run != true && 'release' || '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          # Full history for the release tag, without blobs; git-cliff, which
          # fails on a blobless clone, does not run here.
          filter: blob:none

      # The same check as check-release-push.yml (test_release_push.py runs it).
      - name: Check that the source is on a release branch
        if: ${{ inputs.dry-run != true }}
        run: |
          set -euo pipefail
          # Commits only: the check needs history, not trees or blobs.
          git fetch --quiet --no-tags --filter=tree:0 origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          branches=$(git for-each-ref --contains HEAD --format='%(refname:lstrip=3)' \
            refs/remotes/origin/main 'refs/remotes/origin/release/')
          if [[ -z "$branches" ]]; then
            echo "::error title=Release source::$(git rev-parse HEAD) is not on main or a release/** branch"
            exit 1
          fi
          echo "Release source is on: $(tr '\n' ' ' <<< "$branches")"

      - name: Download build artifacts
        if: ${{ inputs.artifact-pattern != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: true
          path: ${{ inputs.artifact-path }}

      - name: Set up release tools
        uses: ./.github/actions/setup-release-tools

      - name: Set version
        run: xmtp-release set-manifest-version --sdk "${{ inputs.sdk }}" --version "${{ inputs.version }}"

      - name: Pin binding dependency version
        if: ${{ inputs.dep-name != '' }}
        run: xmtp-release set-dependency-version --sdk "${{ inputs.sdk }}" --dep "${{ inputs.dep-name }}" --version "${{ inputs.dep-version }}"

      - name: Pin second dependency version
        if: ${{ inputs.dep-name-2 != '' }}
        run: xmtp-release set-dependency-version --sdk "${{ inputs.sdk }}" --dep "${{ inputs.dep-name-2 }}" --version "${{ inputs.dep-version-2 }}"

      - name: Set the packed product version
        if: inputs.package-tarball == ''
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-dir }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: xmtp-release stamp-package --dir "$PACKAGE_DIRECTORY" --version "$PACKAGE_VERSION"

      - name: Determine NPM tag
        id: npm-tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == *dev* || "$VERSION" == *rc* ]]; then
            echo "tag=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # OIDC trusted publishing needs npm >= 11.5.1. Keep the tested major
      # stable instead of taking a new npm major from the runner image.
      - name: Update npm
        run: npm install -g npm@11

      - name: Set up Nix
        if: inputs.package-tarball != ''
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "read"
          github-token: ${{ github.token }}

      - name: Verify the checked React Native tarball
        if: inputs.package-tarball != ''
        env:
          PACKAGE_TARBALL_INPUT: ${{ inputs.package-tarball }}
          PACKAGE_VERSION: ${{ inputs.version }}
          SDK: ${{ inputs.sdk }}
        run: |
          set -euo pipefail
          if [ "$SDK" != react-native-sdk ]; then
            echo "::error::Prepacked publication is supported only for the checked React Native product"
            exit 1
          fi
          source=$(nix eval --raw .#sdkProvenance.source)
          python3 sdks/react-native/scripts/package.py verify-package "$PACKAGE_TARBALL_INPUT" --version "$PACKAGE_VERSION" --source "$source"
          echo "PACKAGE_TARBALL=$(realpath "$PACKAGE_TARBALL_INPUT")" >> "$GITHUB_ENV"

      - name: Pack package
        if: inputs.package-tarball == ''
        env:
          IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        run: |
          pack_dir="$RUNNER_TEMP/npm-pack"
          mkdir -p "$pack_dir"
          pnpm --dir "${{ inputs.package-dir }}" pack \
            --config.node-linker=hoisted \
            --config.ignore-scripts="$IGNORE_SCRIPTS" \
            --pack-destination "$pack_dir"
          shopt -s nullglob
          tarballs=("$pack_dir"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one package tarball, found ${#tarballs[@]}"
            exit 1
          fi
          echo "PACKAGE_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"

      - name: Prepare release tag
        if: ${{ inputs.dry-run != true }}
        env:
          SDK: ${{ inputs.sdk }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "::error::Release HEAD does not match the selected source commit"
            exit 1
          fi
          xmtp-release tag-release --sdk "$SDK" --version "$VERSION" --no-push --ignore-if-exists
          tag_ref="refs/tags/${SDK}-${VERSION}"
          tag_sha=$(git rev-parse "$tag_ref^{commit}")
          if [ "$tag_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Release tag does not match the selected source commit"
            exit 1
          fi
          git bundle create "$RUNNER_TEMP/release.bundle" "$tag_ref"
      - name: Store release tag
        if: ${{ inputs.dry-run != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tag-${{ inputs.sdk }}
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Publish to NPM
        if: ${{ inputs.dry-run != true }}
        run: npm publish "$PACKAGE_TARBALL" --provenance ${{ inputs.ignore-scripts && '--ignore-scripts' || '' }} --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Preview NPM package
        if: ${{ inputs.dry-run == true }}
        run: npm publish "$PACKAGE_TARBALL" --dry-run ${{ inputs.ignore-scripts && '--ignore-scripts' || '' }} --tag ${{ steps.npm-tag.outputs.tag }}

  push-tag:
    name: Tag
    needs: [publish]
    if: ${{ inputs.dry-run != true }}
    uses: ./.github/workflows/push-release-tag.yml
    with:
      sdk: ${{ inputs.sdk }}
      version: ${{ inputs.version }}
      source-sha: ${{ inputs.source-sha }}
    secrets: inherit
