name: Deploy persistent backend

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fly-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: backend-dev
      url: https://backend-dev.xmtp.to
    steps:
      - uses: actions/checkout@v6
      - name: Check for a newer commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/self-hosted" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip superseded commit $GITHUB_SHA"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.current.outputs.deploy == 'true'
      - name: Require the deployment API key
        if: steps.current.outputs.deploy == 'true'
        env:
          XMTP_BACKEND_DEV_API_KEY: ${{ secrets.XMTP_BACKEND_DEV_API_KEY }}
        run: |
          if [[ ! "$XMTP_BACKEND_DEV_API_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set XMTP_BACKEND_DEV_API_KEY using xdbg generate-api-key."
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: "22"
      - name: Deploy private observability services
        if: steps.current.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          node --test dev/fly/render-dashboard.test.mjs
          bash dev/fly/deploy-observability
      - name: Deploy backend commit
        if: steps.current.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          XMTP_BACKEND_DEV_API_KEY: ${{ secrets.XMTP_BACKEND_DEV_API_KEY }}
        run: bash dev/fly/deploy-backend "ghcr.io/xmtp/backend:sha-$GITHUB_SHA"
      - name: Check deployed services
        if: steps.current.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl checks list --app xmtp-backend-dev
          flyctl ssh console --app xmtp-backend-dev --command '/bin/grpc-health-probe -addr=127.0.0.1:5050'
