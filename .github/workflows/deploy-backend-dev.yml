name: "Deploy: backend-dev (Fly)"

on:
  workflow_call:

permissions:
  contents: read

env:
  BACKEND_HOST: backend-dev.xmtp.to

concurrency:
  group: fly-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend and observability
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: backend-dev
      url: https://${{ env.BACKEND_HOST }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for a newer commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip superseded commit $GITHUB_SHA"
          fi
      - name: Install flyctl
        if: steps.current.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.104"
      - name: Install Node.js from .node-version
        if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Deploy private observability services
        if: steps.current.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          node --test dev/fly/render-dashboard.test.mjs
          dev/fly/deploy-observability
      - name: Deploy backend commit
        if: steps.current.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: dev/fly/deploy-backend "ghcr.io/xmtp/backend:sha-$GITHUB_SHA"
      - name: Check deployed services
        if: steps.current.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl checks list --app xmtp-backend-dev
          # Probe the client-facing TLS endpoint without Fly SSH permissions.
          for attempt in $(seq 1 6); do
            if docker run --rm \
              ghcr.io/grpc-ecosystem/grpc-health-probe:v0.4.57@sha256:f77f1257805ecb57f1f0c36c5825d3c2e47aa81cce87128675e768463ed6487a \
              -addr="$BACKEND_HOST:443" -tls -connect-timeout=10s -rpc-timeout=10s; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public backend gRPC health check failed."
          exit 1
