name: Push keepalive-probe Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      accepted-source:
        description: Full primary-branch SHA accepted for deployment
        required: true
        type: string

concurrency:
  group: keepalive-publication
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: xmtp/keepalive-probe

jobs:
  cutover-policy:
    uses: ./.github/workflows/check-cutover-policy.yml
    with:
      operation: deployment
      accepted-source: ${{ inputs.accepted-source || '' }}
      primary-branch: main

  build:
    needs: cutover-policy
    if: needs.cutover-policy.outputs.allowed == 'true' && needs.cutover-policy.outputs.deploy == 'true'
    name: Build and push keepalive-probe image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Capture commit metadata
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/keepalive-probe/docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check current source before publication
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SOURCE: ${{ inputs.accepted-source || '' }}
        run: bash dev/cutover-source main
      - name: Publish current image tags
        if: steps.current.outputs.deploy == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done <<< "$IMAGE_TAGS"
