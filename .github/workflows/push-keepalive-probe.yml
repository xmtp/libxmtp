name: "Publish: keepalive probe image"

on:
  push:
    branches:
      - main
    # Every input of the image build: this workflow, the crates of
    # keepalive-probe's Cargo closure (normal and build dependencies), the
    # protos that xmtp_proto's build script compiles, the workspace build
    # settings, and the .dockerignore that filters the build context.
    # dev/tests/test_release_push.py checks the list.
    paths:
      - '.github/workflows/push-keepalive-probe.yml'
      - 'apps/keepalive-probe/**'
      - 'crates/xmtp_common/**'
      - 'crates/xmtp_configuration/**'
      - 'crates/xmtp_cryptography/**'
      - 'crates/xmtp_events/**'
      - 'crates/xmtp_logging/**'
      - 'crates/xmtp_macro/**'
      - 'crates/xmtp_proto/**'
      - 'proto/**'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'
  workflow_dispatch:

# One run per ref at a time, so an older run cannot tag `latest` after a newer
# one. A running build is never cancelled. GitHub keeps one pending run per
# group and a newer one replaces it, so `latest` ends at the newest commit; a
# replaced commit gets no sha tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: xmtp/keepalive-probe

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Capture commit metadata
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # No GitHub Actions layer cache: the builder copies the whole tree
      # before `cargo build`, so every run that this workflow's paths trigger
      # misses the build layer, and exporting it only evicts other caches.
      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./apps/keepalive-probe/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
