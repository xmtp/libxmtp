name: Test execution
'on':
  workflow_call:
    inputs:
      suites:
        type: string
        default: '["test_native_backend","test_validation","test_backend","test_workspace","test_keepalive","test_wasm","test_node","test_agent","test_xdbg","test_browser","test_bindings","test_sdk_staging","test_bridge_runtime","test_browser_platform"]'
      run-bindings-ios:
        type: boolean
        default: true
      run-bindings-android:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: true
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    uses: ./.github/workflows/test-target.yml
    with:
      suite: ${{ matrix.suite }}
      run-bindings-ios: ${{ inputs.run-bindings-ios }}
      run-bindings-android: ${{ inputs.run-bindings-android }}
    secrets: inherit
  results:
    name: Test execution results
    if: always()
    needs: suites
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - env:
        PASSED: ${{ needs.suites.result == 'success' }}
      run: test "$PASSED" = true
