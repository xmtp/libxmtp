name: Test Android example
'on':
  workflow_call:
    inputs:
      emulator:
        description: >-
          false runs the APK, JVM test, lint, and build job; true runs the
          emulator tests. Two suites call this file, one per job, so the
          emulator tests can run as advisory on pull requests (decision D1).
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  # Job ids stay unique across test-android.yml and this file (setup-gradle
  # keys its entries by job id and the calling workflow).
  messenger-build:
    name: APK, unit tests, lint, and builds (Messenger)
    if: ${{ !inputs.emulator }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      # The slim CI shell: no Rust toolchain, no emulator.
      NIX_DEVSHELL: android-ci
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: "ci"
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # CI-only Gradle cache: protected trunk pushes write it, and every
        # other run only reads it. Release and deploy jobs never restore it.
        cache-read-only: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && github.ref == 'refs/heads/main') }}
    # The APK derivation uses its own pinned Gradle downloads, not the
    # restored Gradle User Home, and needs no backend.
    - name: Build and verify the signed universal APK
      run: nix build .#example-android-apk --no-link
    # One Gradle call: unit tests, Spotless, Android Lint, and every variant
    # build, then the APK package checks. No JVM test creates a client, so
    # the job starts no backend.
    - name: Test, lint, and build Messenger
      run: dev/nix-shell 'just example-android check-all'
  integration-tests:
    name: Integration tests (Messenger)
    if: ${{ inputs.emulator }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: "ci"
        cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        github-token: ${{ github.token }}
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # CI-only Gradle cache: protected trunk pushes write it, and every
        # other run only reads it. Release and deploy jobs never restore it.
        cache-read-only: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && github.ref == 'refs/heads/main') }}
    - name: Start backend
      env:
        NIX_DEVSHELL: android-ci-emulator
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Run Messenger integration tests
      timeout-minutes: 30
      env:
        NIX_DEVSHELL: android-ci-emulator
        XMTP_METADATA_LOG_DIR: ${{ runner.temp }}/messenger-metadata-backend
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/messenger-emulator-startup
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096 -partition-size 8192
      run: dev/nix-shell 'just example-android test-integration'
    - name: Upload failed Messenger test reports
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: messenger-integration-failures
        retention-days: 7
        if-no-files-found: ignore
        path: |
          apps/example-android/app/build/outputs/androidTest-results/connected/**/*.xml
          apps/example-android/app/build/outputs/androidTest-results/connected/**/*.txt
          apps/example-android/app/build/reports/androidTests/**
          apps/example-android/app/build/screenshots/**
          ${{ runner.temp }}/messenger-metadata-backend/
          ${{ runner.temp }}/messenger-emulator-startup/
        include-hidden-files: 'true'
