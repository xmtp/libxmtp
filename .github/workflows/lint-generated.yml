# Generated by dev/ci-suites from .github/ci-suites.yml. Do not edit.
name: Lint suites
on:
  workflow_call:
    inputs:
      suites:
        description: JSON list of the suites to run.
        type: string
        required: true
permissions:
  contents: read
jobs:
  lint_workspace:
    if: contains(fromJSON(inputs.suites), 'lint_workspace')
    uses: ./.github/workflows/lint-workspace.yml
    permissions:
      contents: read
    secrets: inherit
  lint_js:
    if: contains(fromJSON(inputs.suites), 'lint_js')
    uses: ./.github/workflows/lint-js.yml
    permissions:
      contents: read
    secrets: inherit
  lint_config:
    if: contains(fromJSON(inputs.suites), 'lint_config')
    uses: ./.github/workflows/lint-config.yml
    permissions:
      contents: read
    secrets: inherit
  lint_proto:
    if: contains(fromJSON(inputs.suites), 'lint_proto')
    uses: ./.github/workflows/lint-proto.yml
    permissions:
      contents: read
    secrets: inherit
  docs_quality:
    if: contains(fromJSON(inputs.suites), 'docs_quality')
    uses: ./.github/workflows/docs-quality.yml
    permissions:
      contents: read
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  lint_ios:
    if: contains(fromJSON(inputs.suites), 'lint_ios')
    uses: ./.github/workflows/lint-ios.yml
    permissions:
      contents: read
    secrets: inherit
  lint_android:
    if: contains(fromJSON(inputs.suites), 'lint_android')
    uses: ./.github/workflows/lint-android.yml
    permissions:
      contents: read
    secrets: inherit
  required:
    name: Require selected suites
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    needs:
    - lint_workspace
    - lint_js
    - lint_config
    - lint_proto
    - docs_quality
    - lint_ios
    - lint_android
    steps:
    - name: Check that every selected suite passed
      env:
        SELECTED: ${{ inputs.suites }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        jq -en \
          --argjson selected "$SELECTED" \
          --argjson results "$RESULTS" \
          '$selected | all(.[]; $results[.].result == "success")'
