name: Push release tag

on:
  workflow_call:
    inputs:
      sdk:
        required: true
        type: string
      version:
        required: true
        type: string
      source-sha:
        required: true
        type: string

permissions: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Download release tag
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-tag-${{ inputs.sdk }}
          path: ${{ runner.temp }}/release-tag
      - name: Import release tag
        env:
          SDK: ${{ inputs.sdk }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          case "$SDK" in ios|android) ;; *) exit 1 ;; esac
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source commit must be a full SHA"
            exit 1
          fi
          TAG_REF="refs/tags/${SDK}-${VERSION}"
          git check-ref-format "$TAG_REF"
          git init --bare "$RUNNER_TEMP/release-push.git"
          git --git-dir="$RUNNER_TEMP/release-push.git" fetch --no-tags \
            "$RUNNER_TEMP/release-tag/release.bundle" "$TAG_REF:$TAG_REF"
          TAG_SHA=$(git --git-dir="$RUNNER_TEMP/release-push.git" rev-parse "$TAG_REF^{commit}")
          if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
            if [ "$SDK" != ios ]; then
              echo "::error::Android tag does not match the workflow source commit"
              exit 1
            fi
            PARENTS=$(git --git-dir="$RUNNER_TEMP/release-push.git" rev-list --parents -n 1 "$TAG_SHA")
            if [ "$PARENTS" != "$TAG_SHA $SOURCE_SHA" ]; then
              echo "::error::iOS tag must use the source commit or one direct release commit"
              exit 1
            fi
            git --git-dir="$RUNNER_TEMP/release-push.git" diff \
              --no-ext-diff --no-textconv --name-only -z "$SOURCE_SHA" "$TAG_SHA" \
              > "$RUNNER_TEMP/release-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                Package.swift|sdks/ios/XMTP.podspec|sdks/ios/ReleaseArtifacts.json|sdks/ios/Sources/XmtpSdk/*) ;;
                *) echo "::error::iOS release commit changes a file outside the release paths"; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/release-paths"
          fi
      - name: Create release push token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PK }}
          permission-contents: write
          permission-workflows: write
      - name: Push release tag
        env:
          SDK: ${{ inputs.sdk }}
          VERSION: ${{ inputs.version }}
          RELEASE_TOKEN: ${{ steps.token.outputs.token }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH_HEADER"
          TAG_REF="refs/tags/${SDK}-${VERSION}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="$AUTH_HEADER" \
            git --git-dir="$RUNNER_TEMP/release-push.git" \
              -c core.hooksPath=/dev/null -c credential.helper= \
              push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$TAG_REF:$TAG_REF"
