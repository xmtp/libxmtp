name: Push release tag

on:
  workflow_call:
    inputs:
      sdk:
        required: true
        type: string
      version:
        required: true
        type: string
      source-sha:
        required: true
        type: string

permissions: {}

jobs:
  push:
    runs-on: ubuntu-latest
    # GH_APP_ID and GH_APP_PK belong in this environment, whose deployment
    # policy admits only protected branches; a same-repository pull request
    # run then cannot read them.
    environment: release
    steps:
      - name: Download release tag
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-tag-${{ inputs.sdk }}
          path: ${{ runner.temp }}/release-tag
      - name: Import release tag
        env:
          SDK: ${{ inputs.sdk }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          # The libxmtp hub tag (release.yml) is v<version>.
          case "$SDK" in
            libxmtp) TAG_REF="refs/tags/v${VERSION}" ;;
            ios|android|node-sdk|browser-sdk|agent-sdk|react-native-sdk|cli) TAG_REF="refs/tags/${SDK}-${VERSION}" ;;
            *) exit 1 ;;
          esac
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected source commit must be a full SHA"
            exit 1
          fi
          git check-ref-format "$TAG_REF"
          git init --bare "$RUNNER_TEMP/release-push.git"
          git --git-dir="$RUNNER_TEMP/release-push.git" fetch --no-tags \
            "$RUNNER_TEMP/release-tag/release.bundle" "$TAG_REF:$TAG_REF"
          TAG_SHA=$(git --git-dir="$RUNNER_TEMP/release-push.git" rev-parse "$TAG_REF^{commit}")
          if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
            if [ "$SDK" != ios ]; then
              echo "::error::$SDK tag does not match the selected source commit"
              exit 1
            fi
            PARENTS=$(git --git-dir="$RUNNER_TEMP/release-push.git" rev-list --parents -n 1 "$TAG_SHA")
            if [ "$PARENTS" != "$TAG_SHA $SOURCE_SHA" ]; then
              echo "::error::iOS tag must use the source commit or one direct release commit"
              exit 1
            fi
            git --git-dir="$RUNNER_TEMP/release-push.git" diff \
              --no-ext-diff --no-textconv --name-only -z "$SOURCE_SHA" "$TAG_SHA" \
              > "$RUNNER_TEMP/release-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                Package.swift|sdks/ios/XMTP.podspec|sdks/ios/ReleaseArtifacts.json|sdks/ios/Sources/XmtpSdk/*) ;;
                *) echo "::error::iOS release commit changes a file outside the release paths"; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/release-paths"
          fi
      # Any workflow in the repository can call this one, so check the calling
      # run before the App token exists: a protected trunk or release branch,
      # never a pull request, and a source commit on one of those branches.
      - name: Check the calling run
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|schedule|workflow_dispatch) ;;
            *) echo "::error title=Release tag::A $EVENT_NAME run cannot push a release tag"; exit 1 ;;
          esac
          case "$CALLER_REF" in
            refs/heads/main|refs/heads/release/*) ;;
            *) echo "::error title=Release tag::$CALLER_REF is not main or a release/* branch"; exit 1 ;;
          esac
          if [ "$REF_PROTECTED" != true ]; then
            echo "::error title=Release tag::$CALLER_REF is not protected"
            exit 1
          fi
          # Commits only, from the public repository, without a token. A
          # release may build another branch than the one it runs on (the
          # `ref` input of release.yml), so any release branch counts.
          git --git-dir="$RUNNER_TEMP/release-push.git" fetch --quiet --no-tags --filter=tree:0 \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          branches=$(git --git-dir="$RUNNER_TEMP/release-push.git" for-each-ref --contains "$SOURCE_SHA" \
            --format='%(refname:lstrip=3)' refs/remotes/origin/)
          if [[ -z "$branches" ]]; then
            echo "::error title=Release tag::$SOURCE_SHA is not on main or a release/* branch"
            exit 1
          fi
          echo "Release source is on: $(tr '\n' ' ' <<< "$branches")"
      - name: Create release push token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PK }}
          permission-contents: write
          permission-workflows: write
      - name: Push release tag
        env:
          SDK: ${{ inputs.sdk }}
          VERSION: ${{ inputs.version }}
          RELEASE_TOKEN: ${{ steps.token.outputs.token }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH_HEADER"
          case "$SDK" in
            libxmtp) TAG_REF="refs/tags/v${VERSION}" ;;
            *) TAG_REF="refs/tags/${SDK}-${VERSION}" ;;
          esac
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="$AUTH_HEADER" \
            git --git-dir="$RUNNER_TEMP/release-push.git" \
              -c core.hooksPath=/dev/null -c credential.helper= \
              push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$TAG_REF:$TAG_REF"
