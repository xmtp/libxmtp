name: CI benchmark graph preparation
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact frozen application source SHA
        type: string
        required: true
      old:
        description: Exact old graph SHA
        type: string
        required: true
      candidate:
        description: Exact candidate graph SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-benchmark-preparation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
      - name: Build exact local graph overlays
        env:
          FROZEN_SOURCE_SHA: ${{ inputs.source }}
          OLD_GRAPH_SHA: ${{ inputs.old }}
          CANDIDATE_GRAPH_SHA: ${{ inputs.candidate }}
          NIX_DEVSHELL: rust
        run: |
          python3 - <<'PY'
          import os
          import re
          for name in ("FROZEN_SOURCE_SHA", "OLD_GRAPH_SHA", "CANDIDATE_GRAPH_SHA"):
              if not re.fullmatch(r"[0-9a-f]{40}", os.environ[name]):
                  raise SystemExit(f"Invalid full SHA: {name}")
          PY
          dev/nix-shell "python3.11 -B dev/ci/benchmark-overlay.py materialize --source '$FROZEN_SOURCE_SHA' --old '$OLD_GRAPH_SHA' --candidate '$CANDIDATE_GRAPH_SHA' --output '$RUNNER_TEMP/ci-benchmark-replay'"
      - name: Retain graph branches and source proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-replay
          path: |
            ${{ runner.temp }}/ci-benchmark-replay/replay.bundle
            ${{ runner.temp }}/ci-benchmark-replay/old.json
            ${{ runner.temp }}/ci-benchmark-replay/candidate.json
            ${{ runner.temp }}/ci-benchmark-replay/pair.json
          if-no-files-found: error
          retention-days: 30
