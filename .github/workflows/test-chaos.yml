name: "Test: Rust chaos"
on:
  workflow_call:
    inputs:
      runner:
        description: The GitHub-hosted runner label from .github/ci-suites.yml.
        type: string
        required: true
    secrets:
      CACHIX_PR_AUTH_TOKEN:
        required: false
permissions:
  contents: read
env:
  NIX_DEVSHELL: rust
jobs:
  test:
    name: Five-minute fault run
    runs-on: ${{ inputs.runner }}
    # Includes the source builds and baseline before the five-minute fault run.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Build the chaos supervisor
        run: dev/nix-shell 'just chaos build'
      - name: Start the local backend and fault proxy
        run: dev/nix-shell 'just backend up anvil toxiproxy'
      - name: Test the chaos suite
        run: dev/nix-shell 'just chaos test'
      - name: Run the 50-round baseline
        id: baseline
        run: dev/nix-shell 'just chaos baseline --rounds 50 --seed 1338 --directory .chaos/ci-baseline'
      - name: Run five minutes with all fault types enabled
        # Timed runs finish their current round before checking the deadline.
        run: dev/nix-shell 'just chaos run --hours 0.08333333333333333 --seed 1340 --faults all --directory .chaos/ci-faults'
      - name: Report bounded run evidence
        if: ${{ always() && steps.baseline.outcome != 'skipped' }}
        run: |
          for phase in baseline faults; do
            directory=".chaos/ci-$phase"
            if [ -d "$directory" ]; then
              dev/nix-shell "just chaos status --directory $directory"
              dev/nix-shell "just chaos inspect $directory"
            fi
          done | tee "$RUNNER_TEMP/chaos-report.txt"
      # Raw .chaos files contain wallets and database keys. Upload only the
      # bounded status/inspect output, including on a failed or inconclusive run.
      - name: Retain the bounded chaos report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chaos-report
          path: ${{ runner.temp }}/chaos-report.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain backend startup diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chaos-backend-startup-logs
          path: ${{ runner.temp }}/backend-startup-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the local backend
        if: always()
        run: dev/nix-shell 'just backend down'
