name: Build and Deploy Docs
'on':
  workflow_call:
    inputs:
      deploy:
        description: Build the Swift and Kotlin references and upload the Pages artifact. Only post-merge.yml sets it; its deploy job publishes the artifact.
        type: boolean
        default: false
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: Optional compiler cache reader access key ID
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: Optional compiler cache reader secret access key
        required: false
  workflow_dispatch: null
permissions:
  contents: read
# No workflow-level concurrency. A called workflow sees the caller's
# github.ref, so a group on it would let a manual dispatch on trunk cancel the
# docs jobs of a running merge run. ci.yml already replaces older pull
# request runs. The Pages deploy is a post-merge.yml job: a called job that asks for
# pages: write needs that grant from every caller, even when it is skipped, and
# the merge run grants no Pages permissions.
#
# Cache modes: inside post-merge.yml (deploy) every job is in mode read, so Pages
# content comes only from the trusted cache. In CI runs the jobs are in mode
# ci, except `rust`: it gets no mode outside a deploy, so
# docs-rust-reference.yml picks trusted on a protected trunk push (the CI merge
# run) and writes its `rust-reference` Kache scope there, and ci otherwise. No
# other docs job writes a trusted store or selects the writer environment.
jobs:
  rust:
    uses: ./.github/workflows/docs-rust-reference.yml
    with:
      cache-mode: ${{ inputs.deploy && 'read' || '' }}
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  swift:
    name: Swift reference
    if: inputs.deploy
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    # The iOS outputs are keyed to one Xcode (`xcode` in nix/lib/ios-env.nix),
    # and sdks/ios/dev/bindings fails in CI with another. The image default is
    # older.
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: '26.3'
    - name: Show the Xcode version
      run: xcodebuild -version
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@just
    - run: just ios docs apps/docs/generated/reference/swift
    - name: Archive Swift reference
      env:
        COPYFILE_DISABLE: '1'
      run: tar -cf "${RUNNER_TEMP}/docs-swift.tar" -C apps/docs/generated/reference/swift .
    - uses: actions/upload-artifact@v7
      with:
        name: docs-swift
        path: ${{ runner.temp }}/docs-swift.tar
        if-no-files-found: error
    env:
      NIX_DEVSHELL: ios
  kotlin:
    name: Kotlin reference
    if: inputs.deploy
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@just
    - run: just android docs-generated
    - uses: actions/upload-artifact@v7
      with:
        name: docs-kotlin
        path: sdks/android/library/build/dokka/html
        if-no-files-found: error
    env:
      NIX_DEVSHELL: android
  site:
    name: Site and JavaScript references
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        filter: blob:none
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
        github-token: ${{ github.token }}
        kache: "true"
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: sdk-products-debug
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
    - run: just docs check-agent-docs
    - run: just docs build
    - uses: actions/upload-artifact@v7
      with:
        name: docs-site
        path: apps/docs/dist
        if-no-files-found: error
    env:
      NIX_DEVSHELL: js
  compose:
    name: Validate the composed site
    needs:
    - rust
    - swift
    - kotlin
    - site
    if: '!cancelled() && needs.rust.result == ''success'' && needs.site.result == ''success'' && needs.swift.result != ''failure'' &&
      needs.kotlin.result != ''failure'''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NIX_DEVSHELL: docs
      DOCS_SKIP_NATIVE_REFERENCES: ${{ !inputs.deploy && '1' || '' }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
    - uses: actions/download-artifact@v8
      with:
        name: docs-site
        path: apps/docs/dist
    - uses: actions/download-artifact@v8
      with:
        name: docs-rust
        path: apps/docs/generated/reference/rust
    - uses: actions/download-artifact@v8
      if: inputs.deploy
      with:
        name: docs-swift
        path: ${{ runner.temp }}/docs-swift
    - name: Extract Swift reference
      if: inputs.deploy
      run: 'mkdir -p apps/docs/generated/reference/swift

        tar -xf "${RUNNER_TEMP}/docs-swift/docs-swift.tar" -C apps/docs/generated/reference/swift

        '
    - uses: actions/download-artifact@v8
      if: inputs.deploy
      with:
        name: docs-kotlin
        path: apps/docs/generated/reference/kotlin
    - name: Compose and check the artifact
      run: dev/nix-shell 'cd apps/docs && node scripts/compose.mjs && node scripts/check-site.mjs --built'
    - name: Browser tests
      run: dev/nix-shell 'cd apps/docs && npm run test:browser'
    - name: Check accessibility against the production baseline
      run: dev/nix-shell 'cd apps/docs && node scripts/check-lighthouse.mjs'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: docs-browser-results
        path: 'apps/docs/test-results

          apps/docs/playwright-report

          '
        if-no-files-found: ignore
    - uses: actions/upload-pages-artifact@v4
      if: inputs.deploy
      with:
        path: apps/docs/_site
  result:
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
    - rust
    - swift
    - kotlin
    - site
    - compose
    steps:
    - name: Check that every docs job passed
      env:
        RESULTS: ${{ toJSON(needs) }}
        NATIVE: ${{ inputs.deploy == true }}
      run: |
        jq -en \
          --argjson results "$RESULTS" \
          --argjson native "$NATIVE" '
          def passed($job): $results[$job].result == "success";
          passed("rust") and passed("site") and passed("compose")
          and (($native | not) or (passed("swift") and passed("kotlin")))'
