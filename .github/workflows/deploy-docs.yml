name: Build and Deploy Docs

on:
  # A pull request builds the site and the Rust reference only, and only when
  # it touches something the site is built from. The native references (Swift,
  # Kotlin) are a from-scratch Rust cross-compile that dominates the run, so
  # they are left to the push builds below. docs-quality.yml lints, formats,
  # and tests the site on every pull request regardless.
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "sdks/js/**"
      - "bindings/node/**"
      - "bindings/wasm/**"
      - "crates/**"
      - "nix/**"
      - "flake.lock"
      - ".github/workflows/deploy-docs.yml"
  push:
    branches: [main, self-hosted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust reference and error glossary
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      NIX_DEVSHELL: rust
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
      - name: Generate the error glossary
        run: dev/nix-shell 'dev/gen-error-glossary'
      - name: Reject a stale committed glossary
        run: git diff --exit-code -- docs/error_glossary.md
      - name: Build rustdoc
        run: dev/nix-shell 'cargo doc --locked --no-deps'
      - uses: actions/upload-artifact@v7
        with:
          name: docs-rust
          path: target/doc
          if-no-files-found: error

  swift:
    name: Swift reference
    # Push builds only: this is a from-scratch Rust cross-compile for two Apple
    # targets and is the whole critical path of the run. DocC itself is a minute.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          nix-disk: "false"
          github-token: ${{ github.token }}
          # macOS has no sticky /nix disk, so Cachix is the only cache this job
          # has. Without the token it substitutes but never pushes, and the
          # dependency closure is rebuilt on every run.
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - run: just ios docs apps/docs/generated/reference/swift
      - name: Archive Swift reference
        # DocC symbol filenames contain colons, which upload-artifact rejects.
        env:
          # Keep macOS metadata files out of the published reference.
          COPYFILE_DISABLE: "1"
        run: tar -cf "${RUNNER_TEMP}/docs-swift.tar" -C apps/docs/generated/reference/swift .
      - uses: actions/upload-artifact@v7
        with:
          name: docs-swift
          path: ${{ runner.temp }}/docs-swift.tar
          if-no-files-found: error

  kotlin:
    name: Kotlin reference
    # Push builds only, like swift: the Rust bindings build dominates it and
    # dokka itself is under a minute.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: android
          gradle-disk: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - run: just android docs
      - uses: actions/upload-artifact@v7
        with:
          name: docs-kotlin
          path: sdks/android/library/build/dokka/html
          if-no-files-found: error

  site:
    name: Site and JavaScript references
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - name: Build the SDKs and both binding packages
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "true"
        run: just js build
      - run: just docs install
      - run: just docs check-agent-docs
      - run: just docs build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error

  compose:
    name: Validate the composed site
    # swift and kotlin are skipped on a pull request, and a skipped need would
    # otherwise skip this job too. Fail only when a need actually failed.
    needs: [rust, swift, kotlin, site]
    if: >-
      !cancelled()
      && needs.rust.result == 'success'
      && needs.site.result == 'success'
      && needs.swift.result != 'failure'
      && needs.kotlin.result != 'failure'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NIX_DEVSHELL: docs
      # Without the native references, check-site.mjs must not demand their
      # entrypoints and compose.mjs must not demand their directories.
      DOCS_SKIP_NATIVE_REFERENCES: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - run: just docs install
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: apps/docs/dist
      - uses: actions/download-artifact@v8
        with:
          name: docs-rust
          path: apps/docs/generated/reference/rust
      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          name: docs-swift
          path: ${{ runner.temp }}/docs-swift
      - name: Extract Swift reference
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p apps/docs/generated/reference/swift
          tar -xf "${RUNNER_TEMP}/docs-swift/docs-swift.tar" -C apps/docs/generated/reference/swift
      - uses: actions/download-artifact@v8
        if: github.event_name != 'pull_request'
        with:
          name: docs-kotlin
          path: apps/docs/generated/reference/kotlin
      - name: Compose and check the artifact
        run: dev/nix-shell 'cd apps/docs && node scripts/compose.mjs && node scripts/check-site.mjs --built'
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Internal links are checked against the built site. Canonical URLs
          # must not depend on the live site's deployment or certificate.
          args: >-
            --no-progress
            --max-retries 2
            --scheme https
            --scheme http
            --root-dir '${{ github.workspace }}/apps/docs/_site'
            --exclude '^https://docs\.xmtp\.org/.*'
            --exclude '^https://self-hosted-docs\.xmtp\.to/.*'
            --exclude '^https://github\.com/xmtp/libxmtp/edit/.*'
            --exclude '^http://collector:4317/?$'
            'apps/docs/_site/*.html'
            'apps/docs/_site/agents/**/*.html'
            'apps/docs/_site/chat-apps/**/*.html'
            'apps/docs/_site/content-types/**/*.html'
            'apps/docs/_site/get-started/**/*.html'
            'apps/docs/_site/privacy/**/*.html'
            'apps/docs/_site/protocol/**/*.html'
            'apps/docs/_site/sdk/**/*.html'
            'apps/docs/_site/specs/**/*.html'
            'apps/docs/_site/terms/**/*.html'
            'apps/docs/_site/tools/**/*.html'
            'apps/docs/_site/reference/browser-sdk/**/*.html'
            'apps/docs/_site/reference/node-sdk/**/*.html'
            'apps/docs/_site/reference/agent-sdk/**/*.html'
            'apps/docs/_site/reference/error-glossary/**/*.html'
            'apps/docs/_site/reference/limits/**/*.html'
          fail: true
      - name: Browser tests
        run: dev/nix-shell 'cd apps/docs && npm run test:browser'
      - name: Check accessibility against the production baseline
        run: dev/nix-shell 'cd apps/docs && node scripts/check-lighthouse.mjs'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-browser-results
          path: |
            apps/docs/test-results
            apps/docs/playwright-report
          if-no-files-found: ignore
      # Only the deploy job consumes this, and a pull-request artifact would be
      # missing the native references anyway.
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/_site

  deploy:
    # self-hosted is where the work happens, so it is what publishes. A push to
    # main still runs the full build as a signal; GitHub Pages serves one site
    # per repository, so only one branch can deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/self-hosted'
    needs: compose
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the published custom domain
        # Publishing succeeds even when DNS or the TLS certificate is pending.
        run: |
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            --connect-timeout 10 --max-time 30 --retry-all-errors \
            --output /dev/null https://self-hosted-docs.xmtp.to/; then
            echo "::warning::Pages published, but the custom domain HTTPS check failed. Check DNS and the Pages certificate."
            echo "Pages published. The custom domain HTTPS check failed; check DNS and the Pages certificate." >> "$GITHUB_STEP_SUMMARY"
          fi
