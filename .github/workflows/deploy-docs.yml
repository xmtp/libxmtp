name: "Build: Docs site"
'on':
  workflow_call:
    inputs:
      runner:
        description: The runner of the site build and the Rust reference. A dispatch uses the default.
        type: string
        default: blacksmith-8vcpu-ubuntu-2404
      compose-runner:
        description: The runner of the composed-site checks. A dispatch uses the default.
        type: string
        default: blacksmith-4vcpu-ubuntu-2404
      deploy:
        description: Add the Swift and Kotlin references (post-merge.yml builds them in the same run) and upload the Pages artifact. Only post-merge.yml sets it; its deploy job publishes the artifact.
        type: boolean
        default: false
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: Optional compiler cache reader access key ID
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: Optional compiler cache reader secret access key
        required: false
  workflow_dispatch: null
permissions:
  contents: read
# No workflow-level concurrency. A called workflow sees the caller's
# github.ref, so a group on it would let a manual dispatch on trunk cancel the
# docs jobs of a running merge run. ci.yml already replaces older pull
# request runs. The Pages deploy is a post-merge.yml job: a called job that asks for
# pages: write needs that grant from every caller, even when it is skipped, and
# the merge run grants no Pages permissions.
#
# Cache modes: inside post-merge.yml (deploy) every job is in mode read, so Pages
# content comes only from the trusted cache. In CI runs (pull requests; the
# docs_site suite leaves the merge run) the jobs are in mode ci, except `rust`:
# it gets no mode outside a deploy, so docs-rust-reference.yml picks its own
# mode. The CI merge run calls docs-rust-reference.yml directly (suite
# docs_rust), in mode trusted, and writes its `rust-reference` Kache scope
# there. No other docs job writes a trusted store or selects the writer
# environment.
jobs:
  rust:
    name: Rust reference
    uses: ./.github/workflows/docs-rust-reference.yml
    with:
      cache-mode: ${{ inputs.deploy && 'read' || '' }}
      runner: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  site:
    name: Build site and JS reference
    runs-on: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
    - name: Check out the source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
        filter: blob:none
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
        github-token: ${{ github.token }}
    - name: Install JS dependencies (pnpm)
      uses: ./.github/actions/setup-js
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
    - name: dev/nix-shell 'just docs check-agent-docs'
      run: dev/nix-shell 'just docs check-agent-docs'
    - name: dev/nix-shell 'just docs build'
      run: dev/nix-shell 'just docs build'
    - name: Upload docs-site
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: docs-site
        path: apps/docs/dist
        if-no-files-found: error
    env:
      NIX_DEVSHELL: js
      # The references read the release-profile Nix products (products_sdk_js).
      XMTP_SDK_BUILD: nix
  # In a deploy, the docs-swift and docs-kotlin artifacts come from the
  # post-merge.yml jobs that its docs call waits for (one run shares its
  # artifacts).
  compose:
    name: Compose, browser tests, Lighthouse
    needs:
    - rust
    - site
    runs-on: ${{ inputs.compose-runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    env:
      NIX_DEVSHELL: docs
      DOCS_SKIP_NATIVE_REFERENCES: ${{ !inputs.deploy && '1' || '' }}
    steps:
    - name: Check out the source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
        github-token: ${{ github.token }}
    - name: Install JS dependencies (pnpm)
      uses: ./.github/actions/setup-js
      with:
        cache-mode: ${{ inputs.deploy && 'read' || 'ci' }}
    - name: Download docs-site
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: docs-site
        path: apps/docs/dist
    - name: Download docs-rust
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: docs-rust
        path: apps/docs/generated/reference/rust
    - name: Download docs-swift
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      if: inputs.deploy
      with:
        name: docs-swift
        path: ${{ runner.temp }}/docs-swift
    - name: Extract Swift reference
      if: inputs.deploy
      run: 'mkdir -p apps/docs/generated/reference/swift

        tar -xf "${RUNNER_TEMP}/docs-swift/docs-swift.tar" -C apps/docs/generated/reference/swift

        '
    - name: Download docs-kotlin
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      if: inputs.deploy
      with:
        name: docs-kotlin
        path: apps/docs/generated/reference/kotlin
    - name: dev/nix-shell 'just docs compose && just docs check'
      run: dev/nix-shell 'just docs compose && just docs check'
    - name: dev/nix-shell 'just docs test-browser'
      run: dev/nix-shell 'just docs test-browser'
    - name: dev/nix-shell 'cd apps/docs && node scripts/check-lighthouse.mjs'
      run: dev/nix-shell 'cd apps/docs && node scripts/check-lighthouse.mjs'
    - name: Upload docs-browser-results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: docs-browser-results
        path: 'apps/docs/test-results

          apps/docs/playwright-report

          '
        if-no-files-found: ignore
    - name: Upload the Pages artifact
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
      if: inputs.deploy
      with:
        path: apps/docs/_site
