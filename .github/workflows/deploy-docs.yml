name: Build and Deploy Docs
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    uses: ./.github/workflows/docs-rust-reference.yml
    secrets:
      KACHE_S3_ACCESS_KEY_ID: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
      KACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
  swift:
    name: Swift reference
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        nix-disk: 'false'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: nix-only
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - run: just ios docs apps/docs/generated/reference/swift
    - name: Archive Swift reference
      env:
        COPYFILE_DISABLE: '1'
      run: tar -cf "${RUNNER_TEMP}/docs-swift.tar" -C apps/docs/generated/reference/swift .
    - uses: actions/upload-artifact@v7
      with:
        name: docs-swift
        path: ${{ runner.temp }}/docs-swift.tar
        if-no-files-found: error
    env:
      NIX_DEVSHELL: ios
  kotlin:
    name: Kotlin reference
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: nix-only
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - run: just android docs-generated
    - uses: actions/upload-artifact@v7
      with:
        name: docs-kotlin
        path: sdks/android/library/build/dokka/html
        if-no-files-found: error
    env:
      NIX_DEVSHELL: android
  site:
    name: Site and JavaScript references
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        filter: blob:none
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: web
        github-token: ${{ github.token }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: sdk-products-debug
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
    - run: just docs check-agent-docs
    - run: just docs build
    - uses: actions/upload-artifact@v7
      with:
        name: docs-site
        path: apps/docs/dist
        if-no-files-found: error
    env:
      NIX_DEVSHELL: js
  compose:
    name: Validate the composed site
    needs:
    - rust
    - swift
    - kotlin
    - site
    if: '!cancelled() && needs.rust.result == ''success'' && needs.site.result == ''success'' && needs.swift.result != ''failure'' &&
      needs.kotlin.result != ''failure'''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NIX_DEVSHELL: docs
      DOCS_SKIP_NATIVE_REFERENCES: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: web
        github-token: ${{ github.token }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: nix-only
        kache-readonly: "true"
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
    - uses: actions/download-artifact@v8
      with:
        name: docs-site
        path: apps/docs/dist
    - uses: actions/download-artifact@v8
      with:
        name: docs-rust
        path: apps/docs/generated/reference/rust
    - uses: actions/download-artifact@v8
      if: github.event_name != 'pull_request'
      with:
        name: docs-swift
        path: ${{ runner.temp }}/docs-swift
    - name: Extract Swift reference
      if: github.event_name != 'pull_request'
      run: 'mkdir -p apps/docs/generated/reference/swift

        tar -xf "${RUNNER_TEMP}/docs-swift/docs-swift.tar" -C apps/docs/generated/reference/swift

        '
    - uses: actions/download-artifact@v8
      if: github.event_name != 'pull_request'
      with:
        name: docs-kotlin
        path: apps/docs/generated/reference/kotlin
    - name: Compose and check the artifact
      run: dev/nix-shell 'cd apps/docs && node scripts/compose.mjs && node scripts/check-site.mjs --built'
    - name: Browser tests
      run: dev/nix-shell 'cd apps/docs && npm run test:browser'
    - name: Check accessibility against the production baseline
      run: dev/nix-shell 'cd apps/docs && node scripts/check-lighthouse.mjs'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: docs-browser-results
        path: 'apps/docs/test-results

          apps/docs/playwright-report

          '
        if-no-files-found: ignore
    - uses: actions/upload-pages-artifact@v4
      if: github.event_name != 'pull_request'
      with:
        path: apps/docs/_site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/self-hosted'
    needs: compose
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
    - name: Check the published custom domain
      run: "if ! curl --fail --silent --show-error --retry 3 --retry-delay 10 \\\n  --connect-timeout 10 --max-time 30 --retry-all-errors\
        \ \\\n  --output /dev/null https://self-hosted-docs.xmtp.to/; then\n  echo \"::warning::Pages published, but the custom domain\
        \ HTTPS check failed. Check DNS and the Pages certificate.\"\n  echo \"Pages published. The custom domain HTTPS check failed;\
        \ check DNS and the Pages certificate.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
  result:
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
    - rust
    - swift
    - kotlin
    - site
    - compose
    - deploy
    steps:
    - env:
        PASSED: ${{ needs.rust.result == 'success' && needs.site.result == 'success' && needs.compose.result == 'success' && (github.event_name
          == 'pull_request' || (needs.swift.result == 'success' && needs.kotlin.result == 'success')) && (github.event_name != 'push'
          || github.ref != 'refs/heads/self-hosted' || needs.deploy.result == 'success') }}
      run: test "$PASSED" = true
