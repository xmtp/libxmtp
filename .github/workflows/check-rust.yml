name: "Test: Rust Clippy"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: "Optional compiler cache reader access key ID"
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: "Optional compiler cache reader secret access key"
        required: false
jobs:
  # Native and WASM Clippy in one job and one Kache scope. `wasm` is an alias
  # of the rust shell (flake.nix), so one shell serves every step.
  clippy:
    name: Clippy (native, SDK generator, WASM)
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted runners (merge and manual runs) have 4 vCPU.
    timeout-minutes: ${{ startsWith(inputs.runner, 'ubuntu-') && 60 || 30 }}
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && github.ref == 'refs/heads/main' && 'kache-s3-writer' || '' }}
    env:
      NIX_DEVSHELL: rust
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && github.ref == 'refs/heads/main' && 'trusted' || 'ci' }}
          github-token: ${{ github.token }}
          kache: "true"
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: rust-clippy
          kache-readonly: "false"
      - name: dev/nix-shell 'dev/agent-run cargo clippy --locked --all-features --all-targets --no-deps -- -Dwarnings'
        id: native
        run: dev/nix-shell 'dev/agent-run cargo clippy --locked --all-features --all-targets --no-deps -- -Dwarnings'
      # The later checks also run when native Clippy fails, so one run reports
      # every Clippy failure. They do not run when setup failed.
      - name: dev/nix-shell 'dev/agent-run cargo clippy -p xmtp-sdk-bindgen --all-targets --no-deps -- -Dwarnings'
        # The generator is not a default workspace member.
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: dev/nix-shell 'dev/agent-run cargo clippy -p xmtp-sdk-bindgen --all-targets --no-deps -- -Dwarnings'
      - name: dev/nix-shell 'just wasm lint'
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: dev/nix-shell 'just wasm lint'
