name: Check Rust compiler lint
on:
  workflow_call:
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: "Optional compiler cache reader access key ID"
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: "Optional compiler cache reader secret access key"
        required: false
jobs:
  native:
    name: Check (native all-feature Clippy)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    env:
      NIX_DEVSHELL: rust
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
          kache: "true"
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: rust-clippy-native
          kache-readonly: "false"
      - uses: taiki-e/install-action@just
      - name: Run native all-feature Clippy
        run: dev/nix-shell 'dev/agent-run cargo clippy --locked --all-features --all-targets --no-deps -- -Dwarnings'
      - name: Run SDK generator Clippy
        # The generator is not a default workspace member.
        run: dev/nix-shell 'dev/agent-run cargo clippy -p xmtp-sdk-bindgen --all-targets --no-deps -- -Dwarnings'
      - name: Record compiler cache report
        if: ${{ always() && env.XMTP_KACHE == '1' }}
        continue-on-error: true
        run: dev/nix-shell --shell rust --command kache stats --format json --redact --since 1h --output "$RUNNER_TEMP/kache-native-clippy.json"
      - name: Retain compiler cache report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kache-native-clippy-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-native-clippy.json
          if-no-files-found: ignore
          retention-days: 7
  wasm:
    name: Check (WASM Clippy)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NIX_DEVSHELL: wasm
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Run WASM Clippy
        run: just wasm lint
