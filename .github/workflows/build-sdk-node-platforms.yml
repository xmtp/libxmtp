name: "Build: Node SDK package"
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      cache-mode:
        description: >-
          setup-nix and setup-js cache mode: read (default) for release, ci
          for CI runs.
        type: string
        default: read
    outputs:
      artifact:
        value: sdk_node_public
jobs:
  plan:
    name: Read Node platform matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      cargo: ${{ steps.matrix.outputs.cargo }}
      load: ${{ steps.matrix.outputs.load }}
    steps:
      - name: Check out the platform list
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: nix/sdk-platforms.json
          sparse-checkout-cone-mode: false
      - name: Read nix/sdk-platforms.json
        id: matrix
        env:
          # The list comes from the caller's ref, so the values that reach
          # runners, scripts, and actions must be in these fixed lists, and
          # images are pinned by digest.
          ALLOWED_TARGETS: >-
            ["darwin-arm64", "linux-x64-gnu", "linux-x64-musl", "linux-arm64-gnu",
            "linux-arm64-musl", "win32-x64-msvc"]
          ALLOWED_RUST_TARGETS: >-
            ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl",
            "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
          ALLOWED_LIBRARIES: '["libxmtp_sdk.dylib", "libxmtp_sdk.so", "xmtp_sdk.dll"]'
          ALLOWED_GLIBC_FLOOR: "2.27"
          ALLOWED_RUNNERS: >-
            ["blacksmith-16vcpu-ubuntu-2404", "ubuntu-24.04", "ubuntu-24.04-arm",
            "ubuntu-latest", "macos-15", "warp-macos-15-arm64-6x", "windows-latest"]
          ALLOWED_IMAGES: >-
            ["node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d",
            "node:22.23.4-alpine@sha256:ce8d97f7cfc7c5386421eb932df20a29df99b1a7f469f6157d5c9956702ffadc"]
        run: |
          rejected=$(jq -r --argjson runners "$ALLOWED_RUNNERS" --argjson images "$ALLOWED_IMAGES" \
            --argjson targets "$ALLOWED_TARGETS" --argjson rustTargets "$ALLOWED_RUST_TARGETS" \
            --argjson libraries "$ALLOWED_LIBRARIES" --arg glibcFloor "$ALLOWED_GLIBC_FLOOR" '
            # A runner label fits a target when it has the target OS and,
            # on Linux, its architecture.
            def fits($target):
              if ($target | startswith("linux-")) then
                test("ubuntu") and (($target | contains("arm64")) == contains("-arm"))
              elif ($target | startswith("win32-")) then startswith("windows-")
              else test("macos") end;
            # The Nix system of a runner label.
            def nixSystem:
              if test("macos") then "aarch64-darwin"
              elif test("ubuntu") then (if contains("-arm") then "aarch64-linux" else "x86_64-linux" end)
              else null end;
            ([.glibcFloor] - [$glibcFloor] | map("glibc floor \(.)"))
            + ([.node[] | .runner, .loadRunner] - $runners | map("runner \(.)"))
            + ([.node[] | .loadImage // empty] - $images | map("image \(.)"))
            + ([.node[] | .target] - $targets | map("target \(.)"))
            + ([.node[] | .rustTarget] - $rustTargets | map("Rust target \(.)"))
            + ([.node[] | .library] - $libraries | map("library \(.)"))
            # A Nix target builds on a runner whose system builds it (the
            # arm64 Linux pairs are cross outputs of x86_64-linux); a cargo
            # target builds on its own OS. Each target loads on its own OS
            # and architecture, and a Linux target loads in the pinned image
            # of its libc.
            + [.node[] | .target as $t | .nixSystems as $systems
              | select(.runner != null and (
                  if $systems == [] then .runner | fits($t) | not
                  else [.runner | nixSystem] - $systems != [] end))
              | "build platform \($t) on \(.runner)"]
            + [.node[] | .target as $t | select((.loadRunner | fits($t) | not) or
                if ($t | startswith("linux-")) then
                  (($t | endswith("-musl")) != ((.loadImage // "") | startswith("node:22.23.4-alpine@")))
                  or (($t | endswith("-gnu")) != ((.loadImage // "") | startswith("node:22.23.4-bookworm-slim@")))
                else .loadImage != null end)
              | "load platform \($t) on \(.loadRunner) with \(.loadImage // "no image")"]
            | .[] | @json' nix/sdk-platforms.json)
          if [ -n "$rejected" ]; then
            while IFS= read -r item; do
              echo "::error file=nix/sdk-platforms.json::$item is not in this workflow's allowlist"
            done <<< "$rejected"
            exit 1
          fi
          # Every allowed target, exactly once, so a ref cannot drop a platform
          # from the build, load, and assembly.
          mismatched=$(jq -r --argjson targets "$ALLOWED_TARGETS" '
            [.node[] | .target] as $listed
            | if ($listed | sort) == ($targets | sort) then empty else
                ($targets - $listed | map("missing target \(.)"))
                + ($listed - $targets | map("extra target \(.)"))
                + ($listed | group_by(.) | map(select(length > 1) | "duplicate target \(.[0])"))
                | .[]
              end' nix/sdk-platforms.json)
          if [ -n "$mismatched" ]; then
            while IFS= read -r item; do
              echo "::error file=nix/sdk-platforms.json::$item: the Node platforms must be exactly ALLOWED_TARGETS"
            done <<< "$mismatched"
            exit 1
          fi
          # The Nix pairs and the smoke tests run one job per runner label, so
          # the four Linux pairs, all cross outputs of x86_64-linux, share one
          # job. `os` and `label` name the job; `pairs` lists its targets
          # (`target:library` words for the build, which runs on macOS too).
          {
            echo "build=$(jq -c '
              [.node[] | select(.nixSystems != [])] | group_by(.runner)
              | map({runner: .[0].runner, first: .[0].target,
                  os: (if (.[0].runner | test("macos")) then "macOS" else "Linux" end),
                  pairs: (map("\(.target):\(.library)") | join(" "))})' nix/sdk-platforms.json)"
            echo "cargo=$(jq -c '[.node[] | select(.nixSystems == []) | {target, rustTarget, library, runner}]' nix/sdk-platforms.json)"
            echo "load=$(jq -c '
              [.node[] | {target, runner: .loadRunner, image: (.loadImage // "")}]
              | group_by(.runner)
              | map({runner: .[0].runner,
                  label: (.[0].target | split("-")
                    | ({"linux": "Linux", "darwin": "macOS", "win32": "Windows"}[.[0]]) + " " + .[1]),
                  pairs: map({target, image})})' nix/sdk-platforms.json)"
          } >> "$GITHUB_OUTPUT"

  unix:
    name: Build Node pairs (${{ matrix.os }}, Nix)
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The warm release set holds every pair that x86_64-linux builds,
        # the arm64 Linux pairs as cross outputs, so a release substitutes
        # them; the arm64 load jobs still test them on arm64.
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: ${{ inputs.cache-mode }}
          cachix-pr-auth-token: ${{ inputs.cache-mode == 'ci' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          github-token: ${{ github.token }}
      - name: Build matched SDK and pinned runtime pairs
        env:
          PAIRS: ${{ matrix.pairs }}
        run: |
          set -euo pipefail
          # The plan job allowlists every target and library, so the words
          # split safely. macOS runs this with bash 3.2.
          installables=()
          for pair in $PAIRS; do
            installables+=(".#xmtp-sdk-node-${pair%%:*}")
          done
          # One build for every pair, so Nix substitutes or builds them in
          # parallel; the per-pair builds below only add the links.
          nix build --no-link "${installables[@]}"
          for pair in $PAIRS; do
            TARGET="${pair%%:*}" LIBRARY="${pair#*:}"
            export TARGET LIBRARY
            nix build .#xmtp-sdk-node-"$TARGET" --out-link target/sdk-node-pair-"$TARGET"
            dev/nix-shell --shell js-node 'python3.11 crates/xmtp_sdk/dev/record-node-platform.py "$TARGET" --library target/sdk-node-pair-"$TARGET"/lib/"$LIBRARY" --addon target/sdk-node-pair-"$TARGET"/runtime/uniffi-runtime-napi."$TARGET".node --native-provenance target/sdk-node-pair-"$TARGET"/native-provenance.json --runtime-provenance target/sdk-node-pair-"$TARGET"/runtime/runtime-provenance.json'
          done
      - name: Store the built pairs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk_node_pair_${{ matrix.first }}
          path: target/sdk-node-platforms
          retention-days: 1

  # The platforms that no Nix system builds. They build with cargo on Windows.
  windows:
    name: Build Node pair (${{ matrix.target }}, cargo)
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SQLX_OFFLINE: "true"
      # In the job env, so the key's compiler context sees the build's flags.
      OPENSSL_SRC_PERL: C:/Strawberry/perl/bin/perl.exe
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cargo) }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      # The pair is cached by the source key of its SDK inputs, build recipe
      # (this file), and compiler, not by commit, so a re-dispatch with
      # unchanged SDK sources reuses it. A run restores
      # entries from its own ref, then from main (dev releases dispatched
      # on main save there). This is a release-only exception to selecting
      # nothing by cache status: Windows has no Nix store to substitute from.
      # The key names the compiler (`rustc -vV`), so install the toolchain of
      # rust-toolchain.toml first; the targets and the Rust cache are set up
      # only on a miss.
      - name: Pinned Rust toolchain
        shell: bash
        run: rustup toolchain install
      # The key hashes this workflow as committed at `inputs.ref`, so callers
      # must run it from that same commit (as release does); a run from another
      # ref could cache a pair built by a different recipe under this key.
      - name: Source key
        id: key
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          key="$(python crates/xmtp_sdk/dev/sdk-artifacts.py key --profile release --rust-target "$RUST_TARGET")"
          echo "$key" | tee "$RUNNER_TEMP/source-key.json"
          {
            echo "key=$(jq -r .key <<< "$key")"
            echo "fork-revision=$(jq -r .forkRevision <<< "$key")"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the built pair
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/sdk-node-platforms/${{ matrix.target }}
          key: sdk-node-pair-${{ matrix.target }}-${{ steps.key.outputs.key }}
      - name: Add the Rust target
        if: steps.restore.outputs.cache-hit != 'true'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rustTarget }}
        run: rustup target add "$RUST_TARGET"
      - name: Restore the Rust build cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
      # Matches the Nix protobuf of the Linux and macOS builds. The version and
      # hash are part of this file, so a bump changes the pair's cache key.
      - name: Install protoc
        if: steps.restore.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          PROTOC_VERSION: "35.1"
          PROTOC_SHA256: "5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082"
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:PROTOC_SHA256) {
            throw "protoc $env:PROTOC_VERSION archive does not match its SHA-256"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $protoc = Join-Path $dir 'bin\protoc.exe'
          & $protoc --version
          if ($LASTEXITCODE -ne 0) {
            throw "protoc --version failed with exit code $LASTEXITCODE"
          }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build SDK library and pinned runtime addon
        if: steps.restore.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rustTarget }}
          LIBRARY: ${{ matrix.library }}
          FORK_REV: ${{ steps.key.outputs.fork-revision }}
        run: |
          /c/Strawberry/perl/bin/perl.exe -MLocale::Maketext::Simple -e 1
          python crates/xmtp_sdk/dev/sdk-artifacts.py build --targets node --profile release --rust-target "$RUST_TARGET" --skip-bindgen --artifacts target/sdk-node-windows
          # The Rust cache can restore this temporary checkout.
          rm -rf target/sdk-node-runtime-source
          git init target/sdk-node-runtime-source
          git -C target/sdk-node-runtime-source remote add origin https://github.com/neekolas/uniffi-bindgen-react-native.git
          git -C target/sdk-node-runtime-source fetch --no-tags --depth=1 origin "$FORK_REV"
          git -C target/sdk-node-runtime-source checkout --detach "$FORK_REV"
          cargo build --manifest-path target/sdk-node-runtime-source/Cargo.toml --locked --release -p uniffi-runtime-napi --lib --target "$RUST_TARGET"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          target, rust_target = os.environ["TARGET"], os.environ["RUST_TARGET"]
          addon = Path(f"target/sdk-node-runtime-source/target/{rust_target}/release/uniffi_runtime_napi.dll")
          name = f"uniffi-runtime-napi.{target}.node"
          receipt = {"schema": 1, "target": rust_target, "addon": name, "revision": os.environ["FORK_REV"], "files": {name: hashlib.sha256(addon.read_bytes()).hexdigest()}}
          Path("target/sdk-node-windows/runtime-provenance.json").write_text(json.dumps(receipt) + "\n")
          PY
          python crates/xmtp_sdk/dev/record-node-platform.py "$TARGET" --library target/sdk-node-windows/native/"$LIBRARY" --addon target/sdk-node-runtime-source/target/"$RUST_TARGET"/release/uniffi_runtime_napi.dll --native-artifacts target/sdk-node-windows/artifacts.json --runtime-provenance target/sdk-node-windows/runtime-provenance.json --runtime-source target/sdk-node-runtime-source --source-key "$RUNNER_TEMP/source-key.json"
      - name: Save the built pair
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/sdk-node-platforms/${{ matrix.target }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Store the built pair
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk_node_pair_${{ matrix.target }}
          path: target/sdk-node-platforms
          retention-days: 1

  assemble:
    name: Assemble Node package
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: js-node
      # The common binding is the release-profile Nix tree that CI tested.
      XMTP_SDK_BUILD: nix
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: ${{ inputs.cache-mode }}
          cachix-pr-auth-token: ${{ inputs.cache-mode == 'ci' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          github-token: ${{ github.token }}
      - name: Set up JavaScript
        uses: ./.github/actions/setup-js
        with:
          cache-mode: ${{ inputs.cache-mode }}
      - name: Download the built pairs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sdk_node_pair_*
          merge-multiple: true
          path: target/sdk-node-platforms
      - name: Assemble the full public product
        env:
          XMTP_SDK_NODE_PLATFORMS_DIR: target/sdk-node-platforms
        run: dev/nix-shell 'dev/js/sdk-package node'
      - name: Check installed aggregate Node ESM package
        run: dev/nix-shell 'node crates/xmtp_sdk/dev/package-smoke.mjs node'
      - name: Store the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk_node_public
          path: target/sdk-packages/node
          include-hidden-files: true
          retention-days: 1

  load:
    name: Smoke-test installed package (${{ matrix.label }})
    needs: [plan, assemble]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.load) }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sdk_node_public
          path: target/sdk-packages/node
      - name: Install Node.js 22.23.4
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
      # Each Linux target loads in the pinned image of its libc.
      - name: Installed package on Linux without build-host libraries
        if: runner.os == 'Linux'
        env:
          PAIRS: ${{ toJSON(matrix.pairs) }}
        run: |
          set -euo pipefail
          # The list goes through a file: bash ignores the exit status of a
          # process substitution, so a failed jq would smoke nothing.
          jq -r '.[] | "\(.target) \(.image)"' <<< "$PAIRS" > "$RUNNER_TEMP/smoke-pairs"
          if [[ ! -s "$RUNNER_TEMP/smoke-pairs" ]]; then
            echo "::error::No Linux target to smoke"
            exit 1
          fi
          while read -r TARGET NODE_IMAGE <&3; do
            echo "::group::$TARGET"
            docker run --rm -v "$PWD:/work" -w /work "$NODE_IMAGE" node crates/xmtp_sdk/dev/package-smoke.mjs node
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/smoke-pairs"
      - name: Installed package on macOS or Windows
        if: runner.os != 'Linux'
        shell: bash
        run: node crates/xmtp_sdk/dev/package-smoke.mjs node
