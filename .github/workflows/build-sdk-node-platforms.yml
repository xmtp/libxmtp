name: Build public Node SDK platforms
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      cache-mode:
        description: >-
          setup-nix and setup-js cache mode: read (default) for release, ci
          for CI runs.
        type: string
        default: read
    outputs:
      artifact:
        value: sdk_node_public
jobs:
  plan:
    name: Node platform matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      cargo: ${{ steps.matrix.outputs.cargo }}
      load: ${{ steps.matrix.outputs.load }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: nix/sdk-platforms.json
          sparse-checkout-cone-mode: false
      - name: Read nix/sdk-platforms.json
        id: matrix
        env:
          # The list comes from the caller's ref, so the values that reach
          # runners, scripts, and actions must be in these fixed lists, and
          # images are pinned by digest.
          ALLOWED_TARGETS: >-
            ["darwin-arm64", "linux-x64-gnu", "linux-x64-musl", "linux-arm64-gnu",
            "linux-arm64-musl", "win32-x64-msvc"]
          ALLOWED_RUST_TARGETS: >-
            ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl",
            "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
          ALLOWED_LIBRARIES: '["libxmtp_sdk.dylib", "libxmtp_sdk.so", "xmtp_sdk.dll"]'
          ALLOWED_GLIBC_FLOOR: "2.27"
          ALLOWED_RUNNERS: >-
            ["blacksmith-16vcpu-ubuntu-2404", "ubuntu-24.04-arm", "ubuntu-latest",
            "warp-macos-15-arm64-6x", "windows-latest"]
          ALLOWED_IMAGES: >-
            ["node:22.12.0-bookworm-slim@sha256:35531c52ce27b6575d69755c73e65d4468dba93a25644eed56dc12879cae9213",
            "node:22.12.0-alpine@sha256:51eff88af6dff26f59316b6e356188ffa2c422bd3c3b76f2556a2e7e89d080bd"]
        run: |
          rejected=$(jq -r --argjson runners "$ALLOWED_RUNNERS" --argjson images "$ALLOWED_IMAGES" \
            --argjson targets "$ALLOWED_TARGETS" --argjson rustTargets "$ALLOWED_RUST_TARGETS" \
            --argjson libraries "$ALLOWED_LIBRARIES" --arg glibcFloor "$ALLOWED_GLIBC_FLOOR" '
            # A runner label fits a target when it has the target OS and,
            # on Linux, its architecture.
            def fits($target):
              if ($target | startswith("linux-")) then
                test("ubuntu") and (($target | contains("arm64")) == contains("-arm"))
              elif ($target | startswith("win32-")) then startswith("windows-")
              else test("macos") end;
            ([.glibcFloor] - [$glibcFloor] | map("glibc floor \(.)"))
            + ([.node[] | (.runner // empty), .loadRunner] - $runners | map("runner \(.)"))
            + ([.node[] | .loadImage // empty] - $images | map("image \(.)"))
            + ([.node[] | .target] - $targets | map("target \(.)"))
            + ([.node[] | .rustTarget] - $rustTargets | map("Rust target \(.)"))
            + ([.node[] | .library] - $libraries | map("library \(.)"))
            # Each target builds and loads on its own OS and architecture, and
            # a Linux target loads in the pinned image of its libc.
            + [.node[] | .target as $t | select(.runner != null and (.runner | fits($t) | not))
              | "build platform \($t) on \(.runner)"]
            + [.node[] | .target as $t | select((.loadRunner | fits($t) | not) or
                if ($t | startswith("linux-")) then
                  (($t | endswith("-musl")) != ((.loadImage // "") | startswith("node:22.12.0-alpine@")))
                  or (($t | endswith("-gnu")) != ((.loadImage // "") | startswith("node:22.12.0-bookworm-slim@")))
                else .loadImage != null end)
              | "load platform \($t) on \(.loadRunner) with \(.loadImage // "no image")"]
            | .[] | @json' nix/sdk-platforms.json)
          if [ -n "$rejected" ]; then
            while IFS= read -r item; do
              echo "::error file=nix/sdk-platforms.json::$item is not in this workflow's allowlist"
            done <<< "$rejected"
            exit 1
          fi
          # Every allowed target, exactly once, so a ref cannot drop a platform
          # from the build, load, and assembly.
          mismatched=$(jq -r --argjson targets "$ALLOWED_TARGETS" '
            [.node[] | .target] as $listed
            | if ($listed | sort) == ($targets | sort) then empty else
                ($targets - $listed | map("missing target \(.)"))
                + ($listed - $targets | map("extra target \(.)"))
                + ($listed | group_by(.) | map(select(length > 1) | "duplicate target \(.[0])"))
                | .[]
              end' nix/sdk-platforms.json)
          if [ -n "$mismatched" ]; then
            while IFS= read -r item; do
              echo "::error file=nix/sdk-platforms.json::$item: the Node platforms must be exactly ALLOWED_TARGETS"
            done <<< "$mismatched"
            exit 1
          fi
          {
            echo "build=$(jq -c '[.node[] | select(.nixSystems != []) | {target, library, runner}]' nix/sdk-platforms.json)"
            echo "cargo=$(jq -c '[.node[] | select(.nixSystems == []) | {target, rustTarget, library, runner}]' nix/sdk-platforms.json)"
            echo "load=$(jq -c '[.node[] | {target, runner: .loadRunner, image: (.loadImage // "")}]' nix/sdk-platforms.json)"
          } >> "$GITHUB_OUTPUT"

  unix:
    name: Node pair (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NIX_DEVSHELL: rust
    strategy:
      fail-fast: false
      matrix:
        # No warm set holds the native linux-arm64 pairs, and a release reads
        # only, so a release builds those two cold. That stays until release
        # takes the Node pairs from the products build.
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: ${{ inputs.cache-mode }}
          cachix-pr-auth-token: ${{ inputs.cache-mode == 'ci' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          github-token: ${{ github.token }}
      - name: Build matched SDK and pinned runtime pair
        env:
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ matrix.library }}
        run: |
          dev/nix-shell 'env -u LD_LIBRARY_PATH nix build .#xmtp-sdk-node-"$TARGET" --out-link target/sdk-node-pair -L'
          dev/nix-shell 'python3.11 crates/xmtp_sdk/dev/record-node-platform.py "$TARGET" --library target/sdk-node-pair/lib/"$LIBRARY" --addon target/sdk-node-pair/runtime/uniffi-runtime-napi."$TARGET".node --native-provenance target/sdk-node-pair/native-provenance.json --runtime-provenance target/sdk-node-pair/runtime/runtime-provenance.json'
      - uses: actions/upload-artifact@v7
        with:
          name: sdk_node_pair_${{ matrix.target }}
          path: target/sdk-node-platforms
          retention-days: 1

  # The platforms that no Nix system builds. They build with cargo on Windows.
  windows:
    name: Node pair (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SQLX_OFFLINE: "true"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cargo) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rustTarget }}
          workspaces: .
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install protoc
      - name: Verify protoc for Rust builds
        shell: pwsh
        run: |
          $protoc = Join-Path $env:ChocolateyInstall 'lib\protoc\tools\bin\protoc.exe'
          if (-not (Test-Path -LiteralPath $protoc -PathType Leaf)) {
            throw "Chocolatey protoc executable is missing: $protoc"
          }
          & $protoc --version
          if ($LASTEXITCODE -ne 0) {
            throw "protoc --version failed with exit code $LASTEXITCODE"
          }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build SDK library and pinned runtime addon
        shell: bash
        env:
          OPENSSL_SRC_PERL: C:/Strawberry/perl/bin/perl.exe
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rustTarget }}
          LIBRARY: ${{ matrix.library }}
        run: |
          /c/Strawberry/perl/bin/perl.exe -MLocale::Maketext::Simple -e 1
          python crates/xmtp_sdk/dev/sdk-artifacts.py build --targets node --profile release --rust-target "$RUST_TARGET" --skip-bindgen --artifacts target/sdk-node-windows
          # The Rust cache can restore this temporary checkout.
          rm -rf target/sdk-node-runtime-source
          git init target/sdk-node-runtime-source
          git -C target/sdk-node-runtime-source remote add origin https://github.com/neekolas/uniffi-bindgen-react-native.git
          fork_rev=$(node -p 'require("fs").readFileSync("Cargo.toml", "utf8").match(/\[workspace\.metadata\.xmtp-sdk-fork\][^\[]*rev\s*=\s*"([0-9a-f]{40})"/)[1]')
          git -C target/sdk-node-runtime-source fetch --no-tags --depth=1 origin "$fork_rev"
          git -C target/sdk-node-runtime-source checkout --detach "$fork_rev"
          cargo build --manifest-path target/sdk-node-runtime-source/Cargo.toml --locked --release -p uniffi-runtime-napi --lib --target "$RUST_TARGET"
          FORK_REV="$fork_rev" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          target, rust_target = os.environ["TARGET"], os.environ["RUST_TARGET"]
          addon = Path(f"target/sdk-node-runtime-source/target/{rust_target}/release/uniffi_runtime_napi.dll")
          name = f"uniffi-runtime-napi.{target}.node"
          receipt = {"schema": 1, "target": rust_target, "addon": name, "revision": os.environ["FORK_REV"], "files": {name: hashlib.sha256(addon.read_bytes()).hexdigest()}}
          Path("target/sdk-node-windows/runtime-provenance.json").write_text(json.dumps(receipt) + "\n")
          PY
          python crates/xmtp_sdk/dev/record-node-platform.py "$TARGET" --library target/sdk-node-windows/native/"$LIBRARY" --addon target/sdk-node-runtime-source/target/"$RUST_TARGET"/release/uniffi_runtime_napi.dll --native-artifacts target/sdk-node-windows/artifacts.json --runtime-provenance target/sdk-node-windows/runtime-provenance.json --runtime-source target/sdk-node-runtime-source
      - uses: actions/upload-artifact@v7
        with:
          name: sdk_node_pair_${{ matrix.target }}
          path: target/sdk-node-platforms
          retention-days: 1

  assemble:
    name: Assemble one supported-platform public package
    needs: [unix, windows]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: rust
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: ${{ inputs.cache-mode }}
          cachix-pr-auth-token: ${{ inputs.cache-mode == 'ci' && secrets.CACHIX_PR_AUTH_TOKEN || '' }}
          github-token: ${{ github.token }}
          kache: "true"
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: sdk-native-release
          kache-readonly: "true"
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: ${{ inputs.cache-mode }}
      - uses: actions/download-artifact@v8
        with:
          pattern: sdk_node_pair_*
          merge-multiple: true
          path: target/sdk-node-platforms
      - name: Build and render the common release binding
        run: |
          dev/nix-shell 'just sdk build node --profile release'
          dev/nix-shell 'just sdk render node --profile release'
      - name: Assemble the full public product
        env:
          XMTP_SDK_NODE_PLATFORMS_DIR: target/sdk-node-platforms
          XMTP_SDK_GENERATED_DIR: target/sdk-generated
        run: dev/nix-shell 'bash dev/js/sdk-package node'
      - name: Check installed aggregate Node ESM package
        env:
          NIX_DEVSHELL: js-node
        run: dev/nix-shell 'node crates/xmtp_sdk/dev/package-smoke.mjs node'
      - uses: actions/upload-artifact@v7
        with:
          name: sdk_node_public
          path: target/sdk-packages/node
          include-hidden-files: true
          retention-days: 1

  load:
    name: Installed public Node package (${{ matrix.target }})
    needs: [plan, assemble]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.load) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: sdk_node_public
          path: target/sdk-packages/node
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - name: Installed package on Linux without build-host libraries
        if: runner.os == 'Linux'
        env:
          NODE_IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/work" -w /work "$NODE_IMAGE" node crates/xmtp_sdk/dev/package-smoke.mjs node
      - name: Installed package on macOS or Windows
        if: runner.os != 'Linux'
        shell: bash
        run: node crates/xmtp_sdk/dev/package-smoke.mjs node
