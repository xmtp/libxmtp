name: "Test: iOS example app"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
    secrets:
      CACHIX_PR_AUTH_TOKEN:
        required: false
permissions:
  contents: read
env:
  NIX_DEVSHELL: ios
jobs:
  # The fast job: lint first, then the ExampleKit unit tests and the Debug and
  # Push builds. The journeys run in their own job, in parallel.
  tests:
    name: Lint, unit tests, builds
    runs-on: ${{ inputs.runner }}
    # About 1.5x the slowest successful run through 2026-10-20, cold builds
    # included, rounded up to 5 min, so a stalled Nix download fails sooner.
    timeout-minutes: 35
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - name: dev/nix-shell 'bash dev/check-apple-toolchain'
        run: dev/nix-shell 'bash dev/check-apple-toolchain'
      - name: dev/nix-shell 'just example-ios lint && just example-ios test'
        run: dev/nix-shell 'just example-ios lint && just example-ios test'
      - name: dev/nix-shell 'just example-ios build'
        run: dev/nix-shell 'just example-ios build'
      - name: CONFIGURATION=Push dev/nix-shell 'just example-ios build'
        run: CONFIGURATION=Push dev/nix-shell 'just example-ios build'
      - name: Check configuration entitlements
        run: |
          for configuration in Debug Release; do
            settings=$(dev/nix-shell "env -u LD xcodebuild -showBuildSettings -project apps/example-ios/ExampleApp.xcodeproj -scheme ExampleApp -configuration $configuration -sdk iphonesimulator")
            if printf '%s\n' "$settings" | grep -E '^[[:space:]]*CODE_SIGN_ENTITLEMENTS = .+'; then
              echo "$configuration must not declare push entitlements"
              exit 1
            fi
          done
          push_settings=$(dev/nix-shell "env -u LD xcodebuild -showBuildSettings -project apps/example-ios/ExampleApp.xcodeproj -scheme ExampleApp -configuration Push -sdk iphonesimulator")
          printf '%s\n' "$push_settings" | grep -Eq '^[[:space:]]*CODE_SIGN_ENTITLEMENTS = ExampleApp/Resources/ExampleApp-Push.entitlements[[:space:]]*$'
  journeys:
    name: Simulator journeys
    runs-on: ${{ inputs.runner }}
    # About 1.5x the slowest successful run through 2026-10-20 (34 min),
    # cold builds included, rounded up to 5 min, so a stalled Nix download
    # fails sooner.
    timeout-minutes: 55
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - name: dev/nix-shell 'bash dev/check-apple-toolchain'
        run: dev/nix-shell 'bash dev/check-apple-toolchain'
      # `test-ui` builds Debug first.
      - name: dev/nix-shell 'just backend ci just example-ios test-ui'
        env:
          XMTP_SERVICES_LOGS: ${{ runner.temp }}/backend-ci-logs/journeys
          XMTP_BACKEND_URL: http://127.0.0.1:5050
        run: dev/nix-shell 'just backend ci just example-ios test-ui'
      - name: Retain failed journey results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-ios-journeys-results
          path: apps/example-ios/.build/DerivedData/Logs/Test
          include-hidden-files: true
          retention-days: 7
      - name: Retain native service logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-ios-backend-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
