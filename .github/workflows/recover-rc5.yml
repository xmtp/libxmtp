name: Recover frozen RC5 publications
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Verify original RC5 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-release-plan
          run-id: 43899974572
          github-token: ${{ github.token }}
          path: frozen-plan
      - name: Require the original source, version, and completed all-SDK gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            echo 'RC5 recovery publishes retained bytes; it is not a dry run' >&2
            exit 1
          fi
          gh api repos/xmtp/libxmtp/actions/runs/43899974572 > original-run.json
          gh api --paginate --slurp 'repos/xmtp/libxmtp/actions/runs/43899974572/jobs?per_page=100&filter=latest' > original-jobs.json
          python3 dev/verify_rc5_recovery.py original-run.json original-jobs.json frozen-plan/release-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-release-plan
          path: frozen-plan/release-plan.json
          if-no-files-found: error
          retention-days: 7
  retain:
    name: Retain original checked artifact
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - release-npm-node-sdk
          - release-npm-browser-sdk
          - release-npm-agent-sdk
          - release-npm-react-native-sdk
          - release-npm-cli
          - android-release-package
          - android-maven-bundle
          - release-tag-android
          - android-example-apk
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}
          run-id: 43899974572
          github-token: ${{ github.token }}
          path: retained
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: retained
          if-no-files-found: error
          retention-days: 7
  publish-node-sdk:
    needs: retain
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      source-sha: 690af7ce11df9419e5dafb62d309d71c48c6cc99
      version: 8.0.0-rc5
      sdk: node-sdk
      prepared: true
  publish-browser-sdk:
    needs: retain
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      source-sha: 690af7ce11df9419e5dafb62d309d71c48c6cc99
      version: 8.0.0-rc5
      sdk: browser-sdk
      prepared: true
  publish-react-native-sdk:
    needs: retain
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      source-sha: 690af7ce11df9419e5dafb62d309d71c48c6cc99
      version: 8.0.0-rc5
      sdk: react-native-sdk
      prepared: true
  publish-agent-sdk:
    needs: [retain, publish-node-sdk]
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      source-sha: 690af7ce11df9419e5dafb62d309d71c48c6cc99
      version: 8.0.0-rc5
      sdk: agent-sdk
      prepared: true
  publish-cli:
    needs: [retain, publish-node-sdk]
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      source-sha: 690af7ce11df9419e5dafb62d309d71c48c6cc99
      version: 8.0.0-rc5
      sdk: cli
      prepared: true
  publish-android:
    needs: retain
    uses: ./.github/workflows/release-android.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      source-sha: 690af7ce11df9419e5dafb62d309d71c48c6cc99
      version: 8.0.0-rc5
      release-type: rc
      publish-only: true
      reuse-signed: true
