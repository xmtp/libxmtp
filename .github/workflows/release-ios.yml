# .github/workflows/release-ios.yml
name: Release iOS SDK

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
        description: "dev, rc, or final"
      rc-number:
        required: false
        type: string
        description: "RC number (required for rc releases)"
      ref:
        required: true
        type: string
        description: "Git ref to build from"
      timestamp:
        required: false
        type: string
        description: "Shared UTC YYYYMMDDHHMMSS stamp minted once per Release run"
      pending-version:
        required: false
        type: string
      pending-kind:
        required: false
        type: string
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

jobs:
  check-push-permissions:
    uses: ./.github/workflows/check-release-push.yml
    secrets: inherit

  build-and-package:
    runs-on: warp-macos-15-arm64-12x
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
      artifact-url: ${{ steps.release.outputs.artifact-url }}
      checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-release-tools
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Compute version
        id: version
        env:
          REF: ${{ inputs.ref }}
          TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          BASE=$(xmtp-release compute-version --sdk ios --release-type final)
          if [ "${{ inputs.release-type }}" = "rc" ]; then
            VERSION=$(xmtp-release compute-version --sdk ios --release-type rc --rc-number ${{ inputs.rc-number }})
          elif [ "${{ inputs.release-type }}" = "dev" ]; then
            VERSION=$(xmtp-release compute-version --sdk ios --release-type dev --source-ref "$REF" --timestamp "$TIMESTAMP")
          elif [ "${{ inputs.release-type }}" = "nightly" ]; then
            # Belt-and-suspenders: release.yml already skips this whole job when
            # the gate isn't green or there are no conventional commits
            # (nothing-pending), so pending-* are populated whenever we reach
            # here. This guard only fires if that orchestration is bypassed.
            if [ -z "${{ inputs.pending-version }}" ] || [ -z "${{ inputs.pending-kind }}" ]; then
              echo "::error::nightly resolve called with empty pending version/kind"
              exit 1
            fi
            VERSION=$(xmtp-release resolve-sdk-version \
              --sdk ios --release-type nightly \
              --timestamp "$TIMESTAMP" \
              --pending-version "${{ inputs.pending-version }}" \
              --pending-kind "${{ inputs.pending-kind }}")
          else
            VERSION=$BASE
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base-version=$BASE" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"
      - name: Build xcframeworks
        run: dev/nix-shell 'nix build --max-jobs 1 --cores 2 .#ios-xcframeworks --out-link build/ios'

      - name: Package and checksum
        id: checksum
        run: |
          cp -rL build/ios/XmtpSdkFFI XmtpSdkFFI
          chmod -R u+w XmtpSdkFFI
          (cd XmtpSdkFFI && zip -qr ../XmtpSdkFFI.zip .)
          echo "checksum=$(shasum -a 256 XmtpSdkFFI.zip | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          TAG="libxmtp-ios-${SOURCE_SHA:0:7}"
          ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/XmtpSdkFFI.zip"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading artifacts"
            gh release upload "$TAG" XmtpSdkFFI.zip --clobber
          else
            gh release create "$TAG" \
              --target "$SOURCE_SHA" \
              --title "iOS $VERSION - libxmtp binaries" \
              --notes "Intermediate artifact release for iOS SDK $VERSION" \
              --prerelease \
              XmtpSdkFFI.zip
          fi

          echo "artifact-url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: [build-and-package, check-push-permissions]
    runs-on: warp-macos-15-arm64-12x
    permissions:
      contents: read
    outputs:
      version: ${{ needs.build-and-package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-release-tools
      - name: Update Package.swift and podspec
        env:
          VERSION: ${{ needs.build-and-package.outputs.version }}
          ARTIFACT_URL: ${{ needs.build-and-package.outputs.artifact-url }}
          CHECKSUM: ${{ needs.build-and-package.outputs.checksum }}
        run: |
          xmtp-release update-spm-checksum --sdk ios \
            --url "$ARTIFACT_URL" --checksum "$CHECKSUM"

          # For dev/rc releases, update podspec with suffixed version
          if [ "${{ inputs.release-type }}" != "final" ]; then
            # Write the full version (with suffix) directly to podspec
            xmtp-release set-manifest-version --sdk ios --version "$VERSION"
          fi
      - name: Prepare CocoaPods bundle
        env:
          ARTIFACT_URL: ${{ needs.build-and-package.outputs.artifact-url }}
          VERSION: ${{ needs.build-and-package.outputs.version }}
        working-directory: sdks/ios
        run: |
          set -euo pipefail
          curl -L "$ARTIFACT_URL" -o XmtpSdkFFI.zip
          unzip -qo XmtpSdkFFI.zip -d artifact
          rm -f XmtpSdkFFI.zip

          rm -rf bundle && mkdir -p bundle/Sources
          cp -r artifact/Sources/XmtpSdk bundle/Sources/
          mkdir -p Sources/XmtpSdk
          cp -r artifact/Sources/XmtpSdk/. Sources/XmtpSdk/
          cp -r artifact/XmtpSdkFFI.xcframework bundle/
          cp ReleaseArtifacts.json bundle/
          cp ../../LICENSE bundle/
          (cd bundle && zip -qry ../XMTP-${VERSION}.zip .)
          chmod -R u+w artifact bundle 2>/dev/null || true
          rm -rf artifact bundle
      - name: Detach HEAD
        run: git checkout --detach
      - name: Commit changes
        env:
          VERSION: ${{ needs.build-and-package.outputs.version }}
        run: |
          # Always commit Package.swift + updated bindings, only commit podspec for final releases
          if [ "${{ inputs.release-type }}" = "final" ]; then
            git add Package.swift sdks/ios/XMTP.podspec sdks/ios/ReleaseArtifacts.json sdks/ios/Sources/XmtpSdk
          else
            git add Package.swift sdks/ios/ReleaseArtifacts.json sdks/ios/Sources/XmtpSdk
          fi
          if ! git diff-index --quiet HEAD --; then
            git commit -m "release: iOS SDK $VERSION [skip ci]"
          else
            echo "No changes to commit"
          fi

      - name: Prepare release tag
        env:
          VERSION: ${{ needs.build-and-package.outputs.version }}
        run: |
          xmtp-release tag-release --sdk ios --version "$VERSION" --no-push
          git bundle create "$RUNNER_TEMP/release.bundle" "refs/tags/ios-$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tag-ios
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-release-bundle
          path: sdks/ios/XMTP-${{ needs.build-and-package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 1

  push-tag:
    needs: [prepare-release]
    uses: ./.github/workflows/push-release-tag.yml
    with:
      sdk: ios
      version: ${{ needs.prepare-release.outputs.version }}
      source-sha: ${{ github.sha }}
    secrets: inherit

  publish:
    needs: [prepare-release, push-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-release-bundle
          path: sdks/ios
      - name: Create release and upload bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        working-directory: sdks/ios
        run: |
          TAG="ios-${VERSION}"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "XMTP-${VERSION}.zip" --clobber
          else
            NOTES_ARGS=(--notes "iOS SDK version $VERSION")
            if [ "${{ inputs.release-type }}" = "final" ]; then
              NOTES_FILE="../../docs/release-notes/ios/${VERSION}.md"
              if [ -f "$NOTES_FILE" ]; then
                NOTES_ARGS=(--notes-file "$NOTES_FILE")
              fi
            fi
            PRERELEASE_FLAG=""
            if [ "${{ inputs.release-type }}" != "final" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" \
              --title "iOS SDK $VERSION" \
              "${NOTES_ARGS[@]}" \
              $PRERELEASE_FLAG \
              "XMTP-${VERSION}.zip"
          fi
