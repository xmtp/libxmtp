name: 'Release: iOS SDK'
on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
        description: dev, rc, or final
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
      dry-run:
        type: boolean
        required: false
        default: false
      build-only:
        type: boolean
        required: false
        default: false
      publish-only:
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: The published version string
        value: ${{ inputs.version }}
jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
  prepare-release:
    name: Build and validate SwiftPM package
    needs: [check-push-permissions]
    if: inputs.publish-only != true
    runs-on: warp-macos-15-arm64-12x
    env:
      NIX_DEVSHELL: ios
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      XMTP_SDK_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
          fetch-depth: 0
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.3'
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ github.token }}
      - name: Materialize the shared SDK version
        uses: ./.github/actions/release-source
      - name: Build XCFramework and generated Swift sources
        run: |
          nix build .#ios-xcframeworks --out-link build/ios
      - name: Package the checked SwiftPM archive
        run: |
          set -euo pipefail
          mkdir -p target/release/ios
          cp -RL build/ios/XmtpSdkFFI target/release/ios/XmtpSdkFFI
          chmod -R u+w target/release/ios/XmtpSdkFFI
          (cd target/release/ios/XmtpSdkFFI && zip -qry ../XmtpSdkFFI.zip .)
          cp -RL target/release/ios/XmtpSdkFFI/Sources/XmtpSdk/. sdks/ios/Sources/XmtpSdk/
          rm -rf target/release/ios/XmtpSdkFFI
          CHECKSUM=$(shasum -a 256 target/release/ios/XmtpSdkFFI.zip | awk '{print $1}')
          export CHECKSUM
          python3 - <<'RECEIPT'
          import json, os
          from pathlib import Path
          url=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/libxmtp-ios-{os.environ['VERSION']}/XmtpSdkFFI.zip"
          Path('sdks/ios/ReleaseArtifacts.json').write_text(json.dumps(dict(url=url,sha256=os.environ['CHECKSUM'],sourceSha=os.environ['SOURCE_SHA'],version=os.environ['VERSION']),indent=2)+'\n')
          RECEIPT
          # Only generated Apple release metadata belongs in the direct release commit.
          git restore Cargo.toml Cargo.lock sdks/android/gradle.properties sdks/node/package.json sdks/browser/package.json sdks/agent/package.json sdks/react-native/package.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sdks/ios/ReleaseArtifacts.json sdks/ios/Sources/XmtpSdk
          git -c commit.gpgsign=false commit -m "release: iOS SDK $VERSION"
          git tag "ios-$VERSION"
          git bundle create target/release/ios/release.bundle "refs/tags/ios-$VERSION"
          dev/nix-shell --shell js-node --command python3.11 dev/sdk_version.py seal target/release/ios --plan "$RUNNER_TEMP/sdk-release-plan/release-plan.json"
      - name: Install the prepared SwiftPM release archive
        run: dev/nix-shell --command python3.11 dev/check_swiftpm_release.py target/release/ios/XmtpSdkFFI.zip "$RUNNER_TEMP/sdk-release-plan/release-plan.json"
      - name: Store checked SwiftPM product
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-bundle
          path: target/release/ios
          if-no-files-found: error
          retention-days: 7
      - name: Store release tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tag-ios
          path: target/release/ios/release.bundle
          if-no-files-found: error
          retention-days: 7
    permissions:
      contents: read
  push-tag:
    name: Tag
    needs: [publish, check-push-permissions]
    if: "!cancelled() && needs.publish.result == 'success' && needs.check-push-permissions.result == 'success'"
    uses: ./.github/workflows/push-release-tag.yml
    with:
      sdk: ios
      version: ${{ inputs.version }}
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
    secrets: inherit
  publish:
    name: Publish SwiftPM archive
    needs: [prepare-release, check-push-permissions]
    if: "!cancelled() && needs.check-push-permissions.result == 'success' && inputs.dry-run != true && inputs.build-only != true && (inputs.publish-only || needs.prepare-release.result == 'success')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ github.token }}
      - name: Materialize the shared SDK version
        uses: ./.github/actions/release-source
      - name: Download checked SwiftPM product
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-release-bundle
          path: target/release/ios
      - name: Verify and publish immutable SwiftPM archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          dev/nix-shell --shell js-node --command python3.11 dev/sdk_version.py verify target/release/ios --plan "$RUNNER_TEMP/sdk-release-plan/release-plan.json"
          TAG="libxmtp-ios-$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-ios"
            gh release download "$TAG" --pattern XmtpSdkFFI.zip --dir "$RUNNER_TEMP/existing-ios"
            cmp target/release/ios/XmtpSdkFFI.zip "$RUNNER_TEMP/existing-ios/XmtpSdkFFI.zip"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_SHA"
          else
            gh release create "$TAG" target/release/ios/XmtpSdkFFI.zip --target "$SOURCE_SHA" --prerelease --title "iOS binaries $VERSION" --notes "SwiftPM binary archive for $SOURCE_SHA"
          fi
  publish-release:
    name: Publish iOS SDK release
    needs: [push-tag, check-push-permissions]
    if: "!cancelled() && needs.push-tag.result == 'success' && needs.check-push-permissions.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the SDK release after its archive and tag exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          if ! gh release view "ios-$VERSION" >/dev/null 2>&1; then
            FLAGS=()
            if [ "$RELEASE_TYPE" != final ]; then FLAGS+=(--prerelease); fi
            gh release create "ios-$VERSION" --verify-tag --title "iOS SDK $VERSION" --notes "SwiftPM SDK $VERSION" "${FLAGS[@]}"
          fi
