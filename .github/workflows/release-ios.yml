# .github/workflows/release-ios.yml
name: "Release: iOS SDK"

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
        description: "dev, rc, or final"
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha }}
    secrets: inherit

  build-and-package:
    name: Build XCFramework
    needs: [check-push-permissions]
    # Paid macOS: the iOS outputs are keyed to Xcode 26.3 at
    # /Applications/Xcode_26.3.app (nix/lib/ios-env.nix), and a cache miss
    # compiles Rust for iOS, about 35 minutes on a 3-core hosted Mac.
    runs-on: warp-macos-15-arm64-12x
    permissions:
      contents: write
    outputs:
      artifact-url: ${{ steps.release.outputs.artifact-url }}
      checksum: ${{ steps.checksum.outputs.checksum }}
    env:
      NIX_DEVSHELL: ios
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      # The iOS outputs are keyed to one Xcode (`xcode` in nix/lib/ios-env.nix)
      # and a build with another fails, so select it before the build.
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ github.token }}
      - name: Build xcframeworks
        # "Package and checksum" reads build/ios/XmtpSdkFFI.
        run: nix build .#ios-xcframeworks --out-link build/ios

      - name: Package and checksum
        id: checksum
        run: |
          cp -rL build/ios/XmtpSdkFFI XmtpSdkFFI
          chmod -R u+w XmtpSdkFFI
          (cd XmtpSdkFFI && zip -qr ../XmtpSdkFFI.zip .)
          echo "checksum=$(shasum -a 256 XmtpSdkFFI.zip | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          TAG="libxmtp-ios-${SOURCE_SHA:0:7}"
          ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/XmtpSdkFFI.zip"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading artifacts"
            gh release upload "$TAG" XmtpSdkFFI.zip --clobber
          else
            gh release create "$TAG" \
              --target "$SOURCE_SHA" \
              --title "iOS $VERSION - libxmtp binaries" \
              --notes "Intermediate artifact release for iOS SDK $VERSION" \
              --prerelease \
              XmtpSdkFFI.zip
          fi

          echo "artifact-url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

  # Linux: this job edits files, downloads the binaries, zips, and commits.
  # It uses no Xcode.
  prepare-release:
    name: Commit SwiftPM release
    needs: [build-and-package, check-push-permissions]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
          fetch-depth: 0
          # Full history for the release tag, without blobs; git-cliff, which
          # fails on a blobless clone, does not run here.
          filter: blob:none
      - name: Set up release tools
        uses: ./.github/actions/setup-release-tools
      - name: Update Package.swift and podspec
        env:
          VERSION: ${{ inputs.version }}
          ARTIFACT_URL: ${{ needs.build-and-package.outputs.artifact-url }}
          CHECKSUM: ${{ needs.build-and-package.outputs.checksum }}
        run: |
          xmtp-release update-spm-checksum --sdk ios \
            --url "$ARTIFACT_URL" --checksum "$CHECKSUM"

          # For dev/rc releases, update podspec with suffixed version
          if [ "${{ inputs.release-type }}" != "final" ]; then
            # Write the full version (with suffix) directly to podspec
            xmtp-release set-manifest-version --sdk ios --version "$VERSION"
          fi
      - name: Prepare CocoaPods bundle
        env:
          ARTIFACT_URL: ${{ needs.build-and-package.outputs.artifact-url }}
          VERSION: ${{ inputs.version }}
        working-directory: sdks/ios
        run: |
          set -euo pipefail
          curl -L "$ARTIFACT_URL" -o XmtpSdkFFI.zip
          unzip -qo XmtpSdkFFI.zip -d artifact
          rm -f XmtpSdkFFI.zip

          rm -rf bundle && mkdir -p bundle/Sources
          cp -r artifact/Sources/XmtpSdk bundle/Sources/
          mkdir -p Sources/XmtpSdk
          cp -r artifact/Sources/XmtpSdk/. Sources/XmtpSdk/
          cp -r artifact/XmtpSdkFFI.xcframework bundle/
          cp ReleaseArtifacts.json bundle/
          cp ../../LICENSE bundle/
          (cd bundle && zip -qry ../XMTP-${VERSION}.zip .)
          chmod -R u+w artifact bundle 2>/dev/null || true
          rm -rf artifact bundle
      - name: Detach HEAD
        run: git checkout --detach
      - name: Commit changes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Always commit Package.swift + updated bindings, only commit podspec for final releases
          if [ "${{ inputs.release-type }}" = "final" ]; then
            git add Package.swift sdks/ios/XMTP.podspec sdks/ios/ReleaseArtifacts.json sdks/ios/Sources/XmtpSdk
          else
            git add Package.swift sdks/ios/ReleaseArtifacts.json sdks/ios/Sources/XmtpSdk
          fi
          if ! git diff-index --quiet HEAD --; then
            git commit -m "release: iOS SDK $VERSION [skip ci]"
          else
            echo "No changes to commit"
          fi

      - name: Prepare release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          xmtp-release tag-release --sdk ios --version "$VERSION" --no-push
          git bundle create "$RUNNER_TEMP/release.bundle" "refs/tags/ios-$VERSION"
      - name: Store release tag
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tag-ios
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 1
      - name: Store CocoaPods bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-bundle
          path: sdks/ios/XMTP-${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 1

  push-tag:
    name: Tag
    needs: [prepare-release, check-push-permissions]
    uses: ./.github/workflows/push-release-tag.yml
    with:
      sdk: ios
      version: ${{ needs.prepare-release.outputs.version }}
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
    secrets: inherit

  publish:
    name: Create iOS GitHub release
    needs: [prepare-release, push-tag, check-push-permissions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - name: Download CocoaPods bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-release-bundle
          path: sdks/ios
      - name: Create release and upload bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        working-directory: sdks/ios
        run: |
          TAG="ios-${VERSION}"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "XMTP-${VERSION}.zip" --clobber
          else
            NOTES_ARGS=(--notes "iOS SDK version $VERSION")
            if [ "${{ inputs.release-type }}" = "final" ]; then
              NOTES_FILE="../../docs/release-notes/ios/${VERSION}.md"
              if [ -f "$NOTES_FILE" ]; then
                NOTES_ARGS=(--notes-file "$NOTES_FILE")
              fi
            fi
            PRERELEASE_FLAG=""
            if [ "${{ inputs.release-type }}" != "final" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" \
              --title "iOS SDK $VERSION" \
              "${NOTES_ARGS[@]}" \
              $PRERELEASE_FLAG \
              "XMTP-${VERSION}.zip"
          fi
