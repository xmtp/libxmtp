name: "Release: Node SDK"

on:
  workflow_call:
    inputs:
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      build-only:
        description: Retain checked products without publication
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  build:
    name: Build
    needs: [check-push-permissions]
    uses: ./.github/workflows/build-sdk-node-platforms.yml
    with:
      ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      sdk-release: true
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  publish:
    name: Publish
    needs: [build, check-push-permissions]
    uses: ./.github/workflows/npm-prepare.yml
    with:
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
      package-dir: target/sdk-packages/node
      sdk: node-sdk
      version: ${{ inputs.version }}
      artifact-pattern: ${{ needs.build.outputs.artifact }}
      artifact-path: target/sdk-packages/node
      ignore-scripts: true
      dry-run: ${{ inputs.dry-run }}
      prepare-only: ${{ inputs.build-only }}
    secrets: inherit
