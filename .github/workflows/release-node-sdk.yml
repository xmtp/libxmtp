name: Release Node SDK

on:
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
        description: "dev, rc, or final"
      rc-number:
        required: false
        type: string
        description: "RC number (required for rc releases)"
      ref:
        required: true
        type: string
        description: "Git ref to build from"
      timestamp:
        required: false
        type: string
        description: "Shared UTC YYYYMMDDHHMMSS stamp minted once per Release run"
      pending-version:
        required: false
        type: string
      pending-kind:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Pin the release source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-release-tools

      - name: Compute version
        id: version
        env:
          REF: ${{ inputs.ref }}
          TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          if [ "${{ inputs.release-type }}" = "rc" ]; then
            VERSION=$(xmtp-release compute-version --sdk node-sdk --release-type rc --rc-number ${{ inputs.rc-number }})
          elif [ "${{ inputs.release-type }}" = "dev" ]; then
            VERSION=$(xmtp-release compute-version --sdk node-sdk --release-type dev --source-ref "$REF" --timestamp "$TIMESTAMP")
          elif [ "${{ inputs.release-type }}" = "nightly" ]; then
            if [ -z "${{ inputs.pending-version }}" ] || [ -z "${{ inputs.pending-kind }}" ]; then
              echo "::error::nightly resolve called with empty pending version/kind"
              exit 1
            fi
            VERSION=$(xmtp-release resolve-sdk-version \
              --sdk node-sdk --release-type nightly \
              --timestamp "$TIMESTAMP" \
              --pending-version "${{ inputs.pending-version }}" \
              --pending-kind "${{ inputs.pending-kind }}")
          else
            VERSION=$(xmtp-release compute-version --sdk node-sdk --release-type final)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

  build:
    needs: setup
    uses: ./.github/workflows/build-sdk-node-platforms.yml
    with:
      ref: ${{ needs.setup.outputs.source-sha }}
    secrets: inherit

  publish:
    needs: [setup, build]
    uses: ./.github/workflows/npm-publish.yml
    with:
      ref: ${{ needs.setup.outputs.source-sha }}
      package-dir: target/sdk-packages/node
      sdk: node-sdk
      version: ${{ needs.setup.outputs.version }}
      artifact-pattern: ${{ needs.build.outputs.artifact }}
      artifact-path: target/sdk-packages/node
      ignore-scripts: true
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
