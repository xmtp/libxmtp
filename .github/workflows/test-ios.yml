name: Test iOS

on:
  workflow_call:
    inputs:
      run-unit:
        type: boolean
        default: true
      run-platform:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    if: inputs.run-unit || inputs.run-platform
    runs-on: warp-macos-15-arm64-6x
    name: Tests (iOS)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: taiki-e/install-action@just
      - name: Check native Apple toolchain
        env:
          NIX_DEVSHELL: ios
        run: dev/nix-shell 'bash dev/check-apple-toolchain'
      - name: Run iOS unit tests and examples
        if: inputs.run-unit
        env:
          NIX_DEVSHELL: ios
        # The separate Swift job owns the seam and consumer proofs.
        run: dev/nix-shell 'just backend ci bash -c "just ios test skip-seams && just ios check-examples"'
      - name: Run iOS simulator tests
        if: inputs.run-platform
        env:
          NIX_DEVSHELL: ios
        run: dev/nix-shell 'just backend ci just ios test-simulator'
      - name: Retain native service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
