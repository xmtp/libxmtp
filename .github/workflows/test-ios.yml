name: Test iOS

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  wait-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the commit image
        env:
          BACKEND_IMAGE: ghcr.io/xmtp/backend:sha-${{ github.sha }}
        run: |
          for i in $(seq 1 240); do
            if docker manifest inspect "$BACKEND_IMAGE" > /dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for the backend image ($i/240)"
            sleep 15
          done
          echo "::error::Backend image was not published: $BACKEND_IMAGE"
          exit 1

  deploy-backend:
    needs: wait-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Deploy Backend
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
      app_name: ${{ steps.deploy.outputs.app_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: ./.github/actions/setup-nix
        with:
          nix-disk: "false"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Deploy test infrastructure
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="libxmtp-ios-test-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          ./sdks/ios/dev/fly/deploy "$APP_NAME" "ghcr.io/xmtp/backend:sha-${{ github.sha }}"
          echo "backend_url=https://${APP_NAME}.fly.dev" >> "$GITHUB_OUTPUT"
      - name: Wait for services
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          BACKEND_HOST="${{ steps.deploy.outputs.app_name }}.fly.dev"
          for i in $(seq 1 60); do
            if nix run nixpkgs#grpc-health-probe -- -addr="${BACKEND_HOST}:443" -tls; then
              echo "Services ready"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          exit 1

  tests:
    runs-on: warp-macos-15-arm64-6x
    needs: deploy-backend
    name: Tests (iOS)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: taiki-e/install-action@just
      - name: Build and test
        env:
          NIX_DEVSHELL: ios
          XMTP_BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: just ios test
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy-backend, tests]
    if: always()
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="${{ needs.deploy-backend.outputs.app_name }}"
          [ -n "$APP_NAME" ] && flyctl apps destroy "$APP_NAME" --yes || true
