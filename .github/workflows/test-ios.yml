name: Test iOS

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # One job builds the xcframework once (`sdks/ios/dev/bindings` skips the
  # copy when the store path is unchanged) and runs every iOS check.
  tests:
    runs-on: warp-macos-15-arm64-6x
    name: Tests (iOS)
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      # The Xcode of the iOS outputs (`xcode` in nix/lib/ios-env.nix).
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just
      - name: Check native Apple toolchain
        run: dev/nix-shell 'dev/check-apple-toolchain'
      # The tracked Swift under sdks/ios/Sources must match the generated
      # Swift: a changed, deleted, or new file fails.
      - name: Build the iOS bindings and check the tracked Swift
        run: |
          dev/nix-shell 'sdks/ios/dev/bindings'
          drift=$(git status --porcelain -- sdks/ios/Sources)
          if [ -n "$drift" ]; then
            echo "::error title=Stale generated Swift::run sdks/ios/dev/bindings and commit sdks/ios/Sources"
            printf '%s\n' "$drift"
            git diff --stat -- sdks/ios/Sources
            exit 1
          fi
      - name: Run iOS unit tests
        run: dev/nix-shell 'just backend ci just ios test'
      - name: Check Swift consumers
        run: dev/nix-shell 'just ios check-consumer'
      - name: Run iOS simulator tests
        run: dev/nix-shell 'just backend ci just ios test-simulator'
      - name: Retain native service logs
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
