name: "Test: iOS SDK"

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true

permissions:
  contents: read

jobs:
  # One job builds the xcframework once (`sdks/ios/dev/bindings` skips the
  # copy when the store path is unchanged) and runs every iOS check.
  tests:
    runs-on: ${{ inputs.runner }}
    name: Lint and tests (macOS, simulator)
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: ios
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      # The Xcode of the iOS outputs (`xcode` in nix/lib/ios-env.nix).
      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"
      - name: dev/nix-shell 'dev/check-apple-toolchain'
        run: dev/nix-shell 'dev/check-apple-toolchain'
      # SwiftLint and SwiftFormat take seconds, so they run here instead of in
      # a macOS lint job of their own.
      - name: dev/nix-shell 'just ios lint'
        run: dev/nix-shell 'just ios lint'
      # The tracked Swift under sdks/ios/Sources must match the generated
      # Swift: a changed, deleted, or new file fails.
      - name: Build the iOS bindings and check the tracked Swift
        run: |
          dev/nix-shell 'sdks/ios/dev/bindings'
          drift=$(git status --porcelain -- sdks/ios/Sources)
          if [ -n "$drift" ]; then
            echo "::error title=Stale generated Swift::run sdks/ios/dev/bindings and commit sdks/ios/Sources"
            printf '%s\n' "$drift"
            git diff --stat -- sdks/ios/Sources
            exit 1
          fi
      - name: dev/nix-shell 'just backend ci just ios test'
        run: dev/nix-shell 'just backend ci just ios test'
      - name: dev/nix-shell 'just ios check-consumer'
        run: dev/nix-shell 'just ios check-consumer'
      - name: dev/nix-shell 'just backend ci just ios test-simulator'
        run: dev/nix-shell 'just backend ci just ios test-simulator'
      - name: Retain native service logs
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
