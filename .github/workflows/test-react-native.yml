# The React Native device chain: components, the npm package, then the
# installed bare and Expo apps on an emulator and a simulator. The unit checks
# that need no device run in check-react-native.yml.
#
# Pull request runs assemble the partial test package (x86_64 Android, iOS
# simulator); every other event assembles the full release package. Release
# consumers still test the exact versioned tarball before npm publish.
name: "Test: React Native SDK"
on:
  workflow_dispatch:
    inputs:
      scope:
        description: full (Android and iOS, bare and Expo) or android-smoke (Android bare app)
        type: choice
        options: [full, android-smoke]
        default: full
      package:
        description: auto (test on pull requests, release otherwise), test, or release
        type: choice
        options: [auto, test, release]
        default: auto
      debug:
        description: Record and upload the product identity receipts
        type: boolean
        default: false
  workflow_call:
    inputs:
      scope:
        description: full (Android and iOS, bare and Expo) or android-smoke (Android bare app)
        type: string
        default: full
      package:
        description: auto (test on pull requests, release otherwise), test, or release
        type: string
        default: auto
      debug:
        description: Record and upload the product identity receipts
        type: boolean
        default: false
    secrets:
      CACHIX_PR_AUTH_TOKEN:
        required: false
permissions:
  contents: read
env:
  RN_CACHE_WRITER: ${{ secrets.CACHIX_PR_AUTH_TOKEN != '' }}
  # The test package exists only for pull requests and explicit requests.
  RN_PACKAGE_KIND: ${{ (inputs.package == 'test' || ((inputs.package || 'auto') == 'auto' && github.event_name == 'pull_request')) && 'test' || 'release' }}
  RN_DEBUG: ${{ inputs.debug == true }}
jobs:
  components:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            name: Build JS and Android parts (Linux)
            runner: blacksmith-16vcpu-ubuntu-2404
          # Trial 2026-10-19: was warp-macos-26-arm64-12x.
          - system: aarch64-darwin
            name: Build iOS parts (macOS)
            runner: warp-macos-26-arm64-6x
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: ci
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Build the components
        uses: ./.github/actions/react-native-product
        with:
          stage: components
          system: ${{ matrix.system }}
          source-sha: ${{ github.sha }}
          package-version: ""
          package-kind: ${{ env.RN_PACKAGE_KIND }}
          exchange: ${{ env.RN_CACHE_WRITER != 'true' }}
          artifact-prefix: rn
          cache-mode: ci
          debug: ${{ env.RN_DEBUG }}
      - name: Finish component cache uploads
        if: ${{ env.RN_CACHE_WRITER == 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        shell: bash
        run: |
          jq -r '.[]' "$XMTP_RN_ROOTS" > "$RUNNER_TEMP/rn-roots"
          while IFS= read -r path; do cachix push xmtp-pr "$path"; done < "$RUNNER_TEMP/rn-roots"

  package:
    name: Assemble npm package
    needs: components
    # Trial 2026-10-19: was blacksmith-16vcpu-ubuntu-2404. The job copies and
    # packs files; it compiles nothing.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: ci
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Assemble the package
        uses: ./.github/actions/react-native-product
        with:
          stage: package
          system: x86_64-linux
          source-sha: ${{ github.sha }}
          package-version: ""
          package-kind: ${{ env.RN_PACKAGE_KIND }}
          exchange: ${{ env.RN_CACHE_WRITER != 'true' }}
          artifact-prefix: rn
          cache-mode: ci
          debug: ${{ env.RN_DEBUG }}
      - name: Finish package cache upload
        if: ${{ env.RN_CACHE_WRITER == 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
        run: cachix push xmtp-pr "$XMTP_RN_PACKAGE_DIR"

  consumers:
    name: ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        # android-smoke: the bare Android app of the test package only.
        include: ${{ fromJSON(inputs.scope == 'android-smoke' && '[{"platform":"android","system":"x86_64-linux","runner":"blacksmith-16vcpu-ubuntu-2404","consumers":"bare","name":"Installed-app tests (Android bare)"}]' || '[{"platform":"android","system":"x86_64-linux","runner":"blacksmith-16vcpu-ubuntu-2404","consumers":"all","name":"Installed-app tests (Android)"},{"platform":"ios","system":"aarch64-darwin","runner":"warp-macos-26-arm64-12x","consumers":"all","name":"Installed-app tests (iOS)"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      XMTP_SDK_BUILD: nix
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Check the scope
        env:
          SCOPE: ${{ inputs.scope }}
          KIND: ${{ env.RN_PACKAGE_KIND }}
        run: |
          case "$SCOPE" in full|android-smoke) ;; *) echo "::error::unknown scope: $SCOPE"; exit 1 ;; esac
          # Only the test package has a bare-only Android app output.
          if [[ "$SCOPE" == android-smoke && "$KIND" != test ]]; then
            echo "::error::scope android-smoke needs the test package"; exit 1
          fi
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: ci
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Install the Node peer dependencies
        uses: ./.github/actions/setup-js
        with:
          cache-mode: ci
          filter: "@xmtp/node-sdk..."
      - name: Build the installed apps
        uses: ./.github/actions/react-native-product
        with:
          stage: consumers
          system: ${{ matrix.system }}
          source-sha: ${{ github.sha }}
          package-version: ""
          package-kind: ${{ env.RN_PACKAGE_KIND }}
          consumers: ${{ matrix.consumers }}
          exchange: ${{ env.RN_CACHE_WRITER != 'true' }}
          artifact-prefix: rn
          cache-mode: ci
          debug: ${{ env.RN_DEBUG }}
      - name: Run the installed-app tests
        uses: ./.github/actions/react-native-conformance
        with:
          platform: ${{ matrix.platform }}
          consumers: ${{ matrix.consumers }}
          artifact-prefix: react-native
