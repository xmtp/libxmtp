name: Test Native SDK Check
'on':
  workflow_call:
    inputs:
      run-ios:
        type: boolean
        default: true
      run-android:
        type: boolean
        default: true
jobs:
  check-swift:
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || 'kache-s3-reader' }}
    strategy:
      fail-fast: false
      matrix:
        target:
        - aarch64-apple-darwin
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache: 'true'
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: bindings-check-${{ matrix.target }}
        kache-readonly: 'false'
    - name: Check native SDK compile
      env:
        NIX_DEVSHELL: ios
      run: dev/nix-shell 'dev/agent-run cargo check --locked -p xmtp_sdk --target ${{ matrix.target }}'
    if: inputs.run-ios
  check-android:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      NIX_DEVSHELL: android
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: android
        gradle-disk: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
        kache: 'true'
    - uses: taiki-e/install-action@just
    - name: Start backend
      run: dev/nix-shell 'just backend up'
    - name: Check Android SDK compile
      run: dev/nix-shell 'just android check'
    - name: Retain backend startup diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: android-check-backend-startup-logs
        path: ${{ runner.temp }}/backend-startup-logs
        if-no-files-found: ignore
        retention-days: 7
    if: inputs.run-android
  result:
    if: always()
    needs:
    - check-swift
    - check-android
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - env:
        PASSED: ${{ (!inputs.run-ios || needs.check-swift.result == 'success') && (!inputs.run-android || needs.check-android.result
          == 'success') }}
      run: test "$PASSED" = true
