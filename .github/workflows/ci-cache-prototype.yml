name: Compiler cache prototype
on:
  push:
    branches: [codex/ci-efficiency-investigation]
    paths: [dev/ci/cache-trial.trigger]
  workflow_dispatch:
    inputs:
      arm:
        description: Compiler control or cache arm
        type: choice
        options: [current, no-incremental, sccache, kache]
        default: kache
      scenario:
        description: Stable paths or a separate checkout for the warm sample
        type: choice
        options: [stable, cross-checkout]
        default: stable
      diagnostics:
        description: Save Cargo commands and compiler key diagnostics (untimed)
        type: boolean
        default: true
      verify:
        description: Add untimed Kache compile-and-compare sample
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: compiler-cache-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    if: github.ref == 'refs/heads/codex/ci-efficiency-investigation'
    name: Compiler cache (${{ matrix.arm }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(format('["{0}"]', inputs.arm || 'kache')) }}
    env:
      NIX_DEVSHELL: rust
      TRIAL_DIR: ${{ github.workspace }}/target/cache-trial/${{ matrix.arm }}
      KACHE_CACHE_DIR: ${{ github.workspace }}/target/cache-trial/${{ matrix.arm }}/action-store
    steps:
      - name: Record runner start
        run: date -u +%FT%TZ > "$RUNNER_TEMP/cache-trial-start.txt"
      - uses: actions/checkout@v6
      - name: Create initial checkpoint
        env:
          SCENARIO: ${{ inputs.scenario || 'stable' }}
          DIAGNOSTICS: ${{ github.event_name == 'push' || inputs.diagnostics }}
        run: |
          args=(init --arm '${{ matrix.arm }}' --output "$TRIAL_DIR" --scenario "$SCENARIO")
          if [[ "$DIAGNOSTICS" == true ]]; then args+=(--diagnostics); fi
          python3 dev/ci/cache-trial.py "${args[@]}"
      - name: Save initial checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.arm }}-init-${{ github.run_attempt }}
          path: target/cache-trial/${{ matrix.arm }}/trial.json
          retention-days: 7
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
          nix-disk: "false"
          sccache: "false"
      - uses: ./.github/actions/setup-js
      - name: Install Kache after Nix
        if: matrix.arm == 'kache'
        uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c
        with:
          version: v1.0.0
          cache-executables: "true"
          pr-comment: "false"
          github-cache: "false"
          save-cache: "false"
          warm: "false"
      - name: Cold SDK generation
        run: dev/nix-shell --command python3 dev/ci/cache-trial.py sample --output "$TRIAL_DIR" --phase cold
      - name: Save cold checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.arm }}-cold-${{ github.run_attempt }}
          path: |
            target/cache-trial/${{ matrix.arm }}/trial.json
            target/cache-trial/${{ matrix.arm }}/cold-*/build.log
            target/cache-trial/${{ matrix.arm }}/cold-*/context.json
            target/cache-trial/${{ matrix.arm }}/cold-*/key-diagnostics.json
            target/cache-trial/${{ matrix.arm }}/cold-*/sccache-debug.log
            target/cache-trial/${{ matrix.arm }}/cold-*/cache-stats.json
            target/cache-trial/${{ matrix.arm }}/cold-*/runtime/events.jsonl
            target/cache-trial/${{ matrix.arm }}/cold-*/artifacts/artifacts.json
          retention-days: 7
      - name: Warm SDK generation with fresh Cargo outputs
        run: dev/nix-shell --command python3 dev/ci/cache-trial.py sample --output "$TRIAL_DIR" --phase warm
      - name: Save warm checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.arm }}-warm-${{ github.run_attempt }}
          path: |
            target/cache-trial/${{ matrix.arm }}/trial.json
            target/cache-trial/${{ matrix.arm }}/warm-*/build.log
            target/cache-trial/${{ matrix.arm }}/warm-*/context.json
            target/cache-trial/${{ matrix.arm }}/warm-*/key-diagnostics.json
            target/cache-trial/${{ matrix.arm }}/warm-*/sccache-debug.log
            target/cache-trial/${{ matrix.arm }}/warm-*/cache-stats.json
            target/cache-trial/${{ matrix.arm }}/warm-*/runtime/events.jsonl
            target/cache-trial/${{ matrix.arm }}/warm-*/artifacts/artifacts.json
          retention-days: 7
      - name: Untimed Kache comparison
        if: matrix.arm == 'kache' && inputs.verify
        run: dev/nix-shell --command python3 dev/ci/cache-trial.py sample --output "$TRIAL_DIR" --phase verify
      - name: Save comparison and allocation checkpoint
        if: always()
        run: |
          cp "$RUNNER_TEMP/cache-trial-start.txt" "$TRIAL_DIR/runner-start.txt"
          date -u +%FT%TZ > "$TRIAL_DIR/runner-checkpoint.txt"
          echo 'Final job API timestamps include setup, artifacts, post steps, and cancellation cost.' >> "$GITHUB_STEP_SUMMARY"
          python3 dev/ci/cache-trial.py summary --output "$TRIAL_DIR" >> "$GITHUB_STEP_SUMMARY"
      - name: Save final checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.arm }}-final-${{ github.run_attempt }}
          path: |
            target/cache-trial/${{ matrix.arm }}/trial.json
            target/cache-trial/${{ matrix.arm }}/runner-*.txt
            target/cache-trial/${{ matrix.arm }}/verify-*/build.log
            target/cache-trial/${{ matrix.arm }}/verify-*/context.json
            target/cache-trial/${{ matrix.arm }}/verify-*/key-diagnostics.json
            target/cache-trial/${{ matrix.arm }}/verify-*/sccache-debug.log
            target/cache-trial/${{ matrix.arm }}/verify-*/runtime/events.jsonl
            target/cache-trial/${{ matrix.arm }}/verify-*/cache-stats.json
          retention-days: 7
