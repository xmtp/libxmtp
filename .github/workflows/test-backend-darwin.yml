name: "Test: Darwin backend smoke"

on:
  workflow_call:
    inputs:
      runner:
        description: The macOS runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
    secrets:
      CACHIX_PR_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  smoke:
    name: Native backend and service readiness (macOS)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      NIX_DEVSHELL: rust
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Build and start the native backend and wait for test services
        run: dev/nix-shell 'just backend ci true'
      - name: Retain native service logs
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: darwin-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
