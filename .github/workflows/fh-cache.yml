name: Cache all Nix Outputs
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - self-hosted
    tags:
      - v?[0-9]+.[0-9]+.[0-9]+*
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-16vcpu-ubuntu-2404, warp-macos-26-arm64-12x]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: fh-cache
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: nix-only
          kache-readonly: "true"
      - name: Check source formatting
        run: nix fmt -- --fail-on-change
      - name: Install omnix
        run: nix profile install nixpkgs#omnix
      - name: Build all flake outputs
        run: om ci run --include-all-dependencies --results=om.json -- --keep-going
      - name: Pin outputs to cachix
        # if: github.ref_name == 'main'
        run: |
          SYSTEM=$(jq -r '.systems[0]' om.json)
          jq -r --arg prefix "$BRANCH_NAME" --arg sys "$SYSTEM" \
            '.result.omnix.build.byName | to_entries[] | "\($prefix)-\($sys)-\(.key) \(.value)"' \
            om.json | while read -r pin_name store_path; do
              echo "Pinning: $pin_name => $store_path"
              cachix pin xmtp "$pin_name" "$store_path"
            done
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
