name: Manual public SDK recovery
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  NIX_DEVSHELL: js-node
jobs:
  recovery:
    name: Test (node-sdk) recovery
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: web
        docker-builder: 'true'
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
    - name: Start backend
      run: dev/nix-shell 'just backend up'
    - name: Build backend for graceful restart
      run: dev/nix-shell 'just backend build'
    - name: Run public recovery matrix
      env:
        XMTP_RECOVERY_BACKEND_BINARY: ${{ github.workspace }}/result/bin/xmtp-backend
      run: dev/nix-shell 'just js test-node-sdk-ci test/streamRecovery.test.ts'
    - name: Stop test services
      if: always()
      run: dev/nix-shell 'just backend down'
