name: "Test: Node SDK stream recovery (manual)"
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  NIX_DEVSHELL: js-node
  # JS jobs test the release-profile Nix products (products_sdk_js), not a
  # cargo debug build.
  XMTP_SDK_BUILD: nix
jobs:
  recovery:
    name: Stream recovery tests
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: read
        github-token: ${{ github.token }}
    - name: Set up JavaScript
      uses: ./.github/actions/setup-js
      with:
        cache-mode: read
    - name: Start backend
      run: dev/nix-shell 'just backend up'
    - name: Build backend for graceful restart
      run: dev/nix-shell 'just backend build'
    - name: Run public recovery matrix
      env:
        XMTP_RECOVERY_BACKEND_BINARY: ${{ github.workspace }}/result/bin/xmtp-backend
      run: dev/nix-shell 'just js test-node-sdk-ci test/streamRecovery.test.ts'
    - name: Stop test services
      if: always()
      run: dev/nix-shell 'just backend down'
