name: Manual public SDK recovery
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  NIX_DEVSHELL: js-node
jobs:
  recovery:
    name: Test (node-sdk) recovery
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: web
        docker-builder: 'true'
        github-token: ${{ github.token }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: sdk-recovery
        kache-readonly: "true"
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
    - name: Start backend
      run: dev/nix-shell 'just backend up'
    - name: Build backend for graceful restart
      run: dev/nix-shell 'just backend build'
    - name: Run public recovery matrix
      env:
        XMTP_RECOVERY_BACKEND_BINARY: ${{ github.workspace }}/result/bin/xmtp-backend
      run: dev/nix-shell 'just js test-node-sdk-ci test/streamRecovery.test.ts'
    - name: Stop test services
      if: always()
      run: dev/nix-shell 'just backend down'
