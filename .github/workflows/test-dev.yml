name: Test dev tools
on:
  workflow_call:
env:
  NIX_DEVSHELL: rust
jobs:
  test:
    name: Test (dev tools)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: "ci"
      - name: Run the dev tool tests
        run: just test dev
