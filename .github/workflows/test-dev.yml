name: "Test: Dev tools"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
env:
  NIX_DEVSHELL: rust
jobs:
  test:
    name: Python and release-tool tests
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted runners (merge and manual runs) have 4 vCPU.
    timeout-minutes: ${{ startsWith(inputs.runner, 'ubuntu-') && 40 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - name: Install JS dependencies (pnpm)
        uses: ./.github/actions/setup-js
        with:
          cache-mode: "ci"
      - name: dev/nix-shell 'just test dev'
        run: dev/nix-shell 'just test dev'
