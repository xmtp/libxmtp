name: Test dev tools
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
env:
  NIX_DEVSHELL: rust
jobs:
  test:
    name: Test (dev tools)
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted runners (merge and manual runs) have 4 vCPU.
    timeout-minutes: ${{ startsWith(inputs.runner, 'ubuntu-') && 40 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: "ci"
      - name: Run the dev tool tests
        run: dev/nix-shell 'just test dev'
