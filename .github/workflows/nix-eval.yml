name: "Lint: Nix evaluation"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
jobs:
  # post-merge.yml is the first job that builds the Darwin warm sets, so a pull
  # request that breaks their evaluation would pass. Evaluating every drvPath
  # catches that in about 2.5 minutes. The same job fails when a set other than
  # `rn` builds an `rn` member, which would let an RN break fail the post-merge
  # `build` and the docs; that adds about 3 s.
  ci-sets:
    name: Evaluate CI build sets
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      # Every set evaluates with allow-import-from-derivation false, so no
      # system needs another one evaluated first.
      - name: Evaluate every ciSets drvPath and keep RN members out of the other sets
        run: dev/ci/rn-isolation
