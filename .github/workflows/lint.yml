name: Lint source
'on':
  workflow_call:
    inputs:
      suites:
        type: string
        default: '["lint_workspace","lint_js","lint_config","lint_proto"]'
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: true
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    uses: ./.github/workflows/lint-target.yml
    with:
      suite: ${{ matrix.suite }}
    secrets: inherit
  results:
    name: Source lint results
    if: always()
    needs: suites
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - env:
        PASSED: ${{ needs.suites.result == 'success' }}
      run: test "$PASSED" = true
