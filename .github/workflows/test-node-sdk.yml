name: "Test: Node SDK, Agent SDK, CLI"
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
env:
  NIX_DEVSHELL: js-node
  # JS jobs test the release-profile Nix products (products_sdk_js), not a
  # cargo debug build.
  XMTP_SDK_BUILD: nix
jobs:
  # One job and one backend start for the Node SDK, CLI, and Agent SDK tests.
  test:
    name: Tests
    runs-on: ${{ inputs.runner }}
    # GitHub-hosted runners (merge and manual runs) have 4 vCPU.
    timeout-minutes: ${{ startsWith(inputs.runner, 'ubuntu-') && 60 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: ci
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - name: Install JS dependencies (pnpm)
        uses: ./.github/actions/setup-js
        with:
          cache-mode: ci
      - name: dev/nix-shell 'just backend up'
        run: dev/nix-shell 'just backend up'
      - name: dev/nix-shell 'just js test-node-sdk-ci --exclude test/streamRecovery.test.ts'
        id: node
        run: dev/nix-shell 'just js test-node-sdk-ci --exclude test/streamRecovery.test.ts'
      # The CLI and agent tests also run when an earlier test step failed, so
      # one run reports all three. They do not run when setup failed.
      - name: dev/nix-shell 'just cli test'
        if: ${{ !cancelled() && steps.node.outcome != 'skipped' }}
        run: dev/nix-shell 'just cli test'
      - name: dev/nix-shell 'just js test-agent-sdk-ci'
        if: ${{ !cancelled() && steps.node.outcome != 'skipped' }}
        run: dev/nix-shell 'just js test-agent-sdk-ci'
