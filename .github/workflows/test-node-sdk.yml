name: Test Node SDK
on:
  workflow_call:
    inputs:
      prepared-products:
        type: boolean
        default: false
env:
  NIX_DEVSHELL: js-node
jobs:
  test:
    name: Test (${{ matrix.kind }}) shard ${{ matrix.shard }}
    runs-on: ${{ inputs.prepared-products && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.prepared-products && '[{"kind":"node","shard":1},{"kind":"cli","shard":1}]' || '[{"kind":"node","shard":1},{"kind":"node","shard":2}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ""
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Restore prepared SDK product
        if: inputs.prepared-products
        uses: ./.github/actions/sdk-product
        with:
          target: node
          artifact-name: ci-sdk-node
      - name: Restore prepared backend product
        if: inputs.prepared-products
        id: backend-product
        uses: ./.github/actions/backend-product
        with:
          artifact-name: ci-backend
          allow-earlier-attempt: "true"
      - name: Start prepared backend
        if: inputs.prepared-products
        run: dev/nix-shell 'just backend up-prepared'
      - name: Start backend
        if: ${{ !inputs.prepared-products }}
        run: dev/nix-shell 'just backend up'
      - name: Run node-sdk tests (shard ${{ matrix.shard }}/2)
        if: ${{ !inputs.prepared-products && matrix.kind == 'node' }}
        run: dev/nix-shell 'just js test-node-sdk-ci --shard ${{ matrix.shard }}/2 --exclude test/streamRecovery.test.ts'
      - name: Run all node-sdk tests with prepared products
        if: inputs.prepared-products && matrix.kind == 'node'
        run: dev/nix-shell 'just js test-node-sdk-prepared --exclude test/streamRecovery.test.ts'
      - name: Run CLI tests (shard ${{ matrix.shard }}/2)
        if: ${{ !inputs.prepared-products }}
        run: dev/nix-shell 'just cli test-ci --shard ${{ matrix.shard }}/2'
      - name: Run all CLI tests with prepared products
        if: inputs.prepared-products && matrix.kind == 'cli'
        run: dev/nix-shell 'just cli test-ci'
