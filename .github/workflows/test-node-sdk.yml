name: Test Node SDK
on:
  workflow_call:
env:
  NIX_DEVSHELL: js-node
jobs:
  test:
    name: Test (node-sdk) shard ${{ matrix.shard }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          docker-builder: "true"
          github-token: ${{ github.token }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: node-sdk-test
          kache-readonly: "false"
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Start backend
        run: dev/nix-shell 'just backend up'
      - name: Run node-sdk tests (shard ${{ matrix.shard }}/2)
        run: dev/nix-shell 'just js test-node-sdk-ci --shard ${{ matrix.shard }}/2 --exclude test/streamRecovery.test.ts'
      - name: Run CLI tests (shard ${{ matrix.shard }}/2)
        run: dev/nix-shell 'just cli test-ci --shard ${{ matrix.shard }}/2'
