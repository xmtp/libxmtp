name: Test Node SDK
on:
  workflow_call:
env:
  NIX_DEVSHELL: js-node
  # JS jobs test the release-profile Nix products (products_sdk_js), not a
  # cargo debug build.
  XMTP_SDK_BUILD: nix
jobs:
  test:
    name: Test (node-sdk) shard ${{ matrix.shard }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: ci
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just (v2.87.28)
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: ci
      - name: Start backend
        run: dev/nix-shell 'just backend up'
      - name: Run node-sdk tests (shard ${{ matrix.shard }}/2)
        run: dev/nix-shell 'just js test-node-sdk-ci --shard ${{ matrix.shard }}/2 --exclude test/streamRecovery.test.ts'
      - name: Run CLI tests (shard ${{ matrix.shard }}/2)
        run: dev/nix-shell 'just cli test-ci --shard ${{ matrix.shard }}/2'
