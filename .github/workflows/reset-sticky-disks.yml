name: Reset Sticky Disks
# Nix stores on sticky disks only grow (every flake.lock bump adds a
# closure), and CoW snapshots mean in-filesystem deletion doesn't shrink
# billed size. Periodically drop the disks; the next run per disk is cold
# but repopulates from Cachix via substitution, not rebuilds.
on:
  schedule:
    # 1st of every other month (Jan, Mar, May, Jul, Sep, Nov) at 00:00 UTC
    - cron: "0 0 1 */2 *"
  workflow_dispatch:
jobs:
  reset-nix-disks:
    name: Delete Nix store sticky disks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Must match runner.arch values used in the setup-nix disk key
        arch: [X64, ARM64]
    steps:
      - name: Delete ${{ github.repository }}-nix-Linux-${{ matrix.arch }}
        uses: useblacksmith/stickydisk-delete@v1
        with:
          delete-key: ${{ github.repository }}-nix-Linux-${{ matrix.arch }}
