name: Lint Deny
on:
  # Advisories appear without a change in this repository. The daily run on
  # the default branch reports them and fails on one. Pull requests and
  # merges check bans, licenses, and sources in lint-config.yml.
  schedule:
    - cron: "23 7 * * *"
permissions:
  contents: read
env:
  NIX_DEVSHELL: rust
jobs:
  deny:
    name: Lint (cargo-deny advisories)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - name: Check advisories
        run: dev/nix-shell 'cargo deny --locked check advisories'
