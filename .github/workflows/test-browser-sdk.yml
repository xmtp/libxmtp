name: Test Browser SDK
on:
  workflow_call:
env:
  NIX_DEVSHELL: js
jobs:
  test:
    name: Test (browser-sdk) shard ${{ matrix.shard }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || 'kache-s3-reader' }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: web
          docker-builder: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: browser-sdk-test
          kache-readonly: "false"
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-js
      - name: Start backend
        run: just backend up
      - name: Run browser-sdk tests (shard ${{ matrix.shard }}/4)
        run: just js test-browser-sdk-ci --shard ${{ matrix.shard }}/4
      - name: Check web-chat
        if: matrix.shard == 1
        run: just web-chat check
      - name: Oxlint web-chat
        if: matrix.shard == 1
        run: just web-chat lint
      - name: Build web-chat
        if: matrix.shard == 1
        run: just web-chat build
      - name: Test web-chat
        if: matrix.shard == 1
        run: just web-chat test
