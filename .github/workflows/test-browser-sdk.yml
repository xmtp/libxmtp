name: Test Browser SDK
on:
  workflow_call:
env:
  NIX_DEVSHELL: js
  # JS jobs test the release-profile Nix products (products_sdk_js), not a
  # cargo debug build.
  XMTP_SDK_BUILD: nix
jobs:
  test:
    name: Test (browser-sdk) shard ${{ matrix.shard }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: ci
          cachix-pr-auth-token: ${{ secrets.CACHIX_PR_AUTH_TOKEN }}
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just (v2.87.28)
      - uses: ./.github/actions/setup-js
        with:
          cache-mode: ci
      - name: Start backend
        run: just backend up
      - name: Run browser-sdk tests (shard ${{ matrix.shard }}/4)
        run: just js test-browser-sdk-ci --shard ${{ matrix.shard }}/4
      - name: Check web-chat
        if: matrix.shard == 1
        run: just web-chat check
      - name: Oxlint web-chat
        if: matrix.shard == 1
        run: just web-chat lint
      - name: Build web-chat
        if: matrix.shard == 1
        run: just web-chat build
      - name: Test web-chat
        if: matrix.shard == 1
        run: just web-chat test
