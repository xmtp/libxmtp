name: Test Swift lifecycle checks and consumers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  swift:
    name: Swift lifecycle checks and consumers
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: warp-macos-15-arm64-6x
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 60
    env:
      NIX_DEVSHELL: ios
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          kache: "true"
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: swift-lifecycle
          kache-readonly: "false"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - uses: taiki-e/install-action@just
      - name: Check native Apple toolchain
        run: dev/nix-shell 'bash dev/check-apple-toolchain'
      # test-ios.yml skips these tests in its macOS run (`test skip-lifecycle`).
      - name: Swift lifecycle checks
        run: dev/nix-shell 'just backend ci just ios test-lifecycle'
      - name: Check Swift consumers
        run: dev/nix-shell 'just ios check-consumer'
      - name: Retain native service logs
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
