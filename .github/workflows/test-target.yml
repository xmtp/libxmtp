name: Test suite target
'on':
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      run-bindings-ios:
        type: boolean
        default: true
      run-bindings-android:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  test_native_backend:
    if: inputs.suite == 'test_native_backend'
    uses: ./.github/workflows/test-native-backend.yml
  test_validation:
    if: inputs.suite == 'test_validation'
    uses: ./.github/workflows/test-validation.yml
    secrets: inherit
  test_backend:
    if: inputs.suite == 'test_backend'
    uses: ./.github/workflows/test-backend.yml
    secrets: inherit
  test_workspace:
    if: inputs.suite == 'test_workspace'
    uses: ./.github/workflows/test-workspace.yml
    secrets: inherit
  test_keepalive:
    if: inputs.suite == 'test_keepalive'
    uses: ./.github/workflows/test-keepalive-probe.yml
    secrets: inherit
  test_wasm:
    if: inputs.suite == 'test_wasm'
    uses: ./.github/workflows/test-wasm.yml
    secrets: inherit
  test_node:
    if: inputs.suite == 'test_node'
    uses: ./.github/workflows/test-node-sdk.yml
    secrets: inherit
  test_agent:
    if: inputs.suite == 'test_agent'
    uses: ./.github/workflows/test-agent-sdk.yml
    secrets: inherit
  test_xdbg:
    if: inputs.suite == 'test_xdbg'
    uses: ./.github/workflows/test-xdbg.yml
    secrets: inherit
  test_browser:
    if: inputs.suite == 'test_browser'
    uses: ./.github/workflows/test-browser-sdk.yml
    secrets: inherit
  test_bindings:
    if: inputs.suite == 'test_bindings'
    uses: ./.github/workflows/test-bindings-check.yml
    secrets: inherit
    with:
      run-ios: ${{ inputs.run-bindings-ios }}
      run-android: ${{ inputs.run-bindings-android }}
  test_sdk_staging:
    if: inputs.suite == 'test_sdk_staging'
    uses: ./.github/workflows/test-sdk-staging.yml
    secrets: inherit
  test_bridge_runtime:
    if: inputs.suite == 'test_bridge_runtime'
    uses: ./.github/workflows/test-sdk-platform.yml
    secrets: inherit
    with:
      target: bridge
  test_browser_platform:
    if: inputs.suite == 'test_browser_platform'
    uses: ./.github/workflows/test-sdk-platform.yml
    secrets: inherit
    with:
      target: browser
  result:
    name: Require selected test target
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 1
    if: always()
    needs:
    - test_native_backend
    - test_validation
    - test_backend
    - test_workspace
    - test_keepalive
    - test_wasm
    - test_node
    - test_agent
    - test_xdbg
    - test_browser
    - test_bindings
    - test_sdk_staging
    - test_bridge_runtime
    - test_browser_platform
    steps:
    - env:
        PASSED: ${{ (inputs.suite == 'test_native_backend' && needs.test_native_backend.result == 'success') || (inputs.suite == 'test_validation'
          && needs.test_validation.result == 'success') || (inputs.suite == 'test_backend' && needs.test_backend.result == 'success')
          || (inputs.suite == 'test_workspace' && needs.test_workspace.result == 'success') || (inputs.suite == 'test_keepalive' &&
          needs.test_keepalive.result == 'success') || (inputs.suite == 'test_wasm' && needs.test_wasm.result == 'success') || (inputs.suite
          == 'test_node' && needs.test_node.result == 'success') || (inputs.suite == 'test_agent' && needs.test_agent.result == 'success')
          || (inputs.suite == 'test_xdbg' && needs.test_xdbg.result == 'success') || (inputs.suite == 'test_browser' && needs.test_browser.result
          == 'success') || (inputs.suite == 'test_bindings' && needs.test_bindings.result == 'success') || (inputs.suite == 'test_sdk_staging'
          && needs.test_sdk_staging.result == 'success') || (inputs.suite == 'test_bridge_runtime' && needs.test_bridge_runtime.result
          == 'success') || (inputs.suite == 'test_browser_platform' && needs.test_browser_platform.result == 'success') }}
      run: test "$PASSED" = true
