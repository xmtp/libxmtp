name: Publish backend image

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
        with:
          disk-key: rust
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - name: Build image
        run: just backend image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker load --input result-backend-image
          docker tag ghcr.io/xmtp/backend:self-hosted "ghcr.io/xmtp/backend:sha-${COMMIT_SHA}"
          docker push "ghcr.io/xmtp/backend:sha-${COMMIT_SHA}"
      - name: Publish branch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/self-hosted'
        run: docker push ghcr.io/xmtp/backend:self-hosted
