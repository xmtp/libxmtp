name: Publish backend image

on:
  push:
  pull_request:

concurrency:
  group: backend-image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for the commit image
        id: image
        env:
          BACKEND_IMAGE: ghcr.io/xmtp/backend:sha-${{ github.sha }}
        run: |
          if docker manifest inspect "$BACKEND_IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-nix
        if: steps.image.outputs.exists != 'true'
        with:
          disk-key: rust
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
        if: steps.image.outputs.exists != 'true'
      - name: Build image
        if: steps.image.outputs.exists != 'true'
        run: just backend image
      - name: Publish commit image
        if: steps.image.outputs.exists != 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker load --input result-backend-image
          docker tag ghcr.io/xmtp/backend:self-hosted "ghcr.io/xmtp/backend:sha-${COMMIT_SHA}"
          docker push "ghcr.io/xmtp/backend:sha-${COMMIT_SHA}"
      - name: Publish branch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/self-hosted'
        env:
          BACKEND_IMAGE: ghcr.io/xmtp/backend:sha-${{ github.sha }}
        run: |
          docker pull "$BACKEND_IMAGE"
          docker tag "$BACKEND_IMAGE" ghcr.io/xmtp/backend:self-hosted
          docker push ghcr.io/xmtp/backend:self-hosted
