name: "Release: CLI"

on:
  workflow_dispatch:
    inputs:
      release-type:
        required: true
        type: choice
        description: "dev, rc, or final"
        options:
          - dev
          - rc
          - final
      rc-number:
        required: false
        type: string
        description: "RC number (required for rc releases)"
      node-sdk-version:
        required: false
        type: string
        description: "Published @xmtp/node-sdk version to pin (defaults to npm latest)"
      dry-run:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
      node-sdk-version:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: write
  id-token: write

jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      # A direct dispatch has no source-sha and releases the dispatched ref.
      ref: ${{ inputs.source-sha || github.ref }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  setup:
    name: Compute version
    needs: [check-push-permissions]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version || steps.version.outputs.version }}
      node-sdk-version: ${{ steps.node-sdk-version.outputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      # release.yml passes the version it computed for every SDK of the run.
      # Only a direct dispatch of this workflow computes it here.
      - name: Set up release tools
        if: inputs.version == ''
        uses: ./.github/actions/setup-release-tools

      # Inputs are passed through env, never interpolated into shell source:
      # this job holds contents/id-token write and dispatch inputs are free text.
      - name: Compute version
        id: version
        if: inputs.version == ''
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
          RC_NUMBER: ${{ inputs.rc-number }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          args=(--sdk cli --release-type "$RELEASE_TYPE")
          case "$RELEASE_TYPE" in
            rc) args+=(--rc-number "$RC_NUMBER") ;;
            dev) args+=(--source-ref "$REF") ;;
          esac
          version=$(xmtp-release compute-version "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"

      - name: Resolve node-sdk version to pin
        id: node-sdk-version
        env:
          NODE_SDK_VERSION: ${{ inputs.node-sdk-version }}
        run: |
          if [ -n "$NODE_SDK_VERSION" ]; then
            VERSION="$NODE_SDK_VERSION"
          else
            VERSION=$(npm view @xmtp/node-sdk version)
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid @xmtp/node-sdk version: $VERSION"
            exit 1
          fi
          if [ "${VERSION%%.*}" -lt 8 ]; then
            echo "::error::This CLI requires @xmtp/node-sdk 8 or later"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [setup, check-push-permissions]
    runs-on: ubuntu-24.04
    env:
      NIX_DEVSHELL: js-node
      # The Node SDK build copies the release-profile Nix tree that CI tested.
      XMTP_SDK_BUILD: nix
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up release tools
        uses: ./.github/actions/setup-release-tools
        with:
          nix: "true"
          # This job also builds the Node SDK and the CLI.
          filter: ""
      - name: Build CLI release artifact
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          dev/nix-shell '
            pnpm --filter @xmtp/node-sdk build
            xmtp-release set-manifest-version --sdk cli --version "$VERSION"
            pnpm --filter @xmtp/cli build
            pnpm --filter @xmtp/cli manifest'
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli_build
          path: |
            apps/cli/dist
            apps/cli/oclif.manifest.json
          retention-days: 1

  publish:
    name: Publish
    needs: [setup, build, check-push-permissions]
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
      package-dir: apps/cli
      sdk: cli
      version: ${{ needs.setup.outputs.version }}
      artifact-pattern: cli_build
      artifact-path: apps/cli
      ignore-scripts: true
      dep-name: "@xmtp/node-sdk"
      dep-version: ${{ needs.setup.outputs.node-sdk-version }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
