name: 'Release: CLI'
on:
  workflow_call:
    inputs:
      source-sha:
        description: Fixed source commit resolved by the release caller
        required: true
        type: string
      version:
        description: The version to publish, computed once by release.yml
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      build-only:
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: The published version string
        value: ${{ jobs.publish.outputs.version }}
permissions:
  contents: read
  id-token: write
jobs:
  check-push-permissions:
    name: Source
    uses: ./.github/workflows/check-release-push.yml
    with:
      ref: ${{ inputs.source-sha }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
  build:
    name: Build
    needs: [check-push-permissions]
    runs-on: ubuntu-24.04
    env:
      NIX_DEVSHELL: js-node
      XMTP_SDK_BUILD: nix
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.check-push-permissions.outputs.source-sha }}
      - name: Set up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-mode: read
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize the shared SDK version
        uses: ./.github/actions/release-source
      - name: Set up JavaScript
        uses: ./.github/actions/setup-js
        with:
          cache-mode: read
      - name: Build Node types and CLI
        run: |
          dev/nix-shell 'pnpm --filter @xmtp/node-sdk build && pnpm --filter @xmtp/cli build && pnpm --filter @xmtp/cli manifest'
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli_build
          path: |
            apps/cli/dist
            apps/cli/oclif.manifest.json
          retention-days: 1
  publish:
    name: Publish
    needs: [build, check-push-permissions]
    uses: ./.github/workflows/npm-publish.yml
    with:
      source-sha: ${{ needs.check-push-permissions.outputs.source-sha }}
      package-dir: apps/cli
      sdk: cli
      version: ${{ inputs.version }}
      artifact-pattern: cli_build
      artifact-path: apps/cli
      ignore-scripts: true
      dep-name: '@xmtp/node-sdk'
      dep-version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      prepare-only: ${{ inputs.build-only }}
    secrets: inherit
