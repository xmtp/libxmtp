name: Release CLI

on:
  workflow_dispatch:
    inputs:
      release-type:
        required: true
        type: choice
        description: "dev, rc, or final"
        options:
          - dev
          - rc
          - final
      rc-number:
        required: false
        type: string
        description: "RC number (required for rc releases)"
      node-sdk-version:
        required: false
        type: string
        description: "Published @xmtp/node-sdk version to pin (defaults to npm latest)"
      dry-run:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-type:
        required: true
        type: string
      rc-number:
        required: false
        type: string
      ref:
        required: false
        type: string
      timestamp:
        required: false
        type: string
      node-sdk-version:
        required: false
        type: string
      pending-version:
        required: false
        type: string
      pending-kind:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "The published version string"
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      node-sdk-version: ${{ steps.node-sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-release-tools
      - name: Compute version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
          RC_NUMBER: ${{ inputs.rc-number }}
          PENDING_VERSION: ${{ inputs.pending-version }}
          PENDING_KIND: ${{ inputs.pending-kind }}
          REF: ${{ inputs.ref || github.ref }}
          TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          if [ "$RELEASE_TYPE" = "rc" ]; then
            VERSION=$(xmtp-release compute-version --sdk cli --release-type rc --rc-number "$RC_NUMBER")
          elif [ "$RELEASE_TYPE" = "dev" ]; then
            VERSION=$(xmtp-release compute-version --sdk cli --release-type dev --source-ref "$REF" --timestamp "$TIMESTAMP")
          elif [ "$RELEASE_TYPE" = "nightly" ]; then
            if [ -z "$PENDING_VERSION" ] || [ -z "$PENDING_KIND" ]; then
              echo "::error::nightly resolve called with empty pending version/kind"
              exit 1
            fi
            VERSION=$(xmtp-release resolve-sdk-version --sdk cli --release-type nightly --timestamp "$TIMESTAMP" --pending-version "$PENDING_VERSION" --pending-kind "$PENDING_KIND")
          else
            VERSION=$(xmtp-release compute-version --sdk cli --release-type final)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"
      - name: Resolve node-sdk version to pin
        id: node-sdk-version
        env:
          NODE_SDK_VERSION: ${{ inputs.node-sdk-version }}
        run: |
          if [ -n "$NODE_SDK_VERSION" ]; then
            VERSION="$NODE_SDK_VERSION"
          else
            VERSION=$(npm view @xmtp/node-sdk version)
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid @xmtp/node-sdk version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: blacksmith-16vcpu-ubuntu-2404
    env:
      NIX_DEVSHELL: js-node
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-nix
        with:
          nix-disk: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-release-tools
      - name: Stage node bindings
        run: just js bindings-node
      - name: Build CLI release artifact
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          nix develop .#js --command bash -euc '
            cd sdks/js
            yarn install --immutable
            yarn workspace @xmtp/node-sdk run build
            cd ../..
            xmtp-release set-manifest-version --sdk cli --version "$VERSION"
            cd apps/cli
            yarn install --immutable
            yarn build
            yarn manifest'
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: cli_build
          path: |
            apps/cli/dist
            apps/cli/oclif.manifest.json
          retention-days: 1

  publish:
    needs: [setup, build]
    uses: ./.github/workflows/npm-publish.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      package-dir: apps/cli
      install-dir: apps/cli
      lockfile-path: apps/cli/yarn.lock
      sdk: cli
      version: ${{ needs.setup.outputs.version }}
      artifact-pattern: cli_build
      artifact-path: apps/cli
      ignore-scripts: true
      dep-name: "@xmtp/node-sdk"
      dep-version: ${{ needs.setup.outputs.node-sdk-version }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
