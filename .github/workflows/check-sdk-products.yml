name: Check SDK products
'on':
  workflow_call:
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: "Optional compiler cache reader access key ID"
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: "Optional compiler cache reader secret access key"
        required: false
jobs:
  generated:
    name: Check (generated SDK products)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    environment:
      name: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_protected && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/self-hosted') && 'kache-s3-writer' || '' }}
    timeout-minutes: 90
    env:
      NIX_DEVSHELL: rust
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: web
        github-token: ${{ github.token }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: sdk-products
        kache-readonly: "false"
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
      env:
        NIX_DEVSHELL: js
    - name: Check native Nix inputs
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk check-native-nix'
    - name: Check package scripts
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk check-package-scripts'
    - name: Generate local SDK products
      run: dev/nix-shell 'just sdk generate'
    - name: Check local clean SDK generation
      run: dev/nix-shell 'just sdk check-clean-generate'
    - name: Check generated SDK bindings and runtime
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk lint'
    - name: Local installed Node ESM package smoke
      run: dev/nix-shell 'just sdk package-smoke node'
    - name: Local installed Browser pure and worker package smoke
      env:
        NIX_DEVSHELL: js
      run: dev/nix-shell 'just sdk package-smoke browser'
