name: Check SDK products
'on':
  workflow_call:
jobs:
  generated:
    name: Check (generated SDK products)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      NIX_DEVSHELL: rust
      # The release-profile Nix products (products_sdk_js), not a cargo build.
      XMTP_SDK_BUILD: nix
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        github-token: ${{ github.token }}
    - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just (v2.87.28)
    - uses: ./.github/actions/setup-js
      with:
        cache-mode: ci
      env:
        NIX_DEVSHELL: js
    # Source checks first: they need no generated tree.
    - name: Check SDK sources
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk lint-source'
    - name: Check the generated SDK build closures
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk check-generated-nix'
    # The Kotlin tree and the Android fast consumer: files, receipts, source
    # and render identities, and the ELF library (Swift only on Darwin).
    - name: Check the SDK product receipts
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'python3 -B nix/check-sdk-products.py'
    - name: Check package scripts
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk check-package-scripts'
    # The Nix trees of every target; the cargo render path, including its
    # stale-file cleanup, is covered by `check-package-scripts`.
    - name: Generate SDK products from Nix
      run: dev/nix-shell 'just sdk generate'
    - name: Check generated SDK bindings and runtime
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk lint-generated'
    - name: Local installed Node ESM package smoke
      run: dev/nix-shell 'just sdk package-smoke node'
    - name: Local installed Browser pure and worker package smoke
      env:
        NIX_DEVSHELL: js
      run: dev/nix-shell 'just sdk package-smoke browser'
