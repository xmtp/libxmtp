name: "Test: SDK packaging"
'on':
  workflow_call:
    inputs:
      runner:
        description: The runner label. ci.yml passes it from .github/ci-suites.yml (runners).
        type: string
        required: true
jobs:
  generated:
    name: Codegen, closures, install smoke
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      NIX_DEVSHELL: rust
      # The release-profile Nix products (products_sdk_js), not a cargo build.
      XMTP_SDK_BUILD: nix
    permissions:
      contents: read
    steps:
    - name: Check out the source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: ci
        github-token: ${{ github.token }}
    - name: Install JS dependencies (pnpm)
      uses: ./.github/actions/setup-js
      with:
        cache-mode: ci
      env:
        NIX_DEVSHELL: js
    # Source checks first: they need no generated tree.
    - name: dev/nix-shell 'just sdk lint-source'
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk lint-source'
    - name: dev/nix-shell 'just sdk check-generated-nix'
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk check-generated-nix'
    # The Kotlin tree and the Android fast consumer: files, receipts, source
    # and render identities, and the ELF library (Swift only on Darwin).
    - name: dev/nix-shell 'python3 -B nix/check-sdk-products.py'
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'python3 -B nix/check-sdk-products.py'
    - name: dev/nix-shell 'just sdk check-package-scripts'
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk check-package-scripts'
    # The Nix trees of every target; the cargo render path, including its
    # stale-file cleanup, is covered by `check-package-scripts`.
    - name: dev/nix-shell 'just sdk generate'
      run: dev/nix-shell 'just sdk generate'
    - name: dev/nix-shell 'just sdk lint-generated'
      env:
        NIX_DEVSHELL: rust
      run: dev/nix-shell 'just sdk lint-generated'
    - name: dev/nix-shell 'just sdk package-smoke node'
      run: dev/nix-shell 'just sdk package-smoke node'
    - name: dev/nix-shell 'just sdk package-smoke browser'
      env:
        NIX_DEVSHELL: js
      run: dev/nix-shell 'just sdk package-smoke browser'
