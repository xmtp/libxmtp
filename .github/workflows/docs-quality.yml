name: Docs Quality
'on':
  workflow_call:
    secrets:
      KACHE_S3_ACCESS_KEY_ID:
        description: "Optional compiler cache reader access key ID"
        required: false
      KACHE_S3_SECRET_ACCESS_KEY:
        description: "Optional compiler cache reader secret access key"
        required: false
permissions:
  contents: read
jobs:
  quality:
    name: Docs lint, format, and tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      NIX_DEVSHELL: docs
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        disk-key: web
        github-token: ${{ github.token }}
        kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
        kache-s3-region: ${{ vars.KACHE_S3_REGION }}
        kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
        kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
        kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
        kache-scope: docs-quality
        kache-readonly: "true"
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/setup-js
    - run: just docs test
    - name: Lint repository Markdown
      run: just lint-markdown
    - name: Check documentation source
      run: dev/nix-shell 'cd apps/docs && node scripts/check-site.mjs'
