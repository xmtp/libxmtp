name: Test native backend
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: Native backend contract
    runs-on: warp-macos-15-arm64-6x
    timeout-minutes: 45
    env:
      NIX_DEVSHELL: rust
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
      # Prove public cache substitution without a cache-write token.
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@just
      - name: Check wrapper processes
        run: dev/nix-shell 'shellcheck dev/backend/ci && python3.11 dev/backend/check-ci.py'
      - name: Check cache reader environment
        run: |
          test -z "${CACHIX_AUTH_TOKEN:-}"
          test -z "${CACHIX_SIGNING_KEY:-}"
          echo "Cache writer environment absent"
      - name: Build native service package
        run: time nix build --no-link .#backend-ci
      - name: Record service versions and published configuration
        run: |
          nix run .#backend-ci -- bash -euc '
            postgres --version
            versitygw --version
            grpcurl -plaintext -emit-defaults -import-path proto -proto backend/v1/backend.proto \
              -d "{}" 127.0.0.1:5050 xmtp.backend.v1.ConfigurationService/GetConfiguration \
              > "$RUNNER_TEMP/backend-ci-logs/configuration.json"
          '
          dev/nix-shell --command jq -e \
            '.attachments == {baseUrl: "http://127.0.0.1:9067/attachments", maxUploadBytes: "104857600", retentionSeconds: "0"}' \
            "$RUNNER_TEMP/backend-ci-logs/configuration.json"
      - name: Check shared attachment configuration
        run: dev/nix-shell 'just backend test --lib local_s3_config_only_adds_attachments'
      # Build logs establish source-build or cache substitution evidence.
      # Cache-only substitution and job-only rerun proofs are recorded after CI.
      - name: Check real S3 attachment contract
        run: dev/nix-shell 'just backend ci just backend test --lib s3_target_accepts_exact_bytes_once'
      - name: Retain native service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-backend-ci-logs
          path: ${{ runner.temp }}/backend-ci-logs
          retention-days: 7
