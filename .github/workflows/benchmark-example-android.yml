name: Benchmark Android example
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  messenger-performance:
    name: Messenger local query and heap budgets (API 34 x86_64)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix
      with:
        gradle-disk: 'true'
        github-token: ${{ github.token }}
        cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - uses: taiki-e/install-action@just
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run the fixed workload and cache failure control
      timeout-minutes: 210
      env:
        NIX_DEVSHELL: android
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/messenger-performance-emulator
      run: dev/nix-shell 'just example-android performance'
    - name: Upload performance proof
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: messenger-api34-performance
        retention-days: 7
        if-no-files-found: ignore
        include-hidden-files: 'true'
        path: |
          apps/example-android/app/build/performance/
          apps/example-android/app/build/outputs/androidTest-results/connected/
          ${{ runner.temp }}/messenger-performance-emulator/
