name: "Benchmark: Android example app"
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  messenger-performance:
    name: Query and heap budgets (API 34 x86_64)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 240
    steps:
    - name: Check out the commit
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up Nix
      uses: ./.github/actions/setup-nix
      with:
        cache-mode: read
        github-token: ${{ github.token }}
    - name: Start backend
      env:
        NIX_DEVSHELL: android
      run: dev/nix-shell 'just backend up'
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run the fixed workload and cache failure control
      timeout-minutes: 210
      env:
        NIX_DEVSHELL: android
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/messenger-performance-emulator
      run: dev/nix-shell 'just example-android performance'
    - name: Upload performance proof
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: messenger-api34-performance
        retention-days: 7
        if-no-files-found: ignore
        include-hidden-files: 'true'
        path: |
          apps/example-android/app/build/performance/
          apps/example-android/app/build/outputs/androidTest-results/connected/
          ${{ runner.temp }}/messenger-performance-emulator/
