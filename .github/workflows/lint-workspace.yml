name: Lint Workspace
on:
  workflow_call:
env:
  NIX_DEVSHELL: rust
jobs:
  lint:
    name: Lint (Rust Workspace)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          cache-mode: "ci"
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@0c0305935e3ef3b9e6205d176ec55ee4fce34cca # just
      - name: Lint Rust workspace
        run: just lint-rust-source
