name: 'Release: create branch'
on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base ref (commit/branch) to create the release from
        required: false
        type: string
      version:
        description: Shared SDK target version (for example 8.0.0)
        required: true
        type: string
      pr-base:
        description: Release PR target branch
        required: false
        type: string
        default: main
jobs:
  create-branch:
    name: Create release branch and PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.base-ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up release tools
        uses: ./.github/actions/setup-release-tools
      - name: Create release branch
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BASE_REF: ${{ inputs.base-ref || github.ref_name }}
        run: |
          xmtp-release create-release-branch --version "$RELEASE_VERSION" --base "$BASE_REF"
          git push -u origin "release/$RELEASE_VERSION"
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          PR_BASE: ${{ inputs.pr-base }}
        run: |
          BRANCH="release/${RELEASE_VERSION}"
          gh pr create \
            --base "$PR_BASE" \
            --head "$BRANCH" \
            --title "Release ${RELEASE_VERSION}" \
            --body "$(cat <<EOF
          ## Release ${RELEASE_VERSION}

          This PR was created by the "Release: create branch" workflow.

          ### Checklist
          - [ ] Release notes reviewed and finalized
          - [ ] Shared SDK version verified
          - [ ] RC published and validated
          - [ ] Final release published via Release workflow

          > **Note:** This PR will be merged automatically by the Release workflow upon final release.
          EOF
          )"
  release-notes:
    name: Release notes
    needs: create-branch
    uses: ./.github/workflows/release-notes.yml
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    with:
      release-branch: release/${{ inputs.version }}
    secrets: inherit
