name: Deploy xmtp.chat

# Build the generated SDK package before Vercel builds the app. The SDK stage
# contains the worker, WASM modules, and pinned runtimes from this source tree.

on:
  # Every merge to self-hosted deploys, with no paths filter. The app bundles
  # the SDK WASM modules, so a commit touching only crates/ still changes
  # what ships; keeping the trigger unfiltered means the deployed build always
  # matches the branch head.
  push:
    branches: [self-hosted]
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not interleave: two runs finishing out of order would leave the
# older build live. Queue them instead of cancelling, so a superseded run still
# reaches the guard below and skips cleanly.
concurrency:
  group: deploy-web-chat
  cancel-in-progress: false

env:
  NIX_DEVSHELL: js

jobs:
  deploy:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    environment:
      name: web-chat
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for a newer commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/self-hosted" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip superseded commit $GITHUB_SHA"
          fi
      - uses: ./.github/actions/setup-nix
        if: steps.current.outputs.deploy == 'true'
        with:
          disk-key: web
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          kache-s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          kache-s3-region: ${{ vars.KACHE_S3_REGION }}
          kache-s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || '' }}
          kache-s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY_ID }}
          kache-s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_ACCESS_KEY }}
          kache-scope: sdk-products-debug
          kache-readonly: "true"
      - uses: taiki-e/install-action@just
        if: steps.current.outputs.deploy == 'true'
      - uses: ./.github/actions/setup-js
        if: steps.current.outputs.deploy == 'true'
      # Stage the complete generated browser package before the app build.
      - name: Build the linked SDK
        if: steps.current.outputs.deploy == 'true'
        env:
          XMTP_BACKEND_URL: ""
          VITE_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        run: just web-chat build
      - name: Deploy to Vercel
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # `vercel build` re-runs Vite despite vercel.json's buildCommand:
          # null, so these must be in scope here too. Without them the
          # deployed bundle inlines an empty WalletConnect id and wallet
          # connection silently breaks. Vite inlines both at build time, so
          # setting them in the Vercel dashboard has no effect.
          XMTP_BACKEND_URL: ""
          VITE_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        working-directory: apps/web-chat
        run: |
          # `vercel pull` reports an unusable token as "Could not retrieve
          # Project Settings ... remove the .vercel directory", which points at
          # local link state rather than the credential. Say what actually
          # failed, whatever the token's form.
          if ! npx --yes vercel@48 pull --yes --environment=production --token="$VERCEL_TOKEN"; then
            echo "::error::vercel pull failed. Check that VERCEL_TOKEN is valid and can read project $VERCEL_PROJECT_ID in team $VERCEL_ORG_ID. The .vercel directory the CLI mentions is not the problem in CI."
            exit 1
          fi
          npx --yes vercel@48 build --prod --token="$VERCEL_TOKEN"
          url="$(npx --yes vercel@48 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the deployment serves the app
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # The deployment URL can 401 behind Vercel's deployment protection
          # even when the deploy succeeded, so a failure here is a warning, not
          # a failed deploy. The deploy step itself is the real gate.
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --retry-all-errors --max-time 30 \
            --output /dev/null "$DEPLOYMENT_URL"; then
            echo "::warning::Deployed, but $DEPLOYMENT_URL did not return 200. Check Vercel deployment protection and the domain alias."
          fi
