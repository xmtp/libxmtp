name: Deploy xmtp.chat

# Vercel cannot build this app. web-chat depends on the in-tree browser SDK
# through portal:../../sdks/js/browser-sdk, which depends on
# @xmtp/wasm-bindings through portal:../../../bindings/wasm, whose dist/ is a
# Nix build of a Rust crate. So the build happens here, where the Nix sticky
# disk already makes it cheap, and Vercel only stores and serves the output.

on:
  # Every merge to self-hosted deploys, with no paths filter. The app bundles
  # the Rust WASM bindings, so a commit touching only crates/ still changes
  # what ships; keeping the trigger unfiltered means the deployed build always
  # matches the branch head.
  push:
    branches: [self-hosted]
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not interleave: two runs finishing out of order would leave the
# older build live. Queue them instead of cancelling, so a superseded run still
# reaches the guard below and skips cleanly.
concurrency:
  group: deploy-web-chat
  cancel-in-progress: false

env:
  NIX_DEVSHELL: js

jobs:
  deploy:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    environment:
      name: web-chat
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for a newer commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/self-hosted" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip superseded commit $GITHUB_SHA"
          fi
      - uses: ./.github/actions/setup-nix
        if: steps.current.outputs.deploy == 'true'
        with:
          disk-key: web
          github-token: ${{ github.token }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: taiki-e/install-action@just
        if: steps.current.outputs.deploy == 'true'
      # sdks/js must install before web-chat. The build's `sdk` step runs
      # `yarn install --immutable` in sdks/js, which rewrites node_modules and
      # drops web-chat's portal link if web-chat was installed first.
      - name: Install dependencies
        if: steps.current.outputs.deploy == 'true'
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "true"
        run: |
          just js install-ci
          just web-chat install-ci
      - name: Build the linked SDK and the app
        if: steps.current.outputs.deploy == 'true'
        env:
          # Deliberately empty: the deployed app ships with no default backend
          # and each user enters one in the settings panel. Vite inlines this
          # at build time, so it cannot be set on the Vercel side.
          XMTP_BACKEND_URL: ""
          VITE_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
        run: just web-chat build
      - name: Deploy to Vercel
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: apps/web-chat
        run: |
          npx --yes vercel@48 pull --yes --environment=production --token="$VERCEL_TOKEN"
          # dist/ is already built above; `vercel build` only packages it into
          # .vercel/output, because vercel.json sets no build command.
          npx --yes vercel@48 build --prod --token="$VERCEL_TOKEN"
          url="$(npx --yes vercel@48 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the deployment serves the app
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # The deployment URL can 401 behind Vercel's deployment protection
          # even when the deploy succeeded, so a failure here is a warning, not
          # a failed deploy. The deploy step itself is the real gate.
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --retry-all-errors --max-time 30 \
            --output /dev/null "$DEPLOYMENT_URL"; then
            echo "::warning::Deployed, but $DEPLOYMENT_URL did not return 200. Check Vercel deployment protection and the domain alias."
          fi
