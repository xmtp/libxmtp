name: React Native installed conformance
description: Execute fresh bare and Expo native proofs against the imported canonical package
# The journeys read XMTP_RN_JOURNEYS from the job environment: unset or `pr` on
# pull requests, `full` in nightly, manual, and release runs. The variable reaches
# run.py and its peer through dev/nix-shell, the emulator wrapper, and
# `just backend ci`, the same route as XMTP_NODE_SDK_DIR.
inputs:
  platform:
    description: android or ios
    required: true
  consumers:
    description: all (bare and Expo) or bare
    default: all
  artifact-prefix:
    description: Namespace for retained native assertion reports
    required: true
runs:
  using: composite
  steps:
    - name: Stage the independent Node peer SDK
      shell: bash
      run: |
        dev/nix-shell --shell js-node 'dev/js/sdk-package node'
        echo "XMTP_NODE_SDK_DIR=$PWD/target/sdk-packages/node" >> "$GITHUB_ENV"
    - name: Enable Android hardware acceleration
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot an available iOS simulator
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        device=$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.state == "Shutdown" and (.name | startswith("iPhone")))][0].udid')
        xcrun simctl boot "$device" --arch=arm64
        xcrun simctl bootstatus "$device" -b
        echo "XMTP_RN_DEVICE=$device" >> "$GITHUB_ENV"
    # One driver shell per platform: the slim emulator shell on Android, and
    # the react-native shell, which the installed proofs need anyway, on iOS.
    - name: Execute fresh Android installed-package proofs
      if: runner.os == 'Linux'
      shell: bash
      env:
        RN_CONSUMERS: ${{ inputs.consumers }}
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/react-native-emulator
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096
      run: |
        case "$RN_CONSUMERS" in all|bare) ;; *) exit 1 ;; esac
        dev/nix-shell --shell android-ci-emulator 'run-test-emulator -- just backend ci dev/nix-shell --shell react-native --command sdks/react-native/scripts/test-installed android "$RN_CONSUMERS" --conformance'
    - name: Execute fresh iOS installed-package proofs
      if: runner.os == 'macOS'
      shell: bash
      env:
        RN_CONSUMERS: ${{ inputs.consumers }}
      run: |
        case "$RN_CONSUMERS" in all|bare) ;; *) exit 1 ;; esac
        dev/nix-shell --shell react-native 'just backend ci dev/nix-shell --shell react-native --command sdks/react-native/scripts/test-installed ios "$RN_CONSUMERS" --conformance'
    - name: Upload the native assertion reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: ${{ inputs.artifact-prefix }}-proof-${{ inputs.platform }}
        path: target/react-native-results/*.json
        if-no-files-found: ignore
        retention-days: 7
