name: React Native installed conformance
description: Execute fresh bare and Expo native proofs against the imported canonical package
inputs:
  platform:
    description: android or ios
    required: true
  artifact-prefix:
    description: Namespace for retained native assertion reports
    required: true
  portable-contracts:
    description: Also run the portable package, controller, React, and native-helper contracts
    default: "false"
runs:
  using: composite
  steps:
    - name: Stage the independent Node peer SDK
      shell: bash
      run: |
        dev/nix-shell --shell js 'dev/js/sdk-package node'
        echo "XMTP_NODE_SDK_DIR=$PWD/target/sdk-packages/node" >> "$GITHUB_ENV"
    - name: Check portable RN contracts
      if: inputs.portable-contracts == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        dev/nix-shell --shell js 'just react-native check-package'
        dev/nix-shell --shell js 'just react-native test-control'
        dev/nix-shell --shell js 'just react-native test-react'
        dev/nix-shell --shell js 'just react-native test-native'
    - name: Enable Android hardware acceleration
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot an available iOS simulator
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        device=$(xcrun simctl list devices available --json | jq -er '[.devices[][] | select(.state == "Shutdown" and (.name | startswith("iPhone")))][0].udid')
        xcrun simctl boot "$device" --arch=arm64
        xcrun simctl bootstatus "$device" -b
        echo "XMTP_RN_DEVICE=$device" >> "$GITHUB_ENV"
    - name: Execute fresh Android installed-package proofs
      if: runner.os == 'Linux'
      shell: bash
      env:
        NIX_ANDROID_EMULATOR_LOG_DIR: ${{ runner.temp }}/react-native-emulator
        NIX_ANDROID_EMULATOR_FLAGS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -memory 4096
      run: dev/nix-shell 'run-test-emulator -- just backend ci just react-native test-conformance android'
    - name: Execute fresh iOS installed-package proofs
      if: runner.os == 'macOS'
      shell: bash
      run: dev/nix-shell 'just backend ci just react-native test-conformance ios'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: ${{ inputs.artifact-prefix }}-proof-${{ inputs.platform }}
        path: target/react-native-results/*.json
        if-no-files-found: ignore
        retention-days: 7
