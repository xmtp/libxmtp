name: Restore SDK product
description: Restore and check the exact SDK product from this CI run
inputs:
  target:
    description: node or browser
    required: true
  artifact-name:
    description: Same-run artifact name
    required: true
outputs:
  generated-dir:
    description: Verified generated roots for selected products
    value: ${{ steps.restore.outputs.generated-dir }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: target/ci-products/download-${{ inputs.target }}
    - name: Restore current product and prepare generated checks
      id: restore
      env:
        SDK_TARGET: ${{ inputs.target }}
      shell: bash
      run: |
        set -euo pipefail
        case "$SDK_TARGET" in node|browser) ;; *) echo 'Invalid SDK target' >&2; exit 1 ;; esac
        generated="$(python3 -B dev/ci/sdk-products.py restore --target "$SDK_TARGET" --input "target/ci-products/download-$SDK_TARGET/sdk-$SDK_TARGET.tar")"
        export GENERATED_SOURCE="$generated"
        python3 -B - <<'PY'
        import hashlib
        import os
        from pathlib import Path
        import shutil

        generated = Path(os.environ["GENERATED_SOURCE"])
        target = os.environ["SDK_TARGET"]
        union = Path("target/sdk-generated")
        union.mkdir(parents=True, exist_ok=True)
        for tree in generated.iterdir():
            if not tree.is_dir():
                continue
            destination = union / tree.name
            if destination.exists():
                shutil.rmtree(destination)
            shutil.copytree(tree, destination)
        runtimes = generated.parent / "runtimes"
        runtime_union = Path("target/ci-products/runtimes")
        runtime_union.mkdir(parents=True, exist_ok=True)
        for runtime in runtimes.iterdir():
            destination = runtime_union / runtime.name
            if destination.exists():
                def hashes(folder):
                    return {
                        str(path.relative_to(folder)): hashlib.sha256(path.read_bytes()).hexdigest()
                        for path in folder.rglob("*") if path.is_file()
                    }
                if hashes(destination) != hashes(runtime):
                    raise ValueError("Prepared runtime products differ")
            else:
                shutil.copytree(runtime, destination)
        PY
        echo "XMTP_SDK_PREPARED_PRODUCTS=1" >> "$GITHUB_ENV"
        echo "XMTP_SDK_GENERATED_DIR=$GITHUB_WORKSPACE/target/sdk-generated" >> "$GITHUB_ENV"
        echo "XMTP_SDK_RUNTIME_DIR=$GITHUB_WORKSPACE/target/ci-products/runtimes" >> "$GITHUB_ENV"
        echo "generated-dir=$GITHUB_WORKSPACE/target/sdk-generated" >> "$GITHUB_OUTPUT"
