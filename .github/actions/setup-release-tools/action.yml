name: "Setup Release Tools"
description: "Make the installed xmtp-release command available in PATH"
inputs:
  nix:
    description: "Use pnpm from the active Nix development shell"
    required: false
    default: "false"
  filter:
    description: >-
      The pnpm install filter. The default installs only the release tools
      and the root project; a job that also builds or tests JavaScript passes
      an empty value for the whole workspace.
    required: false
    default: "@xmtp/release-tools..."
runs:
  using: "composite"
  steps:
    - name: Set up JavaScript
      uses: ./.github/actions/setup-js
      with:
        nix: ${{ inputs.nix }}
        filter: ${{ inputs.filter }}
    - name: Add xmtp-release to PATH
      shell: bash
      run: |
        BIN_DIR="$RUNNER_TEMP/xmtp-release-bin"
        mkdir -p "$BIN_DIR"
        cat > "$BIN_DIR/xmtp-release" << 'WRAPPER'
        #!/usr/bin/env bash
        # Keep pnpm messages out of captured versions and JSON.
        cd "$GITHUB_WORKSPACE" && exec pnpm --silent --filter @xmtp/release-tools cli "$@"
        WRAPPER
        chmod +x "$BIN_DIR/xmtp-release"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
    - name: Configure git user
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
