name: Materialize the frozen SDK release
description: Apply one release version before native or JavaScript builds
inputs:
  snapshot:
    description: Commit materialized metadata locally for Node cache and artifact identities
    default: 'false'
runs:
  using: composite
  steps:
    - name: Download the frozen version
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: sdk-release-plan
        path: ${{ runner.temp }}/sdk-release-plan
    - name: Python for the Windows source snapshot
      if: runner.os == 'Windows'
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: "3.11"
    - name: Materialize Cargo and all SDK metadata
      shell: bash
      env:
        SNAPSHOT: ${{ inputs.snapshot }}
      run: |
        set -euo pipefail
        FLAGS=()
        if [ "$SNAPSHOT" = true ]; then FLAGS+=(--snapshot); fi
        if [ "$RUNNER_OS" = Windows ]; then
          python dev/sdk_version.py materialize --plan "$RUNNER_TEMP/sdk-release-plan/release-plan.json" "${FLAGS[@]}"
        else
          dev/nix-shell --shell js-node --command python3.11 dev/sdk_version.py materialize \
            --plan "$RUNNER_TEMP/sdk-release-plan/release-plan.json" "${FLAGS[@]}"
        fi
