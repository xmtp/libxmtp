name: Materialize the frozen SDK release
description: Apply one release version before native or JavaScript builds
runs:
  using: composite
  steps:
    - name: Download the frozen version
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: sdk-release-plan
        path: ${{ runner.temp }}/sdk-release-plan
    - name: Python for the Windows source snapshot
      if: runner.os == 'Windows'
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: "3.11"
    - name: Materialize Cargo and all SDK metadata
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = Windows ]; then
          python dev/sdk_version.py materialize --plan "$RUNNER_TEMP/sdk-release-plan/release-plan.json"
        else
          dev/nix-shell --shell js-node --command python3.11 dev/sdk_version.py materialize \
            --plan "$RUNNER_TEMP/sdk-release-plan/release-plan.json"
        fi
