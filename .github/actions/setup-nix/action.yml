name: "Setup Nix"
description: "Install Nix with parallel builds and Cachix caching for XMTP"
inputs:
  github-token:
    description: "GitHub token for Nix installation"
    required: true
  cachix-auth-token:
    description: "Cachix auth token for xmtp cache"
    required: false
  kache:
    description: >-
      Enable pinned Kache for Cargo commands outside Nix derivations. Set
      "true" only in jobs that run cargo outside Nix; Nix builds cannot use it.
    required: false
    default: "false"
  kache-s3-bucket:
    description: "S3 compiler cache bucket; used only with a complete credential pair"
    required: false
    default: ""
  kache-s3-region:
    description: "S3 compiler cache region"
    required: false
    default: "us-east-2"
  kache-s3-endpoint:
    description: "Optional HTTPS endpoint for an S3-compatible compiler cache"
    required: false
    default: ""
  kache-s3-access-key-id:
    description: "Selected reader or writer access key ID"
    required: false
    default: ""
  kache-s3-secret-access-key:
    description: "Selected reader or writer secret access key"
    required: false
    default: ""
  kache-scope:
    description: "Stable compiler build variant; required for S3"
    required: false
    default: ""
  kache-readonly:
    description: "Disable remote uploads; false still requires a trusted protected branch push"
    required: false
    default: "true"
  gradle-disk:
    description: >-
      Mount the shared repo-wide sticky disk at ~/.gradle (Linux); enable in CI
      jobs that run Gradle. Release jobs must not enable it: CI jobs commit it.
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # Print the kernel OOM-killer records when the job ends, also after a
    # failure. A job gets a lower max-jobs only when such a record shows that
    # the kernel killed a process for memory. Registered first, so it runs
    # after every other post step. action-post-run exec()s its `run` input as
    # a bare executable (no shell), so the script must live in a file.
    - name: Write kernel OOM report script
      if: ${{ runner.os == 'Linux' }}
      run: |
        cat > "$RUNNER_TEMP/kernel-oom-report.sh" << 'EOF'
        #!/usr/bin/env bash
        if ! log="$(sudo -n dmesg 2>&1)"; then
          echo "::warning title=Kernel log unavailable::sudo dmesg failed: $log"
          exit 0
        fi
        records="$(grep -E 'Out of memory: Killed process|oom-kill' <<< "$log" || true)"
        if [[ -z "$records" ]]; then
          echo "No kernel out-of-memory record in this job."
          exit 0
        fi
        echo "::warning title=Kernel OOM::The kernel killed a process for memory in this job"
        printf '%s\n' "$records"
        exit 0
        EOF
        chmod +x "$RUNNER_TEMP/kernel-oom-report.sh"
      shell: bash
    - name: Register kernel OOM report
      if: ${{ runner.os == 'Linux' }}
      uses: webiny/action-post-run@3.1.0
      with:
        run: bash ${{ runner.temp }}/kernel-oom-report.sh
    # Gradle wrapper dist + dependency/transform caches for Android jobs.
    # One disk repo-wide (not per workflow): contents are append-only
    # downloads, so a lost commit race just re-downloads a few jars.
    # Must be registered before the busy-process cleanup below so the cleanup
    # post (which kills gradle/kotlin daemons) runs before this unmounts.
    - name: Mount ~/.gradle sticky disk
      if: ${{ inputs.gradle-disk == 'true' && runner.os == 'Linux' }}
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-gradle-${{ runner.os }}-${{ runner.arch }}
        path: ~/.gradle
        commit: ${{ !startsWith(github.event_name, 'pull_request') && 'on-change' || 'false' }}
    # Posts run in reverse order: registered after the mount = runs right
    # before unmount+commit. Gradle and Kotlin daemons hold ~/.gradle busy.
    # See convos-releases#31.
    - name: Write ~/.gradle busy-process cleanup script
      if: ${{ runner.os == 'Linux' && inputs.gradle-disk == 'true' }}
      run: |
        cat > "$RUNNER_TEMP/gradle-unmount-cleanup.sh" << 'EOF'
        #!/usr/bin/env bash
        for pid in $(sudo fuser -M -m "$HOME/.gradle" 2>/dev/null); do
          sudo kill -9 "$pid" 2>/dev/null
        done
        sleep 2
        exit 0
        EOF
        chmod +x "$RUNNER_TEMP/gradle-unmount-cleanup.sh"
      shell: bash
    - name: Register ~/.gradle busy-process cleanup
      if: ${{ runner.os == 'Linux' && inputs.gradle-disk == 'true' }}
      uses: webiny/action-post-run@3.1.0
      with:
        run: bash ${{ runner.temp }}/gradle-unmount-cleanup.sh
    # Build independent derivations in parallel, one per CPU (`max-jobs`), and
    # give each build all cores (`cores = 0`). Nix defaults to max-jobs = 1.
    # Lower max-jobs for one job only after a kernel OOM record (above) or a
    # measurement shows that job slower with `auto`.
    # Single-user install. Stay on 2.31.x: 2.34.4 breaks patches
    # (https://github.com/nixos/nix/issues/15619).
    - name: Install Nix (Linux)
      if: ${{ runner.os == 'Linux' }}
      uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_version: 2.31.5
        nix_conf: |
          accept-flake-config = true
          access-tokens = github.com=${{ inputs.github-token }}
          max-jobs = auto
          cores = 0
    - name: Install Nix (macOS)
      if: ${{ runner.os != 'Linux' }}
      uses: cachix/install-nix-action@v31
      with:
        # https://github.com/nixos/nix/issues/15619 2.34.4 causes patch failures
        install_url: https://releases.nixos.org/nix/nix-2.31.2/install
        github_access_token: ${{ inputs.github-token }}
        extra_nix_config: |
          accept-flake-config = true
          max-jobs = auto
          cores = 0
    - uses: cachix/cachix-action@v17
      if: ${{ inputs.cachix-auth-token != '' }}
      with:
        name: xmtp
        authToken: ${{ inputs.cachix-auth-token }}
    - uses: cachix/cachix-action@v17
      if: ${{ inputs.cachix-auth-token == '' }}
      with:
        name: xmtp
    - name: Compiler cache backend
      if: ${{ inputs.kache == 'true' }}
      id: compiler-cache-backend
      env:
        KACHE_CI_BUCKET: ${{ inputs.kache-s3-bucket }}
        KACHE_CI_REGION: ${{ inputs.kache-s3-region }}
        KACHE_CI_ENDPOINT: ${{ inputs.kache-s3-endpoint }}
        KACHE_CI_ACCESS_KEY: ${{ inputs.kache-s3-access-key-id }}
        KACHE_CI_SECRET_KEY: ${{ inputs.kache-s3-secret-access-key }}
        KACHE_CI_SCOPE: ${{ inputs.kache-scope }}
        KACHE_CI_READONLY: ${{ inputs.kache-readonly }}
      run: bash dev/kache-ci-config
      shell: bash
    - name: Compiler cache write policy
      if: ${{ inputs.kache == 'true' }}
      id: compiler-cache-policy
      env:
        KACHE_CI_BACKEND: ${{ steps.compiler-cache-backend.outputs.backend }}
        KACHE_CI_READONLY: ${{ inputs.kache-readonly }}
      run: bash dev/kache-ci-policy
      shell: bash
    - name: Setup Kache
      if: ${{ inputs.kache == 'true' }}
      uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c
      with:
        version: v1.0.0
        cache-executables: "true"
        pr-comment: "false"
        github-cache: "false"
        s3-bucket: ${{ steps.compiler-cache-backend.outputs.backend == 's3' && inputs.kache-s3-bucket || '' }}
        s3-region: ${{ steps.compiler-cache-backend.outputs.region }}
        s3-endpoint: ${{ steps.compiler-cache-backend.outputs.backend == 's3' && inputs.kache-s3-endpoint || '' }}
        s3-prefix: libxmtp/trusted
        s3-access-key-id: ${{ steps.compiler-cache-backend.outputs.backend == 's3' && inputs.kache-s3-access-key-id || '' }}
        s3-secret-access-key: ${{ steps.compiler-cache-backend.outputs.backend == 's3' && inputs.kache-s3-secret-access-key || '' }}
        save-cache: ${{ steps.compiler-cache-policy.outputs.cache-write }}
        manifest-key: ${{ steps.compiler-cache-backend.outputs.manifest-key }}
        namespace: ${{ steps.compiler-cache-backend.outputs.manifest-key }}
        sync: "false"
        warm: "true"
        min-compile-ms: "1000"
        max-size: 10GiB
    - name: Configure Kache compiler environment
      if: ${{ inputs.kache == 'true' }}
      run: |
        # Use the immutable Nix wrapper; keep the action's cache and runtime.
        : "${KACHE_CACHE_DIR:?Kache action did not configure storage}"
        : "${KACHE_RUNTIME_DIR:?Kache action did not configure a private runtime}"
        cache_package=$(nix build --no-link --print-out-paths .#kache)
        export PATH="$cache_package/bin:$PATH"
        echo "$cache_package/bin" >> "$GITHUB_PATH"
        if [[ -x "$cache_package/bin/xmtp-kache" ]]; then
          export RUSTC_WRAPPER="$cache_package/bin/xmtp-kache"
        else
          export RUSTC_WRAPPER="$cache_package/bin/kache"
        fi
        export XMTP_KACHE=1
        source dev/kache-env
        for key in XMTP_KACHE XMTP_KACHE_WRAPPER RUSTC_WRAPPER KACHE_CACHE_DIR KACHE_MAX_SIZE KACHE_CACHE_EXECUTABLES KACHE_KEY_ENV_VARS KACHE_BUILD_SCRIPT_CACHE KACHE_CACHE_CC_LINKS CARGO_INCREMENTAL KACHE_ADAPTIVE_INCREMENTAL KACHE_PRESERVE_INCREMENTAL; do
          printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
        done
      shell: bash
    - name: Disable outer compiler cache
      if: ${{ inputs.kache != 'true' }}
      run: |
        echo 'XMTP_KACHE=0' >> "$GITHUB_ENV"
        echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"
      shell: bash
