name: "Setup Nix"
description: "Install Nix with Blacksmith sticky-disk store persistence (Linux) and Cachix caching for XMTP"
inputs:
  github-token:
    description: "GitHub token for Nix installation"
    required: true
  cachix-auth-token:
    description: "Cachix auth token for xmtp cache"
    required: false
  sccache:
    description: "Enable sccache with GitHub Actions cache backend"
    required: false
    default: "false"
  docker-builder:
    description: "Set up Blacksmith buildx builder with sticky-disk Docker layer caching"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # Persistent /nix sticky disk, one per (repo, OS, arch); must mount
    # before Nix installs. Concurrent jobs clone the last snapshot;
    # Cachix backfills anything a lost commit race drops.
    - name: Prepare /nix mount point
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo mkdir -p /nix/store
        sudo chmod -R 777 /nix
      shell: bash
    - name: Mount /nix sticky disk
      if: ${{ runner.os == 'Linux' }}
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-nix-${{ runner.os }}-${{ runner.arch }}
        path: /nix
        # Untrusted PR jobs never commit — a malicious PR could persist
        # tampered store paths that release builds later consume. Trusted
        # events (push/tag/dispatch/schedule) commit on-change.
        commit: ${{ !startsWith(github.event_name, 'pull_request') && 'on-change' || 'false' }}
    # Posts run in reverse order: registered after the mount = runs right
    # before unmount+commit. Store-binary daemons (gradle/kotlin/adb) hold
    # /nix busy; spare cachix daemon, its own post stops it. See convos-releases#31.
    # action-post-run exec()s its `run` input as a bare executable (no
    # shell), so the script must live in a file.
    - name: Write /nix busy-process cleanup script
      if: ${{ runner.os == 'Linux' }}
      run: |
        cat > "$RUNNER_TEMP/nix-unmount-cleanup.sh" << 'EOF'
        #!/usr/bin/env bash
        keep="$(pgrep -f 'cachix daemon' || true)"
        for pid in $(sudo fuser -M -m /nix 2>/dev/null); do
          echo "$keep" | grep -qx "$pid" || sudo kill -9 "$pid" 2>/dev/null
        done
        sleep 2
        exit 0
        EOF
        chmod +x "$RUNNER_TEMP/nix-unmount-cleanup.sh"
      shell: bash
    - name: Register /nix busy-process cleanup
      if: ${{ runner.os == 'Linux' }}
      uses: webiny/action-post-run@3.1.0
      with:
        run: bash ${{ runner.temp }}/nix-unmount-cleanup.sh
    # Buildx builder backed by a sticky-disk layer cache (per Dockerfile,
    # shared repo-wide, LWW commits). Speeds up compose-built backend
    # images (validation service, anvil).
    - name: Setup Blacksmith Docker builder
      if: ${{ inputs.docker-builder == 'true' && runner.os == 'Linux' }}
      uses: useblacksmith/setup-docker-builder@v1
      with:
        # Prune cap so stale layers don't grow the disk unbounded.
        max-cache-size-mb: "10240"
    # Single-user install, works with pre-populated /nix. Stay on 2.31.x:
    # 2.34.4 breaks patches (https://github.com/nixos/nix/issues/15619).
    - name: Install Nix (Linux)
      if: ${{ runner.os == 'Linux' }}
      uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_version: 2.31.5
        nix_conf: |
          accept-flake-config = true
          access-tokens = github.com=${{ inputs.github-token }}
    - name: Install Nix (macOS)
      if: ${{ runner.os != 'Linux' }}
      uses: cachix/install-nix-action@v31
      with:
        # https://github.com/nixos/nix/issues/15619 2.34.4 causes patch failures
        install_url: https://releases.nixos.org/nix/nix-2.31.2/install
        github_access_token: ${{ inputs.github-token }}
        extra_nix_config: |
          accept-flake-config = true
    - uses: cachix/cachix-action@v17
      if: ${{ inputs.cachix-auth-token != '' }}
      with:
        name: xmtp
        authToken: ${{ inputs.cachix-auth-token }}
    - uses: cachix/cachix-action@v17
      if: ${{ inputs.cachix-auth-token == '' }}
      with:
        name: xmtp
    - name: Setup sccache
      if: ${{ inputs.sccache == 'true' }}
      uses: mozilla-actions/sccache-action@v0.0.9
    - name: Install nix-fast-build
      run: nix profile add github:Mic92/nix-fast-build
      shell: bash
    - name: Configure sccache env
      if: ${{ inputs.sccache == 'true' }}
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      shell: bash
