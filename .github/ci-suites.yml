# CI suite selection. This file is the only place to edit it.
#
# After a change, run `dev/nix-shell 'python3.11 dev/ci-suites generate'` and
# commit .github/ci-suites.json and .github/workflows/{lint,test}-generated.yml.
# `just lint-config` fails when they are stale.
# `dev/ci-suites explain PATH...` shows what a path selects.
#
# Each suite is one reusable workflow. ci.yml calls lint-generated.yml with the
# selected lint suites and test-generated.yml with the selected test suites.
# Each generated workflow calls the selected suites' workflows, which run all
# of their jobs.
#
# A pull request runs a suite when a changed file matches the suite's workflow
# or one of its path_filters. The workflow file and every local workflow and
# action it uses select the suite. Each path filter is one of:
#   "glob"                A path glob. `**` crosses directories, `*` does not.
#   "!glob"               Excludes matching paths from the suite.
#   cargo_package: name   A Cargo package, or a list of them. The package's
#                         path-dependency closure selects the suite: normal,
#                         build and target-specific dependencies, plus the
#                         package's own dev-dependencies. `@default-members` is
#                         the workspace default members.
#   path_group: name      The path_filters of a group in `path_groups`.
#
# Every suite sets every key below, in this order, except covered_by. Nothing
# has a default.
#   phase             lint or test.
#   workflow          The suite's workflow file in .github/workflows.
#   run_on            Events that can run the suite: draft_pr_push and
#                     ready_pr_push (pull request pushes) and merge (pushes to
#                     main or self-hosted). A merge runs every suite that lists
#                     it. A manual run runs every suite.
#   disable_on_forks  true skips the suite for fork pull requests.
#   secrets           `inherit` (all secrets) or `kache` (only the Kache keys).
#   permissions       Token permissions for the suite.
#   covered_by        Optional. A suite whose run makes this one unnecessary.
#   kache             The Kache scopes the workflows use, or []. Generation
#                     checks them.
#   path_filters      The filters described above, or [].
#
# A changed file that matches `shared` runs every suite. A file that matches no
# rule also runs every suite. A `neutral` file selects a suite only through a
# repository-wide glob, which starts with `**/` (for example `**/*.md`).
# A pull request that deletes or renames a file also runs the suites in
# `on_deleted_path`, which check that every rule still names real files.
# A `!` exclusion in a path group applies to the whole suite that uses it.
version: 1

on_deleted_path: [lint_config]

shared:
  - "{flake.nix,flake.lock,rust-toolchain.toml,justfile}"
  - ".cargo/**"
  - "proto/**"
  - "nix/lib/{base,default,filesets,mkToolchain,mkVersion,patches,shell-common}.nix"
  - "nix/lib/packages/{kache,rtk}.nix"
  - "nix/shells/{local,rust}.nix"
  - "nix/apps.nix"
  - ".github/{ci-suites.yml,ci-suites.json}"
  - ".github/workflows/{ci,lint-generated,test-generated}.yml"
  - ".github/actions/setup-nix/**"
  - "dev/{ci-select,ci-suites,nix-shell,worktree-env,agent-run,kache-env,kache-ci-config,kache-ci-policy,kache-darwin-wrapper}"

neutral:
  - "**/{AGENTS,CLAUDE}.md"
  - ".github/**/*.md"
  - "{README,CONTRIBUTING,ONBOARDING,TEST_SCENARIOS}.md"
  - "{LICENSE,.envrc,.gitignore,.git-blame-ignore-revs,.gitattributes,.dockerignore,codecov.yml,om.yaml,cliff.toml}"
  - "{.agents,.claude,.codex,.devcontainer,.macroscope,.murmur,.vscode,.zed}/**"
  - "{img,diagrams}/**"
  - "apps/.gitkeep"
  - ".github/{CODEOWNERS,dependabot.yml}"
  - ".github/ISSUE_TEMPLATE/**"
  - "dev/{fly,tls,test}/**"
  - "dev/{ast-outline,bench,serena,flamegraph,llvm-cov,up,down,direnv-up,direnv-down,docs}"
  - "dev/{nix-up,nix-down,nix-status,nix-cache-up,ci-failure-markers}"
  - "dev/{ci,nix}/**"

path_groups:
  # Suites that start the Docker stack test against a backend built from source.
  docker_backend:
    - "apps/backend/**"
    - "crates/xmtp_attachments_server/**"
    - "dev/{docker,backend}/**"
    - "nix/package/backend.nix"
    - "nix/musl-docker.nix"
  # Suites that run `just backend ci` use the native backend package.
  native_backend:
    - "apps/backend/**"
    - "crates/xmtp_attachments_server/**"
    - "dev/backend/**"
    - "dev/docker/s3/**"
    - "nix/package/{backend,backend-ci}.nix"
  js_workspace:
    - "{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.node-version,.nvmrc,.oxlintrc.json,.oxfmtrc.json}"
    - "sdks/js.just"
    - "dev/js/**"
    - "nix/{js,js-node}.nix"
    - "nix/lib/packages/pnpm.nix"
  # The SDK facade and its generated bindings. Rust core changes reach the SDK
  # suites through the merge run, not on pull requests.
  sdk_core:
    - "crates/xmtp_sdk/**"
    # The SDK products are Rust builds, so workspace dependency changes reach them.
    - "{Cargo.toml,Cargo.lock}"
    - "apps/xmtp_sdk_bindgen/**"
    - "nix/package/xmtp-sdk{,-native,-node-runtime}.nix"
    - "nix/package/libffi-zig-cross.site"
    - "nix/package/node.nix"
    - "nix/node-packages.nix"
    - "nix/lib/{sdk-sources,sdk-provenance,napiBuild,napiTarget}.nix"
    - "nix/lib/packages/{ubrn,wasm-bindgen-cli}.nix"
    - "nix/lib/packages/napi-rs-cli/**"
  swift:
    - "sdks/ios/**"
    - "{Package.swift,Package.resolved,.spi.yml}"
    - "nix/lib/ios-env.nix"
    - "nix/shells/ios.nix"
    - "nix/package/ios.nix"
    - "nix/lib/packages/{swiftformat,swiftlint}.nix"
    - "dev/check-apple-toolchain"
  android:
    - "sdks/android/**"
    - "nix/lib/android-*"
    - "nix/shells/android.nix"
    - "nix/android-packages.nix"
    - "!docs/**"
  example_android:
    - "apps/example-android/**"
    - "!**/*.md"
  js_packages:
    - "sdks/{node,browser,agent}/**"
    - "apps/{cli,web-chat,docs}/**"
    - "dev/release-tools/**"

suites:
  # --- Lint ------------------------------------------------------------------
  lint_workspace:
    phase: lint
    workflow: lint-workspace.yml
    run_on: [draft_pr_push, ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - "{crates,apps}/**/*.rs"
      - "**/Cargo.toml"
      - "{Cargo.lock,rustfmt.toml,.clippy.toml,.taplo.toml,deny.toml}"
      - ".config/hakari.toml"
      - "crates/xmtp-workspace-hack/**"
      - "apps/{chaos,db_tools,error_glossary,keepalive-probe,xmtp_debug}/**"
  lint_js:
    phase: lint
    workflow: lint-js.yml
    run_on: [draft_pr_push, ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - path_group: js_workspace
      - path_group: js_packages
  lint_config:
    phase: lint
    workflow: lint-config.yml
    run_on: [draft_pr_push, ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      # treefmt formats these file types across the repository.
      - "**/*.{nix,py,sh,toml,kt,kts,swift}"
      - "{.editorconfig,sdks/ios/.swiftformat}"
      - ".github/**"
      - "dev/{tests,agents,specs,release-tools}/**"
      - "nix/fmt.nix"
  lint_proto:
    phase: lint
    workflow: lint-proto.yml
    run_on: [draft_pr_push, ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - "proto/**"
  docs_quality:
    phase: lint
    workflow: docs-quality.yml
    run_on: [draft_pr_push, ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - path_group: js_workspace
      # markdownlint reads every Markdown file.
      - "**/*.md"
      - "nix/docs.nix"
      - "{apps/docs,docs}/**"
      - "sdks/agent/src/**"
      - "sdks/*/package.json"
      - "dev/js/sdk-package"
  lint_ios:
    phase: lint
    workflow: lint-ios.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - path_group: swift
  lint_android:
    phase: lint
    workflow: lint-android.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - path_group: android
  lint_example_android:
    phase: lint
    workflow: lint-example-android.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - path_group: example_android
      - path_group: android
      - path_group: sdk_core

  # --- Rust ------------------------------------------------------------------
  check_rust:
    phase: test
    workflow: check-rust.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    kache: [rust-clippy-native, rust-clippy-wasm]
    path_filters:
      - cargo_package: ["@default-members", xmtp-sdk-bindgen]
      - "{.clippy.toml,dev/wasm.just,nix/shells/wasm.nix}"
  check_sdk_unit:
    phase: test
    workflow: check-sdk-unit.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    kache: [sdk-tests-debug]
    path_filters:
      - cargo_package: xmtp_sdk
      - path_group: docker_backend
      - ".config/nextest.toml"
  test_backend:
    phase: test
    workflow: test-backend.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [backend-tests-debug]
    path_filters:
      - cargo_package: xmtp_backend
      - path_group: docker_backend
      # apps/backend tests embed these files.
      - "docs/{backend-observability.md,schemas/backend-v1.json,specs/OPS-backend-operations.md}"
      - path_group: native_backend
      - "nix/{ci-checks,package/backend-tests}.nix"
      - "nix/package/backend-tests.sh"
  test_validation:
    phase: test
    workflow: test-validation.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    path_filters:
      - cargo_package: [xmtp_mls_validation, xmtp_id, xmtp_proto]
      - "{dev/check-validation,nix/package/validation-check.nix,nix/ci-checks.nix}"
  test_workspace:
    phase: test
    workflow: test-workspace.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    path_filters:
      - cargo_package: "@default-members"
      - path_group: docker_backend
      - "{.config/nextest.toml,webdriver.json}"
      - "{nix/package/nextest.nix,nix/ci-checks.nix,dev/check-ephemeral-backend}"
  test_keepalive:
    phase: test
    workflow: test-keepalive-probe.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    path_filters:
      - cargo_package: keepalive-probe
      - "{nix/package/keepalive-probe-check.nix,nix/ci-checks.nix}"
  test_wasm:
    phase: test
    workflow: test-wasm.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    path_filters:
      - cargo_package:
          - xmtp_mls
          - xmtp_cryptography
          - xmtp_common
          - xmtp_api
          - xmtp_id
          - xmtp_db
          - xmtp_api_backend
          - xmtp_content_types
          - xmtp_attachments
          - xmtp_sdk
      - path_group: docker_backend
      - "{webdriver.json,.config/nextest.toml,dev/wasm.just}"
      - "{nix/package/wasm-nextest.nix,nix/shells/wasm.nix,nix/ci-checks.nix}"
  test_xdbg:
    phase: test
    workflow: test-xdbg.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    path_filters:
      - cargo_package: xdbg
      # The observability job runs xdbg against the Docker stack.
      - path_group: docker_backend
      - "nix/package/xdbg{,-check}.nix"
      - "nix/ci-checks.nix"
  docs_rust:
    phase: test
    workflow: docs-rust-reference.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    covered_by: docs_site
    kache: [rust-reference]
    path_filters:
      - cargo_package: ["@default-members", error_glossary]
      - "{docs/error_glossary.md,dev/gen-error-glossary}"

  # --- JavaScript ------------------------------------------------------------
  check_types:
    phase: test
    workflow: check-types.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    kache: [sdk-products-debug]
    path_filters:
      - path_group: js_workspace
      - path_group: js_packages
      - path_group: sdk_core
  check_sdk:
    phase: test
    workflow: check-sdk-products.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    kache: [sdk-products-debug]
    path_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - "sdks/{node,browser}/package.json"
      - "sdks/browser/test/platform/**"
      - "nix/check-sdk-products.py"
  test_node:
    phase: test
    workflow: test-node-sdk.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [sdk-native-debug]
    path_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - path_group: docker_backend
      - "sdks/node/**"
      - "apps/cli/**"
  test_agent:
    phase: test
    workflow: test-agent-sdk.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [sdk-native-debug]
    path_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - path_group: docker_backend
      - "sdks/{node,agent}/**"
      - "apps/cli/**"
  test_browser:
    phase: test
    workflow: test-browser-sdk.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [sdk-products-debug]
    path_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - path_group: docker_backend
      - "sdks/browser/**"
      - "apps/web-chat/**"
  test_sdk_platform:
    phase: test
    workflow: test-sdk-platform.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [sdk-browser-conformance, sdk-products-debug]
    path_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - path_group: docker_backend
      - "sdks/browser/**"
  docs_site:
    phase: test
    workflow: deploy-docs.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read, pages: write, id-token: write}
    kache: [nix-only, rust-reference, sdk-products-debug]
    path_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - "apps/docs/**"
      - "nix/docs.nix"
      - "docs/**"
      - "sdks/agent/src/**"
      - "sdks/{node,browser,agent}/{package.json,tsconfig.json,typedoc.json}"
      - "!sdks/agent/src/**/*.test.ts"

  # --- Mobile ----------------------------------------------------------------
  test_ios:
    phase: test
    workflow: test-ios.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: true
    secrets: inherit
    permissions: {contents: read}
    kache: ["bindings-check-*", nix-only]
    path_filters:
      - path_group: sdk_core
      - path_group: swift
      - path_group: native_backend
  test_android:
    phase: test
    workflow: test-android.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only, sdk-android-release]
    path_filters:
      - path_group: sdk_core
      - path_group: android
      - path_group: docker_backend
  test_example_android:
    phase: test
    workflow: test-example-android.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: [nix-only]
    path_filters:
      - path_group: example_android
      - path_group: android
      - path_group: sdk_core
      - path_group: docker_backend
