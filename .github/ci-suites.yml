# CI suite selection. This file is the only place to edit it.
#
# After a change, run `dev/nix-shell 'python3.11 dev/ci-suites generate'` and
# commit .github/ci-suites.json and .github/workflows/ci.yml.
# `just lint-config` fails when they are stale.
# `dev/ci-suites explain PATH...` shows what a path selects, and in which tier.
#
# Each suite is one reusable workflow. The generated ci.yml has the job Select
# suites (dev/ci-select), the products jobs, a caller job per suite, and the
# Lint and Test gates. A suite without `with` inputs runs all of its jobs.
#
# Tiers. A pull request runs a suite when a changed file or PR label matches
# one of its pr_filters or advisory_filters. The filters of each list are
# joined with OR. A match in pr_filters makes the suite blocking: the Lint or
# Test gate of its phase waits for it and fails when it does not pass. A suite
# that only advisory_filters match runs as advisory, in a second caller job
# named `<title> (advisory)`, and no gate waits for it. A full run of a pull
# request (see `shared` below) runs a suite with advisory_filters as advisory
# unless a pr_filters entry matched. When detection fails or a pull request has
# more files than the list holds, a suite that pr_filters can select blocks.
# Merge runs and manual runs run every selected suite as blocking. The suite's workflow file and every local
# workflow and action it uses count as pr_filters, or as advisory_filters for
# a suite whose pr_filters select nothing. For a suite with skip_full_runs,
# only the files that no other suite's workflow uses count.
#
# Each filter is one of:
#   "glob"                A path glob. `**` crosses directories, `*` does not.
#   "!glob"               Excludes matching paths from the matches of the same
#                         list (pr_filters or advisory_filters).
#   cargo_package: name   A Cargo package, or a list of them. The package's
#                         path-dependency closure selects the suite: normal,
#                         build and target-specific dependencies, plus the
#                         package's own dev-dependencies. `@default-members` is
#                         the workspace default members.
#   path_group: name      The path filters of a group in `path_groups`.
#   pr_label: name        An exact PR label name. Valid only in suite filters.
#
# Every suite sets these keys, in this order. Nothing has a default.
#   title             The caller job name, so checks read `<title> / <job name>`.
#                     At most 30 characters, unique in its phase, and never a
#                     name that ci.yml uses itself (Lint, Test, Select suites).
#   phase             lint or test: the gate that waits for the suite.
#   workflow          The suite's workflow file in .github/workflows.
#   run_on            Events that can run the suite: draft_pr_push and
#                     ready_pr_push (pull request pushes) and merge (pushes to
#                     main). Test suites do not run on drafts. A merge runs
#                     every suite that lists it.
#   disable_on_forks  true skips the suite for fork pull requests.
#   secrets           `inherit` (all secrets), `kache` (only the Kache keys),
#                     `cachix-pr` (only the PR-cache token),
#                     or `none` (no secrets; the suite gets only GITHUB_TOKEN).
#   permissions       Token permissions for the suite.
#   kache             The Kache scopes the workflows use, or []. Generation
#                     checks them.
#   products          The product groups the suite waits for, or []. Only test
#                     suites can wait.
#   pr_filters        The blocking filters described above, or [].
# These keys are optional; leave them out when they do not apply:
#   covered_by        A suite whose run makes this one unnecessary. It applies
#                     when the cover runs in the same or a stronger tier.
#   skip_full_runs    true: a full run of a pull request (see `shared` below)
#                     runs the suite only when its own filters or labels
#                     match. Merge and manual runs, and runs whose changed
#                     files are not all known, are unchanged.
#   runners           Workflow inputs that set runs-on, each as
#                     {pr: LABEL, merge: LABEL}. The caller passes the pr
#                     label on pull requests and the merge label on merge and
#                     manual runs, so a dispatch measures merge runners. The
#                     workflow declares the input (type string) and a job uses
#                     it as `runs-on: ${{ inputs.NAME }}`. A workflow that is
#                     also dispatched or called elsewhere needs a default for
#                     those runs. dev/ci-suites lists the allowed labels.
#   with              Other workflow inputs, as name: value (string, boolean,
#                     or number). The caller passes them in every run.
#   advisory_filters  Filters that select the suite as advisory.
#
# Manual runs: the `suites` input of ci.yml is a comma-separated list of suite
# keys. Empty runs every suite. An unknown key fails Select suites. A run of a
# subset names its gates `Lint (manual subset)` and `Test (manual subset)`, so
# it cannot satisfy the required Lint and Test checks.
#
# A changed file that matches `shared` runs every suite. A file that matches no
# rule also runs every suite. A `neutral` file selects a suite only through a
# repository-wide glob, which starts with `**/` (for example `**/*.md`).
# A pull request that deletes or renames a file also runs the suites in
# `on_deleted_path` as blocking, because a rule or a Nix file may still name it.
# Exclusions and neutral files do not block label matches.
#
# `runners` at the top sets the runners of the jobs that ci.yml defines itself
# (Select suites, the products jobs, and the gates), as {pr, merge} pairs.
#
# Runner policy. Merge and manual runs use free GitHub-hosted runners, except
# the jobs that write the Gradle home, which lives in Blacksmith's cache and
# which pull requests read. Pull request jobs use the smallest Blacksmith size
# that keeps them off the critical path: 4 vCPU for light jobs, 8 vCPU for
# Gradle builds, 16 vCPU for jobs that compile on a cache miss and the docs.
# Select suites and the gates use free runners on pull requests too. The
# first PR runs measured each move; a job more than 30 s slower went back. On a GitHub-hosted Linux runner, setup-nix first frees disk space.
# The macOS jobs run on WarpBuild. A trial moved the iOS SDK and iOS example
# pull request jobs to Blacksmith macOS 15; it was reverted after Nix setup
# failed there ("opening lock file '/nix/var/nix/db/big-lock': Permission
# denied" right after the install, before the Nix daemon was up). The RN iOS
# jobs also need Xcode 27.0 at its pinned path, which Blacksmith macOS 26 has
# only behind a symlink, and that path is part of the Nix output key.
#
# `products` maps a product group name to its title (the products job name)
# and its `path_filters` (the path-only filter syntax). nix/ci-sets.nix lists
# the group's flake outputs as `ciSets.x86_64-linux.<group>`. ci.yml gets one
# job, `products_<group>`, that builds the group once (mode ci, so it pushes to
# xmtp-pr), and each suite that waits for the group needs that job. A run
# builds a group when a selected blocking suite waits for it and a changed file
# matches its filters, or on a full run, and only when the run has the PR-cache
# token. The Test gate needs every products job, so it never waits for a group
# that only advisory suites use; those suites build the products themselves.
# Fork runs have no token. Dependabot runs have it once it is a Dependabot
# secret. A suite whose group did not run builds the products itself, so a
# filter that is too narrow costs time, not coverage. The Test gate counts a
# failed products job only when a selected blocking suite waits for it.
version: 1

on_deleted_path: [lint_config, nix_eval]

runners:
  select: {pr: ubuntu-24.04, merge: ubuntu-24.04}
  products: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
  gates: {pr: ubuntu-24.04, merge: ubuntu-24.04}

shared:
  - "{flake.nix,flake.lock,rust-toolchain.toml,justfile}"
  - ".cargo/**"
  - "proto/**"
  - "nix/lib/{base,default,filesets,mkToolchain,mkVersion,patches,shell-common}.nix"
  - "nix/lib/kache.toml"
  - "nix/lib/packages/{kache,rtk}.nix"
  - "nix/shells/{local,rust}.nix"
  - "nix/apps.nix"
  - "nix/**/*.patch"
  - ".github/{ci-suites.yml,ci-suites.json}"
  - ".github/workflows/ci.yml"
  - ".github/actions/setup-nix/**"
  - "dev/{ci-select,ci-suites,nix-shell,worktree-env,agent-run}"

neutral:
  - "**/{AGENTS,CLAUDE}.md"
  - ".github/**/*.md"
  - "{README,CONTRIBUTING,ONBOARDING,TEST_SCENARIOS}.md"
  - "{LICENSE,.envrc,.gitignore,.git-blame-ignore-revs,.gitattributes,.dockerignore,codecov.yml,cliff.toml}"
  - "{.agents,.claude,.codex,.macroscope,.murmur,.vscode,.zed}/**"
  - "{img,diagrams}/**"
  - "apps/.gitkeep"
  - ".github/{CODEOWNERS,dependabot.yml}"
  - ".github/ISSUE_TEMPLATE/**"
  - "dev/{ast-outline,bench,serena}"
  - "dev/nix-up"

path_groups:
  # Suites that start the Docker stack test against a backend built from source.
  # A backend change runs the backend suites and three client suites that talk
  # to it: test_workspace, test_wasm, and test_node. The Android, iOS, browser,
  # and SDK platform suites add wrapper code that a backend change does not
  # touch; the merge run covers them. The observability services (Tempo,
  # Prometheus, Grafana) select only test_backend, which checks them.
  docker_backend:
    - "apps/backend/**"
    - "crates/xmtp_attachments_server/**"
    - "crates/xmtp_backend_config/**"
    - "dev/docker/{compose.yml,up,compose,load-env,load-backend-image}"
    - "dev/docker/{postgres,s3,toxiproxy}/**"
    - "dev/backend/{local.toml,local-s3.toml}"
    - "nix/package/backend.nix"
    - "nix/musl-docker.nix"
  # The native backend package and the test services (nix/services), which
  # `just backend ci` runs. test_ios starts them on macOS, the only Darwin run
  # before a merge. test_dev checks the services contract on Linux
  # (dev/tests/test_services.py).
  native_backend:
    - "apps/backend/**"
    - "crates/xmtp_attachments_server/**"
    - "crates/xmtp_backend_config/**"
    - "dev/backend/**"
    - "dev/docker/s3/**"
    - "nix/package/backend.nix"
    - "nix/services/**"
  js_workspace:
    - "{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.node-version,.nvmrc,.oxlintrc.json,.oxfmtrc.json}"
    - "sdks/js.just"
    - "dev/js/{sdk-*,tsconfig.*.json}"
    - "nix/{js,js-node}.nix"
    - "nix/lib/packages/pnpm.nix"
  # The SDK facade and its generated bindings. Rust core changes reach the SDK
  # suites through the merge run, not on pull requests.
  sdk_core:
    - "crates/xmtp_sdk/**"
    # The SDK products are Rust builds, so workspace dependency changes reach them.
    - "{Cargo.toml,Cargo.lock}"
    - "apps/xmtp_sdk_bindgen/**"
    - "nix/package/xmtp-sdk{,-native,-node-runtime}.nix"
    - "nix/package/libffi-zig-cross.site"
    - "nix/package/node.nix"
    - "nix/node-packages.nix"
    - "nix/lib/{sdk-sources,sdk-provenance,sdk-native-toolchain,napiTarget}.nix"
    - "nix/sdk-platforms.json"
    - "nix/lib/packages/{ubrn,wasm-bindgen-cli}.nix"
    - "nix/lib/packages/napi-rs-cli/**"
  swift:
    - "sdks/ios/**"
    - "{Package.swift,Package.resolved,.spi.yml}"
    - "nix/lib/ios-env.nix"
    - "nix/package/ios.nix"
    - "nix/lib/packages/{swiftformat,swiftlint}.nix"
    - "dev/check-apple-toolchain"
  android:
    - "sdks/android/**"
    - "nix/lib/android-*"
    - "nix/shells/android{,-ci}.nix"
    - "nix/android-packages.nix"
    - "!docs/**"
  example_ios:
    - "apps/example-ios/**"
    - "nix/package/example-ios-run.nix"
    - "!**/*.md"
  # The React Native example is a standalone pnpm project. Root JS checks do
  # not see it; lint_example_react_native checks it against the JS-only SDK.
  example_react_native:
    - "apps/example-react-native/**"
    - "!**/*.md"
  # SDK and toolchain Nix inputs of the example apps. They select an example
  # suite as advisory (decision D1); the app's own paths block. The common
  # shell toolchain reads both mobile platform definitions. Backend and
  # service inputs select no example suite; the merge run covers them.
  example_common_nix:
    - "nix/package/xmtp-sdk{,-native}.nix"
    - "nix/lib/{sdk-sources,sdk-provenance,android-env,ios-env}.nix"
    - "nix/sdk-platforms.json"
  example_android_nix:
    - path_group: example_common_nix
    - "nix/package/libffi-zig-cross.site"
    - "nix/android-packages.nix"
    - "nix/lib/android-*"
    - "nix/shells/android{,-ci}.nix"
    - "nix/ci-sets.nix"
  example_ios_nix:
    - path_group: example_common_nix
    - "nix/package/ios.nix"
    # The iOS/default shell inherits pnpm and WASM tools from the Rust shell.
    - "nix/lib/packages/{swiftformat,swiftlint,pnpm,wasm-bindgen-cli}.nix"
  react_native:
    - ".github/actions/react-native-{product,conformance}/**"
    - "sdks/react-native/**"
    - "nix/react-native-*"
    - "nix/package/react-native-*"
    - "nix/lib/{react-native-env,sdk-native-toolchain}.nix"
    - "nix/shells/react-native.nix"
    - "nix/lib/ios-env.nix"
    - "nix/lib/android-*"
    - "nix/android-packages.nix"
    - "nix/shells/android{,-ci}.nix"
    - "nix/ci-sets.nix"
  js_packages:
    - "sdks/{node,browser,agent,react-native}/**"
    - "apps/{cli,web-chat,docs}/**"

products:
  # The JavaScript suites' and the docs site's Nix products: the Node and
  # browser trees and the browser platform fixtures. JS-only changes build no
  # group; the suites substitute the warm outputs.
  sdk_js:
    title: Prebuild JS SDKs (Nix)
    path_filters:
      - path_group: sdk_core
      - "nix/ci-sets.nix"
  # The Android suites' Nix products: the Kotlin tree, the JNI libraries, and
  # the JNA host library. They are Rust builds of the SDK and do not read
  # sdks/android, so a Kotlin-only change builds no group.
  sdk_android:
    title: Prebuild Android SDK (Nix)
    path_filters:
      - path_group: sdk_core
      - "nix/android-packages.nix"
      - "nix/lib/android-env.nix"
      - "nix/ci-sets.nix"

suites:
  # --- Lint ------------------------------------------------------------------
  # One Linux job runs every Linux lint: hakari, cargo-deny (bans, licenses,
  # and sources; the advisories run daily in lint-deny.yml), buf, treefmt with
  # the CI declaration check and the release tools, Oxlint, Oxfmt, the docs
  # script tests, markdownlint, and the docs source check. Its filters are the
  # union of each check's inputs, so it runs on almost every pull request.
  lint_config:
    title: Repository lint
    phase: lint
    workflow: lint-config.yml
    run_on: [draft_pr_push, ready_pr_push, merge]
    disable_on_forks: false
    secrets: none
    permissions: {contents: read}
    kache: []
    products: []
    runners:
      runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      # treefmt formats and checks these file types across the repository.
      # Every tracked Rust file is under crates/ or apps/ today. This rule
      # does not select a Rust file elsewhere: a known path (for example under
      # sdks/android/) runs its own suites, and an unknown path runs all.
      - "**/*.{nix,py,sh,toml,kt,swift}"
      - "{crates,apps}/**/*.rs"
      - "{.editorconfig,sdks/ios/.swiftformat,apps/example-ios/.swiftformat}"
      # The treefmt configuration.
      - "nix/fmt.nix"
      # `dev/ci-suites check` reads every workflow and action.
      - ".github/**"
      # `just lint-rust-source` (hakari) and cargo-deny read the manifests.
      - "**/Cargo.toml"
      - "{Cargo.lock,.clippy.toml,.taplo.toml,deny.toml}"
      - ".config/hakari.toml"
      - "crates/xmtp-workspace-hack/**"
      # No other suite owns this module; any `just` run parses it.
      - "apps/chaos/chaos.just"
      # Oxlint, Oxfmt, and the release-tools type check and lint.
      - path_group: js_workspace
      - path_group: js_packages
      - "dev/js/{lint-source.mjs,test-lint-source.mjs}"
      - "dev/release-tools/**"
      # markdownlint reads every Markdown file; the docs checks read these.
      - "**/*.md"
      - "nix/docs.nix"
      - "{apps/docs,docs}/**"
      - "sdks/agent/src/**"
      - "sdks/*/package.json"
      - "dev/js/sdk-package"
  # post-merge.yml is the first job that builds the Darwin build sets, so a
  # pull request that breaks their evaluation would pass. This suite
  # evaluates every ciSets drvPath. It skips drafts: a draft that breaks
  # evaluation fails when it is marked ready.
  nix_eval:
    title: Nix evaluation
    phase: lint
    workflow: nix-eval.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: none
    permissions: {contents: read}
    kache: []
    products: []
    # Measured on PR runs: the free runner took 172 s longer.
    runners:
      runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      # Evaluation reads every Nix file and the data files below, through
      # readFile, importJSON, fromTOML, or a Gradle fetchDeps data file. A
      # shared input (flake.nix, flake.lock, ...) runs every suite anyway.
      - "**/*.nix"
      - "nix/**/*.json"
      - "{Cargo.lock,webdriver.json,package.json}"
      - "**/Cargo.toml"
      - "sdks/android/{gradle.properties,gradle/wrapper/gradle-wrapper.properties}"
      - "sdks/react-native/package.json"
      - "sdks/react-native/test/consumers/**/*.json"
      # The job runs it to evaluate the sets.
      - "dev/ci/rn-isolation"
  # Typecheck, Oxlint, Oxfmt and unit tests of the React Native example. It
  # runs on drafts too: native builds are local (see the app's AGENTS.md).
  lint_example_react_native:
    title: React Native example app
    phase: lint
    workflow: lint-example-react-native.yml
    run_on: [draft_pr_push, ready_pr_push, merge]
    disable_on_forks: false
    secrets: cachix-pr
    permissions: {contents: read}
    kache: []
    products: []
    # Measured on PR runs: the free runner took 673 s longer.
    runners:
      runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: example_react_native
      - pr_label: "react-native"

  # --- Dev tools -------------------------------------------------------------
  # `just test dev`: the dev/tests/run modules, the Fly dashboard test, and the
  # release-tools tests. lint_config keeps the lints of these files.
  test_dev:
    title: Dev tools
    phase: test
    workflow: test-dev.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: none
    permissions: {contents: read}
    kache: []
    products: []
    runners:
      runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      # dev/tests/run finds test modules in dev/tests, dev/specs, nix/lib, and
      # the Android example fixtures and performance tools. The tests read and
      # run Nix, Python, shell, and TOML files across the repository.
      - "**/*.{nix,py,sh,toml}"
      # The tests read every workflow and action.
      - ".github/**"
      # `just test dev` runs the tests of these tools.
      - "dev/{tests,agents,specs,release-tools,fly,ci}/**"
      - "dev/ci-failure-markers"
      # The dev tests and the Fly dashboard test read these files.
      - "dev/docker/{compose.yml,load-backend-image,load-env,up}"
      - "dev/docker/grafana/dashboards/backend.json"
      - "dev/tls/**"
      - "apps/backend/backend.just"
      # dev/tests/test_services.py runs it.
      - "dev/services"
      # dev/tests/test_sdk_package.py runs it.
      - "dev/js/sdk-package"
      # dev/tests/test_backend_configs.py reads the Node recovery backend.
      - "sdks/node/test/recoveryBackend.ts"
      # dev/tests/test_android_release.py reads the SDK Gradle properties.
      - "sdks/android/gradle.properties"
      # dev/tests/test_ci_suites.py dry-runs the iOS lifecycle recipes.
      - "sdks/ios/ios.just"
      # dev/tests/test_script_lint.py lints every extensionless script; they
      # live under a dev/ directory, except this one. The leading `**/` lets a
      # neutral script such as dev/nix-up select this suite.
      - "**/dev/**"
      - "sdks/browser/test/platform/object-store/with-object-store"
      - "sdks/android/android.just"
      - "sdks/react-native/scripts/test-installed"
      - "apps/example-android/{dev/apk,example-android.just,app/build.gradle}"
      # test_script_lint.py reads the shellcheck exclusions.
      - "nix/fmt.nix"
      # The release-tools tests and the release push test run its tools.
      - path_group: js_workspace

  # --- Rust ------------------------------------------------------------------
  # Native, SDK generator, and WASM Clippy in one job and one Kache scope.
  check_rust:
    title: Rust Clippy
    phase: test
    workflow: check-rust.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    kache: [rust-clippy]
    products: []
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - cargo_package: ["@default-members", xmtp-sdk-bindgen]
      - "{.clippy.toml,dev/wasm.just}"
  # The Docker backend job: the image starts with only the database, then the
  # full Compose stack passes the observability check (xdbg traffic, traces,
  # metrics, and the dashboard). The check builds xdbg, so the xdbg closure
  # (the client crates) selects it too.
  test_backend:
    title: Backend Docker image
    phase: test
    workflow: test-backend.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: cachix-pr
    permissions: {contents: read}
    kache: []
    products: []
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - cargo_package: [xmtp_backend, xdbg]
      - path_group: docker_backend
      - "dev/docker/{tempo,prometheus,grafana}/**"
      - "dev/docker/{observe-check.sh,observe_check.py}"
      - "nix/package/xdbg.nix"
  # One job builds four Nix checks, each its own derivation: MLS validation,
  # the backend tests, and the xdbg and keepalive-probe Clippy.
  test_nix_checks:
    title: Rust Nix checks
    phase: test
    workflow: test-nix-checks.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: cachix-pr
    permissions: {contents: read}
    kache: []
    products: []
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - cargo_package:
          - xmtp_backend
          - xmtp_mls_validation
          - xmtp_id
          - xmtp_proto
          - xdbg
          - keepalive-probe
      - path_group: native_backend
      # apps/backend tests embed these files.
      - "docs/{backend-observability.md,specs/OPS-backend-operations.md}"
      - "crates/xmtp_mls_validation/dev/check-validation"
      - "nix/package/{backend-tests,validation-check,xdbg,xdbg-check,keepalive-probe-check}.nix"
      - "nix/ci-checks.nix"
  test_workspace:
    title: Rust workspace
    phase: test
    workflow: test-workspace.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    products: []
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - cargo_package: "@default-members"
      - path_group: docker_backend
      - "{.config/nextest.toml,webdriver.json}"
      # xmtp_backend_config tests embed these files.
      - "docs/{schemas/backend-v1.json,specs/CONF-backend-configuration.md,specs/RATE-backend-rate-limits.md}"
      - "{nix/package/nextest.nix,nix/ci-checks.nix,nix/lib/junit.nix,dev/check-ephemeral-backend}"
      # The derivation starts these services.
      - "nix/services/**"
  test_wasm:
    title: Rust WASM
    phase: test
    workflow: test-wasm.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    products: []
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - cargo_package:
          - xmtp_mls
          - xmtp_cryptography
          - xmtp_common
          - xmtp_api
          - xmtp_id
          - xmtp_db
          - xmtp_api_backend
          - xmtp_content_types
          - xmtp_attachments
          - xmtp_sdk
      - path_group: docker_backend
      - "{webdriver.json,.config/nextest.toml,dev/wasm.just}"
      - "{nix/package/wasm-nextest.nix,nix/ci-checks.nix,nix/lib/junit.nix}"
      - "nix/services/**"
  docs_rust:
    title: Rust reference
    phase: test
    workflow: docs-rust-reference.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    covered_by: docs_site
    kache: [rust-reference]
    products: []
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - cargo_package: ["@default-members", error_glossary]
      - "{docs/error_glossary.md,dev/gen-error-glossary}"

  # --- JavaScript ------------------------------------------------------------
  check_types:
    title: JS types
    phase: test
    workflow: check-types.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: none
    permissions: {contents: read}
    kache: []
    products: [sdk_js]
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: js_workspace
      - path_group: js_packages
      - path_group: sdk_core
  check_sdk:
    title: SDK packaging
    phase: test
    workflow: check-sdk-products.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: none
    permissions: {contents: read}
    kache: []
    products: [sdk_js, sdk_android]
    runners:
      runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - "sdks/{node,browser}/package.json"
      - "sdks/browser/test/platform/**"
      - "nix/check-sdk-products.py"
  # The Node SDK, CLI, and Agent SDK tests share one job and one backend.
  test_node:
    title: Node SDK, Agent SDK, CLI
    phase: test
    workflow: test-node-sdk.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    products: [sdk_js]
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - path_group: docker_backend
      - "sdks/{node,agent}/**"
      - "apps/cli/**"
  test_browser:
    title: Browser SDK
    phase: test
    workflow: test-browser-sdk.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    products: [sdk_js]
    runners:
      runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - "sdks/browser/**"
      - "apps/web-chat/**"
      # The attachment test PUTs to the stack's S3 from the browser origin, so
      # it depends on the S3 CORS policy and the Compose lines that apply it.
      - "dev/docker/s3/**"
      - "dev/docker/compose.yml"
  test_sdk_platform:
    title: Browser SDK platform
    phase: test
    workflow: test-sdk-platform.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    products: [sdk_js]
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - "sdks/browser/**"
      # The platform proofs build its fixture host (examples/fixture_host.rs)
      # and the OPFS export that the host calls.
      - "crates/xmtp_legacy_migration/**"
      - "crates/xmtp_db/src/encrypted_store/database/wasm/**"
  # Post-merge builds and deploys the docs after every merge, so the CI merge
  # run does not build them; docs_rust then runs there and writes the
  # rust-reference Kache scope.
  docs_site:
    title: Docs site
    phase: test
    workflow: deploy-docs.yml
    run_on: [ready_pr_push]
    disable_on_forks: false
    secrets: kache
    permissions: {contents: read}
    kache: [rust-reference]
    products: [sdk_js]
    runners:
      runner: {pr: blacksmith-16vcpu-ubuntu-2404, merge: ubuntu-24.04}
      compose-runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: js_workspace
      - path_group: sdk_core
      - "apps/docs/**"
      - "nix/docs.nix"
      - "docs/**"
      - "sdks/agent/src/**"
      - "sdks/{node,browser,agent}/{package.json,tsconfig.json,typedoc.json}"
      # The RN reference: TypeDoc reads the declarations that
      # .#xmtp-sdk-react-native-js stages. These are the inputs of that
      # derivation that are not in sdk_core (test_ci_select checks the list
      # against its source fileset).
      - "sdks/react-native/{src/**,package.json,tsconfig.json,scripts/stage-package.mjs}"
      - "nix/{react-native-packages.nix,package/react-native-js-tools.nix}"
      - "!sdks/agent/src/**/*.test.ts"

  # --- Mobile ----------------------------------------------------------------
  # The tests job also runs SwiftLint and SwiftFormat. Forks run it: its only
  # secret is the PR-cache token, which forks do not get. The native backend
  # selects it because no other job builds and starts the backend and the test
  # services on macOS before a merge.
  test_ios:
    title: iOS SDK
    phase: test
    workflow: test-ios.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    products: []
    runners:
      runner: {pr: warp-macos-15-arm64-6x, merge: warp-macos-15-arm64-6x}
    pr_filters:
      - path_group: sdk_core
      - path_group: swift
      - path_group: native_backend
  test_android:
    title: Android SDK
    phase: test
    workflow: test-android.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    kache: []
    products: [sdk_android]
    pr_filters:
      # sdk-build runs `gradlew build`, which includes Android Lint and
      # Spotless, so no separate Android lint suite exists.
      - path_group: sdk_core
      - path_group: android
  # Messenger has two suites over one workflow: the APK, JVM test, lint, and
  # build job, and the emulator tests. Decision D1 applies to both: the app's
  # own paths and its label block; the Kotlin SDK and the SDK and toolchain
  # Nix inputs run them as advisory; other pull requests, full runs included,
  # do not run them. Merge runs run both as blocking.
  test_example_android:
    title: Android example app
    phase: test
    workflow: test-example-android.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    skip_full_runs: true
    kache: []
    products: [sdk_android]
    with: {emulator: false}
    pr_filters:
      - "apps/example-android/**"
      - "nix/package/example-android-apk*"
      - pr_label: "android"
    advisory_filters:
      - path_group: android
      - path_group: example_android_nix
  test_example_android_emulator:
    title: Android example emulator
    phase: test
    workflow: test-example-android.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: inherit
    permissions: {contents: read}
    skip_full_runs: true
    kache: []
    products: [sdk_android]
    with: {emulator: true}
    pr_filters:
      - "apps/example-android/**"
      - "nix/package/example-android-apk*"
      - pr_label: "android"
    advisory_filters:
      - path_group: android
      - path_group: example_android_nix

  test_example_ios:
    title: iOS example app
    phase: test
    workflow: test-example-ios.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: cachix-pr
    permissions: {contents: read}
    skip_full_runs: true
    kache: []
    products: []
    runners:
      runner: {pr: warp-macos-15-arm64-6x, merge: warp-macos-15-arm64-6x}
    # Decision D1: the app's own paths and its label block, both the fast job
    # (lint, unit tests, builds) and the journeys. The Swift SDK and the SDK
    # and toolchain Nix inputs run the app as advisory. Other pull requests,
    # full runs included, do not run it.
    pr_filters:
      - "apps/example-ios/**"
      - "nix/package/example-ios-run.nix"
      - pr_label: "iOS"
    advisory_filters:
      - path_group: swift
      - path_group: example_ios_nix

  # React Native, decision D2. The unit checks (package admission, React
  # ownership, native helpers) run on Linux with no device and block. The
  # device chain is advisory on pull requests: the full chain (Android and
  # iOS, bare and Expo) on RN paths or the `react-native` label, and only the
  # bare Android app on the other paths that can break RN. Merge runs leave
  # the device chain to post-merge, which alerts on a failure.
  check_react_native:
    title: React Native unit checks
    phase: test
    workflow: check-react-native.yml
    run_on: [ready_pr_push, merge]
    disable_on_forks: false
    secrets: none
    permissions: {contents: read}
    kache: []
    products: [sdk_js]
    runners:
      runner: {pr: blacksmith-4vcpu-ubuntu-2404, merge: ubuntu-24.04}
    pr_filters:
      - path_group: react_native
      - path_group: sdk_core
      - path_group: js_workspace
  test_react_native:
    title: React Native SDK
    phase: test
    workflow: test-react-native.yml
    run_on: [ready_pr_push]
    disable_on_forks: false
    secrets: cachix-pr
    permissions: {contents: read}
    # On a full run without RN changes, the Android smoke runs instead.
    skip_full_runs: true
    kache: []
    products: []
    with: {scope: full}
    pr_filters: []
    advisory_filters:
      - path_group: react_native
      - pr_label: "react-native"
  test_react_native_smoke:
    title: React Native Android smoke
    phase: test
    workflow: test-react-native.yml
    run_on: [ready_pr_push]
    disable_on_forks: false
    secrets: cachix-pr
    permissions: {contents: read}
    covered_by: test_react_native
    kache: []
    products: []
    with: {scope: android-smoke}
    pr_filters: []
    advisory_filters:
      - path_group: sdk_core
      - path_group: js_workspace
      - path_group: native_backend
      - path_group: docker_backend
