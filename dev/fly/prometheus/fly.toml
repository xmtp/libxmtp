app = "xmtp-backend-dev-prometheus"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
dockerfile = "Dockerfile"

# Private remote-write receiver. No public services or IP addresses.
[[mounts]]
source = "prometheus_data"
destination = "/prometheus"

[checks.ready]
type = "http"
port = 9090
path = "/-/ready"
interval = "15s"
timeout = "5s"
grace_period = "60s"

[[restart]]
policy = "always"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
