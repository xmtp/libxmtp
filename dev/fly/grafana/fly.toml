app = "xmtp-backend-dev-grafana"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
dockerfile = "Dockerfile"

[env]
GF_SERVER_HTTP_ADDR = "::"
GF_SERVER_ROOT_URL = "http://127.0.0.1:3000"
GF_AUTH_ANONYMOUS_ENABLED = "false"
GF_USERS_ALLOW_SIGN_UP = "false"
GF_ANALYTICS_REPORTING_ENABLED = "false"
GF_ANALYTICS_CHECK_FOR_UPDATES = "false"
GF_SECURITY_ADMIN_USER = "admin"

# Access only through: fly proxy 3000:3000 -a xmtp-backend-dev-grafana
[[mounts]]
source = "grafana_data"
destination = "/var/lib/grafana"

[checks.ready]
type = "http"
port = 3000
path = "/api/health"
interval = "15s"
timeout = "5s"
grace_period = "60s"

[[restart]]
policy = "always"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
