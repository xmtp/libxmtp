groups:
  - name: xmtp-backend
    rules:
      - alert: BackendDown
        expr: >-
          up{job="backend"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Backend scrape is down."
      - alert: BackendNotReady
        expr: >-
          xmtp_backend_ready == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Backend is not ready."
      - alert: TailerNotReady
        expr: >-
          xmtp_tailer_ready == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Tailer is not ready."
      - alert: HighErrorRate
        expr: >-
          sum(rate(grpc_server_handled_total{grpc_code=~"Unavailable|Internal|DeadlineExceeded|Unknown"}[5m])) / sum(rate(grpc_server_started_total[5m])) > 0.02
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Backend error ratio exceeds 2%."
      - alert: DatabaseUnavailable
        expr: >-
          rate(xmtp_db_errors_total{kind="connection"}[5m]) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Database connections fail."
      - alert: StorageInvariant
        expr: >-
          increase(xmtp_db_errors_total{kind="invariant"}[10m]) > 0
        labels:
          severity: page
        annotations:
          summary: "Storage invariant failed."
      - alert: PublishLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(grpc_server_handling_seconds_bucket{grpc_method="Publish",grpc_code="OK"}[5m]))) > 1
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Publish p99 exceeds one second."
      - alert: QueryLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(grpc_server_handling_seconds_bucket{grpc_method=~"Query|QueryNewest|Get",grpc_code="OK"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Query p99 exceeds half a second."
      - alert: LockWaitHigh
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(xmtp_operation_duration_seconds_bucket{operation="publish.locks"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Publish lock wait is high."
      - alert: PoolSaturated
        expr: >-
          max by (instance, pool) (xmtp_db_pool_connections{state="busy"} / on (instance, pool) xmtp_db_pool_max_connections) > 0.9
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Database pool usage exceeds 90%."
      - alert: LeakedTransactions
        expr: >-
          increase(xmtp_db_released_open_transactions_total[10m]) > 0
        labels:
          severity: warn
        annotations:
          summary: "A connection was released with an open transaction."
      - alert: ReplicaLagHigh
        expr: >-
          xmtp_replica_replay_delay_seconds > 5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Replica replay delay exceeds five seconds."
      - alert: ReplicaSequenceLag
        expr: >-
          (xmtp_sequence_id{database="primary"} - ignoring (database) xmtp_sequence_id{database="read"}) > 10000
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Replica sequence lag exceeds 10000."
      - alert: TailerRestarting
        expr: >-
          increase(xmtp_tailer_restarts_total[10m]) > 2
        labels:
          severity: page
        annotations:
          summary: "Tailer restarted more than twice."
      - alert: GapRangesGrowing
        expr: >-
          xmtp_tailer_gap_ranges > 5000
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Tailer gap ranges exceed 5000."
      - alert: BarrierStarved
        expr: >-
          sum by (instance) (rate(xmtp_boundary_advances_total{result="lock_timeout"}[10m])) > sum by (instance) (rate(xmtp_boundary_advances_total{result="ok"}[10m]))
        labels:
          severity: warn
        annotations:
          summary: "Boundary lock timeouts exceed successful advances."
      - alert: DeliveryLagHigh
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(xmtp_stream_delivery_lag_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Stream delivery p99 exceeds two seconds."
      - alert: StreamsFailing
        expr: >-
          sum(rate(xmtp_stream_ended_total{reason=~"backpressure|capacity|tailer|database"}[5m])) > 0.1
        labels:
          severity: warn
        annotations:
          summary: "Stream failure rate is high."
      - alert: FetchWorkersSaturated
        expr: >-
          avg_over_time(xmtp_stream_fetch_workers_in_use[5m]) >= 7
        labels:
          severity: warn
        annotations:
          summary: "Stream fetch workers are near capacity."
      - alert: ChainRpcFailing
        expr: >-
          sum(rate(xmtp_scw_verifications_total{result="error"}[5m])) / sum(rate(xmtp_scw_verifications_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Chain verification error ratio exceeds 10%."
      - alert: ExportFailing
        expr: >-
          rate(xmtp_telemetry_export_failures_total[5m]) > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Telemetry export fails."
      - alert: SamplerFailing
        expr: >-
          rate(xmtp_telemetry_sampler_errors_total[5m]) > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Telemetry sampler fails."
      - alert: CpuSaturated
        expr: >-
          sum by (instance) (rate(tokio_runtime_worker_busy_seconds_total[5m])) / on (instance) tokio_runtime_workers > 0.85
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Tokio worker usage exceeds 85%."
      - alert: MemoryGrowing
        expr: >-
          predict_linear(process_resident_memory_bytes[1h], 6*3600) > 2147483648
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Memory is projected to exceed 2 GiB within six hours."
      - alert: TaskLeak
        expr: >-
          deriv(tokio_runtime_alive_tasks[30m]) > 0 and on (instance) sum by (instance) (delta(xmtp_stream_sessions[30m])) <= 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "Task count grows without stream growth."
