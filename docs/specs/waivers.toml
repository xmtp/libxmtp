issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "The nonce-zero derivation is checked against the existing signer rather than the legacy signature's own signer, and is skipped when the existing signer is an installation."

[[waiver]]
id = "IDENT-040"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "An add whose new member is already a current member is accepted and overwrites its adder, timestamp, and chain id."

[[waiver]]
id = "IDENT-045"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "No chain id is recorded for the recovery role, so a recovery identifier that is not a member carries no chain binding."

[[waiver]]
id = "IDENT-046"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "The chain check runs only when the signer is found among the current members, and AddAssociation checks only existing_member_signature."

[[waiver]]
id = "IDENT-050"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "Replay keys are not canonical: ERC-191 and legacy wallet signatures record the recovery byte as received (0 or 1 against 27 or 28) and passkey signatures record s as received, so one signature has several replay keys."

[[waiver]]
id = "IDENT-060"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "An account_id whose namespace is not eip155 is not rejected before routing; the verifier lookup fails with a retryable no-route error."

[[waiver]]
id = "IDENT-062"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "No admission freshness check on an ERC-6492 signature's block_number exists, so a removed contract signer can sign now and validate against a block before its removal."

[[waiver]]
