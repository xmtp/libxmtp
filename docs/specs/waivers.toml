# Waivers under SPEC-055. Each entry names a requirement that carries no
# `verifies:` link, with the kind that says why (SPEC-094).
#
# `gap` entries record behaviour the implementation does not yet satisfy. They
# are the ones SPEC-026 requires when a spec states the intended behaviour and
# the code does something else. Each needs an owner and an issue.
#
# `analysis` entries record an obligation a recorded review establishes and no
# test can.
#
# `untested` entries name the code that satisfies the row without a proving
# test. Each needs an owner.
#
# The issue links below are placeholders. Each needs a real issue before its
# spec is approved.
