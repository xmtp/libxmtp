issue = "https://github.com/xmtp/libxmtp/issues/4644"
reason = "Readers verify entries under a consensus key taken from the first self-verifying entry on the topic and do not decrypt them, because entries are not sealed yet. One envelope that does not decode fails the whole batched read for every conversation in the batch, instead of being discarded alone."

