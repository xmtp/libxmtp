[[waiver]]
id = "API-230"
kind = "gap"
owner = "Nicholas Molnar"
issue = "https://github.com/xmtp/libxmtp/issues/4644"
reason = "Admission checks no signature on a group message or a commit-log entry, so it accepts only 16-byte group ids and refuses 32-byte ones. It parses commit-log entries as `CommitLogEntry`. In `crates/xmtp_mls_validation/src/tests.rs`, `group_message_matrix_preserves_routing_bytes_and_flags` admits a 16-byte group id, `commit_log_admission_preserves_unverified_bytes_and_signature` admits a `CommitLogEntry` whose signature does not verify, and the wrong-length matrix tests take 16 bytes as the valid length. The linked tests assert the old rule; the change that closes this gap updates them."

[[waiver]]
