# Waivers under SPEC-055. Each entry names a requirement that carries no
# `verifies:` link, with the kind that says why (SPEC-094).
#
# `gap` entries record behaviour the implementation does not yet satisfy. They
# are the ones SPEC-026 requires when a spec states the intended behaviour and
# the code does something else. Each needs an owner and an issue.
#
# `analysis` entries record an obligation a recorded review establishes and no
# test can.
#
# `untested` entries name the code that satisfies the row without a proving
# test. Each needs an owner.
#
# The issue links below are placeholders. Each needs a real issue before its
# spec is approved.
[[waiver]]
id = "JOIN-077"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "A Welcome whose wrapper algorithm is unknown is held for one day and then rejected. A Welcome whose MLS version is unsupported is held with no deadline, so it is never rejected and blocks key-package retirement for as long as it stays in the queue."

[[waiver]]
id = "JOIN-060"
kind = "gap"
owner = "protocol"
issue = "https://github.com/xmtp/libxmtp/issues/new"
reason = "Three separate failures. The two-party conversation check rejects only when every policy differs from the fixed set, so a conversation with a single permissive policy is accepted. A conversation the joiner added itself skips the policy and admin checks. A conversation naming the kind used between an inbox's own installations is installed with no validation at all."

[[waiver]]
