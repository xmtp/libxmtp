[package]
name = "xmtp_backend"
description = "XMTP self-hosted backend"
license.workspace = true
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "xmtp-backend"
path = "src/main.rs"

[features]
test-utils = [
  "dep:h2",
  "dep:http-body-util",
  "dep:rcgen",
  "dep:tokio-rustls",
  "dep:tonic-prost",
  "dep:jsonschema",
  "dep:rustls",
  "xmtp_common/test-utils",
  "xmtp_id/test-utils",
  "xmtp_logging/test-utils",
  "xmtp_mls_validation/test-utils",
  "xmtp_proto/grpc_client_impls",
]

[dependencies]
alloy-primitives.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem"] }
futures.workspace = true
h2 = { version = "0.4", optional = true }
hex.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util = { workspace = true, optional = true }
jsonschema = { version = "0.55", default-features = false, optional = true }
jsonwebtoken = { version = "10", default-features = false, features = [
  "rust_crypto",
  "use_pem",
] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
opentelemetry.workspace = true
p256 = { workspace = true, features = ["pem"] }
p384 = { version = "0.13", features = ["pem"] }
parking_lot.workspace = true
pin-project.workspace = true
prost.workspace = true
prost-types.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = [
  "ring",
  "pem",
], optional = true }
reqwest.workspace = true
rsa = { version = "0.9", features = ["pem"] }
rustls = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
], optional = true }
tokio-stream = { workspace = true, features = ["net"] }
toml.workspace = true
tonic = { workspace = true, features = ["transport", "router", "gzip"] }
tonic-health.workspace = true
tonic-prost = { version = "0.14", optional = true }
tonic-types.workspace = true
tonic-web.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
xmtp_common.workspace = true
xmtp_configuration.workspace = true
xmtp_cryptography.workspace = true
xmtp_id.workspace = true
xmtp_logging = { workspace = true, features = ["metrics"] }
xmtp_mls_validation.workspace = true
xmtp_proto = { workspace = true, features = ["grpc_server_impls"] }

[dev-dependencies]
h2 = "0.4"
http.workspace = true
http-body-util.workspace = true
jsonschema = { version = "0.55", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = [
  "ring",
  "pem",
] }
rustls.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }
tonic-prost = "0.14"
xmtp_common = { workspace = true, features = ["test-utils"] }
xmtp_id = { workspace = true, features = ["test-utils"] }
xmtp_logging = { workspace = true, features = ["test-utils"] }
xmtp_mls_validation = { workspace = true, features = ["test-utils"] }
xmtp_proto = { workspace = true, features = ["grpc_client_impls"] }

[lints]
workspace = true
