plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

String androidBackendURL() {
    String url = System.getenv('XMTP_ANDROID_BACKEND_URL')
    if (url) return url
    String port = System.getenv('XMTP_BACKEND_PORT')
    File environment = new File(rootDir, '../../../dev/docker/.env')
    if (!port && environment.isFile()) {
        String line = environment.readLines().find { it.startsWith('XMTP_BACKEND_PORT=') }
        if (line) port = line.substring('XMTP_BACKEND_PORT='.length()).replaceAll("^'|'\$", '')
    }
    return "http://10.0.2.2:${port ?: '5050'}"
}

android {
    namespace 'com.example.xmtpv3_example'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.xmtpv3_example"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'XMTP_BACKEND_URL', "\"${androidBackendURL()}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation project(':library')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
