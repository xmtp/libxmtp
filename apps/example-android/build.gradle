buildscript {
    configurations.classpath.resolutionStrategy.activateDependencyLocking()
}

plugins {
    id 'com.android.application' apply false
    id 'com.android.library' apply false
    id 'org.jetbrains.kotlin.android' apply false
    id 'org.jetbrains.kotlin.multiplatform' apply false
    id 'org.jetbrains.kotlin.plugin.compose' apply false
    id 'org.jetbrains.compose' apply false
    id 'com.diffplug.spotless' apply false
}

def pins = new Properties()
file('../../sdks/android/gradle/toolchain.properties').withInputStream { pins.load(it) }
rootProject.ext.androidToolchain = pins

group = "org.xmtp"
// The SDK composite build owns the SDK release version.

// Configure Spotless for all subprojects
subprojects {
    apply plugin: 'com.diffplug.spotless'
    apply from: rootProject.file('../../sdks/android/gradle/android-ndk.gradle')

    dependencyLocking {
        lockAllConfigurations()
        lockMode = org.gradle.api.artifacts.dsl.LockMode.STRICT
    }

    spotless {
        kotlin {
            target '**/*.kt'
            targetExclude '**/build/**', '**/generated/**', '**/.build/**', '**/xmtp_sdk.kt'
            ktlint(pins.getProperty('ktlint'))
        }

        kotlinGradle {
            target '**/*.gradle.kts'
            ktlint(pins.getProperty('ktlint'))
        }

        format 'misc', {
            target '**/*.gradle', '**/*.md', '**/.gitignore'
            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
    }
}
